    body: `Good morning brothers and sisters.

One day God was looking down to earth and saw all of the evil that was going on.

He decided to send an angel down to earth to check it out so he called on a female angel and sent her to earth for a time. When she returned she told God, "yes it is bad on earth, 95% is bad and 5% is good."

Well, He thought for a moment and said maybe I had better send down a male angel. To get both points of view. So God called a male angel and sent him to earth for a time. When the male angel returned he went to God and told him yes the earth was in decline, 95% was bad and 5% was good.

God said this was not good. He would send a letter to the 5% that were good and encourage them, something to help them keep going. Do you know what that letter said?

Oh, you didn't get one either?!

There's a story about a woman that was at work when she received a phone call that her daughter was very sick with a fever. She left her work and stopped by the pharmacy to get some medication. She got back to her car and found that she had locked her keys in the car.

She didn't know what to do, so she called home and told the baby sitter what had happened. The baby sitter told her that the fever was getting worse. She said, "You might find a coat hanger and use that to open the door."

The woman looked around and found an old rusty coat hanger that had been thrown down on the ground, possibly by someone else who at some time or other had locked their keys in their car. Then she looked at the hanger and said, "I don't know how to use this."

So she bowed her head and asked God to send her some help. Within five minutes an old rusty car pulled up, with a dirty, greasy, bearded man who was wearing an old biker skull rag on his head. The woman thought, "This is what you sent to help me?" But, she was desperate, so she was also very thankful.

The man got out of his car and asked her if he could help. She said, "Yes, my daughter is very sick. I stopped to get her some medication and I locked my keys in my car. I must get home to her. Please, can you use this hanger to unlock my car?"

He said, "Sure." He walked over to the car, and in less than a minute the car was opened. She hugged the man and through her tears she said, "Thank You So Much! You are a very nice man."

The man replied, "Lady, I am not a nice man. I just got out of prison today. I was in prison for car theft and have only been out for about an hour."

The woman hugged the man again and with sobbing tears cried out loud, "Oh, Thank you God! You even sent me a Professional!"

Eleanor Roosevelt said "The future belongs to those who believe in the beauty of their dreams."

Winston Churchill said, "Success is never final. Failure is never fatal. It is courage that counts."

And I really like this one by Ralph Waldo Emerson - "Hitch your wagon to a star."

To some degree, we all understand the gospel and know what we should be doing in our lives. Unfortunately, most often we know more than we apply in practice.

We often do not perform to the level of our knowledge.

While many of us take seriously our New Year's resolutions, there are some of us who may have not made any because of our prior problems in keeping them.

We must not overlook the effect that by making good resolutions, we give power to ourselves in helping us make our lives happier and more successful- regardless of our past performance.

In an informal survey, taken among 150 young adults, they were asked to list three resolutions they felt would help them become happier and more successful during the New Year.

Almost everyone in the survey (98 percent) included resolutions to increase their spirituality. Two out of three (68 percent) indicated they would like to improve their social skills. Half (49 percent) indicated a desire to improve their physical fitness, and half (48 percent) wanted to grow intellectually. Everyone indicated a desire to improve. After all, self- improvement by coming unto Christ is at the heart of why we are here in mortality.

In the Sermon on the Mount, the Savior is recorded as saying, "Be ye therefore perfect, even as your Father which is in heaven is perfect" - Matt 5:48.

In the Joseph Smith Translation, the first part of that sentence is rendered, "Ye are therefore commanded to be perfect" (JST, Matt. 5:50).

The translation of the Greek word for perfect means "complete, finished, fully developed."

Some biblical analysts indicate that the suggestion to become perfect is exaggerated idealism or scriptural overstatement.

We as Latter-day Saints believe that the Savior meant what he said and that becoming like our Father in Heaven and the Savior is a commandment, not just a suggestion. We should strive continually to be more like them.

After his resurrection, the Savior asked his disciples, "What manner of men ought ye to be?" and then answered, "Even as I am" - 3 Nephi 27:27.

Only one verse of scripture in the entire King James Version of the New Testament suggests what the Savior did to develop himself from age twelve until he began his formal ministry at age thirty: "Jesus increased in wisdom and stature, and in favour with God and man" - Luke 2:52.

In other words, the Savior developed in the same areas indicated on the poll: intellectually (in wisdom and knowledge), physically (in stature), socially (in favor with man), and spiritually (in favor with God).

I am convinced that if we make and keep resolutions in those four areas, we will have a happier and more successful new year this coming year and every year for the rest of our lives. Let's consider the nature of such resolutions and the benefits that can be ours if our resolve to improve ourselves is firm.

I resolve to expand my intellectual horizons, to increase in wisdom.

This year, commit to read good books. Some people learn to read but don't read very much. A few years ago, a disturbing poll indicated that 56 percent of college graduates never read a book all the way through after their schooling. We might ask ourselves, Are we reading? Are we growing in wisdom?

The scriptural commandment to us is to "seek ... out of the best books words of wisdom" and "become acquainted with all good books, and with languages, tongues, and people" - D&C 88:118 and D&C 90:15.

What we choose to read will make a huge difference in the development of our minds and character.

In 1838 Sidney Rigdon, a member of the First Presidency, addressed a group of relatively new members of the Church, some of whom apparently thought all they had to do was be baptized, receive the gift of the Holy Ghost, and then just sit back and wait to receive the celestial glory. He said: "Vain are the hopes of those who embrace the gospel, and then suppose ... they have nothing more to do. ... The great God ... never thought of ... raising up a society of ignoramuses, but of men and women of intelligence ... as high as human nature was susceptible"

So the challenge is the same for us all—to continue learning throughout our lives, and especially learning more about the gospel.

Suppose you were to read an entire book each week for the next seventy years. You would read 3,640 books. That sounds like a lot, but in the Library of Congress are more than 27,000,000 books.

It is said that books are spewing from the world's presses at the rate of one thousand titles per day. That means that in seventy years there will be an additional 25,000,000 volumes. Even if we read continually, we could not read more than the smallest fraction of the books in print. Therefore, we should not waste time reading anything that is not uplifting and instructive.

It also would be very beneficial if we resolve not to watch even one movie, video, or television show of poor quality or worse—from now on. Much of our future happiness and success depends on that choice.

There is safety in following the prophet. President Ezra Taft Benson said: "We counsel you ... not to pollute your minds with such degrading matter, for the mind through which this filth passes is never the same afterwards."

I resolve to improve my physical health.

It is impressive that more than 160 years ago the Lord revealed a health code, the Word of Wisdom, that can make all the difference in how we feel and perform. With good health, we can be happier and more successful.

Without it, we are curtailed in almost every way.

Resolve to get an adequately balanced diet.

Resolve to get adequate physical exercise. Choose a sport or other vigorous physical exercise consistent with your situation and physical condition, and be regular in pursuing it.

Get the blood circulating, and give your major muscles a workout. An appropriate amount of time and effort spent in exercising will help you to be more effective in all other areas of your life.

Resolve to get adequate rest. Really follow the counsel of the Lord to "cease to sleep longer than is needful; retire to thy bed early, that ye may not be weary; arise early, that your bodies and your minds may be invigorated" - D&C 88:124.

I resolve to be a truer friend and to become more socially acceptable to people of high standards.

We need to learn to be the kind of person with whom others of high standards enjoy associating. We all would like to have more friends.

More than sixty years ago, Dale Carnegie wrote How to Win Friends and Influence People. Among his suggestions that are equally valuable today are these time-honored principles for making friends:

Become genuinely interested in other people.

Smile. (Remember, the Lord commands us to "be of good cheer.")

Be a good listener. Encourage others to talk about themselves.

Talk in terms of the other person's interests.

Make the other person feel important—and do it sincerely.

Occasionally, look in a full-length mirror. President Spencer W. Kimball said: "How nice and easy would it be if we had a magic wand! But we haven't. You might take a careful inventory of your habits, your speech, and your appearance.

The Lord expects us to do the best we can with what he has given us.

I resolve to grow spiritually—I will increase in favor with God.

I will just touch upon a few items that are essential to our spiritual growth.

The first one that I would like to talk about is pride. President Benson argued that pride is the universal sin. That means that every one of us, to one degree or another, suffers from the problem and must do all in our power to overcome its influence. As human beings, we have a remarkable capacity to fall under the influence of pride.

In the scriptures are many indications that pride has risen to destroy individuals, nations, and in some cases even the Church itself.

In fact, the Book of Mormon documents at least 30 times the cycles of prosperity and peace being destroyed by the effects of human pride.

Jacob warned: "O that cunning plan of the evil one! O the vainness, and the frailties, and the foolishness of men! When they are learned they think they are wise, and they hearken not unto the counsel of God, for they set it aside, supposing they know of themselves, wherefore, their wisdom is foolishness and it profiteth them not. And they shall perish. "But to be learned is good if they hearken unto the counsels of God" - 2 Nephi 9:28-29.

Resolve now that you will read from the scriptures daily. President Ezra Taft Benson has repeatedly emphasized that we should read from the Book of Mormon daily.

Scholars have counted within its pages there are 3,925 references to the Savior. On average, one reads in this book something about Jesus every 1.7 verses.

If we started each January first reading just two pages of the Book of Mormon each day (even slow readers can read two pages in ten minutes or less), by each September we will have finished another reading of that book. Then we can start over and continue feasting on Christ's words, as we are commanded. I promise you, that if you follow this counsel, every decision of your life would become more inspired.

Resolve to really pray and not just say prayers.

There is a big difference here. Learn to pour out the real in-depth feelings of your heart to your Heavenly Father, rather than merely saying the same trite words and phrases that you have become accustomed to using.

Remember President Brigham Young's counsel that if we don't feel like praying, that is the time to pray until we do feel like it.

Young men, resolve now that you will prepare yourself physically, mentally, emotionally, and morally to serve as a full-time missionary. There is no other experience in which you will grow spiritually more effectively and efficiently than you will while serving a full-time mission.

There is a story about a man's experience that I hope all of us will learn from and apply in our lives.

[Story omitted for copyright — "Don't Hope ... Decide!" by Michael D. Hargrove, a widely circulated inspirational essay. Add back in from the source document.]

Gordon B. Hinckley said: "There is room for improvement in every life. Regardless of our occupations, regardless of our circumstances, we can improve ourselves and while so doing have an effect on the lives of those about us. We can lower our voices a few decibels. We can return good for evil. We can smile when anger might be so much easier. We can exercise self-control and self-discipline and dismiss any affront levied against us. Let us be a happy people. The Lord's plan is a plan of happiness. The way will be lighter, the worries will be fewer, the confrontations will be less difficult if we cultivate a spirit of happiness. Let us work a little harder at the responsibility we have as parents. The home is the basic unit of society. The family is the basic organization of the Church. We are deeply concerned over the quality of the lives of our people as husbands and wives and as parents and children. There is too much of criticism and faultfinding with anger and raised voices. The pressures we feel each day are tremendous."

And when President Hinckley concluded the general conference he uttered these words, "I, for one, have made a stronger resolution within myself to be a better person than I have been in the past. I hope that I will be a little kinder to any I meet who may be in distress. I hope that I will be a little more helpful to those who are in need. I hope that I will be a little more worthy of your confidence. I hope that I will be a better husband, a better father and grandfather. I hope that I will be a better neighbor and friend. I hope that I will be a better Latter-day Saint, with an increased understanding of the wonderful aspects of this glorious gospel."

For a prophet of God to resolve these things, how much more need do we need to resolve in our own lives to be better.

I bear testimony that God lives that we have before us the tools to bring mighty change in our own lives and the lives of those we associate with.

That as we cast our burdens upon the Lord, he will make them light.

Brothers and Sisters, I challenge you to resolve this day to improve your lives intellectually, socially, physically, and most of all spiritually.

May we "hitch our wagons to a star", I pray and testify, in the name of Jesus Christ. Amen.`

    body: `Good Morning Brothers and Sisters.

Today is a wonderful day, isn't it? Today is not only a wonderful day but it is a very special day!

Can you guess what special day it is?

Yes, you're right, today is the day that we rest from our labours and turn our hearts to our Eternal Father in Heaven and His Son, Jesus Christ.

Yes, today is the Sabbath!

This is the subject of my talk.

In Exodus, Moses expressed the Lord's desire that we observe this day as a day unto the Lord.

Ever since the creation, the Lord has respectfully dedicated the seventh day as the Sabbath, the day that we meet together and ... hey.

Wait a minute, this is the Sabbath, but it is also another very special day ... it's Mother's Day!

Mothers is the subject of my talk. Almost gotcha, didn't I?

I do believe that today is a wonderful day, that it is a day that I think the Lord wishes us to give tribute to the sanctity of motherhood.

If you can remember last year, I gave a brief description of how Mother's Day came about. Well, this year I would like to tell you Taaron's version of how Mother's Day came about.

Taaron asked me that question, and before I could respond he informed me that he had figured out the answer.

He said, "Well, Father's Day is Heavenly Father's dad's birthday, and so Mother's Day must be Heavenly Father's mom's birthday."

Who knows?

You know, there is a certain trend that occurs during Mother's Day and Father's Day. Have you ever noticed it?

On Mother's Day, the talks in church are filled with tear-flowing stories and words about how wonderful mothers are. Flowers and breakfast in bed are commonplace in many homes; whereas—

On Father's Day, the talks in church are filled with instruction to the fathers on how they are to become better fathers and husbands. Instead of flowers and breakfast in bed, Dad is given a BBQ, which will take him the whole day to put together, and then he'll spend the rest of the week trying to figure out where the spare pieces go.

Well, today I would like to break tradition, break the trend...

Sigh!

Am I crazy? There's no way I'm going to break tradition or break the trend!

Mothers don't need it. They're perfect! Fathers, on the other hand, do need it. We are not perfect!

When Mother Teresa won the Nobel Peace Prize, someone asked her, "What can we do to promote world peace?" Her response?

"Go home and love your family."

It has been said, "Our children are the gift we give to a world we will never see." What is meant by that?

Mothers have the ability to set the whole tone of the home, and therefore, the future.

In a sense, mothers can be described as "investors in futures." No, they are not working the stock markets. They are investors in the future of each child they are divinely entrusted with.

When a mother takes the time to read stories, pray with their children before school, cheer at hockey games, wash clothes, send care packages to college, help with scouts, sew on badges, mend a doll's broken arm, fill out financial aid applications, go to endless special education forums, and drive all over town, you are saying to them:

"You are important to me, and I will go the extra mile to help you feel secure, worthy, and loved."

In Proverbs 22:6 it says, "Train up a child in the way he should go, and when he is old, he will not depart from it."

A mother's job is to invest in the short time we have with our children now, and leave the rest to God.

President Heber J. Grant wrote, "The true spirit of the Church of Jesus Christ of Latter-day Saints gives to woman the highest place of honor in human life."

The work of a mother is hard, too often unheralded work.

A typical four-year-old girl—cute, inquisitive, bright as a new penny—expressed difficulty in grasping the concept of marriage.

Her father decided to pull out his wedding photo album, thinking visual images would help.

One page after another, he pointed out the bride arriving at the church, the entrance, the wedding ceremony, the reception, etc.

"Now do you understand?" he asked.

"I think so," she said, "is that when Mommy came to work for us?"

Maybe some mothers have experienced this following story:

"From the baby's first disgruntled cry in the morning, to the taillights of the uninvited guests and the wreckage in their wake, it had been a day more chaotic than usual. For the first time in ten years of marriage, I dumped a can of beans into a pot and plunked a loaf of bread on the table.

"My husband arrived home from work, came into the kitchen, and I watched his expression change from exhausted to hopeful to dispirited. Gleefully our four-year-old daughter ran to him and cried: 'Daddy, Daddy! Guess what's for supper? Lunch!'"

Through the thick and thin of all this, I know deep down inside that you mothers are doing God's work.

Motherhood is an eternal partnership with God.

Jeffrey R. Holland encourages all mothers:

"Mothers, we acknowledge and esteem your faith in every footstep. Please know that it is worth it then, now, and forever. And if, for whatever reason, you are making this courageous effort alone, without your husband at your side, then our prayers will be all the greater for you, and our determination to lend a helping hand even more resolute."

He counsels that we "remember that families are the highest priority of all,"

that mothers "cherish that role that is so uniquely yours and for which heaven itself sends angels to watch over you and your little ones."

He also exhorts all husbands, as well as Church leaders and friends, to be helpful and sensitive and wise when helping the mothers of this world.

Mothers, yours is the grand tradition of Eve, the mother of all the human family.

Yours is the grand tradition of Sarah and Rebekah and Rachel, without whom there could not have been those magnificent patriarchal promises to Abraham, Isaac, and Jacob, which bless us all.

Yours is the grand tradition of the mothers of the 2,000 stripling warriors.

Yours is the grand tradition of Mary, chosen and foreordained from before this world was, to conceive, carry, and bear the Son of God.

There is nothing more important in this world than participating so directly in the work and glory of God, in bringing to pass the mortality and earthly life of His daughters and sons.

Jeffrey R. Holland proclaims: "You are doing God's work ... He is blessing you and He will bless you, even—no, especially—when your days and your nights may be the most challenging."

Mothers go above and beyond the call of duty, and they always know what is best.

Here is an example of how a mother knows best. Maybe this is you?

Although my own daughter was sick with the flu, a bucket beside her bed, I agreed to teach the four-year-olds at Sunday school when I got a call saying the teacher was sick. At the church, one mother informed me that her daughter, Susie, hadn't been feeling well either but had insisted on coming anyway.

Just before class ended, Susie began to cry. I knew I had to act quickly. I grabbed her and rushed her to the rest room. In desperation I forced her head over the toilet, encouraging her to throw up. She didn't have to, she sobbed.

"Why are you crying, then?" I asked.

"Because Kenny took my Sunday school paper."

Mothers do know best.

I have seen my own children do things without their mother seeing them, like sticking their fingers into the icing sugar, and then their mom, from the other room, say, "Taaron, don't do that."

In fact, as I was writing this last sentence the same situation occurred.

My boys look at each other, or at me (sometimes I'm just as bad), and give the look—"How did she know?"

"How do they know?"

Sometimes a mother's opportunity for teaching backfires.

One day a little girl was sitting and watching her mother do the dishes at the kitchen sink. She suddenly noticed that her mother had several strands of white hair sticking out, in contrast to her brunette head.

She looked at her mother and inquisitively asked, "Mommy, why are some of your hairs white?"

Her mother replied, "Well, every time you do something wrong and make me cry or unhappy, one of my hairs turns white."

The little girl was silent for a while, and then said, "Poor Grandma. You must have been very, very hard to raise."

I have been very fortunate to have a very wonderful mother.

And I have been very fortunate to have a wonderful mother for my children.

I truly appreciate the efforts they have made and the investments they have made and are making in the futures of the children that our Father in Heaven has entrusted to them.

I am also thankful for the mothers in this world who recognize the value and importance of their eternal callings.

For those who are faithful to this calling, yours will be the grand tradition as was Eve's.

Yours will be the grand tradition as was Sarah's, Rebekah's, and Rachel's.

Yours will be the grand tradition as was that of the mothers of the 2,000 stripling warriors.

And yours will be the grand tradition as was Mary's, who conceived, carried, and bore the Son of God.

May these blessings be bestowed upon you.

In the name of Jesus Christ, amen.`

    body: `*Kai's portion:*

Good Morning Brothers and Sisters.

Life's journey is not traveled on a freeway free of obstacles, pitfalls, and snares. Rather, it is a pathway marked by forks and turnings. Decisions are constantly before us.

To make correct decisions, courage is needed: the courage to say no, the courage to say yes. The decisions we make certainly do determine our destiny.

The call for courage comes constantly to each of us. We are always faced with the challenge to be courageous.

Some of the greatest examples of courage come from battles of war. We can read about them and we have seen movies of these acts.

The courage of a military leader was recorded by a young Confederate infantryman during America's Civil War. He describes the influence of General J. E. B. Stuart in these words:

"At a critical point in the battle, he leaped his horse over the breastworks near my company, and when he had reached a point about the center of the brigade, while the men were loudly cheering him, he waved his hand toward the enemy and shouted, 'Forward men. Forward! Just follow me!'

"The men were wild with enthusiasm. With courage and resolution, they poured over the breastworks after him like a raging torrent, and the objective was seized and held."

At an earlier time, and in a land far distant, another leader issued the same plea: "Follow me." He was not a general of war. Rather, He was the Prince of Peace, the Son of God.

Those who followed Him then, and those who follow Him now, win a far more significant victory, with consequences that are everlasting. But the need for courage is always needed.

Joseph, son of Jacob, the same who was sold into Egypt, demonstrated his courage when Potiphar's wife tried to seduce him. He said to her: "How ... can I do this great wickedness, and sin against God?"

Let us remember these words: "If you ever find yourself where you shouldn't be, get out!"

The prophet Daniel demonstrated great courage when he stood up for what he knew was right and was courageous when he prayed even though he was threatened to be killed if he did.

Courage described Abinadi, as he was willing to offer his life rather than to deny the truth.

How can we not be inspired by the two thousand stripling warriors who taught and demonstrated the need of courage to follow the teachings of parents, the courage to be chaste and pure?

And at the end of the Book of Mormon we have the example of Moroni, who had the courage to endure to the end in righteousness.

Before the martyrdom of the Prophet Joseph Smith, he fervently declared: "I am going like a lamb to the slaughter; but I am calm as a summer's morning."

All of these individuals were strengthened by the words of Moses: "Be strong and of a good courage, fear not, nor be afraid ... for the Lord thy God, he it is that doth go with thee; he will not fail thee, nor forsake thee."

He did not fail them. He will not fail us. He did not forsake them. He will not forsake us.

I challenge each of you to be like these examples and live our lives with courage, by making the decisions that our Father in Heaven wishes us to make.

I bear testimony that we are God's children, and because we are God's children we can have the courage to endure all things.

In the name of Jesus Christ. Amen.

*Taaron's portion:*

Good Morning Brothers and Sisters.

The following stories describe the acts of courage that President Thomas S. Monson has witnessed in his life. These stories can give us courage to do what is right.

The first story is from when he was in the United States Navy.

"The closing months of World War II was a challenging experience for me. I learned of brave deeds, acts of valor, and examples of courage. One best remembered was the quiet courage of an eighteen-year-old seaman—not of our faith—who was not too proud to pray. Of 250 men in the company, he was the only one who each night knelt down by the side of his bunk, at times amidst the jeers of the curious and the jests of unbelievers, and, with bowed head, prayed to God. He never wavered. He never faltered. He had courage."

The second story describes courage in service of missionary work.

A courageous act in missionary service was Randall Ellsworth's. While serving in Guatemala as a missionary for The Church of Jesus Christ of Latter-day Saints, Randall Ellsworth survived a devastating earthquake that hurled a beam down on his back, paralyzing his legs and severely damaging his kidneys. He was the only American injured in the quake, which claimed the lives of some eighteen thousand persons.

After receiving emergency medical treatment, he was flown to a large hospital near his home in Rockville, Maryland. While Randall was confined there, a newscaster conducted an interview with him that I witnessed through the miracle of television. The reporter asked, "Can you walk?"

The answer: "Not yet, but I will."

"Do you think you will be able to complete your mission?"

Came the reply: "Others think not, but I will. With the president of my church praying for me, and through the prayers of my family, my friends, and my missionary companions, I will walk, and I will return again to Guatemala. The Lord wants me to preach the gospel there for two years, and that's what I intend to do."

There followed a lengthy period of therapy, punctuated by heroic yet silent courage. Little by little, feeling began to return to the almost lifeless limbs. More therapy, more courage, more prayer.

At last, Randall Ellsworth walked aboard the plane that carried him back to the mission to which he had been called—back to the people whom he loved. Behind he left a trail of skeptics and a host of doubters, but also hundreds amazed at the power of God, the miracle of faith, and the example of courage.

On his return to Guatemala, Randall Ellsworth supported himself with the help of two canes. His walk was slow and deliberate. Then one day, as he stood before his mission president, Elder Ellsworth heard these almost unbelievable words spoken: "You have been the recipient of a miracle," said the mission president. "Your faith has been rewarded. If you have the necessary confidence, if you have abiding faith, if you have supreme courage, place those two canes on my desk and walk."

After a long pause, first one cane and then the other was placed on the desk, and a missionary walked. It was halting, it was painful—but he walked, never again to need the canes.

This spring I thought once more of the courage demonstrated by Randall Ellsworth. Years had passed since his ordeal. He was now a husband and a father. An engraved announcement arrived at my office. It read: "The President and Directors of Georgetown University announce commencement exercises of Georgetown University School of Medicine." Randall Ellsworth received his Doctor of Medicine degree. More effort, more study, more faith, more sacrifice, more courage had been required. The price was paid, the victory won.

Brothers and sisters, I challenge you to have courage in times of difficulties, in times of conflict.

May we have courage to say no. May we have courage to say yes, for courage counts.

I bear testimony that God will give us the strength to have the courage that will glorify Him.

In the name of Jesus Christ. Amen.`

    notes: "",
    body: `John Wayne once said, "Courage is being scared to death—and saddling up anyway."

Albert Einstein said, "The individual must not merely wait and criticize, he must defend the cause the best he can. The fate of the world will be such as the world deserves."

Dallin H. Oaks of the Council of the Twelve said: At times all of us must stand against those who mock and revile. Some of us, sometime, will face some earthly power as mighty as Goliath. When that happens, we should emulate the courage of David, who was mighty because he had faith and he went forth in a righteous cause in the name of the Lord of Hosts.

Owen D. Young said, "It takes vision and courage to create—it takes faith and courage to prove."

Brian, a Latter-day Saint boy, attended a school run by another church. One day the children were being very noisy as the teacher tried to read from the Bible. She closed the Bible and said, "No wonder there are no prophets on the earth today. You children are so naughty that you wouldn't listen to them anyway." Brian had an important choice to make. He could remain silent, or he could tell his teacher what he believed. He gathered his courage, quietly raised his hand, and said, "Teacher, there is a prophet on the earth today. He lives in Salt Lake City." The teacher was very interested in this information and asked him to tell her more about his church.

Some of my most favorite movies of all time are: Dragonheart, Bagger Vance, all of The Lord of the Rings movies, and The Three Musketeers.

There is a common theme to these movies. All of them show acts of great courage, honor, and valor.

In the movie Dragonheart, Draco the Dragon believed that in order for his spirit to live on, he had to make a difference in his life for those around him. His heart was broken with the thought that his life would mean nothing if he did not do good in the world.

When we were baptized, we covenanted that we would "stand as witnesses of God at all times and in all things, and in all places."

Unfortunately, there are also stories of those who fell short of their potential because they were unwilling to take such a stand for truth and right.

Some of us have rationalized our bad choices by saying "we all make mistakes." But you must understand that there is a big difference between an honest mistake made in a moment of spiritual weakness and a willful decision to disobey persistently the commandments of God.

Those who deliberately choose to violate God's commandments or ignore the standards of the Church, even when promising themselves and others that someday they will be strong enough to repent, are stepping onto a dangerous path upon which many have lost their spiritual footing.

For those of you who remember Pres. Pullman—he was a mission president quite a few years ago—he had a wonderful saying that he would say to his sons before they went out on a Friday or Saturday night with their friends. He would say, "Remember who you are and what you stand for."

You are a child of God who has covenanted with Him that you would obey His laws and commandments. You are a member of His church. You are a Latter-day Saint.

You stand for being honest, true, chaste, benevolent, virtuous, and doing good to all men.

If there is anything virtuous, lovely, or of good report or praiseworthy, we seek after these things.

We believe all things, we hope all things, we have endured many things, and hope to be able to endure all things.

These are difficult times in which we are living. In some respects, it is perhaps the most challenging age of all time.

But God has reserved some of His strongest spirit children for these latter days, and we are those spirit children.

While God's laws and standards of right and wrong are under attack at every turn, we need to be a great army who is prepared to make a valiant stand for truth and right.

Let us stand, shoulder to shoulder, as brothers and sisters of God's church and do what we can to make this a better, safer, and happier world.

Let us be "witnesses of God at all times and in all things, and in all places."

May we exercise courage, honor, and valor.

May we "prove our quality."

President Gordon B. Hinckley once said, "When you are baptized, you take upon you the name of Jesus Christ. It takes great courage to honor that name by all you do and all you say." He wrote about that kind of courage: "As members of the Church, we ... [are] set apart from the world. ... [Latter-day Saints] may know discouragement and heartache as they explain their Church membership to family and friends. ... The price of discipleship is personal courage."`

The Savior gave a significant warning and promise to those who teach: "Whosoever, therefore, shall break one of these least commandments, and shall teach men so to do, he shall in no wise be saved in the kingdom of heaven; but whosoever shall do and teach these commandments of the law until it be fulfilled, the same shall be called great, and shall be saved in the kingdom of heaven" (JST, Matt. 5:21).

Elder Jeffrey R. Holland of the Quorum of the Twelve Apostles added:

"For each of us to 'come unto Christ,' to keep His commandments and follow His example back to the Father is surely the highest and holiest purpose of human existence. To help others do that as well, to teach, persuade, and prayerfully lead them to walk that path of redemption also, surely that must be the second most significant task in our lives. Perhaps that is why President David O. McKay once said, 'No greater responsibility can rest upon any man [or woman] than to be a teacher of God's children.'"

In the Sermon on the Mount the Savior gave us this commandment: "Ye are therefore commanded to be perfect, even as your Father who is in heaven is perfect."

Perfection is an eternal goal, not a mortal possibility. It is, however, a commandment that can, over time and because of the Atonement, be kept.

President Joseph Fielding Smith observed: "I believe the Lord meant just what he said: that we should be perfect, as our Father in heaven is perfect. That will not come all at once, but line upon line, and precept upon precept, example upon example, and even then not as long as we live in this mortal life, for we will have to go even beyond the grave before we reach that perfection and shall be like God.

"But here we lay the foundation. Here is where we are taught these simple truths of the gospel of Jesus Christ, in this probationary state, to prepare us for that perfection. It is our duty to be better today than we were yesterday, and better tomorrow than we are today.

"Why? Because … if we are keeping the commandments of the Lord, we are on that road to perfection, and that can only come through obedience and the desire in our hearts to overcome the world.

"… It is the duty of every man to try to be like his Eternal Father."

I know that many feel great despair when they hear this commandment that we must be perfect.

Eternal is another name for God. When we receive Eternal Life, we then have God's Life. We are then like Him.

Moroni gives us an understanding of how that can be achieved. He said, "Yea, come unto Christ, and be perfected in him" (Moro. 10:32). We can only be perfect through Christ's atonement, through exercising faith, repenting, and applying his sacrifice for us.

Nephi offers this encouragement: "Wherefore, ye must press forward with a steadfastness in Christ, having a perfect brightness of hope, and a love of God and of all men. Wherefore, if ye shall press forward, feasting upon the word of Christ, and endure to the end, behold, thus saith the Father: Ye shall have eternal life" (2 Ne. 31:20).

The word "steadfastness" in the Greek text means "immovable or settled." In English it means to stand firm in belief and determination.

Faith in the Lord Jesus Christ means to be settled and firm in our faith so that He can help us become even as He is.

The Savior encouraged us to do quiet acts of service, not seeking recognition for that which we have done.

The Savior introduced the Lord's Prayer. In the King James Version, a portion of the Lord's Prayer says, "And lead us not into temptation."

Some people have the impression that Heavenly Father occasionally and purposefully leads us into temptation; however, in the JST it reads, "Suffer us not to be led into temptation."

As part of the Sermon on the Mount, the Savior emphasized his desire to do the will of His Father. He declared, "If therefore thine eye be single to the glory of God, thy whole body shall be full of light."

When the Savior undertook the work of the Father to save all mankind, He had regard only for the glory of the Father. The first words we hear from His premortal life as recorded in the scriptures are "Father, thy will be done, and the glory be thine forever" (Moses 4:2).

The first words we have in the scriptures that the Savior spoke as a mortal include "I must be about my Father's business" (Luke 2:49).

In Gethsemane, He prayed, "Not my will, but thine, be done" (Luke 22:42).

His final words on the cross were "Father, it is finished, thy will is done."

From His premortal existence throughout His entire life, the Savior's eye was single to doing the will of His Father.

In the Sermon on the Mount, the Savior gave direction to the Twelve, who were about to embark on missions. He gave the absolute assurance that Heavenly Father would care for His servants if they would "seek not the things of this world but seek ye first to build up the kingdom of God, and to establish his righteousness."

Although Matthew 6:25–34 was specifically given to the Twelve, the Savior's general counsel to "seek ye first the kingdom of God, and his righteousness" (Matt. 6:33) is very much applicable to all.

The primary purpose of our mortal existence is to come unto Christ by following His example and to invite others to do the same. One of the great challenges of mortality is learning to prioritize, to seek "the riches of eternity" (D&C 68:31) rather than the "vain things of the world [which] you cannot carry … with you" (Alma 39:14).

The King James Version reads: "Judge not, that ye be not judged" (Matt. 7:1), making it sound as if no one should ever judge others. But the JST footnote clarifies the doctrine: "Judge not unrighteously, that ye be not judged: but judge righteous judgment."

The context of verses 2–5 suggests that looking for fault in others or critically condemning others is what is being censured by the Savior.

He has counseled us to be merciful, to deal justly, and to judge others righteously, to make appropriate ethical appraisals of others under the influence of the Spirit (see Alma 41:14; D&C 11:12; D&C 121:41–45).

He warned us to "cease to find fault one with another" (D&C 88:124) because "with [that same] judgment ye judge, ye shall be judged" (Matt. 7:2).

Elder Dallin H. Oaks of the Quorum of the Twelve Apostles observed there are two kinds of judging: "final judgments, which we are forbidden to make, and intermediate judgments which we are directed to make, but upon righteous principles."

Near the close of the Sermon on the Mount, the King James Version states that at the day of final judgment the Savior will declare to some, "I never knew you" (Matt. 7:23).

The Savior, of course, knows each of us. Because of the Atonement, He knows us better than we know ourselves, including an intimate understanding of all our pains, sufferings, and infirmities (Alma 7:11–13).

There is nothing He cannot comprehend (D&C 38:2). He not only knows us, but He loves us.

In contrast with the KJV, the Inspired Version reverses the thought to its accurate case. Instead of "I never knew you," it reads, "Ye never knew me."

As He closed His sermon, the Savior gave the comforting assurance that those who "heareth these sayings of mine and doeth them, I will liken unto a wise man, who built his house upon a rock" (Inspired Version, Matt. 7:34; compare KJV, Matt. 7:24).

His teachings are a sure foundation upon which we can build our lives to weather any storm (see Matt. 7:25). His philosophy of life, His gospel, exceeds all the wisdom of the world.

Brothers and Sisters, may we look to this powerful sermon as a blueprint to the development of our lives, to help us develop the characteristics of the Almighty and live the life like he did.

May we leave another person better and happier than when we first met them.

I bear testimony of the truthfulness of the Sermon on the Mount.

I bear testimony of our Savior Jesus Christ.

And I bear testimony of His Gospel.

In the name of Jesus Christ. Amen.`

    body: `Good Morning Brothers and Sisters.

[lyrics omitted — add back in from the source document]

Pres. Slocam has assigned us to base our message on D&C 64:33: "Wherefore, be not weary in well-doing, for ye are laying the foundation of a great work. And out of small things proceedeth that which is great."

There are some among us who are unhappy with their lives because they have wanted to achieve a measure of greatness in this life but now feel they have failed in some fundamental way.

The Brethren are concerned for those who have worked hard and who have lived righteously but think, because they haven't achieved in the world or in the Church what others have achieved, that they have failed.

Perhaps we should consider the things that make a person great.

We live in a world that seems to worship its own kind of greatness.

It's true that the world's heroes don't last very long in the public mind, but, nevertheless, there is never a lack of champions and great achievers.

We hear almost daily of athletes breaking records; scientists inventing marvelous new devices, machines, and processes; and doctors saving lives in new ways.

We are constantly being exposed to exceptionally gifted musicians and entertainers. Magazines, billboards, and television commercials bombard us with pictures of individuals with perfect teeth and flawless features, wearing stylish clothes and doing whatever it is that successful people do.

Because we are being constantly exposed to the world's definition of success and greatness, it is understandable that we might frequently find ourselves making comparisons between what we are and what others are, or seem to be, and also between what we have and what others have.

Although it is true that making comparisons can be beneficial and may motivate us to accomplish much good and improve our lives, we often allow unfair and improper comparisons to destroy our happiness when they cause us to feel unfulfilled or inadequate or unsuccessful.

Sometimes, because of these feelings, we are led into error, and we dwell on our failures while ignoring aspects of our lives that may contain elements of true greatness.

In a short editorial written by President Joseph F. Smith in 1905, he made this most insightful statement about what true greatness really is:

"Those things which we call extraordinary, remarkable, or unusual may make history, but they do not make real life … To be a successful father or a successful mother is greater than to be a successful general or a successful statesman."

President Joseph F. Smith brings to light the true delegation of man by the Father of our spirits.

They include the things that must be done in order to be a good father or a good mother, but, to generalize, they are also the thousands of little deeds and tasks of service and sacrifice that constitute the giving or losing of one's life for others and for the Lord.

They include gaining a knowledge of our Father in Heaven and his gospel.

They include bringing others into the faith and fellowship of his kingdom.

And these things do not usually receive the attention or the admiration of the world. To extend the statement of President Smith and to be more specific, we could say: to be a successful Relief Society president or Sunday School teacher or loving neighbor or listening friend is much of what true greatness is all about.

To do one's best in the face of the commonplace struggles of life, and possibly in the face of failures, and to continue to endure and persevere with the ongoing difficulties of life, when those struggles and tasks contribute to the progress and happiness of others and the eternal salvation of one's self, this is true greatness.

Surely we need not look far to see the unnoticed and forgotten heroes of daily life. I am speaking of those you know and those I know who quietly and consistently do the things they ought to do. I am talking about those who are always there and always willing.

I am referring to the uncommon valor of the mother who, hour after hour, day and night, will stay with and care for a sick child, or the invalid who struggles and suffers without complaint.

I'm including those who always volunteer to give blood or volunteer to work in the community.

I am speaking of those who are always there to love and nurture.

I am also talking about teachers and nurses and farmers and others who do the good work of the world, who teach and feed and clothe, but who also, in addition, do the work of the Lord, those who lift and love.

I am referring to those who are honest and kind and hardworking in their daily work, but who are also servants of the Master and shepherds of his sheep.

I do not mean to make little of the great accomplishments of the world that have given us so many opportunities and excitement in our lives.

I am merely suggesting that we try to focus more clearly on the things in this life that will be of the greatest worth.

The Savior said, "But he that is greatest among you shall be your servant."

President Joseph F. Smith continued to help us place in proper perspective the achievements and accomplishments that lead to worldly success and recognition.

Notice as I read his words about how he refers to worldly achievements, that is, those that may bring the fame and fortune of the world, as "secondary."

He said:

"It is true that such secondary greatness may be added to that which we style common-place; but when such secondary greatness is not added to that which is fundamental, it is merely an empty honor, and fades away from the common and universal good in life, even though it may find a place in the … pages of history."

With this definition of true greatness, how do we proceed to achieve it?

Remember the scripture that I read earlier: "Out of small things proceedeth that which is great."

Therefore, our judgment of ourselves and our achievements should not merely include the size or magnitude and number of our accomplishments; it should also include the conditions that have existed and the effect that our efforts have had on others.

The effect of our lives on the lives of others will help us understand why some of the common, ordinary work of life should be valued so highly.

The kind of greatness that our Father in Heaven would have us pursue is within the grasp of all who are members of this great church.

This is my prayer.

In the name of Jesus Christ, Amen.`

    body: `Good Morning Brothers and Sisters.

Last week, when Bro. Mitchell had a fond time making people think about what they could talk about, I thought about what I could speak on. Well, since I prepared something in my mind for last week, I took it home and polished it up a bit, and now today I will share with you what was going through my mind.

I appreciate the words that both Chelsea and Sis. Akre have made today.

Lehi's vision of the Iron Rod is one of my most favorite parts of the scriptures. We are truly blessed to have the scriptures to help guide us along the way towards Eternal Life.

Today's talk is about another Iron Rod. It is still the Word of God, but it is more real then the Iron Rod that Lehi saw.

The Iron Rod that is more real to you and me is something that we may take for granted. Some of us put it aside to think of it as something important but not worth acting upon.

Let me tell you a real story.

A few years ago when our family lived in Prince George, I served as the Young Men's President. One summer, we invited the Boy Scouts from the St. Albert, Alberta ward to come to the most beautiful part of Canada.

My brother, who was the Scout Leader there, brought a bunch of very capable young men and their canoes.

So there we were, my band of young men and a band of young men from St. Albert. We drove up to the Nation Lakes Canoe trail.

The first day we set up a tent and had a couple of hours to fish and practice our canoeing.

The next day we made our way along the first lake in the chain. It was a full day of canoeing. It was beautiful out. The sun was shining and we had lots of water fights while paddling through the lake.

One thing we noticed from the very onset of arriving at the lake was that it was very high. The banks of the lake were flooded well over its normal level.

That evening we set up camp and prepared to take the river down to the next lake.

The next day we woke up to a cold and dismal day. The skies were grey. It was a sign of what was to come. I do not believe I will ever forget this day.

As we prepared our canoes, we got together and had a prayer. The assistant Scout Leader from St. Albert was a very proficient canoeist. He instructed us to keep 100 yards away from the boat in front of us.

He took the lead, my brother was put in the middle of the pack, and I was assigned to be the sweeper. My job was to stay in the back and make sure everyone got through any difficulties. If someone wrecked, my partner and I would hold back and help them recover.

The lead's job was to go in advance of everyone and look for any potential problems, like unsurpassable rapids or log jams.

Now remember, the lake was very high. What does that make the rivers? High!

Those of you that know, when a river is high, it is going faster and there are a lot more chances of log jams to produce.

The first hour and a half went along fairly smoothly. Just one canoe (the St. Albert boys) rammed into a big rock, and another canoe (again the St. Albert boys) dumped themselves because of an overhanging tree.

Now I probably make the St. Albert boys look bad. In reality, they were much more skilled than we were. In fact, on that overhanging tree, I also hit the river. I made sure that our canoe didn't dump, so I just let myself fall in.

It was quite comical actually. I had a very young man as bow man (that means he was paddling in the front) and he wasn't too strong of a paddler, and I never really realized it until that corner where the overhanging tree was.

When I fell in, there was that young man, floating down the river with a helpless look on his face. I swam towards the boat, and then with his help we were able to get the boat to the shore and resume our travels.

A short while later, an event that is still very vivid in my mind occurred.

Again, I was the sweeper, the last one in the caravan of canoes, traveling 100 yards behind the previous canoe. I could see them as they were making a corner, turned around, and taxied over to the bank of the river.

Obviously there were some dangerous obstacles ahead. As we made it to the corner, we started to turn around like the rest of the group. As I was doing this, I could see the dangerous obstacle: a huge log jam, spanning the whole river.

What I also saw was two of my young men slammed up against a log about 35 yards before the log jam in the center of the river, rushing water smashing up on them.

I continued to taxi to the edge of the river and found myself safe from the danger.

Over the next while, we attempted to toss a rope to the two young men. Finally, after what seemed to be a very long time, we were able to get a rope out to them. They tied the canoe to the rope and then tried to dislodge themselves from the tree.

As some of you might know, when you are locked up against an object sideways like they were, the pounding water becomes all the more powerful. Imagine what it's like just standing in a river, but then hold something lengthwise. Pretty strong, eh?

It was a very good thing that these boys were pretty tough themselves. They were able to work themselves away from the tree, and the rope that was secured to their canoe was able to pendulum them towards the bank, just short of the log jam.

I remember standing on that log jam as they freed themselves, praying to the Almighty to deliver them safely. I believe it was the thoughts of everyone present.

So you might be asking yourself what this story has to do with the Iron Rod.

Here is the connection:

We had a leader that saw in advance the dangers that were ahead. All of us were given directions to stay 100 yards behind the canoe in front. As it turns out, these two young men were too close to the leader, and as the leader began to turn his boat around, it was too late for the young men to react, and they went past the leader and tried to turn around but were unable.

The leader in this case was the Iron Rod that helped us find a safe spot to get across that difficult spot of the river.

My two young men ignored the directions and found themselves in a very fearful situation.

The history of Lehi's descendants clearly illustrates the blessings that come from heeding the Lord's prophets and the dangers inherent in rejecting their counsel.

From beginning to end the Book of Mormon can be viewed as a handbook on following the prophets. Clear examples are given of the blessings that come from heeding the words of the prophets, and clear examples are given of the dangers inherent in rejecting prophetic direction.

Thus, its messages are just as relevant today as when they were written. Indeed, the book itself exists because prophets' words were heeded.

Lehi and the other prophets of the Book of Mormon were a living demonstration that "surely the Lord God will do nothing, until he revealeth his secret unto his servants the prophets" (Amos 3:7).

As with the Jews, the Lord always forewarns His children before He levies his judgments upon them. Furthermore, from the Book of Mormon we learn that the Lord always fulfills the promises given through His prophets.

The history of Lehi's descendants is a classic example of what happens to a people when they fail to heed the words of the prophets.

In the Book of Mormon, failure to follow the prophets led to bondage, famine, wickedness, sorrow, and destruction.

Furthermore, the Book of Mormon is clear in noting that when people reject the prophets and their message, the Spirit of the Lord ceases to strive with them. They are not just left to their own devices but become captive to the full power of Satan.

Once Satan has this kind of hold on a people, they become blind to the truth and "will not understand the words [of the prophets] which are spoken" to them. Instead of following the prophets, the unrighteous end up fighting against them.

Today, as in Jacob's day, some "despise the words of plainness" spoken by the prophets because they seek for mysteries that cannot be understood (Jacob 4:14). This course of action places one in spiritual danger.

The ministry of Abinadi illustrates the importance of timeliness in our adherence to prophetic warning and the blessings received or lost.

When Abinadi first warned the Nephites in the land of Lehi-Nephi, no one responded to his warning to repent or be placed in bondage. Consequently, when Abinadi returned two years later, the severity of his warning increased. He now prophesied that the Nephites would be brought into bondage and that they would be destroyed if they still did not repent.

King Noah and most of his people rejected the warnings of Abinadi and were thus eventually either destroyed or placed in bondage.

However, Alma and his followers gave heed to Abinadi's message, avoided destruction, and the Lord eased their burdens in the prophetically promised bondage. One vital lesson we learn from this account is that it is much better to follow the prophet's counsel promptly.

To delay either obedience or repentance leads to sorrow and regret. Speaking of this principle, Elder Henry B. Eyring of the Quorum of the Twelve Apostles taught:

"The choice not to take prophetic counsel changes the very ground upon which we stand. It becomes more dangerous. The failure to take prophetic counsel lessens our power to take inspired counsel in the future. The best time to have decided to help Noah build the ark was the first time he asked.

"Each time he asked after that, each failure to respond would have lessened sensitivity to the Spirit. And so each time his request would have seemed more foolish, until the rain came.

"And then it was too late.

"Every time in my life when I have chosen to delay following inspired counsel or decided that I was an exception, I came to know that I had put myself in harm's way. Every time that I have listened to the counsel of prophets, felt it confirmed in prayer, and then followed it, I have found that I moved toward safety.

"Along the path, I have found that the way had been prepared for me and the rough places made smooth. God led me to safety along a path which was prepared with loving care, sometimes prepared long before" ("Finding Safety in Counsel," Ensign, May 1997, 25).

The Book of Mormon presents the stories of individuals like Alma the Younger, Amulek, and Zeezrom, who had to forsake lifestyles or politically popular views in order to follow the living prophet. This forsaking can be and often is painful and difficult, resulting sometimes in loss of friends, associates, and position.

"There are, or will be, moments when prophetic declarations collide with our pride or our seeming personal interests," said Elder Neal A. Maxwell of the Quorum of the Twelve Apostles.

He continued, "We must be like President Marion G. Romney, who humbly said, '… I have never hesitated to follow the counsel of the Authorities of the Church even though it crossed my social, professional, and political life.'"

As with President Romney, the choice of Alma, Amulek, and Zeezrom to follow the prophet ultimately led them to find more peace, joy, and direction in their lives. Ultimately, to follow the prophets is to follow Jesus Christ.

Nephi declared, "We talk of Christ, we rejoice in Christ, we preach of Christ, we prophesy of Christ" (2 Nephi 25:25).

Jacob expressed his great desire to "persuade all men" to "believe in Christ" (Jacob 1:8).

Ultimately, are not the things that we are told to do by our living prophet devices to bring us unto him?

What are those things that President Hinckley has asked of us?

From our last General Conference, I found a few things that he has called the saints to do.

He said:

"I urge you . . . to utilize the temples of the Church. Go there and carry forward the great and marvelous work, which the God of heaven has outlined for us."

"You men who hold this precious priesthood, bind it to your very souls. Be worthy of it at all times and in all circumstances."

"Our objective has been to see whether there might be some programs we could do away with. But as we have analyzed these, we have not seen much that could be dropped." Therefore saying all church programs are essential to bringing us to Christ.

"I hope that our young men, and our young women, will rise to the challenge he has set forth. We must raise the bar on the worthiness and qualifications of those who go into the world as ambassadors of the Lord Jesus Christ."

"I wish to mention … family home evening. We are fearful that this very important program is fading in too many areas. Brethren, there is nothing more important than your families. You know that." He continues: "And we urge, in the strongest terms possible, that fathers and mothers regard most seriously this opportunity and challenge to make of Monday evening a time sacred to the family."

"Brethren, I wish to urge again the importance of self-reliance on the part of every individual Church member and family. None of us knows when a catastrophe might strike. Sickness, injury, unemployment may affect any of us.

"We have a great welfare program with facilities for such things as grain storage in various areas. It is important that we do this. But the best place to have some food set aside is within our homes, together with a little money in savings.

"The best welfare program is our own welfare program. Five or six cans of wheat in the home are better than a bushel in the welfare granary. I do not predict any impending disaster. I hope that there will not be one. But prudence should govern our lives. Begin in a small way, my brethren, and gradually build toward a reasonable objective. Save a little money regularly, and you will be surprised how it accumulates."

"Get out of debt and rid yourself of the terrible bondage that debt brings. We hear much about second mortgages. Now I am told there are third mortgages. Discipline yourselves in matters of spending, in matters of borrowing, in practices that lead to bankruptcy and the agony that comes therewith."

"Too many are being caught in the web of immorality and all of the bitter fruit that flows from it. To the boys who are here tonight, the young men, I wish to say in the strongest language of which I am capable: stay away from moral iniquity. You know what is right and wrong. You cannot use ignorance as an excuse for unacceptable behavior.

"How can you possibly think that you can become involved in immoral practices and then go into the mission field as a representative of the Lord Jesus Christ? Do you suppose that you can be worthy to go to the house of the Lord, there to be married for time and eternity, if you have indulged in such practices?

"I beg of you, my dear young friends, to avoid such behavior. It will not be easy. It will require self-discipline.

"The forces you confront are powerful and inviting. They are the forces of a clever adversary. You need the strength that comes of prayer … Never lose sight of the fact that you hold the priesthood of God.

"When John the Baptist conferred the Aaronic Priesthood upon Joseph Smith and Oliver Cowdery, he stated that this priesthood holds the keys of the ministering of angels, and of the gospel of repentance, and of baptism by immersion for the remission of sins" (D&C 13).

"Do you wish for the ministering of angels? That ministering will bring with it incomparable rewards. Take the high road in your lives, and God will bless you and nurture you and lead [you] by the hand, and give [you] answer to [your] prayers" (D&C 112:10). To you mature men I extend the same plea and the same warning. Small beginnings lead to great tragedies."

"I speak of the evil and despicable sin of child abuse. We cannot tolerate it. We will not tolerate it. Anyone who abuses a child may expect Church discipline as well as possible legal action. Child abuse is an affront toward God. Jesus spoke of the beauty and innocence of children. To anyone who has an inclination that could lead to the abuse of children, I say in the strongest language of which I am capable, discipline yourself. Seek help before you do injury to a child and bring ruin upon yourself."

"There is room for improvement in every life. . . . Regardless of our circumstances, we can improve ourselves and while so doing have an effect on the lives of those about us."

"I, for one, have made a stronger resolution within myself to be a better person than I have been in the past."

"We can lower our voices a few decibels. We can return good for evil. We can smile when anger might be so much easier. We can exercise self-control and self-discipline and dismiss any affront levied against us. Let us be a happy people."
