    body: `A man walked into the little Mom and Pop grocery store and said, "Do you sell salt?" The man said, "Do we sell salt! Just look!" The man showed the customer an entire wall of shelves stocked with nothing but salt-Morton salt, iodized salt, kosher salt, sea salt, rock salt, garlic salt, seasoning salt, Epsom salts-every kind of salt imaginable. The customer was amazed. "You think that's something. Come over here." He led the customer to a back room filled with shelves and bins and cartons and barrels and boxes of salt. The customer said, "This is unreal!" The man said, "You hadn't seen anything yet." He led the customer down some steps into a huge basement, five times as large as the previous room. It was filled wall-to-wall, floor-to-ceiling with every imaginable form, size, and shape of salt you could imagine. The man looked at him and said, "You really do sell salt!" The store owner said, "No, we don't, that's just the problem! We never sell salt. But that salt salesman that comes by every week, boy does he sell salt!" 

I wanted to follow up on the great Sunday School lesson that we had last week which was taught to us by Sis. McDonough.

Let’s start by reading again Matthew 5:13-16 - Ye are the salt of the earth: but if the salt have lost his savour, wherewith shall it be salted? it is thenceforth good for nothing, but to be cast out, and to be trodden under foot of men. Ye are the light of the world. A city that is set on an hill cannot be hid. Neither do men light a candle, and put it under a bushel, but on a candlestick; and it giveth light unto all that are in the house.  Let your light so shine before men, that they may see your good works, and glorify your Father which is in heaven”

Our Saviour, Jesus Christ is the Light of this world.  He is the city on the hill.  He is the light that can illuminate the world of darkness. He shows us where it is safe to go; and where it is not safe to go.

Jesus never wrote a book, he never held a public office, he didn’t travel more than 200 miles from his home town in all His life.

Yet He has had the greatest influence that any person has had on this planet.

People have been attracted to the man Jesus throughout the centuries

He didn’t care what people thought. He cared only what His Father thought.

Jesus did what was right. He didn’t follow the crowd.

He came to earth to bridge the gap between our sins and everlasting life.

Instead of us dying for our sins, He died in our place.

A true follower of the Saviour is not just one that believes – but is one that does that which it believes.

The Saviour himself said in John 14:12 - Verily, verily, I say unto you, He that believeth on me, the works that I do shall he do also …

Around us and inside us, we find two kinds of darkness. 

The first is that of hopelessness and despair. It is the darkness of being in a tunnel and not seeing the light at the end of it. 

It is the darkness of not knowing where to turn; or where to go; and of wondering if it is all worth going forward.

The troubling of our minds is a real challenge.  Without a clear vision of our eternal destiny as a child of God – Darkness can hide our potential of joy.

The second darkness that we find in and around us is that of the immoral and wickedness of the world. 

I know that there are some, that do not find all the spiritual energy that can or has come to them when they attend church on a week to week basis; but I would hope that when we come to church each Sunday – that we can recognize that when we put ourselves into holy places - we then are able to give ourselves a retreat from the onslaught of darkness that is in the world.

The world seems to be gradually moving towards an ever-expanding state of conflict and war.  

Terrible events, cruelty to one another, and substance abuse are escalating even on the streets of our peaceful little Town.

The Bible says that, when God created the world, it was veiled in darkness—until God said, “Let there be light.” And there was light. 

Again - today, the darkness seems to have the upper hand. It dominates in more and more lives, and in more and more communities and nations regions around the world.

In last week’s lesson about the Sermon on the Mount – Our Saviour addressed the problem of darkness and light. He also speaks about salt and the lack of it. 

When we look at the opening words of the Sermon on the Mount, we find a series of blessings, known as the Beatitudes. 

Jesus singles out certain kinds of people who enjoy God’s special favor. 

What kind of people does he talk about? 

They are the poor in spirit, those who mourn, the meek, those who hunger and thirst for righteousness, the merciful, the pure in heart, the peacemakers, those who are persecuted because of righteousness.

What does our society generally say about these people? 

They may say, “These people are not worth anything to society.  They are failures! Good for nothing, other than to be trampled upon!” 

And that is what often happens to such people. People like this are crushed under the feet of those who think that they are either better than them; or those that just don’t care about anyone else but themselves; and those that feel that winning at all cost is a motto to live by. 

They are often taken advantage of by those who love power and influence.

But what does the Saviour say to those people? “You are the salt of the earth!” “You are the light of the world!” “You have a special mission. And you are making a huge difference to the world around you.”

Are you – Brothers and Sisters - the salt of the earth?  

Why salt?  Why wasn’t it “sugar” I’d rather be sugar – wouldn’t you?  My wife is sugar! But let’s get back to what he did say – Ye are the salt of the earth.

In our Saviour’s days, salt would mainly be used commonly for two purposes.

The most common was to season food, to make it tasty and pleasant to eat. 

When we add salt to the food in the right amount, not too much and not too little, salt can accentuate the best flavor of meat or fish or vegetables. That’s why we add salt to our food today.

But in earlier days, salt was also used a lot to preserve food. There were no fridges or freezers in Palestine thousands of years ago. 

The way to preserve meat or fish for extended periods of time was to treat it with huge amounts of salt. As a result, the meat or fish stayed good and eatable for months on end, even during the hot season.

Interestingly, in our salt float that is part of Shannon’s business – the high concentration of salt of between 25 to 35% makes it exceptionally sanitary. 

The vast amount of Epsom salt dissolved in the water - raises the salinity to levels that are inhospitable to bacteria, including microbes and other pathogens.  Scientifically, it has been proven that the salt will draw out the water content of the cells of bacteria, viruses, and other microorganisms that can cause diseases – rendering them dead.

Brothers and Sisters - if we want to have a preserving effect on our society and bring out the best of life - we need to live as the Saviour described us – as meek, those who hunger and thirst for righteousness; as merciful, as pure in heart; as peacemakers; and as those who stand for truth and righteousness regardless of what others say about us.

We should make the most of our resources, our gifts, our conversations, and our opportunities. Not shy away when people question our faith or our values. But boldly proclaim and defend what we believe.

It is our calling and our responsibility to make a difference to this world. To be the salt that preserves the world from becoming wasted, polluted, and corrupted.  

We do this with whatever influence we have at our disposal - to change society from within. That can be anywhere from politics, to business, to education, and neighborhood involvement. Each of us have a unique calling to be the salt of the earth.

There once was a circus owner who was walking down the street in a tourist district and saw crowd of people around a table watching a show.  On the table was a pot turned upside down and a duck tap dancing on it.  The circus owner was so impressed that he offered to buy the duck from its owner. After some haggling the owner agreed to sell the duck and the pot for $10,000.

A couple of days later the circus owner returns to the owner.  “Your duck is a rip-off!”  He says angrily.  “I put him on the pot in front of a big audience and he didn’t dance a single step!”

“Well,” asked the duck’s former owner, “did you remember to light the candle under the pot?”

While someone might use a candle that way, that’s not what candles are for.

Our Saviour has not only told us that we are to be the salt of the earth. We are also told that we are to be the light of the world. 

Light expels the darkness. It expels the fear of the unseen. There are many people who start panicking when they are immersed in darkness.

I remember a tour that I had with Derek Broadhead many years ago.  He took me into a cave that he was doing some surveying in.  We walked straight into the mountain just over here.  After a while you could barely see the light at the end of the tunnel.  We then branched off to another system of tunnels.  After a while - Derek instructed me to turn off our headlamps.  

I have never ever experienced darkness like this before.  Even after a few minutes as our eyes adjusted – I could still not see my hand only inches away from my eyes.  It was incredible.

We spent a few minutes in in complete darkness. 

There was he and I together. We were perfectly safe. We had no reason whatsoever to fear. And yet, after a short while, I became very uneasy.

Darkness can be really frightening. We all know that. In a world full of fear and loneliness and hopelessness and violence and hatred, the light of the Gospel is needed more than ever.

Brothers and Sisters - Light also helps us navigate. Before we had GPS devices and Google maps, people looked to the stars to find their way. A city on a hill would reveal from far away where to go. Or inside the house, lamps would help us avoid stumbling over chairs and tables or stepping on each other’s toes.

Satan—the ultimate enemy of God—is called the prince of darkness. That says a lot. Where there is no light, evil reigns.

And that is exactly why we are called to be the light of the world. 

Where there is light, evil is exposed. Where there is light – there is a beacon of hope and example.

Jesus tells us to let our light shine and not to hide it.

Too often, many of us are uncomfortable showing and sharing our faith beyond the walls of our homes and within these wall, or beyond the circle of church friends. 

We all live in the world – not of the world – but in the world.  It is for that reason, we cannot help but be given the opportunity to be that light upon the hill.

Our faith is meant to be seen. 

Our faith should be perfectly visible to everybody, not just with those in our church and family community.

A faith whose effects stop at the church door is not much use to anyone. That is exactly what is meant by a light that is hidden under a bushel

Our light, our faith, our example - should be even more visible in our ordinary day-to-day activities: in the way we treat a teller at the grocery store; in the way we order a meal in a restaurant; in the way we treat our employees or serve our employer; in the way we drive our cars; in the language we use; and in the TV programs we watch, or in the books we read.

As a follower of Christ – we should be an example of His life in all places, and in all times and in all things; – whether it be at work, at school, or at play.

Jesus did not say, “You are the light of the Church.” He said, “You are the light of the world.” 

And as we take part in life in our society, our faith should be evident to all.

And for what purpose are we to be a light in the world?

Certainly not to earn points, to gain popularity, to get lots of likes and friends on Facebook.

This is not about us. After all, we are not the source of light. We are merely reflecting or transmitting the light of Gospel. It is the glory of our Father in Heaven - that should be our concern.

One of the greatest composers of all times, Johann Sebastian Bach, signed all his church music with the letters S.D.G. They stand for “Soli Deo Gloria” which means “To God only be the glory”. 

Bach realized so clearly that the music he composed was not his own but that it was given and inspired by God. And therefore, his major concern was that wherever his music was used in worship—or even in the concert hall or the intimacy of the home—it would be to the glory of God.

Our concern – Brothers and Sisters - should be that - in performing beautiful and attractive deeds, we do not turn the focus on ourselves but on God, so that He might get all the glory for what he does; and gets done through us.

In the end, it is all about the kingdom of God. Jesus gave us the Great Commission to go out to the ends of the world; to preach the gospel to all people – so that they might know Him – the true and everlasting God.

There is a wonderful LDS song, written by Janice Kapp Perry called “His Image in Your Countenance”.

The chorus asks these questions, Brothers and Sisters - Have you received His image in your countenance? Does the Light of Christ Shine in your eyes?

We are asked to stand as a witness of Him “at all times and in all things, and in all places” (Mosiah 18:9). 

This means that we must be willing to let others know whom we follow and to who’s Church we belong: the Church of Jesus Christ. 

This – Brothers and Sisters - must be done is a spirit of love and testimony. 

It must provide the light to all the world – to give hope; to give encouragement; to give eternal life to all of our Father’s children.  To help those feeling lost or scared – sitting alone in the darkness that surrounds them.

There is true solace in the warmth embrace of our Saviour’s love; and the bright radiance of the truths of Eternal Life.

    notes: "",
    body: `On this day of Remembrance - we have the opportunity to reflect upon the many terrible wars. It was 100 years ago when this day was appointed as a day of observance which was the last day which ended World War I.

It may be inappropriate to have a light hearted moment on such a reverenced day but here’s a quick joke. 

What did George Washington say to his men before they crossed the Delaware?…”Get in the boat, men!”

Brothers and Sisters - our Father in Heaven has created us with a memory.  

Do we realize what a wonderful gift a memory is to us?

In the Book of Mormon, Alma gave up his position as the chief judge to focus on the spiritual needs of his people. He said to them:

And now behold, I say unto you, my brethren, you that belong to this church, have you sufficiently retained in remembrance the captivity of your fathers? Yea, and have you sufficiently retained in remembrance his mercy and long-suffering towards them? And moreover, have ye sufficiently retained in remembrance that he has delivered their souls from hell? [Alma 5:6]

Brothers and Sisters – ask yourself this question, “Have you, ‘sufficiently retained in remembrance’ the things which you should remember?” 

Today is November 11th – it is the day that we remember those who have sacrificed, even their lives for the freedom for us to enjoy the lives that we live today.

Remembrance Day is set aside to remember those who have given their lives for the freedom of others. And sadly for many - the day will pass for some - where they will give no thought its meaning.

Remembering does many things. It brings us back to the reality of what actually happened.

For today - It encourages us to see the dedication of those who fought and died. 

Remembering should stir within us a sense of gratitude and appreciation, and it should strengthen our own resolve to do our part in serving God and our community.

Remembering and reflection provides the human mind with clarity of what has happened.  We’ve heard the expression – hindsight is 20/20.  

A clear understanding of the past provides opportunities to learn, and prepare for the present and the future.

There are many accounts in the scriptures that tell us why we should remember the past. 

In Paul’s writings to the members of the Church – he referred to many examples of their history for their remembrance.

He reminded them of Adam, Enoch, and Noah. He talked about the accounts of Abraham, Isaac, and Jacob. 

He exhorted them to remember Moses and the deliverance of the chosen people from the hands of Pharaoh. 

Why was it that he felt – that it was important for them to remember the stories, or histories that they already knew? 

Because he used remembrance as a way to build their faith. 

Paul emphasized in almost every verse that all of these prophets acted by faith. 

Is it not the same with us? That as we “sufficiently retain in remembrance” our own past - that our faith will be strengthened because of it?

Throughout the scriptures - God’s people are instructed to stop and recall what He has done for them. 

For many people, Remembrance Day can stir mixed emotions. 

Today we remember the fallen of war – we give honour and glory to those who fought so valiantly; yet at the same time we can feel the lamentation of all the evil that war can bring.

We can grieve along with our Father in Heaven, who, when surveying the war and murder that polluted His earth said, “I gave them commandment that they should love one another, but they are without affection, and they hate their own blood. As a result misery shall be their doom; and the whole heavens shall weep over them . . . ; wherefore should not the heavens weep, seeing these shall suffer?” (Moses 7:37).

The observance of this Day — the 11th Day of the 11th month — was originally intended to ensure that never again would our world experience,  the slaughter, and the evil that comes from war.

John McCrae wrote:

In Flanders Fields the poppies blow
Between the crosses row on row,
That mark our place; and in the sky
The larks, still bravely singing, fly
Scarce heard amid the guns below.
We are the Dead. Short days ago
We lived, felt dawn, saw sunset glow,
Loved and were loved, and now we lie
In Flanders fields.


Now, let’s discuss for a moment the idea of “remembering the future.” 

When you hear this – “remember the future” – what would this mean?

What is meant by this – is that if we remembering the future – we will ensure that we will do those things that will help us, and our future generations.

We will work hard to have meaningful experiences that will shape the future in a way that will bring happiness and joy.  

What we have done, and what we will do today – will reflect the outcomes of tomorrow.

In addition to the plan of salvation – where we are here to be tested in one way or another - we are also here to experience all of the happiness and joy possible. 

“Men are that they might have joy” (2 Nephi 2:25). 

The Son of God truly meant it when he said, “I am come that they might have life, and that they might have it more abundantly” (John 10:10). 

Brothers and Sisters - there is an abundant life to experience - and we can make it happen.

I’ve actually used part of this scripture with some of my employees – which is found in D&C 58:27-28 – where it says that we, as sons and daughters of God, have power within us because we are agents unto ourselves and that our mission and purpose is to be “anxiously engaged in a good cause”

Brothers and Sisters - as we choose to do good things for and in behalf of ourselves, our families, and our neighbours - we will have joy – we will fill our lives with heart-warming memories – and we will impact the future for good.

Remembering the Saviour always – can enrich our lives. Each week, on the Sabbath Day, we have the opportunity to renew our baptismal covenants and remember Him.

As the sacrament is blessed, our priesthood holders pray that we who drink of it may remember our Savior, and further, the emblems are blessed that we may witness to the Father that we do always remember His Son. 

To witness means to attest, to testify that we remember Jesus Christ. How do we witness to the Father that we remember Him? There are many ways, of course, to remember Christ. 

We can learn of Him and remember His example and His teachings by reading the scriptures. 

We can remember Him and come to know Him more fully through our prayers. 

We can demonstrate that we desire to follow Him through our attendance at sacrament meeting. 

Our ability to witness will grow stronger each day as we actively live according to His gospel day by day. And, as we learn what it feels like to have the Holy Ghost witness to us of the divinity of Christ, we will, in turn, be able to witness unto the Father and others that we remember His Son.

Helaman 5:12 says:  And now, my sons, remember, remember that it is upon the rock of our Redeemer, who is Christ, the Son of God, that ye must build your foundation; that when the devil shall send forth his mighty winds, yea, his shafts in the whirlwind, yea, when all his hail and his mighty storm shall beat upon you, it shall have no power over you to drag you down to the gulf of misery and endless wo, because of the rock upon which ye are built, which is a sure foundation, a foundation whereon if men build they cannot fall. 

As Latter-day Saints we are commanded to “renounce war and proclaim peace” (D&C 98:16). 

Jesus said, “blessed are the peacemakers, for they shall be called the children of God” (Matt 5:9, 3 Ne 12:9). 

Former Prophet and President of the Church, Spencer W. Kimball, reproved the world – including members of the church when he reminded us:

‘Love your enemies, bless them that curse you, do good to them that hate you, and pray for them which despitefully use you, and persecute you; That ye may be the children of your Father which is in heaven’ (Matthew 5:44-45).

Even though we are called upon to be pacifists. President Hinckley said this about our current ongoing conflict with those in the Middle East:

“Let it be understood that we have no quarrel with the Muslim people or with those of any other faith. We recognize and teach that all the people of the earth are of the family of God. And as He is our Father, so are we brothers and sisters with family obligations one to another.

But as citizens we are all under the direction of our respective national leaders. They have access to greater political and military intelligence than do the people generally. Those in the armed services are under obligation to their respective governments to execute the will of the sovereign. When they joined the military service, they entered into a contract by which they are presently bound and to which they have dutifully responded.”

One of our Articles of Faith, which represent an expression of our doctrine, states, ‘We believe in being subject to kings, presidents, rulers, and magistrates, in obeying, honoring, and sustaining the law’ (Articles of Faith 1:12).

Today, whatever our feelings regarding the rights and wrongs of this or that war, we remember their sacrifice. That is the reason for this Remembrance Day. 

Perhaps – today - we can also take that difficult higher road – and not only pray for our heroes and patriots; but also pray for our enemies.

In Doctrine and Covenants 134:2 – it teaches us that governments have a duty to ensure “free exercise of conscience, the right and control of property, and the protection of life.” 

And even though we are instructed to honour and obey the laws of our land – I suspect that we can be justified - that when governments or nations threaten these rights – those governments and nation have no moral standing – and we are permitted to resist. 

This same situation led a young Latter-day Saint German boy, Helmuth Hübener, to actively oppose the Nazi evil in Hamburg during the Second World War. 

Helmuth Hübener had been a member of the Boy Scouts, but in 1935 the national socialists banned scouting from Germany. He then joined the Hitler Youth, as required by the government, but would later object to his enrollment when the Nazis, including the Hitler Youth, when he experienced their actions which destroyed Jewish businesses and homes. 

When one of the leaders in his local branch, a new convert of under two years, undertook to ban Jews from attending its religious services, Helmuth found himself at odds with the new policy, but continued to attend services with like-minded friends as the Latter-day Saints locally debated the issue. 

It was reported that of the two thousand Latter-day Saints in the Hamburg area – only seven were pro-Nazi; but five of them happened to be in his Branch.

After Helmuth finished middle school in 1941, he began listening to enemy radio broadcasts. Listening to these was then strictly forbidden in Nazi Germany, being considered a form of treason. 

In the summer of that same year, Helmuth discovered his older half-brother Gerhard's shortwave radio in a hallway closet. It had been given to Gerhard early that year by a soldier returning from service in France. 

Helmuth began listening to the BBC on his own, and he used what he heard to compose various anti-national socialist texts and anti-war leaflets, of which he also made many copies. 

The leaflets were designed to bring to people's attention how skewed the official reports about World War II from Berlin were, as well as to point out Adolf Hitler's, Joseph Goebbels's, and other leading Nazis' criminal behaviour. 

In late 1941, he managed to involve three friends from his branch; who helped him distribute about 60 different pamphlets, all containing typewritten material from the British broadcasts.

They distributed them throughout Hamburg, using such methods as secretly pinning them on bulletin boards, inserting them into letterboxes, and stuffing them in coat pockets.

On 5 February 1942, Helmuth Hübener was arrested.

He was tried and sentenced to death. After the sentence was read, Helmuth faced the judges, and said, "Now I must die, even though I have committed no crime. So now it's my turn, but your turn will come." 

For two months he was imprisoned — mistreated, with no bedding or blankets in his cold cell.

On October 27, at the age of 17, he wrote a letter to a fellow branch member, saying, "I know that God lives and He will be the Just Judge in this matter… I look forward to seeing you in a better world!" and with that he was beheaded by guillotine. 

Hübener’s resistance towards the Nazis brought difficult actions towards the members of the church; however, the actions of his moral character – was that he took a stand for the rights of others.

It takes courage.

Courage is what led the young pilots of the Royal Air Force to fight in the skies above Britain over seventy three years ago during the Battle of Britain. 498 of them died. Given the stakes, I do not think Churchill engaged in any exaggeration, when he said:

“The gratitude of every home in our Island, in our Empire, and indeed throughout the world, except in the abodes of the guilty, goes out to the British airmen who, undaunted by odds, unwearied in their constant challenge and mortal danger, are turning the tide of the world war by their prowess and by their devotion. Never in the field of human conflict was so much owed by so many to so few” (August 20, 1940, House of Commons).

There are times and circumstances when nations are justified, in fact have an obligation, to fight for family, for liberty, and against tyranny, threat, and oppression.

So, today we remember those who fought for those very reasons. Like the angel who instructed Alma, we “remember [what] great things [God] has done for [our forebears]; for they were in bondage, and he . . . delivered them” (Mosiah 27:16).

Elder Robert D. Hales talked about the four cornerstones of religious freedom that we as Latter-day Saints must rely upon and protect:

The first is freedom to believe. No one should be criticized, persecuted, or attacked by individuals, or governments, for what he or she believes about God. 

The second cornerstone of religious liberty is the freedom to share our faith and our beliefs with others. The Lord commands us, “Ye shall teach [the gospel to] your children … when thou sittest in thine house.” 

He also said to His disciples, “Go ye into all the world, and preach the gospel to every creature.” 

As parents, full-time missionaries, and member missionaries, we rely on religious freedom in order to teach the Lord’s doctrine in our families and throughout the world.

The third cornerstone of religious liberty is the freedom to form a religious organization, a church, to worship peacefully with others. The eleventh article of faith declares, “We claim the privilege of worshiping Almighty God according to the dictates of our own conscience, and allow all men the same privilege, let them worship how, where, or what they may.” 

And the fourth cornerstone of religious liberty is the freedom to live our faith—free exercise of faith not just in the home and chapel but also in public places. The Lord commands us not only to pray privately but also to go forth and “let [our] light so shine before men, that they may see [our] good works, and glorify [our] Father which is in heaven.”

Remember Captain Moroni, who hoisted the title of liberty inscribed with the words “In memory of our God, our religion, and freedom, and our peace, our wives, and our children.” 

And when he hoisted that banner – the people “came running together”- exercising their agency – with a covenant to act.

Brothers and Sisters - I invite you to remember those in your families; those in our communities, who have served their countries. 

I invite you also to take a moment, the next time you see war memorial.  Look at it – ponder of its significance – be filled with pride and admiration of the sacrifice that was made for you and your freedoms.

As I close – it is the tradition that on the 11th day of the 11th month at the 11minute of the 11th hour that we have a moment of silence – I ask that we take this moment now.  May we bow our heads and give pray and thought for those who have sacrificed, and those who continue to suffer because of the great tragedies of war.

1 minute of silence.

Thank you Brothers and Sisters – I bear testimony that our Father wishes all mankind to be at peace.  He wants us to be in a state where the lion can lie down with the lamb – where we are of one heart, of one voice, and of one people.

May the Lord bless those in our military, wherever they may be, for their faithfulness. 

May the Lord remind us of the debt of gratitude we owe them, and may He awaken within us a resolution to live worthy of their sacrifice.

May we, Brothers and Sisters - do all that we can to be bearers of peace. 

I pray in the name of Jesus Christ. Amen.`

    body: `An annoying man went to the doctor for a check-up. He said, "I feel terrible. Please examine me and tell me what's wrong with me." "Let's begin with a few questions," said the doctor. "Do you drink much?" "Alcohol?" said the man. "Never touch a drop."

"How about smoking?" asked the doctor. "Never," replied the man. "Tobacco is bad, and I have strong principles against it." "Well," said the doctor, "do you ever go out on the town to enjoy good friends and family?" "Oh, no!" said the man. "I stay home – read my scriptures – pray and get to bed 10:30 every night, and I always have been."

The doctor paused, looked hard at the man, and asked, "Well, do you have pains in your head?"  "Yes," said the man. "I have terrible pains in my head." "Ahh – I see," said the doctor. "That's your trouble.”  “What? what?” said the man; and the doctor answers, “Your halo is on too tight!"

Some of you may know the popular new TV series – not that new – it’s entering its 3rd season called “This Is Us”? – Tell about the show -

My wife and I love it.  We have it automatically recorded - stupid commercials.

Nominated for 8 Emmys writing and acting - moments of laughter; to moments of tears.

Jack & Rebecca Pearson. 3 children: Kate – overweight girl -struggles self-image.

Kevin – a good looking guy -actor.

Randall – dependable and responsible young black man - adopted when he was a baby.

Born on the same day.

The show is conveyed by going back and forth while were children, teens and adults.

Not considered a Christian show – has mature subject

So successful – invokes emotions that we can relate to – scene is about us.

The family members struggle with the imperfections of themselves and life.

I talk about this show because it demonstrates a world, and a family that struggles with the difficulties of the world; and celebrates those things that brings peace.

And like I said earlier – we all share in those moments.

They are people – just trying to get by in this world.

We are people – who are just trying to get by in this world.

I hope we all can remember this.  We are not faultless.  Our character is not impeccable.  But, we do make some good choices.  We are ordinary people – just trying to get by.

For this reason – it is important for us to be careful of how we view others.

Paul says in Romans 3:23 “For all have sinned, and come short of the glory of God;”

I know that it is common, for us to critique others because they are not doing the things that we think that they should doing.  Whether they are members of the church or a friend or an acquaintance in our communities.

Sometimes we look at ourselves as somehow superior because of how righteousness we feel that we are.

Paul wanted the Romans understand – that as a follower of Jesus Christ – we’re just like everybody else.

However, I wish to explain that there is a difference between us and those that are not committed to the Lord.

We who profess to follow the Saviour tend to live better lives than those who don’t have Him in their lives.

Now you might be saying to yourself – “isn’t that something that an arrogant, self-righteous person say?”

Possibly, but let me back this up with a study that was done about 9 years ago by the University of Chicago – church attenders performed nearly an average of 25% more charitable acts of kindness a year, than those who never attend church.

Survey of 795 college men at a public university a- found that college girls were safer with men who were religious. And that those religious men were less likely to force themselves on women; and were less likely to be involved in pornography.

It also showed that these men drank less alcohol — and there are many studies (outside of that study) that conclusively shows alcohol use is closely linked to increased aggressive and violent behavior.

There are other studies that conclusively determined that those who regular attend church - are generally happier and healthier than those who don’t go to church.

You know – when our oldest started his rebellious stage and debated the need to go to church on Sunday – I questioned him to point out if there was anything that we teach at church that would not make him a better person.  He thought about it for a while.  You could see in his eyes that he was scanning all of the things that he been taught – and even though he was angry about the subject of the conversation – he could not deny or express anything that would not help him be a better person.

Think about it yourself – is there anything?  You can’t find it.

I also reminded him that – as parents – we feel that it is our responsibility to help our children to be good people in this world – and how in the world can one not be somewhat influence to be good when they are in situations that are teaching them to do that?

Now I want to caution – just because we have that advantage – it does not mean that we are better than other people.

We cannot have an “Holier Than Thou” syndrome.

We have to be careful not to use our righteousness as some kind of yardstick to compare ourselves with people who don’t go to church. And there are 2 reasons for that:

First – we’ve all sinned and have fallen short of the glory of God; and that means that - since we’ve all sinned – there will be times when the world is more righteous than we may be at a particular time.

Take for example some of the times that I am on the golf course by myself and I hit a terrible terrible shot which causes the ball to go in the pond or lost in the trees.  My behaviour has been a terrible sight to see.

In the TV show that I told you about – “This is Us” – there was a powerful segment about one brother giving up something that was very important to himself -a partnership in his law firm – something that he had worked for, for years.  Hours of late nights and sacrifices.  And then came the day that he was going to be promoted – but he learned of his brother’s darkest moments of despair.  The choice was laid before him – promotion or his brother.  With compassion, he fled the opportunities of vocational stability and went to his brother’s side to be there - in his hour of need.

What a powerful moment.

As I reflected on that scene - I can’t help but believe that most of us would give up such a significant opportunity to help another that is in need.

However, I know there is a difference between saying or believing that we would do it – than actually doing it.  Many can talk the talk – but are we really ready to walk the walk?

So remember – I, or you, cannot to compare our righteousness with someone else’s – because there are certainly times when we just don’t measure up.

The second reason we’ve got to be careful about using our righteousness as standard of right and wrong - is that our righteousness doesn’t even compare with God’s.

Earlier in Romans if refers to the fact that - “the whole world may be held accountable to God.”

Isaiah said: “Your iniquities have separated between you and your God, and your sins have hid his face from you, that he will not hear. For your hands are defiled with blood, and your fingers with iniquity; your lips have spoken lies, your tongue hath muttered perverseness” (Isa. 59:2–3).

Brothers and Sisters - God is righteous. His Law is the gold standard of how we ought to live.

And His Law is the benchmark of all that is good and righteous - Not my righteousness or yours.

If I compare my righteousness with yours… I might look a little cleaner than you do. Or you might look a little cleaner than me. But, if I or you compare our righteousness with God’s - we’re all going to look pretty bad.

So comparing our righteousness with that of others is foolish.

God doesn’t want us to be “Holier Than Thou”. He wants us to be humbler.

President Hinckley in April 2004 said this about the advantage that we have in the world because of our knowledge and commitment to the Lord, he said –

“But this does not put us in a position of superiority. Rather, it should humble us. It places upon us an unforgiving responsibility to reach out with concern for all others in the Spirit of the Master, who taught, “Thou shalt love thy neighbour as thyself” (Matt. 19:19). We must cast out self-righteousness and rise above petty self-interest.”

He goes on to say, “We can never compromise the doctrine which has come through revelation, but we can live and work with others, respecting their beliefs and admiring their virtues, joining hands in opposition to the (dishonesties), the quarrels, the hatred—those perils which have been with man from the beginning.

Without surrendering any element of our doctrine, we can be neighborly, we can be helpful, we can be kind and generous.”

There’s a famous painting by Rembrandt called “Raising of the Cross” And to some it is one of the most powerful paintings ever made… but there is an odd detail that many don’t know.

In the picture it is shows the Saviour nailed to the cross.  At the base of the cross there is a man wearing blue beret.  Do you have any idea who that is? That’s right, it’s Rembrandt.

Why do you think that would he do that? Why would he paint himself into the picture of Christ’s crucifixion? It looks almost as if he’s one of those who drove the nails into the feet of Saviour.

Rembrandt was asked why – he tells us that he did that, because he wanted us to know, that he knew the truth. He was guilty of sin, and Jesus was dying for his guilt and his shame … and this is true for all of us as well – He died for all of us.

Brothers and Sisters - Avoiding Self-Righteousness does not mean that we succumb to the ways of the world.

Take for example the story shared by Elder Neil L. Andersen in the April 2014 General Conference where he spoke about a young woman about 16 or 17 years old. He quotes the young woman:

“This past year some of my friends on Facebook began posting their position on marriage. Many favored same-sex marriage, and several LDS youth indicated they ‘liked’ the postings. I made no comment.

“I decided to declare my belief in traditional marriage in a thoughtful way.

“With my profile picture, I added the caption ‘I believe in marriage between a man and a woman.’ Almost instantly I started receiving messages. ‘You are selfish.’ ‘You are judgmental.’ One compared me to a slave owner. And I received this post from a great friend who is a strong member of the Church: ‘You need to catch up with the times. Things are changing and so should you.’

“I did not fight back,” she said, “but I did not take my statement down.”

She concludes: “Sometimes, as President Monson said, ‘You have to stand alone.’ …

The Lord has told us, “Stand … in holy places, and be not moved.”

The Prophet Joseph Smith warned us, “All the religious world is boasting of righteousness: it is the doctrine of the devil to retard the human mind, and hinder our progress, by filling us with self-righteousness.”  He went on to point out this fact, “The nearer we get to our Heavenly Father, the more we are disposed to look with compassion…”

Brothers and Sisters - in the gospel of Jesus Christ, there is no place for ridicule, discrimination, or self-righteousness.

And even though some of us are - from all appearances, or not - are living and applying the gospel in our lives “more” than others - our Lord and Master considers all of us - His sheep.

And there are no sheep that are more important than another one sheep.

The Master, taught, “Thou shalt love thy neighbour as thyself” (Matt. 19:19).

Love – Love is the simple and wonderfully effective remedy to our moments of self-righteousness.

Love, respect, and patience will give provide us with the humility to remember who we are and what we profess to be – a follower of our Saviour Jesus Christ.

What if you took five minutes to slow down and appreciate the people and the interactions around you?

What could your tiny interaction mean to them? We spend our lives waiting for the next big event to happen in our lives, the next destination, usually unaware of the moments being created around us.

For one cab driver, his decision to take a moment to slow down changed everything for one woman.

[Story omitted for copyright — a widely circulated "taxi driver’s last ride" story, sometimes attributed to Kent Nerburn (similar to an account in his book Make Me an Instrument of Your Peace). Add back in from the source document.]

Brothers and Sisters - May we do all that we can - to withhold judgement of others – may we have humility, patience, and love to one another.

May we remember that we are all just people - People just trying to get by in this world.

May we, in humility and compassion - hold hands with our brothers, our sisters, our co-workers, our neighbours, and our friends – and lift one another to greater faith.

This is my prayer and my challenge to you this day, in the sacred name of our Saviour Jesus Christ. Amen.`

    body: `We will have the privilege of hearing our Church leaders today.  At our regular conferences, we have the privilege of sustaining our leaders.

Even though the Lord calls His servants by revelation, they can function only after being sustained by those they are called to serve.

With our sustaining vote, we make solemn promises. We promise to pray for the Lord’s servants and that He will lead and strengthen them.

In D&C 93:51 it says, “… and by your prayer of faith with one consent (one consent) I will uphold him”.

We also pledge that we will look for and expect to feel inspiration from God - in their counsel and whenever they act in their callings.

So as we raise a hand to sustain a person, we commit to support, maintain, nourish, assist, and encourage his/her work in bringing about the purposes of the Lord; and anticipate understanding and inspiration from them of which they are called to serve.

Brothers and Sisters - this can be done through accepting of callings, praying for them, responding to assignments – and most of all – following their direction.

The Lord has promised that - those who uphold the Lord’s servants in His kingdom will be sustained by His matchless power.

When Mike Wallace interviewed President Hinckley some years ago for the television program 60 Minutes, he said, “[People will say] this is a church run by old men.” To this, President Hinckley replied, “Isn’t it wonderful to have a man of maturity at the head—a man of judgment who isn’t blown about by every wind of doctrine?”

Two weeks ago, President Russell M. Nelson made his first public address to the world – with a press conference that followed.

I share with you some of his words to you - “We live in the most vibrant era in the history of the world … I wake up every morning eager for the adventures of the day. And I hope you feel that same exuberance for the gift of life.”

The Church of Jesus Christ of Latter-day Saints has truly gone global and has more than 16 million members in nearly 190 countries around the world.

When asked by a reporter about the diversity of the leadership of the Church, President Nelson said, “Wherever we go, the leadership of the Church is from the local communities, and those are the real leaders.”

“We have women on our councils, we have women administering ordinances in the temple, we have women presidents of the auxiliaries and their counselors. We depend on their voices.”

President Nelson concluded, “I declare my devotion to God our Eternal Father and to His Son, Jesus Christ. I know and love Them and pledge to serve Them — and you — with every remaining breath of my life,”

How do we, brothers and sisters – make a difference in our actions and our faith in sustaining our leaders?

What kind of difference can be made by something small?

Take for example - at 99 degrees, water is hot.

At 100 degrees, it boils.

And with boiling water, comes steam.

And with steam, you can power a train.

One degree. Applying one extra degree of temperature to water means the difference between something that’s simply very hot and something that generates enough force to power a machine.

It shows that seemingly small things - can make tremendous differences.

Thomas Edison said... “Many of life’s failures are men who did not realize how close they were to success when they gave up.”

What would happen if you just added a degree to your life?

On the PGA Tour at the PGA Championships – over the past 10 years - the winner took home an average of $1.89 million – the second-place finisher averaged nearly $760,000… less.

So over the course of a tournament – that margin of difference is 1.71 strokes – which works out to less than a half a stroke a day.

Another example is at NASCAR’s Daytona 500.  Over a 10 year period - the winner took the checkered flag by an average margin of 0.175 seconds… that’s half the time it takes for you to blink.

For the winner it meant nearly $700k… more.

There was a sign in a workplace that said: “If you are like a wheelbarrow, going no farther than you are pushed, you need not apply for work here!”

There is greatness in small things! What would happen if you just added a little bit more faith into your prayers, your confidence in God, your job, your family, and your sustaining of our church leaders?

How often do we miss an opportunity to create better results because we don’t apply a small amount of effort beyond what we normally do?

Consider, the impact of making an extra effort in investing an additional 15 minutes of quality time each day with your children or your spouse – this would be equivalent to more than two weeks each year.

Think Small -- Grow Big!

Being led is contrary to our natural desires, but when we choose to follow a good leader, we end up in a place that is better than where we would naturally gravitate to.

But even though our natural tendency to resist direction – there is something in all of us that knows that we can’t always do it on our own.

We know in the bottom of our hearts that we need to be lead; we need to be nourished; we need to be guided to safe places in our lives.

I want to spend some time focusing on what it means to be led.

Being led is a voluntary action.  Your choice - your choice to act upon the influences that are calling you to follow.

There is an obvious fact - you don’t need to be led to do the things you want to do.

No one needs to lead me to eat the goodies that is in the freezer; or on the counter of the kitchen.

I am naturally lead to those things – all by myself.

When we are led by our church leaders – we are often being led to those things that the natural man fights with – but – even though we may fight against it – we know – that we inwardly need such guidance.

King Benjamin tells us that the natural man is an enemy of God.

I never liked hearing that – I have always had the belief that we are all inherently good and that deep down inside of our moral character is someone that wants to do right – but unless we put off this natural man and turn to God – the natural man will have power and dominion over our thoughts and appetites.

Our leaders call, they inspire, and they direct aright.

Paul understands the struggles of the natural man in Romans 7 – where he describes things that he knows are good but continues to see himself fighting against.  He lets us know that the fight is real – it is in everyone, but the spirit of God – the Saviour’s work and glory has allowed us to conquer such struggles.

Too often we give up or relent to the enticing of the spirit and say – it’s too tough. I can’t do it.

I want you to know brothers and sisters – all is not lost.  Sinners as we are – we have Christ’s atoning love and sacrifice that can clean all those things that spiritually ails us.

We have leaders called of God - that are there to lead you down the path of eternal happiness.

God has called men and women to be in your path to guide you towards the light.

The world leads you one way – and those called of God have been called to lead you back to your Father in Heaven.

Remember - following is voluntary – you make the choice

Look at our military services people – hours and hours of training are done for our military.  Men and women have voluntary enlisted to serve.  Through all that training - they are taught how to defend our country; how to go into battlefield and be successful.

Nobody naturally goes walking into a battlefield.  And if you can’t get anybody onto the battlefield, you’ve lost.

Just as those servicemen have been trained, if they do not apply the training that they had received – we can naturally assume that they would not fare all that well in the battlefield.

Brothers and Sisters – we are being trained and taught all the time from God’s anointed.

Our prophet, the quorum of the twelve, Area presidencies, Stake and District Leaders, Branch Presidents, Elders Quorum, Relief Society, Young Men and Women Presidents, Primary Teachers, Visiting and Home Teachers, and your parents have all been called to holy positions to train and teach you – and to guide you.

Are you ready – are you ready to sustain them through your voluntary response of following of their teachings that brings light, hope, and confidence of greater things to come.

C.S. Lewis writes, “In the end, there are only two kinds of people. There are those who will say to God, ‘Thy will be done,’ and those to whom, in the end, God must say, ‘Ok. Your will be done.’”

Even our elder brother Jesus Christ was led by His Father in Heaven during His mortal ministry.  And we know what kind of person he was, when he came to a point in His life that He did not want to do – however, He said to His Father, “thy will be done”.

Winston Churchill was a man that had great insight to life and the circumstances that were placed before him.

Very early, he knew that nobody wanted to fight the Nazis. But he knew they needed to. It wasn’t until Adolf Hitler invaded Czechoslovakia that people finally realized that Churchill had been right all along – and they finally made him prime minister.

The current Prime Minister, Neville Chamberlain has gone down in history as a wimp who kept insisting that deep in his heart, Hitler was just a good guy – who just needed a little bit more.

Churchill famously said, “Ultimately, you can always appease the lion by allowing yourself to be eaten!”

We know that we can be eaten through the wrongs that we do.  It can deteriorate and corrode the spirit.

Thankfully, Britain knew Churchill was right – and I suspect if they had not chosen to be led – who knows, I might have had to be delivering this talk to you today - in German.

It took a lot of pain and suffering to realize that the Nazi threat was just that – a threat.

Churchill called upon his nation; and the nations around the world to the battlefield; and to “never surrender."

And when his nation and the nations of the world followed his leadership – it truly became “their finest hour.”

Our Saviour with His leaders, are calling us to a battlefield today too. We fight, not against other nations or governments – but we fight against the power and influences of the world that wants us to be drag down to eternal despair.

Sin is a real thing. You may choose to ignore it, you may choose to give into it, or you can choose to fight it. It will take your blood, your toil, your sweat, and your tears. But you will win, if you’ll follow your leaders – those who represent your Saviour, your Redeemer, even Jesus Christ.

I sustain – our Prophet – Russell M. Nelson.  I sustain his counselors and the Twelve Apostles.  I sustain Pres. Wong and President Slocombe.  I sustain President Perrault.  And Brothers and Sisters, I sustain all of you who are called to lead, to direct, and to inspire each of us who need your divine spiritual guidance.

The small increase of your devotion can bring forth great power in your lives and the lives of those whom you are called to serve and those you love.

I pray and challenge you to add an extra degree of commitment to God’s work.

In the name of Jesus Christ. Amen`

    location: "Smithers, BC",
    notes: "",
    body: `Good morning brothers and sisters.  I bring you a special Christmas Greeting from Pres. Slocombe ….

President Harold B. Lee said: “Life is God’s gift to man. What we do with our life is our gift to God.”

Christmas gifts are a huge part of our modern day Christmas.

I say forget the presents!

Think of all the time you could save from shopping, worrying, and wrapping present – that you could use to have quality family time.

So I say – forget all the presents!

Let’s just give a gift to God – a life that would make Him smile and be happy.

I suppose that I don’t have to say anymore – forget presents and give your life to God.

I’m sure all the kids don’t like this message.

The truth is – presents provide us as a means of expression of our love for one another.

There is one present that my wife and I have given – that has brought years of joy and pleasure to so many.

It is one of my most memorable experiences of how a gift can bring tears of joy to another.

It warms my heart each time I recall – it was a few Christmas ago - when Jadyn opened her eyes to see her new puppy.

That little puppy has got to be one of the best gifts ever given.

But you know and I know that it’s not the greatest.

There was a sign in a restaurant that advertised their gift certificate as the ideal Christmas present. Their slogan was “One Gift Fits All.” The idea was that everyone needs a good meal at a good restaurant.

Certificates can be an ideal gift – maybe a gift certificate for a movie rental; or simulated golf; or yoga; or even a salt float?

But in virtually every case – are these certificates truly “gifts that fit all”?

Here’s another example of great gifts –

On the last day of school before Christmas the kids all lined up to give her presents.

The first student gave her a small box, she shook it and heard small things rattling inside it, knowing that the child’s father owned a candy store she said, “I know what this is, it’s a box of chocolate.” “Yes, teacher it is chocolate.”

She took the box from the next student, it was thin and long, his father owned a flower shop, so she said, “I know what this is, you gave me flowers.” “Yes teacher, it’s a bunch of flowers.”

The next student handed her a tall box, his father owned the local liquor store and the box was leaking. She tasted it and said, ‘I know what this is, it’s Champagne.” “No.” said the young student.  She tasted it again, “Is it wine?” “No, teacher it’s a puppy.”

When we talk about the greatest gifts – are they certificates, chocolates, flowers, or even a puppy?

While we can’t argue that they could be great gifts – we know as Latter-day Saints that the greatest gift given to mankind – is truly a gift that fits all – it is the essence of the Christmas story.

It is about God’s gift - of His Son – who came to earth – to inherit a mortal life so that he might die for all of our sins – and to conquer death through His resurrection.

This gift is truly a “gift that fits all” – for we are all fallen and are lost.

I want you to imagine – Imagine if this gift of the Saviour had never been given to the world.

Without this gift – you and I would have died in our sins.

Matthew, the tax collector, would still have been a traitor to his countrymen.

The Roman soldier would have continued his cruelty.

Peter, James and John would have done nothing more with their lives than fish for a living.

The Apostle Paul would have continued to be a cruel Pharisee.

The people who needed healing, during the time that Christ would have lived, would still have been broken in body and spirit.

The lame would still have been lame; the blind would have remained blind; the deaf would have still lived in silence.

We would never have heard the words: “Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid.” (John 14:27)

He came thousands of years ago – but He is still with us now.

He showed us how to Love – how to forgive – how to serve.

He taught us not to use the values of this world to determine our worth, for he said, “So the last shall be first, and the first last …” (Matthew 20:16).

He taught us that our value to God was more important than what anyone else thought about us.

And of one of the most important purposes – this present from our Father – is that Christ’s life and sacrifice – give us the hope of eternal life.

Think about how you would feel if you had no hope – no hope beyond the grave.  You could not talk of heaven – or of eternal families.

May we be like the wise men of old and seek out the Saviour.

Remember - when we seek him; we will find him. The Saviour promised, “Seek and ye shall find, knock and the door shall be opened unto you.”

When we come to church; when we live good lives; when our primary focus is on seeking Christ and being like Him; to search after him; to try draw nearer to him; it is through these, that we exhibit and demonstrate our faith in being a diligent seeker of Him.

Once the wise men reached the newborn Christ, the scriptures say that the first thing they did was worship, just like the shepherds had done.

In Matthew 2:11 we read, “And when they were come into the house, they saw the young child with Mary his mother, and fell down, and worshipped him: and when they had opened their treasures, they presented unto him gifts; gold, and frankincense, and myrrh”

They bowed down and worshipped. They demonstrated their submission to the young child.

This is important for us to remember that we need to submit ourselves to the Father and His Son.

These wise men presented an offering of three gifts as a sign of worship.

So please Brothers and Sisters - remember, that as you worship, you too, should provide an offering.

What do we bring; or what do we offer to our Lord and Saviour, which is costly and precious to us? What do we lay at his feet?

Last Sunday during the First Presidency Christmas Devotional, Pres. Uchtdorf reminded us that, “Even if all we have is a handful of crumbs, we (should) gladly share them with those in emotional, spiritual, or temporal need as an expression of our gratitude for the divine feast God has prepared for us.”

He goes on to say, “But let us never forget that we are disciples and followers of Jesus Christ, the living Son of the living God. To truly honor His coming into the world, we must do as He did and reach out in compassion and mercy to our fellowmen. This we can do daily, by word and deed.”

With that – I again ask you – what do you lay at His feet? What is your offering of worship - to Him?

I can tell you what he wants the most, it’s not your money, or your time; however, God does want you to pay those tithes and offerings of service - but what he really wants - is you, all of you, every part.

I can’t help but think of all those missionaries that serve throughout the world, as they embark in the service of their God.

Their gifts, their offerings of gold, frankincense, and myrrh – is a gift of themselves.

We do not have to be called away on missions to give of ourselves.  We do not need a badge saying Elder or Sister - to give of ourselves.

We can give in small and simple ways – we can give in great and marvelous ways.

Life is given to us – the way we live our life is the gift we give to God.

The message of Christmas is not just a story of the birth in a stable, the Wise Men, the shepherds, or the flight into Egypt. The message of Christmas is the celebration of the gift given to us from our Father in Heaven – the gift of the Saviour – who brought us hope; who brought us the Atonement and the Resurrection.

With the birth of the babe in Bethlehem, there emerged a great blessing, a blessing of power - stronger than anything found in this world.  A blessing worth more than all the wealth, ever found in this world.

The young babe – born in stable - was to be the King of kings, the Lord of lords, the promised Messiah, even Jesus Christ, the Son of God.

The Christmas spirit is the Christ spirit; it is the spirit of the gospel of Jesus Christ, obedience to which will bring ‘peace on earth,’ because it means—good will toward all men.

Remember, the real spirit of Christmas lies in Christ’s assurance: “I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live: And whosoever liveth and believeth in me shall never die” (John 11:25–26).

May our Heavenly Father bless us … with the desire to lay at His feet – all that we are – all that we can give.

And when we do this – my favourite scripture will come to pass - “I will go before your face. I will be on your right hand and on your left, and my Spirit shall be in your hearts, and mine angels round about you, to bear you up.” (D&C 84:88.)

I close in identifying and emphasising the greatest of all gifts. The present that is grandest of all presents – no, it’s not a certificate at Gone Hollywood or the Yoga Loft.

It’s a present that is wrapped; it is presented; and will be yours to open –

It is an incomprehensible gift – but it is real – it is the gift; of all of what the Fathers has – it is His life – God’s life – Eternal life.

May we come to really know Him.  May we give generously to Him, Brothers and Sisters, as He has so abundantly given to us.

I so pray, in the sacred name of our Saviour, that young babe born in Bethlehem so many years ago, our elder brother, the redeemer of mankind - even Jesus Christ, amen.`

    body: `After World War II, a group of German students volunteered to help rebuild an English cathedral that had been severely damaged by German bombs. As work progressed, they became concerned about a large statue of Jesus, whose arms were outstretched and beneath which was the inscription: “Come unto Me.” They had particular difficulty trying to restore the hands, which had been completely destroyed. After much discussion, they decided to let the hands remain missing and changed the inscription to: “Christ has no hands but ours.” (John MacArthur Jr.)

Brothers and Sisters - the work of the Lord is in the hands of those who belong to Him.

In that sense, He has no hands but our hands, no feet but our feet.

The Lord commissioned this work to those who believed “Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost: Teaching them to observe all things whatsoever I have commanded you: and, lo, I am with you alway, even unto the end of the world.” Matthew 28:19-20

Many of you know one of my passions is golfing.  I have been trying to figure out for years how to consistently hit that perfect swing.  I’ve watched excellent golfers on TV, video and in real life.

There is something about how important that the whole body has to work together to make a perfect swing.

You cannot just swing your wrists.  You cannot just swing your arms.  You cannot just twist your shoulders.  And you cannot just rotate your hips.

You must use all of these and other parts of your body - in concert with each other to provide a smooth, effective and efficient golf swing.

While I golf, I sometimes find myself using too much arms or maybe not enough shoulder turn; or enough leg thrusts and as a result a truly sound shot never transpires.

In our Branches, we can find imperfect swings.  What I mean by that is that

Unfortunately, some wards in the Church are hitting on only a few cylinders, including some that are trying to make do with just one. The one-cylinder ward is the ward where the bishop handles all of the problems, makes all of the decisions, and follows through on all of the assignments. Then, like an overworked cylinder in a car engine, he is soon burned out.

Our bishops have heavy demands placed upon them. They—and they alone—hold certain keys, and only they can fulfill certain responsibilities. But they are not called to be all things, at all times, to all people. They are called to preside and to lead and to extend God’s love to His children. Our Heavenly Father does not expect them to do everything by themselves.

The same is true of our stake presidents, priesthood quorum and auxiliary presidents, and, for that matter, mothers and fathers. All have stewardships that require large amounts of their time, talent, and energy. But none is left to do it alone. God, the Master Organizer, has inspired a creation of a system of committees and councils. If understood and put to proper use, this system will decrease the burden on all individual leaders and will extend the reach and the impact of their ministry through the combined help of others.

Six months ago I stood at this pulpit and talked about the importance of the council system in the Church. I spoke about the great spiritual power and inspired direction that come from properly conducted family, ward, and stake councils. The Spirit continues to bear witness to me of how vital efficiently run Church councils are to the accomplishment of the mission of the Church. For that reason, I have been anxious to see how well my remarks in October were understood, particularly by our faithful and diligent bishops.

During training sessions I have conducted in various locations since last general conference, I have focused attention on the ward council. As part of that training, I invited a ward council to participate. I gave to the bishop a theoretical problem about a less-active family and asked him to use the ward council to develop a plan to activate this family.

Without exception, the bishop took charge of the situation immediately and said, “Here’s the problem, and here’s what I think we should do to solve it.” Then he made assignments to the various ward council members. This was a good exercise in delegation, I suppose, but it did not even begin to use the experience and wisdom of council members to address the problem.

Eventually I asked the bishop to try again, only this time to solicit ideas and recommendations from his council members before making any assignments. I especially encouraged him to ask the sisters for their ideas. When the bishop opened the meeting to council members and invited them to counsel together, the effect was like opening the floodgates of heaven. A reservoir of insight and inspiration suddenly began to flow between council members as they planned for fellowshipping the less-active family.

As I watched this same scenario play out before me time after time during the past six months, I decided that it would not be out of order to speak about the importance of councils once again. I speak not to scold those who did not give serious attention last time, but because we have an urgent need in the Church for leaders, particularly stake presidents and bishops, to harness and channel spiritual power through councils. Family, ward, and stake problems can be solved if we seek solutions in the Lord’s way.

In my experience, lives are blessed when leaders make wise use of committees and councils. They move the work of the Lord forward much faster and farther, like a fine automobile operating at peak efficiency. Committee and council members are unified. Together they experience a much more pleasant trip along the highway of Church service.

For my purpose today, let me review three ward committees and councils that always should follow a prearranged agenda.

First is the priesthood executive committee. It consists of the bishopric, high priests group leader, elders quorum president, ward mission leader, Young Men president, ward executive secretary, and ward clerk. This committee meets weekly under the direction of the bishop to consider ward priesthood programs, including temple and family history, missionary, welfare, home teaching, and member activation.

Second is the ward welfare committee. It includes the priesthood executive committee plus the Relief Society presidency. This committee meets at least monthly, again under the direction of the bishop, to consider the temporal needs of ward members. Only the bishop may allocate welfare resources, but the committee helps care for the poor by planning and coordinating the use of ward resources, including the time, talents, skills, materials, and compassionate service of ward members. In this and in other committee and council meetings, delicate matters often are discussed, requiring strict confidentiality.

The third is the ward council. It includes the priesthood executive committee; the presidents of the Relief Society, Sunday School, Young Women, and Primary; and the activities committee chairman. The bishop may invite others to attend as needed. This council meets at least monthly to correlate planning for all ward programs and activities and to review ward progress toward accomplishing the mission of the Church. The ward council brings a varied group of priesthood and women leaders together to focus on the broad range of issues that affect ward members and the community. The council reviews suggestions from home teachers and visiting teachers.

Recently, a bishop who was concerned about reverence in his ward expressed his concern to the members of the ward council and asked for their suggestions. Hesitantly, the Primary president raised her hand.

“Well,” she said, “one person consistently does a lot of enthusiastic visiting in the chapel just before and after sacrament meeting. It can be pretty distracting.”

The bishop had not noticed anyone being especially noisy in the chapel, but he said he would talk to the offending party. He asked the sister who it was.

She took a deep breath. “It’s you, Bishop,” she said. “I know you’re just reaching out to people, and we all appreciate your desire to greet everyone who comes to the meeting. But when others see you moving around the chapel talking to people during the prelude music, they figure it’s OK for them to do the same thing.”

When others in the ward council nodded in agreement, the bishop thanked her and asked for recommendations. The council soon decided that the bishopric, including the bishop, should be in their places on the stand five minutes before sacrament meeting to set an example of reverence in the chapel. During a follow-up discussion, the council members indicated unanimously that the simple plan had worked and that reverence in sacrament meeting had improved decidedly.

Another bishop was concerned about the trend he noticed in ward fast and testimony meetings. Members were bearing few testimonies of Christ and His gospel; instead, they were sermonizing, giving travelogues, sharing personal experiences that were not related to the gospel, and talking about family outings and activities. The bishop understood that those topics were important to the speakers. But they were not testimonies of Christ and His gospel. He asked the ward council, “How can we teach the importance of using testimony meeting for testifying of Christ and His restored church without offending our members?”

After a little time and some comments by the sisters, the council suggested that the bishop should teach the members what a testimony is and what it is not. In addition, the council concluded that the quorums and auxiliaries should discuss the purpose of testimony meeting, and home teachers and visiting teachers should review this subject with individual families during their monthly visits. The bishop now reports, “Our testimony meetings are much better. The witness of Christ and His love for us is expressed by the members, and the spirituality of our ward has improved greatly.”

One major concern of the General Authorities is the lack of retention in full fellowship of some new converts and those who are less active in the Church. If ward councils are functioning as they should, every new convert will be fellowshipped, will have home teachers or visiting teachers, and will receive an appropriate calling within days after baptism. The less active will receive callings that assure them that they are needed and loved by the ward members.

The Brethren also have expressed “concern regarding Church members’ involvement in groups [which are often very expensive] that purport to increase self-awareness, raise self-esteem, and enhance individual agency.” Church leaders and members should not become involved in such groups. Instead, “local leaders should counsel those desiring self-improvement to anchor themselves in gospel principles and to adopt wholesome practices that strengthen one’s ability to cope with challenges” (Bulletin, 1993–2, Salt Lake City: The Church of Jesus Christ of Latter-day Saints, 1993).

When stake presidents and bishops allow the priesthood and auxiliary leaders whom the Lord has called to serve with them to become part of a problem-solving team, wonderful things begin to happen. Their participation broadens the base of experience and understanding, leading to better solutions. You bishops energize your ward leaders by giving them a chance to offer suggestions and to be heard. You prepare future leaders by allowing them to participate and learn. You can lift much of the load from your shoulders through this kind of involvement. People who feel ownership of a problem are more willing to help find a solution, greatly improving the possibility of success.

Once the appropriate councils are organized and the brethren and the sisters have full opportunity to contribute, ward and stake leaders can move beyond just maintaining organizations. They can focus their efforts on finding ways to make their world a better place to live. Certainly ward councils can consider such subjects as gang violence, child safety, urban blight, or community cleanup campaigns. Bishops could ask ward councils, “How can we make a difference in our community?” Such broad thinking and participation in community improvement are the right things for Latter-day Saints to do.

For the past eight and one-half years I have served as a member of a council of twelve men. We come from different backgrounds, and we bring to the Council of the Twelve Apostles a diverse assortment of experiences in the Church and in the world. In our meetings, we do not just sit around and wait for President Howard W. Hunter to tell us what to do. We counsel openly with each other, and we listen to each other with profound respect for the abilities and experiences our brethren bring to the council. We discuss a wide variety of issues, from Church administration to world events, and we do so frankly and openly. Sometimes we discuss issues for weeks before reaching a decision. We do not always agree during our discussions. But once a decision is made, we are always both united and determined.

This is the miracle of Church councils: listening to each other and listening to the Spirit! When we support one another in Church councils, we begin to understand how God can take ordinary men and women and make of them extraordinary leaders. The best leaders are not those who work themselves to death trying to do everything single-handedly; the best leaders are those who follow God’s plan and counsel with their councils.

“Come now,” said the Lord in an earlier dispensation through the prophet Isaiah, “and let us reason together” (Isa. 1:18). And in this dispensation, He repeated that admonition: “Let us reason together, that ye may understand” (D&C 50:10).

Let us remember that the basic council of the Church is the family council. Fathers and mothers should apply diligently the principles I have discussed in their relationships with each other and with their children. In doing so, our homes can become a heaven on earth.

Brothers and sisters, let us work together as never before in our stewardships to find ways to make more effective use of the wondrous power of councils. I ask you to consider all that I said on this subject last October with what I have said today. I testify that we can bring the full force of God’s revealed plan for gospel governance into our ministries as we counsel together.

May God bless us to stand united as we strengthen the Church and our members,

I pray in the name of Jesus Christ, amen.`
