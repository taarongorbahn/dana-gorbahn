    title: "I Am a Mormon",
    date: "October 2015",
    location: "Kitimat, BC",
    notes: "Also given in Terrace in July 2014 and Smithers in November 2014.",
    body: `There was this man – let’s call him – Jordon.  Jordon walks into Tim Hortons and was in line to get his lunch.  He leans over to the guy next to him and says, "Wanna hear a Mormon joke?"  The guy next to him replies, "Well before you tell that joke, you should know something.  I'm 6' tall, 200 lbs., and I am an anti-Mormon.  The guy next to me is 6'2 tall, weighs 225, and he's an anti-Mormon.  The fella next to him is 6'5 tall, weighs 250, and he's an anti-Mormon.  Now, you still wanna tell that joke?"  Jordon then rolls his eyes like he does and says to the first guy, "Nah, not if I'm gonna have to explain it 3 times."

Today, I will not be talking about the phrase “I am an anti-Mormon” but will talk about the phrase, “I am a Mormon”.

Now – I’d first like to remind all of us that the church wishes for us to refer to the name of the church in its entirety - we are to call ourselves The Church of Jesus Christ of Latter-day Saints rather than the Mormon Church; however, it is appropriate to refer to ourselves as Mormons.

Starting in October 2011, the church began a campaign called “I am a Mormon” to respond to the misconceptions and perceptions of the Church throughout the world.

The media campaign included television spots, billboards, ads on buses; and on the Internet.

The ads give a glimpse into the lives of Latter-day Saints from all over the world; and refers people to the mormon.org website, where they can read the profiles of tens of thousands of Mormons, chat live with representatives who will answer questions about the faith and watch dozens of videos about members of the Church.

We as members of the church are encouraged to have our own profiles on the website to share a little bit about ourselves and be a beacon, an example, and a familiar face or name in our small communities.

If you went home today to search Kitimat, you would find a profile of a person named Jason; and find that he was baptized in Kitimat but no longer lives in Kitimat; and has been a member for 33 years; he has 4 children including a set of triplets; that he likes reading and hiking in the mountains; he goes on to say that he enjoys serving in the church and knows that it is easier to know that he can do it because it was the Lord that inspired the leaders to call him to that service.

If you looked at my profile, you would find out some of my hobbies; that I served a mission for the church in England; how I serve in the church; and why I am a Mormon.

I encourage you to take advantage of this easy vehicle of missionary work to share with others the proud fact that you too are also, a Mormon.

When we say, “I am a Mormon”, what is it that we are saying?

Is it only to state that we belong to the Church of Jesus Christ of Latter-day Saints?

Brothers and Sisters – it is more than that.  It is the charge for each of us to be examples of righteousness in a world which desperately needs our influence and our strength.

The Apostle Paul to his beloved Timothy said: “Be thou an example of the believers, in word, in conversation, in charity, in spirit, in faith, in purity.”

Today, so many  influences and effects of Satan, such as liberalism, immorality, pornography, and the power of peer pressure - causes many to be swayed, manipulated and persuaded to do wrong and bring heartache, unhappiness, and shattered dreams of eternal nature to their lives.

As a member of the church, you all belong to a rich heritage which needs to be honored.

You know that you will be tempted - withstand it.   You know the truth – please live it.  You possess a testimony - please share it.

Remember the words given to Moses while he resided in the presence of God on Mount Sinai: “Honour thy father and thy mother.”  There is wisdom and blessing to those who honor their earthly parents but we must not forget to honor our eternal Heavenly Father and Mother.

The Prophet Joseph Smith faced temptation. Can you imagine the ridicule, the scorn, the mocking that must have been heaped upon him as he declared that he had seen a vision?

I suppose it became almost unbearable for the boy. He no doubt knew that it would be easier to retract his statements concerning the vision and just get on with a normal life. He did not, however, give in.

These are his words: “I had actually seen a light, and in the midst of that light I saw two Personages, and they did in reality speak to me; and though I was hated and persecuted for saying that I had seen a vision, yet it was true. … I had seen a vision; I knew it, and I knew that God knew it, and I could not deny it.”

Now – I do not believe that we have all had such an encounter as the boy Joseph, but I hope that we have all had an experience of some light and understanding; or whispering, or moments of spiritual manifestation – where God’s spirit spoke to your spirit - that lends to the resemblance of this statement of “I knew it, and I knew that God knew, and I could not deny it”.

Like Joseph – may we take courage in the face of temptation and withstand it.

In my business, we have specific statements that describe our Code of Conduct.  In fact, each year, I go over these codes with my supervisors and Board of Directors, and they in turn, go over them with the staff with which they have stewardship over.

This exercise is to highlight, emphasize, and accentuate the practices that we value as a business and hope to execute in our day to day operations.

Brothers and Sisters – if the church had its own code of conduct, and for all of us that say “I am a Mormon” – we who are members of the Lord’s true church – can look to the 13th Article of Faith as our own code of conduct; by which we should live our lives.  It states,

“We believe in being honest, true, chaste, benevolent, virtuous, and in doing good to all men; indeed, we may say that we follow the admonition of Paul—We believe all things, we hope all things, we have endured many things, and hope to be able to endure all things. If there is anything virtuous, lovely, or of good report or praiseworthy, we seek after these things.”

After Joseph Smith’s vision in the Sacred Grove, he received no additional communication for three years.

Can you imagine how you would feel if you had seen God the Father and Jesus Christ, His Son, if Christ had spoken to you, and then you had no additional word or communication for three years?

Would you begin to doubt? Would you wonder or question why? The Prophet Joseph Smith did not wonder; he did not question; he did not doubt the Lord. He had received the truth, and he lived it.

I think about the young Joseph’s age.  Just a young boy – a youth like many here today.  What courage and strength.

To the youth here in the Kitimat Branch – you may not be called to lead the church – but you are called to lead your friends and provide support for your parents to lead your families.

You are called to be a beacon, a light, and example to all that you come in contact with.

I know as a youth myself – that I tried to do this (my mom might tell you stories to the contrary) but I know one of the most powerful influences to help me and my friends be true to the things that God wants us to do was this ….

Now  listen to this one thing – cause I know – I really know that this assisted with my testimony and faithfulness in the midst of temptation when I was a youth.

It is that I simply let my friends know who I was, that I was a Mormon, and what standards I was to uphold.

My friends accepted who I was - and was now part of that team that would create an environment that was in harmony with my values.

My dear Brothers and Sisters – Some of our manifestations of the spirit can be greater than others – some may have had these witnesses throughout your lives and some at only key and vital defining moments of time.

Some have had absolute vivid expression of the spirit; yet some receiving the quiet personal assurance.  Regardless – that spirit has communicated with your spirit – a knowledge that God is there; that He knows you personally – and that He loves you.  Please hold fast to that most glorious truth.

Do not give up on that testimony.  Feed it; grow it; share it.

Do not give up on Him. For He will not give up on you!

President Gordon B. Hinckley said: “[The] thing which we call testimony … is as real and powerful as any force on the earth. … It is found in young and old. … It brings with it the assurance that life is purposeful, that some things are of far greater importance than others, that we are on an eternal journey, that we are answerable unto God.”

Remember this Brothers and Sisters – “faith and doubt cannot exist in the mind at the same time, for one will dispel the other. Cast out doubt. Cultivate faith. Strive always to retain that childlike faith which can move mountains and bring heaven closer to heart and home.”

As President Monson said, “You know the truth; live it.”

He also said, that if “you possess a testimony; share it. Never underestimate the far-reaching influence of your testimony. You can strengthen one another; you have the capacity to notice the unnoticed. When you have eyes to see, ears to hear, and hearts to feel, you can reach out and rescue others …”

Brothers and Sisters - You can share your testimony in many ways—by the words you speak, by the example you set, and by the manner in which you live your life.

May each of us emulate the Prophet Joseph’s great example. He taught the truth; he lived the truth; he shared the truth.

I love the saying, "I would rather see a sermon than to hear one any day”

In the Book of Mormon, King Benjamin taught, “I would that ye should take upon you the name of Christ, all you that have entered into the covenant with God that ye should be obedient unto the end of your lives. … (Mosiah 5:8).

As followers of our Savior Jesus Christ; as people who covenanted to take upon us – His name; we must not just talk the talk, ..... but, we must walk the walk.

We have a duty ...... and as Pres. Monson says …. a most glorious duty .... to be faithful to Him in our daily life, ..... not just speaking about Christ, ..... but living in Christ.

Are you living in such a way that reflects His name? Are you producing the fruits of the Spirit?

Are you filled with “love, joy, peace, longsuffering, gentleness, goodness, faith, meekness, and temperance (Galatians 5:22-23)?  If not, you should be.

There is a wonderful LDS song, written by Janice Kapp Perry called “His Image in Your Countenance” and it goes like this,

[Lyrics omitted for copyright — Janice Kapp Perry, "His Image in Your Countenance." Add back in from the source document.]

The chorus asks these questions, Brothers and Sisters - Have you received His image in your countenance? Does the Light of Christ Shine in your eyes?

We are asked to stand as a witness of Him “at all times and in all things, and in all places” (Mosiah 18:9).

This means that we must be willing to let others know whom we follow and to whose Church we belong: the Church of Jesus Christ.

This must be done in a spirit of love and testimony.

We ought to follow the Savior by simply and clearly, yet humbly, declaring that we are members of His Church. That we follow Him by being Latter-day Saints—latter-day disciples.

My prayer is this  – that as we become valiant, courageous and bold – in sharing to all those around us that you “are a Mormon”.

That in so doing – those that hear this proclamation – may too feel and see the Light of Christ shine in your eyes; and that they may see that His image is indeed in your countenance.

May we not only be the sayers of the word but doers of the word.  May our lives be THE sermon.

Because, our lives may be the only sermon ..... that those around us will ever hear; or will ever see.

Let our testimonies of Him be heard and our love for Him always be in our hearts, I humbly pray in His name, the Lord Jesus Christ, amen.`

    section: "Church Talks",
    title: "The Dangers of Drifting",
    date: "August 30, 2015",
    location: "Smithers, BC",
    notes: "",
    body: `Several years ago a couple was on vacation in Florida and they were floating in the ocean on inflatable rafts. The husband decided to head into the shore but his wife wanted to stay out on the raft and continue to catch some rays. After a short time the woman lost herself in floating along on the raft.

What the woman failed to realize was that she was slowly drifting out to sea. As she simply relaxed and let the gentle current take her with it, her situation was becoming more and more dangerous.

By the time that she noticed what was happening to her, it was almost too late. She saw that the shore was much farther away than she expected.

She frantically paddled but seemed to get nowhere - she began to panic.

Fortunately the lifeguards were able to rescue her but the whole situation was created just by being careless.

I have a question for all of us - How many of us are just coasting or drifting along in our spiritual journey?

How many of us are simply being careless with our spiritual lives?

Hebrews 2:1 gives us a specific warning for just this type of spiritual situation – where it says “Therefore we ought to give the more earnest heed to the things which we have heard, lest at any time we should let them slip”

We can easily look around and visibly see the many people that we know that have drifted their ways from the faith that they once had.

What’s not as easy – are those that are quietly drifting.  That could be you or me.

We need to – as Paul asserts - take heed to the word of God that will keep us close to the safety of our Saviour.

Brothers and Sisters – please ask yourselves these questions –

Has there ever been a time in your life, when you were more dedicated to your Saviour and His Gospel, than you are right now?

Has there ever been a time when you felt closer to Him, than you are right now?

If you answered yes to either of these questions – you may be in the process of drifting.

If your relationship with our Saviour is not where it once was or if it is not where you know it should be - you are drifting.

So why is it that so many people drift?

The answers and reasons are many.

The Saviour explained in Matthew:

Some fell upon stony places, where they had not much earth: and forthwith they sprung up, because they had no deepness of earth:

And when the sun was up, they were scorched; and because they had no root, they withered away.

And some fell among thorns; and the thorns sprung up, and choked them:

But he that received the seed into stony places, the same is he that heareth the word, and anon with joy receiveth it. — Matthew 13:5–7, 20

So it seems that for some – they seem to settle for a shallow relationship with the Saviour.

And they will find that they will never have the depth of faith to make it through the rough spots of life.

Their lack of spiritual depth leads to nothing but a withered and dead spiritual soul.

Brothers and Sisters – the gospel of Jesus Christ truly does have the spiritual depth that can overcome any and all complexities of troubles and difficulties of spiritual struggles.

Another reason for some people’s drifting - is that people simply want to choose the things of the world over the things of God.  Quite bluntly – this is like denying the Saviour.

It’s somewhat comparable to what Judas Iscariot did when he betrayed the Saviour for 30 pieces of silver.

Drifting also occurs when life gets tough - we often then discover the mettle of our faith and the reality of how much faith we truly have in God’s power.

The strength of our relationship with our Saviour is only as strong as the strength we give it – or how much we are willing to hold on.  The Saviour never lets go of that relationship – it is us that loosens the grip.

When we come through trials and difficulties with Him by our side - we will find the spiritual strength we so desperately need.

Sometimes people are swayed to follow a doctrine or a way of thought that is false.

They drift in their relationship with God because others have deceived them.

Look at the world – look at how the way of thought is becoming more and more separated from God

Morality and the standards of ethics and principles are becoming further and further the doctrines of Christ.  Look at how society is transforming its acceptance of same sex marriages.

Good is becoming bad and bad is becoming good.

I shake my head sometimes when I hear someone refer to something that is awesome or excited as “wicked”.  Really?

It is vital that we hold our values, principles and beliefs – to be in line with the teachings of our prophets and the gospel of Jesus Christ.

We live in an age where there is no longer any fear over the consequences of sin.

Our society wants us to believe that God is benevolent and good (which he is) but they also want you to believe that He would never hold us accountable for our actions.

The world is falling away from examining our lifestyles through the principles taught by Jesus Himself.

It is more about whether it feels good and brings gratification (most often just temporary or immediate).

They say, “It’s not hurting anyone” – Well, maybe not immediately – but in the long term or in the eternal perspective – it does.

Who can deny that personal drug use leads to greater community deterioration?  Who can deny that sexual immorality leads to broken families and communities?

The people of this world often fool themselves.  However, God is clear on this issue, He loves sinners but hates sin. If God hates sin how can we think that it’s ok?

Brothers and sisters - We must truly take advantage and implement the redeeming power and blessings of repentance.  This means truly turning away from the wrongs that we do.

Too many of us - who come to the altar and pray for salvation - walk right back into our old lifestyles or habits – finding no lasting change.

The reality is that sin just doesn’t bother us enough to want to change.

We will never be able to overcome Satan and the power of sin in our own strength; however, there is good news - Satan has already been defeated - Christ has overcome him through His suffering and His atoning sacrifice.

The power of sin is death; and death has been conquered.

Therefore, the only power that sin has – is the power that you give it to influence your life.  It’s your choice as to whether you want to give in or not.

Power is given to you through Him and through His Holy Spirit – to withstand the influences of sin.

We are meant to grow closer in our relationship with our Saviour – each day - and it is absolutely impossible to grow in a relationship, of which we choose to neglect.

When we settle for an inferior relationship with our Saviour - we will never have the kind of relationship we were meant to have.  We lose the potential that we can only find in Him.

If you can remember a time in your life when you were closer to the Saviour than you are right now, you need to get back to that place.

Remember where you were. Remember what Christ has done for you. Remember when you knew His presence and knew His power

What made those times a reality?

If I were to guess, I would say that 9 out of 10 times - our relationship with God - drifts when we neglect the spiritual disciplines of the Gospel CPRs - such as Church, prayer, and reading the scriptures.

These vital basics—of gospel worship—become the lifeblood of spiritual strength and growth.

Brothers and Sisters – it is time to recognize where you are and whether you are drifting away from the Lord – even so slightly.

As with the lady on the raft – begin your efforts to return to the safety of the shore or the rock of our salvation – even the Lord our Saviour Jesus Christ.

There are others there to help you back – they are your brothers and sisters in this church – they are your home teachers, your visiting teachers; your Primary teachers; relief society teachers; your Branch President.

May we follow the admonition of Nephi - “Wherefore, ye must press forward with a steadfastness in Christ, having a perfect brightness of hope, and a love of God and of all men. Wherefore, if ye shall press forward, feasting upon the word of Christ, and endure to the end, behold, thus saith the Father: Ye shall have eternal life.” (2 Ne. 31:20.)

Quite a few years ago a freighter sailing from England to the coast of France was experiencing engine problems.

In fact, the engines had completely failed, just off the French coast, and the ship was beginning to drift at sea.

The problem was that the tides were pulling the ship to the coast and a rocky shoreline that would inevitably cause the ship to crash. Such a crash could cause the loss of cargo, the loss of life or even the loss of the entire ship.

The cause of this situation was neglect of proper care of the engines. The reason the engines shut down was due to a lack of oil.

Those in charge of maintaining the engines forgot to check the oil and let it run out.

Brothers and sisters - When you neglect your spiritual engine for even a short time - you begin to drift away from God.

Today, if you are not as close to your God as you have been or know that you should be, make things right.

Stop the drifting and draw closer to Him.

Stop drifting and decide now to come back to the relationship you have been missing.

Stop drifting and develop that closeness, that familiarity, that relationship which you long for - with Christ.

I promise you – that when you make the effort to get back to Him - or to greater strengthen your relationship with Him - He will bring inner revival to your soul.

When you strive to be more like Him - He will bring a greater love into your life.

When you seek more of the Holy Spirit - He will fan the flames of faith within your heart.

I so testify and declare – in the sacred name of our Saviour Jesus Christ. Amen.`

    notes: "Also given in Smithers on May 4, 2008 and Terrace on March 22, 2015.",
    body: `Good Morning brothers and sisters.

Ol’ Fred had been a faithful Christian, and now found himself in the hospital, near death. The family called their pastor to stand with them. As the pastor stood next to the bed, Ol’ Fred’s condition appeared to deteriorate and he motioned frantically for something to write on.

The pastor lovingly handed him a pen and a piece of paper, and Ol’ Fred used his last bit of energy to scribble a note, and then he died. The pastor thought it best not to look at the note at that time, so he placed it in his jacket pocket.

At the funeral, as he was finishing the message, he realized that he was wearing the same jacket that he was wearing when Ol’ Fred died. He said, “You know, Ol’ Fred handed me a note just before he died. I haven’t looked at it, but knowing Fred, I’m sure there’s a word of inspiration there for us all.”

He opened the note, and read, “Pastor, you’re standing on my oxygen tube!”

Brothers and Sister - there is a fact of life – we will all go through trials and difficulties; and yes, maybe some so fatal as to what happen to Ol’ Fred.

In the New Testament, Jesus warned Peter that he would go through a testing period of his faith.

But, Jesus apparently believed that this process was necessary for Peter. Jesus called it a sifting like wheat.

Sifting is a two stage process. One step involves tossing the wheat in the air to allow the chaff to blow away in the wind.

The second stage involves a sieve that would be used to separate what is valuable and useful from what is not profitable. In this way, the farmer cleans the

wheat and prepares it for the market.

He is preparing it for a purpose; and God does that with us.

He allows people, circumstances, and events in our lives to take place in order to sift us.

As the Saviour had just instituted the sacrament during the last supper, and just before he departed to the Garden of Gethsemane, he uttered these words to his close friend and companion, Peter:

But I have prayed for thee, that thy faith fail not: and when thou art converted, strengthen thy brethren. (Luke 22:32)

In this instance, the Lord had petitioned to His Father in behalf of Peter, that Peter’s faith would not fail and then gave him the charge that “when” he was converted that he should support and build up his brethren.

I thought that it was interesting that he had said that “when” Peter was converted that he should strengthen his brethren?

Don’t you think that after all that Peter experienced during his precious times with the Saviour, and after all the miracles that he had seen in front of his eyes; the Lord still felt that Peter was not yet converted?

Faith did not come easily for Peter and the rest of the apostles.

The lame walked, the lepers were cleaned, the blind received their sight, and the dead were raised.

The signs of divine presence were all there. But the people heard and saw as though they had neither eyes nor ears.

His closest friends hesitated when the Saviour asked them what they thought. They said, "Some say that thou are John the Baptist; some say Elijah, or Jeremiah" - some great prophet, risen from the dead.

“Yes” says the Saviour, "but whom do you say that I am?"

And it fell to Simon Peter "Thou art the Christ, the Son of the living God." "And Jesus answered, saying, ‘Blessed art thou, Simon, son of Jonas: for flesh and blood hath not revealed it unto thee, but my Father, which is in heaven.’"

This was one of those high points in Peter’s faith; he even continued to assert: "Lord, I am ready to go with thee, both to prison and to death." But that very night, at the hour of cockcrow, there came the moment of denial, as he warmed himself by the fire: "I know him not".

Peter’s faith was sorely tried and tested;

And the Lord said, Simon, Simon, behold, Satan hath desired to have you, that he may sift you as wheat:

We who share the same faith in our Saviour, as Peter had, must know and understand that, we too must experience a trial of our faith.

We walk by faith, and not by sight.

We regularly assert confidently: "Thou art the Christ, the Son of the living God", but there also comes the moments of doubt, and multiple temptations, the moments of denial and betrayal, when we too say, "I know him not."

I think it is vitally important that should recognize, know and understand the meaning of the trials of our faith.

All around us, there are the pressures of persistent temptations which overwhelms the very rock of our faith.  We are told by the world to compromise our beliefs; to ‘Adjust, revise, conform'.

We may be asked, "Surely thou are one of them". And sadly, there are times when we reply, "No, I know him not".

Trials and temptations, our dark night of doubt (as was Peter’s), confusion and uncertainty, are not just unfortunate accidents.

In God’s great plan, these temptations and trials were needed to prove ourselves, to try our faith, like precious metal, "which from the earth is tried, and purified seven times in the fire".

We cannot suppose for one moment that we can avoid this testing.

There is resting assurance that faith can withstand every trial, but remember this one fact that it is human reasoning which is most often mistaken for faith; and it is that human reasoning which fails more often than not.

Satan wishes to have us believe that human reasoning is faith.

How do we distinguish faith from human reasoning? Ask yourselves these questions ... Who is the author? Where does it come from? Who is glorified by it?

Apply this scripture to yourself, “Simon, Simon, behold, Satan hath desired to have you, that he may sift you as wheat."

Our human reasoning will be sifted.

The Lord tries our faith with these trials to teach us to distinguish between true Christ-centered, God-given faith - and human reasoning.

Jesus did not pray that Peter's human reasoning would not fail! Jesus told Peter "But I have prayed for thee, that thy faith fail not."

Did Peter's faith fail? No, it was his human reasoning that failed.

Peter’s belief was real — and that is the very reason that Satan went after him as so to, does he come after all those who believe.

Satan actively attempts to break down people whose faith is weak or wavering.

Few of us realize this truth when we’re in the midst of a trial. We don’t see that we’re in the fire.

Think about Peter: here was a man about to become a pillar of God’s church, launching the gospel into the world.

You can be sure Satan was not going to let that happen without a fight.  All who have testimonies and a desire to serve God are in his cross hairs.  He is actively coming after you.

I can’t help to think of how Lucifer is working overtime in the pursuit of our youth, whose faith is tender and who has so many blessings laid before them to partake as they come of age to enter the holy temple and for some, to serve honourable fulltime missions.

Oh how busy and eager he is to ensnare and sift them as wheat.

Satan’s sifting is much more than a war between flesh and spirit. It is an outright attack by Satan himself to try to destroy our belief.  He is trying to shake us mentally, physically and spiritually.

Our unbelieving thoughts can lead to confusion and chaos. Bitterness can take root and, if allowed to harden, it can lead to a complete falling away.

We can find ourselves putting our own desires ahead of what brings glory and honor to our Father in Heaven.

But the fact remains; God knows the true depths of what is in your heart. He considers you his friend, a soldier for His kingdom.

At a church meeting a very wealthy man rose to give his testimony.

"I'm a millionaire," he said, "and I attribute it all to the rich blessings of God in my life. I can still remember the turning point in my faith, like it was yesterday:

I had just earned my first dollar and I went to a church meeting that night. The speaker was a missionary who told about his service. I knew that I only had a dollar bill and had to either give it all to God's work or nothing at all.

So - at that moment I decided to give my whole dollar to God. I believe that God blessed that decision, and that is why I am a rich man today."

As he finished it was clear that everyone had been moved by this man's story. But, as he took his seat, a little old lady sitting in the same row leaned over and said: "Wonderful story! But I dare you to do it again!"

There are times – brothers and sisters - that we will be called upon to be stronger than the times past – prepare and be willing to do so – I promise you that great blessings will be pronounced upon you; and you will know those blessings as they come to you.

Brothers and sisters.  We are blessed with the whisperings of the Spirit.  We must rely upon the strength of our faith that comes from those moments when spirit speaks with spirit.

We have these moments when we prepare to hear and feel the promptings and whisperings from our Father above.

It is by the Spirit - that true faith and strength is given.  It wasn’t until the day of Pentecost – the day that Peter and the remaining apostles, received the Holy Ghost - When their spirit communed with God’s spirit.

It was that defining moment when Peter went throughout the remainder of his life with the courage and conviction that never wavered.

May we strengthen our faith in our Lord and Saviour, Jesus Christ.

May we all remember those moments of faith – when God’s spirit spoke to your spirit – when you too can rely upon the defining moments of spiritually based faith in the Lord Jesus Christ. And that we remain faithful – even until the end.

Remember -we jumped for joy for the prospects of Eternal Life – and that we stood side by side with our Elder Brother Jesus Christ and declared that “we will prove them herewith, to see if (we) will do all things whatsoever the Lord (our) God shall command (us). – Abraham 3:25.

I pray just as the Saviour prayed, that this be so, in the name of Jesus Christ, amen.`

    body: `An old farmer is inconsolable after his dog goes missing. His wife suggests he take out an ad in the newspaper, which he does. But two weeks later, there’s still no sign of his dog.

“What did you write in the ad?” his wife asks.

He replies, “Here, boy”

Brothers and Sisters - How many of you are in the habit of losing or misplacing things?

Sometimes – we don’t even know that we’ve lost something until we actually need it; and most often when we are looking for it, it seems to be in the last place that you can think of.

Believe it or not – our Father in Heaven knows what this is like.

Our Father in Heaven is searching for something that is lost – it’s not because he doesn’t know where it is – it is because the thing itself has lost its way.

Our Father in Heaven suffers from this loss.

During our Saviour’s earthly ministry, He told stories or parables, but he always told these stories to make a vital and eternal point.

The three stories which I will talk about today exemplifies that fact that our Father in Heaven is actively engaging and longing for a constant relationship with you and me.

There was a point in the life of our Saviour where the people of Israel had noted that he was keeping company with some fairly undesirable types of people, at least in the eyes of those who felt qualified to determine such things.

Tax collectors and other notorious sinners often came to listen to Jesus teach.

This made the Pharisees and teachers of religious law complain that he was associating with such despicable people - even eating with them. (Luke 15:1-2).

This certainly illustrates the fact that our Saviour accepted people and reached out to be with them.

He didn’t pre-qualify anyone before he would speak with them.

People hated the tax-collectors because as the collected the taxes, their compensation was any amount of money they could extort from innocent people in the process.

They had betrayed their Jewish heritage and exchanged it for the protection and preference from the Roman Empire.

Many of the other people that the Saviour found himself amongst the crowd were simply known as “sinners.”

These were people who had rejected God or had made choices that resulted in being shunned or excluded from the established church and organized religion in their world.

Contrary to the train of thought of the Pharisees and Scribes - these tax-collectors, these sinners were of infinite value to God.

In fact, the Saviour said at one point, that these were exactly the types of people whom he came to reach.

Which is why Jesus said about himself, “It is not those who are well who need a physician, but those who are sick. I have not come to call the righteous but sinners to repentance.” (Luke 5:31-32)

The parable of the one coin, the lost sheep, and the prodigal son; exhibits the fact - that all people are valuable in the sight of God.

Brothers and Sisters, all of us – whether a sinner or a saint is valuable to them - like one coin to a poor old woman who can’t afford to spend a single cent unwisely.

We are all valuable to Him - like one sheep to a poor shepherd who only has a small flock with which to make his living.

We are all valuable to him - like a foolish son who rejects his loving father, breaking his heart. Yet that father still sees that one burning ember of hope that his son will one day return to him.

We latter day saints cannot fool ourselves as being saints without sin – we are latter-day saints – men and women striving for perfection – but knowing that we are fallible – that we fall short of the mark and so desperately need the atonement and the rewarding power that comes from forgiveness.

If you were to go out into our town and mention my name, there would be some who knew me; but there would also be a vast majority of people would not know, or care who I was.

If there was an article in the Interior News newspaper describing my death, most of the readers would feel no emotion as they read it, if they read it at all.

And that’s okay. It’s okay because my Father in Heaven and my Saviour Jesus Christ know who I am and know the worth of my soul.

And Brothers and Sisters - So is yours. Regardless of what you have done, or what has been done to you, you are of infinite value to God.

The Saviour has said that we have all sinned and missed the mark – and are sinners, whether in small ways or big ways, and He has paid the price for it.

Everyone who is lost, even the worst of the lost, has value to Him. That’s why He cares and that’s why He is searching for you and me and all of God’s children.

That is why it makes perfect sense that Jesus was spending so much time with sinful people during His ministry.

That is why He is meeting them where they are - in order to issue to them the challenge of accepting and taking hold of the life-line of His atonement.

In Luke 15:3-7, we read - “What man of you, having an hundred sheep, if he lose one of them, doth not leave the ninety and nine in the wilderness, and go after that which is lost, until he find it?

And when he hath found it, he layeth it on his shoulders, rejoicing.

And when he cometh home, he calleth together his friends and neighbours, saying unto them, Rejoice with me; for I have found my sheep which was lost.

I say unto you, that likewise joy shall be in heaven over one sinner that repenteth …”

In the culture of first-century Palestine, livestock was wealth. The more livestock you owned, the richer you were.

During Christ’s time, a hundred sheep was not a lot. This shepherd wasn’t broke, but he certainly wouldn’t be rich either. One sheep was an important asset.

Jesus often compared people to sheep. Not because he thinks we’re senseless and smelly. But because people often act like sheep.

The scriptures tell us, “All of us - like sheep have gone astray…”

Sheep are not good at knowing exactly where they need to go and what they need to do. If a sheep gets lost, for whatever reason, they most often are unable to find their way home by themselves.

In fact, if a herd of sheep are left in a field, they will most likely stay in that field and graze there until it is bare and possibly die of starvation.

Sheep need a shepherd – and in this story, the shepherd knows this - so he goes out looking for his lost sheep.

The Saviour called Himself the Good Shepherd and called His believers “sheep.”

Remember – this lost sheep was already part of the shepherd’s flock. This sheep is like a lot of us who have wandered away from God.

The sheep didn’t necessarily get lost on purpose. He didn’t necessarily do it out of rebellion or maliciousness toward the shepherd.

But the sheep did wander away because it was distracted or lured away - wandering sheep happens all the time – whether they know it or not - and the shepherd is searching.

A husband and wife had just finished tucking their young ones into bed one evening when they heard sobbing coming from three-year-old Billy's room.

Rushing to his side, they found him crying hysterically.

He had accidentally swallowed a penny and was sure he was going to die.

No amount of talking could change his mind.

Desperate to calm him, the husband palmed a penny that he happened to have in his pocket and pretended to pull it from Billy's ear.

Billy was delighted. In a flash, he snatched it from his father’s hand, swallowed it and demanded cheerfully, "Do it again, dad!"

Further in this chapter, the Saviour tells of about another lost coin.

In verses 8-10 it reads, “Either what woman having ten pieces of silver, if she lose one piece, doth not light a candle, and sweep the house, and seek diligently till she find it?

And when she hath found it, she calleth her friends and her neighbours together, saying, Rejoice with me; for I have found the piece which I had lost.

Likewise, I say unto you, there is joy in the presence of the angels of God over one sinner that repenteth.”

Have you ever noticed the intensity with which you will search for an item when you need it?

Your wallet, your purse, your keys, a document, an address, a phone number, a pair of socks or earrings?

When you need it, you need it now and if time is running out, finding that thing becomes the highest priority in your life at that moment.

Now, this parable isn’t intended to be a strict likeness of the human character, but it does illustrates a point.

The point? That there are people who don’t realize that they are lost. They don’t understand that they were created by a loving God.

They don’t realize that when this temporary life ends, an eternal life begins.

Many are like this coin. They weren’t trying to be lost, but they were. They don’t even know that they are lost, but in reality they had indeed gone astray.

Brothers and Sisters, our Father in Heaven is searching for people who need to come back to Him.

In the remainder of the chapter of Luke – we read of the prodigal son.

This parable is one of great hope and compassion.

It tells of a story of a younger son in a family, who obtains his inheritance from his father.

This son leaves for a distant land, where he squanders it in wickedness and immorality: he has to take up the work of herding swine, and is even reduced to hungering for the food which they fed the swine.

He finally comes to his senses and decides to return home, if only to work for his father as a hired laborer.

As he nears home, his father, with love and compassion welcomes him, even holding a feast.

The older brother, who had remained at home working, begrudges the mercy shown by his father.

But the father says that they should rejoice because - the son who was dead now lives. … was lost, and is now found —Luke 15:11-32.

Brothers and Sisters, we are called to the work of reclaiming the lost sheep.

Reactivation has always been an important part of the work of the Lord.

From the Book of Mormon you will recall when Alma the Younger discovered that the Zoramites had fallen away from the Church, he organized a reactivation team to rescue these people.

As they moved forward in their assignment, Alma pleaded with the Lord with these words:

“O Lord, wilt thou grant unto us that we may have success in bringing them again unto thee in Christ.

“Behold, O Lord, their souls are precious, and many of them are our brethren; therefore, give unto us, O Lord, power and wisdom that we may bring these, our brethren, again unto thee” (Alma 31:34–35)

The Savior’s questions to His disciples was: “Lovest thou me? His answer … Feed my sheep” (John 21:16)

You may have noticed that the past few General Conferences – our leaders have emphasised an invitation for those who have gone astray – an invitation to return.

President Thomas S. Monson, said: “Over the years we have issued appeals to the less active, the offended, the critical, the transgressor—to come back. ‘Come back and feast at the table of the Lord, and taste again the sweet and satisfying fruits of fellowship with the Saints’ ”

In conclusion, our commitment as members of Christ’s true Church stems from the fact that the Lord suffered for every single one of us—the non-member, the less-active member, the sinner, and the saint.

Brothers and Sisters, we can bring many to the joy, peace, and sweetness of the gospel, and the residual effects can and will bring many more back - into the loving arms of our Father in Heaven – even generations that follow.

We can succeed because this is the Lord’s Church, and by that virtue, we are called to succeed.

As a father – who has firsthand experienced the parable of the prodigal son.

As a father – who has firsthand witness and experience of the joy, the pleasure; and the happiness of a child coming back home to the knowledge and light of the gospel – it is hard to fully express.

I am now a father – who now sees this son living like Alma in the great work of the Lord.

For I have witness the son who was once dead and who now lives. … who was lost, and is now found.

May the Lord give unto us - power and wisdom that we may bring these, our brothers, our sisters; again unto the Lord.

This great work will bring forth fruit to you and those lost sheep – of which I bear witness - in the name of Jesus Christ, amen.

*Joint Lesson — Branch Conference*

Two shepherds lean on their crooks at the end of a long day and the first asks the second, "So, how’s it going?" The second one sighed and shook his head, "Not good, I can’t pay my bills, my health isn’t good, my kids don’t respect me, and my wife is leaving me." The first replied, "Well, don’t lose any sheep over it."

Have you ever been lost? How did you feel?

In what ways are people lost?

Why do you think God values us so much and finds us so precious to search for us?

Do you feel God loves you in the same way? Why or why not?

If God is so determined to find us and bring us back into his loving care, how should we feel toward God?

How should we feel about helping others find their way back to God?

For those who have become spiritually lost? - In what ways do you think God has been searching for them?

What would you do or have done if a friend or family member began to stray from living the gospel.

*Burnt Matches*

Hold up the burned matches and say, "These represent the sisters in our branch who no longer worship with us. Their testimony light once burned brightly, but has gradually become cold. Do you think it is possible to relight a once lit match?" [They will answer, 'yes'] "The same is true of these members. If I were to continually contact a lit match again and again to these burned-out ones; the warmth generated could eventually 're-light' the relationship and let the light of the gospel burn brightly once again." Point out that by consistent attention and love through Visiting Teaching, Home teaching, friendshipping, and sincere love we can help bring them 'back to the fold'.

We are going to read about the Zoramites - Read Alma 31:1–2.

1 Now it came to pass that after the end of Korihor, Alma having received tidings that the Zoramites were perverting the ways of the Lord, and that Zoram, who was their leader, was leading the hearts of the people to bow down to dumb idols, his heart again began to sicken because of the iniquity of the people.

2 For it was the cause of great sorrow to Alma to know of iniquity among his people; therefore his heart was exceedingly sorrowful because of the separation of the Zoramites from the Nephites.

What were Alma’s feelings when he heard about the iniquity of the Zoramites?

Imagine that you have the opportunity to advise Alma on how to resolve his concerns about the Zoramites – what would you suggest he do.

Here’s what he came up with - read Alma 31:5

5 And now, as the preaching of the word had a great tendency to lead the people to do that which was just—yea, it had had more powerful effect upon the minds of the people than the sword, or anything else, which had happened unto them—therefore Alma thought it was expedient that they should try the virtue of the word of God.

So, what did Alma know to be the most effective way to help the Zoramites?

And based on Alma 31:5, what can we learn about the power of the word of God in our lives? (As we study the word of God, it will lead us to do what is right)

And then what did Alma do?  Read verse 6-7.

6 Therefore he took Ammon, and Aaron, and Omner; and Himni he did leave in the church in Zarahemla; but the former three he took with him, and also Amulek and Zeezrom, who were at Melek; and he also took two of his sons.

7 Now the eldest of his sons he took not with him, and his name was Helaman; but the names of those whom he took with him were Shiblon and Corianton; and these are the names of those who went with him among the Zoramites, to preach unto them the word

In the effort to help people change, why do you think the word of God is more powerful than force or other techniques?

President Boyd K. Packer of the Quorum of the Twelve Apostles.

“True doctrine, understood, changes attitudes and behavior.

“The study of the doctrines of the gospel will improve behavior quicker than a study of behavior will improve behavior. … That is why we stress so forcefully the study of the doctrines of the gospel” (“Little Children,” Ensign, Nov. 1986, 17).

Tell us about a time when you or someone they knew gained a greater desire to do what is right because of the scriptures or the teachings of Church leaders.

When Alma saw the wickedness of the Zoramites, he prayed.  Study Alma 31:32–35

32 O Lord, wilt thou comfort my soul, and give unto me success, and also my fellow laborers who are with me—yea, Ammon, and Aaron, and Omner, and also Amulek and Zeezrom, and also my two sons—yea, even all these wilt thou comfort, O Lord. Yea, wilt thou comfort their souls in Christ.

33 Wilt thou grant unto them that they may have strength, that they may bear their afflictions which shall come upon them because of the iniquities of this people.

34 O Lord, wilt thou grant unto us that we may have success in bringing them again unto thee in Christ.

35 Behold, O Lord, their souls are precious, and many of them are our brethren; therefore, give unto us, O Lord, power and wisdom that we may bring these, our brethren, again unto thee.

What was the focus of Alma’s prayer? (He focused on helping others. Even when he prayed for himself and his companions, he asked for strength to serve the Zoramites.)

What elements of Alma’s prayer would you like to incorporate into your personal prayers?

After Alma prayed for help in reaching the Zoramites, he and his companions began to serve, “taking no thought for themselves” (Alma 31:37).

What might this mean - “taking no thought for themselves”?  (Getting lost in the work)

Were they successful in bringing their brethren back into the light of the gospel?  (You bet they did!)

*Sheep amid a box of animal crackers. (blind fold – gloves – crackers)*

What was difficult about finding the lost item?

What were some of the frustrations? How did you feel trying to find one little item among so many?

What made it easier? (taking of the gloves – hearing the words from the class – being able to see)

Relate this to searching for the lost sheep – those who have gone astray.  It can be done by yourself but it becomes easier when you can see (this is light and understanding from the whisperings of the Holy Spirit and your Church Leaders) and then it is easier and more successful when others are helping you (Visiting and Home Teaching, the missionaries, fellowship at church activities, etc.)

Think of someone you know who has become spiritually “lost,” perhaps through inactivity in the Church or involvement in things that are not of God - ponder briefly how you feel about that person and why you want him or her to “return.”

I challenge you to be as Alma – pray with faith and act upon the inspiration that you receive from His Holy Spirit – and share those gospel truths that will be the greatest teaching moments to change behaviour and bring them into the arms of the Saviour.`

    body: `Good Morning Brothers and Sisters.

I send you the greetings from our District President – he loves you and prays for you always.

I have been given an assignment but I will first deviate from that topic and follow up on the talk we heard last week by Kaleb.

I was very touched by his testimony and challenge to us to find greater true happiness that comes from our families.

As Kaleb said, too often we look in the wrong places for happiness.

If you turn to the last verse of the book, Cinderella. It reads, "and they lived happily ever after."

In the last verse of the book of Sleeping Beauty. It says ..."and they lived happily ever after."

And finally, in the verse of the book of Snow White; it too ends with ... "and they lived happily ever after."

We all long for the fairy tale ending.

We have yearned for it since our childhood.

We just want to be able to live "Happily Ever After".

We desire happiness, we long for it, we search for it, and we want it in our lives.

Our search for the fairy tale life will often cause us to seek happiness from sources other than God.

This search can actually lead us away from God to a place of sinfulness.

A place where God is no longer at the center of our life; where our God has been replaced by another person, possession, pleasure, or way of thought.

Brothers and Sisters - Temporal happiness is fleeting.  It’s like catching a soap bubble - you think you have happiness, then it bursts and it is gone and there is nothing left.

True happiness comes from those things that are Eternal.  Our ability to focus on those eternal principles will give us greater capacity to achieve those lasting effects of such a principle.

Brothers and Sisters – our chances to be in our Father in Heaven’s presence as an Eternal Family is not only within our reach, it is within our capacity.  We are promised that we may have those blessings.

So, if you seek happiness as an Eternal family – you must all work together as one, as a team to achieve that magnificent eternal blessing.

Working as a team means that all are involved.  Parents can do only so much.  They can call, inspire, and direct aright, but they cannot force any of their children to heaven; no matter how much we desire that to happen.

May we all give to our families the spiritual strength, example and leadership; to return into God’s presence as one eternal family.

Like Kaleb said last week, I too love my family so - so very much: and yearn for us to be Eternal.

And my promise is that if you long to live “Happily Ever After” – you can!

Now – on to my assignment –

Did you hear that the church just decided to try a pilot project where sixteen-year-olds will be called on missions? The new policy has met with overwhelming approval from the members. The reasoning is that the 16 year olds - already know everything; and, their moms won't cry at their farewells.

I am kidding, of course.

The holy scriptures contain no proclamation more relevant, no responsibility more binding, no instruction more direct than the command given by the resurrected Saviour as He appeared in Galilee to the eleven disciples.

Where he proclaims, ‘Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost’ [Matthew 28:19].

The Prophet Joseph Smith declared, ‘After all that has been said, the greatest and most important duty is to preach the Gospel’

President David O. McKay … phrased the familiar ‘Every member a missionary!’

And to their words, President Thomas S. Monson, added, “Now is the time for members and missionaries to come together, to work together, to labor in the Lord’s vineyard to bring souls unto Him.

He has prepared the means for us to share the gospel in a multitude of ways, and He will assist us in our labors if we will act in faith to fulfill His work.”

The Lord’s Church has the responsibility to preach the gospel in the world.

The foundation and duty of our missionaries is to “invite others to come unto Christ by helping them receive the restored gospel through faith in Jesus Christ and His Atonement, repentance, baptism, receiving the gift of the Holy Ghost, and enduring to the end.”

Brothers and Sister – I have been thinking more and more about the impact that my mission had on me and others, as I hear; as I think about; and as I pray for my son, Kai as he serves his mission in San Jose.

As I reflect, I can’t help but appreciate the impact which my mission has had.

I discovered a greater love, respect and honor for the sacrifice of our Saviour and His atonement.

I see the influence of a mission in Bro. Jon Coupe.

I see that his knowledge of the scriptures and understanding of the doctrines increased. It too happened for me.

My missionary experiences became part of who and what I am; and has impacted my life and that of my family more than anyone can comprehend.

It was told that when a grandson was turning eight and planning his baptismal service, he asked that his grandmother be one of the speakers and share her conversion story.

When the grandmother asked him why he wanted her to do that, he replied, “Grandma, that is so important. Do you realize that if you hadn’t accepted the gospel, I wouldn’t be getting baptized? I wouldn’t even be who I am.”

Brothers and Sisters - the effects of our missionary work is far-reaching.

President Gordon B. Hinckley said that “when we save (one soul), we save generations.”

Look at my own family – because of some faithful missionaries and the members that support them – my parents were baptized.

Subsequently, eight of their children were baptized – all five boys served full-time missions which brought their influence throughout the world where many were baptized.

And now, some of their grandchildren have or are serving full-time missions.

The effects have been dramatic and wide reaching

Brothers and Sister - Missionary work is the lifeblood of the Church. There is no greater work.

It blesses the lives of all those who participate in it; and it will continue blessing future generations.

I’ve touched upon the blessings of full-time missionary service – but we know that we can all participate in this great and glorious work.

And we cannot deny the fact that if we know we can participate – that we then must ought to participate.

Why is important that we embark in the service of our God?

Why should we share the feelings and thoughts that are so special, so spiritual, and so powerful -  that lives can change from being a lost soul to one that is being held in the arms of the Lord?

Well, the answer for this, is found in the profound words of my daughter, Jadyn where she answers  …. “Because”

It’s more than just because – she goes on to say – “So everybody can learn more about Him and that we can grow closer to Him”

Brothers and Sisters - As you embark in His service, remember to keep in mind these two fundamental truths.

First, have a clear understanding that God loves all His children and desires their salvation. Remember these words, (D&C 18:13), “And how great is his joy in the soul that repenteth.”

Second, remember that our message of Christ and His restored gospel is the most important gift you have to give.

Every member of the Church—children, youth, and adults—can assist in bringing about this joy.

I promise you that as you do - you will experience joy in the fruits of your labor.

And as we do so, we will receive a greater enthusiasm for that missionary work; and it will strengthen our entire branch and District. Your labor, will affect the whole Church.

This is the Lord’s work, and He will help us do it. His gospel has to go to every nation, and we can be instruments in His hands to bless the lives of others by sharing with them His truth.

Kai shared with me this analogy that he heard as he attended his ward in San Jose.

He said that the work of the Lord was like watching a recorded football game where you already know the final outcome – the score and most importantly, that your team is going to win.

And as you are watching this pre-recorded game and you see some of your players getting injured, penalties being called on you, and many setbacks or lost points, you still know you come out on top.

Brothers and Sisters – the Lord’s team will win – and even if you find times of difficulties; or the stumbling blocks hinder your efforts to share – we must know that the Lord will come up with some plays that keep us in the game and will eventually lead to success.

We are members of a gold medal winning team!

We know and testify that we are the children of a loving Heavenly Father. That He sent His Son to open the way so we can live with Him forever.

Brothers and Sisters - Trust the Lord. He is the Good Shepherd. He knows His sheep, and His sheep know His voice; and we are called today, to be the voice of the Good Shepherd.

And if we are not engaged, many who would hear the message of the Restoration will be passed by.

The principles of sharing are pretty simple—pray, personally and in your family, for missionary opportunities.

Pray for the Lord to put opportunities in your path. The Lord has said in the Doctrine and Covenants that many people have been kept from the truth only ‘because they know not where to find it’ (D&C 123:12).

‘lift up your voices unto this people [and] speak the thoughts that [He] shall put into your hearts, … (D&C 100:5)

We are all in this together. I challenge you; I ask you; please - keep the full-time missionaries in your thoughts and prayers. Trust them with your family and friends. The Lord trusts them and has called them to teach and bless those who seek Him.

The following is a little story which illustrates the train of thought of some people, when it comes to sharing the gospel.

There was a blackout one night. When the lights went out, I fumbled to the closet where we keep the candles for nights like this ... I lit four of them. I was turning to leave with the large candle in my hand when I heard a voice,

"Now, hold it right there."

"Who said that?"

"I did." The voice was near my hand.

"Who are you? What are you?"

"I'm a candle."

I lifted up the candle to take a closer look. There was a tiny face in the wax. "Don't take me out of here!"

"What?"

“I said don't take me out of this room."

"What do you mean? I have to take you out. You're a candle. Your job is to give light. It's dark out there."

"But you can't take me out. I'm not ready," the candle explained with pleading eyes. "I need more preparation."

I couldn't believe my ears. "More preparation?"

"Yeah, I've decided I need to research this job of light-giving so I won't go out and make a bunch of mistakes. You'd be surprised how distorted the glow of an untrained candle can be..."

"All right then," I said. "You're not the only candle on the shelf. I'll blow you out and take the others!"

But right then I heard other voices, "We aren't going either!"

I turned to the other candles, "You are candles and your job is to light dark places!"

"Well, that may be what you think," said the first one, "You may think we have to go, but I'm busy ... I'm meditating on the importance of light. It's really enlightening."

"And you other two," I asked, "Are you going to stay, too?"

A short, fat, purple candle with plump cheeks spoke up. "I'm waiting to get my life together, I'm not stable enough."

The last candle had a female voice, very pleasant to the ear. "I'd like to help, "she explained, "but lighting the darkness is not my gift ... I'm a singer. I sing to other candles to encourage them to burn more brightly."

She began a rendition of "This Little Light of Mine." The other three joined in, filling the closet with singing.

I took a step back and considered the absurdity of it all. Four perfectly healthy candles singing to each other about light but refusing to come out of the closet.

Here is a question for you—do you find yourself thinking and acting like these candles?

This world is full of darkness, with many people stumbling around trying to find their way.

You can be a light for them.

Remember - "Ye are the light of the world. A city on a hill cannot be hid. Neither do men light a candle and put it under a bushel, but on a candlestick; and it giveth light unto all that are in the house. Let your light so shine before men that they may see your good works, and glorify your Father which is in Heaven." (Matt 5:14-16)

In closing – Brothers and Sisters – take a moment right now – close your eyes – think about the joy that you get from the gospel – from your understanding of life eternal – from the sweet peace that comes from your Saviour’s sacrifice –

Now, as you think about - feel those feelings that those thoughts brings.

Now – Would you not want your good friends or family members to feel that way too?

I ask for a stronger and more devoted voice - a voice for the gospel, a voice for your God.

That your tongues may be loosed and you will witness and watch your words - work wonders in the lives of those “who are only kept from the truth because they know not where to find it.”

Remember this promise – “for I will go before your face. I will be on your right hand and on your left, and my Spirit shall be in your hearts, and mine angels round about you, to bear you up.” – D&C 84:88.

The promise is made – the promise will be fulfilled.

I so testify and declare, in the sacred name of our Saviour, even Jesus Christ. Amen`

    body: `Good Morning Brothers and Sisters, it is so wonderful to be here, I love speaking in church, can you imagine if we all just said no when asked to give a talk.  President Norton would have to say we have no speakers because everyone said no. we shall sit and ponder the Saviour for 30 minutes. We all have to do our part, for that I am so grateful.

I was asked to speak on how raising my family in the church has been helpful, I say in every aspect. We have referred to the church leaders, standards, programs, and examples of others constantly. As we attend church it is here, we are strengthened, supported, taught and teach. Church is not a place where perfect people gather, rather a place where imperfect people gather to be better.

Most of you know my favorite  primary song is the Army of Helaman. Back when we had a bigger primary the children loved to sing it because they knew I would cry every time. The part of the song that tugs at my heartstrings the most is the very beginning, I will recite it for you: We have been born as Nephi of Old, to goodly parents who love the Lord, We have been taught and we understand, that we must do as the Lord commands.

I want to be a goodly parent, how do I do that, not all children are blessed with parents striving to be good or better. There are many ways parents can access the help and support they need to teach the gospel of Jesus Christ to their children.

Culture is defined as the way of life of a people. There is a unique gospel culture, a set of values and expectations and practices common to all members of the Church of Jesus Christ of Latter Day Saints. This gospel culture comes from the plan of salvation, the commandments of God and the teachings of the living prophets. It is given expression in the way we raise our families and live our individual lives.

Parents must resolve that teaching in the home is the most sacred and important responsibility; other institutions are helpful, but this responsibility ultimately rests on the parents. According to the great plan of happiness, it is goodly parents who are entrusted with the care and development of Heavenly Father’s children.

Here are 5 suggestions, and we have heard them before, and we all know them—are we doing it?

First, we can pray in earnest, asking our Heavenly Father to help us love them, understand, and guide the children He has sent us.

Second, they can hold family prayer, scripture study, and Family Home Evening, and eat together as often as possible.

Third, parents can fully avail themselves of the Church’s support network, primary teachers and youth leaders.

Fourth, parents can share their testimonies often and commit their children to keep Heavenly Father’s commandments.

Fifth, we can organize our families based on clear, simple family rules, expectations, wholesome family traditions, where children have household responsibilities and can earn allowances, so they can learn to budget, save, and pay tithing.

These suggestions for creating stronger family cultures work in tandem with the culture of the Church. Strong family cultures will help our children live in the world and not become of the world.

The proclamation on the family says: Husband and wife have a solemn responsibility to love and care for each other and for their children. Children are a heritage of the Lord. Parents have a sacred duty to rear their children in love and righteousness, to provide for their physical and spiritual needs, and to teach them to love and serve one another, observe the commandments of God, and be law-abiding citizens wherever they live.

By divine design fathers are to preside over their families with love and righteousness and are responsible to provide the necessities of life and protection for their families. Mothers are primarily responsible for the nurture of their children. In these sacred responsibilities, fathers and mothers are obligated to help one another as equal partners.

As we teach our children  the gospel through word and example our families are spiritually strengthened and fortified.

In 1999 a letter was given by the First Presidency; they taught that by teaching and rearing children in gospel principles, parents can protect their families from corrosive elements. They further counseled parents and children to give the highest priority to family prayer, a family home evening, gospel study and instruction and wholesome family activities. However  worthy and appropriate other demands or activities may be, they must not be permitted to displace the divinely appointed duties that only  parents and families can adequately perform.

The key to strengthening the family is to have the spirit of the Lord come into our home, the goal of our families is to be on the straight and narrow path.

Countless thing can be done within the walls of our homes to strengthen the family, here a few more ideas and offered in a spirit of encouragement, knowing that each family and family member are unique.

Make our homes a safe place where each family member feels love and a sense of belonging.

Remember a soft answer turneth away wrath. When you raise up your voice in anger the spirit departs from your home, we must never out of anger lock the door of our home or our heart to our children.

Spend individual time with each of our children.

Encourage our children to have individual prayer, scripture study and fasting.

Pray daily with our children

Read the scriptures together

Read the words of the prophets and other inspiring articles for children youth and adults.

Fill our homes with worthy music

Have family home evening

Invite the missionaries to teach our friends

Show that we sustain and support church leaders

Eat together when possible

Work together as a family

Help our children build good friendships and make their friends feel welcome

Teach our children how to budget time and resources, help them learn self reliance.

Teach our children the history of our ancestors

Build family traditions help them create happy memories, improve their talents, and build their feeling of self worth.

Know what our children are doing in their spare time.

Encourage worthwhile school activities

Act in faith not fear when teenagers begin to test family values. This is the time for added love and support.

While we may despair when after all we can do, some of our children may stray from the path of righteousness, the words of Orson F. Whitney can comfort us: “Though some of the sheep may wander, the eye of the Shepherd is upon them, and sooner or later they will feel the tentacles of Divine Providence reaching out after them drawing them back to the fold. Either in this life or the life to come, they will return. They will have to pay their debt to justice; they will suffer for their sins and may tread a thorny path; but if it leads them at last like the penitent prodigal, to a loving and forgiving mother’s and father’s heart and home, the painful experience will not have been in vain. Pray for our careless and disobedient children; hold on to them with our faith. Hope on, trust on, till you see the salvation of God.”

Knowing that we are in mortality to learn  and to develop our faith, we should understand that there must be opposition in all things.

In the name of Jesus Christ, amen.`
