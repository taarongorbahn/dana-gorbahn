    body: `A man named Jack was walking along a steep cliff one day, when he accidentally got too close to the edge and fell. On the way down he grabbed a branch, which temporarily stopped his fall. He looked down and to his horror saw that the canyon fell straight down for more than a thousand feet.

He couldn't hang onto the branch forever, and there was no way for him to climb up the steep wall of the cliff. So Jack began yelling for help, hoping that someone passing by would hear him and lower a rope or something.

HELP! HELP! Is anyone up there? "HELP!"

He yelled for a long time, but no one heard him. He was about to give up when he heard a voice. Jack, Jack. Can you hear me?"

"Yes, yes! I can hear you. I'm down here!"

"I can see you, Jack. Are you all right?"

"Yes, but who are you, and where are you?

"I am the Lord, Jack. I'm watching you."

"The Lord? You mean, GOD?"

"That's Me."

"God, please help me! I promise - if you'll get me out of this situation, I'll stop sinning. I'll be a really good person. I'll serve You for the rest of my life."

"Easy on the promises, Jack”. The Lord said, “Let's get you off from there; then we can talk."

"Now, here's what I want you to do. Listen carefully."

"I'll do anything, Lord. Just tell me what to do."

"Okay. Let go of the branch." "What?" "I said, let go of the branch. Just trust Me. Let go."

There was a long silence.

Finally Jack yelled, "HELP! HELP! IS ANYONE ELSE UP THERE?"

Brothers and Sisters - I would like to pose a question to you – Is faith faith – without works?

The classic example of faith with works is that of Joseph Smith and the First Vision.

As the young boy Joseph was seeking to know the truth about religion, he read in the first chapter of James:

“If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him.

“But let him ask in faith, nothing wavering” (James 1:5–6).

We all know the results of what happened to Joseph when he exercised, or worked the faith that he had in the power of prayer.

It wasn’t just pondering this biblical text that led Joseph to retire to a grove of trees near his home to pray and to seek spiritual knowledge – it was an acknowledgement that he must do, that he must act, that he must perform – what which the scripture had said.

True faith is focused in and on the Lord Jesus Christ and always leads to righteous action.

The Prophet Joseph Smith taught that “faith [is] the first principle in revealed religion, and the foundation of all righteousness” and that it is also “the principle of action …  He goes on to say “faith is not only the principle of action, but of power also,” (Lectures on Faith [1985]

Action alone is not faith in the Savior, but acting in accordance with correct principles is a central component of faith. Thus, “faith without works is dead” (James 2:20).

Brothers and Sisters – I want you all to clearly understand this important spiritual truth - Faith in Christ leads to righteous action, which increases your spiritual capacity and power.

When understanding that faith is a principle of action and of power – it can inspires us to exercise our agency in being obedient to the gospel truths; and will invite the redeeming and strengthening powers of the Savior.

I don’t know how many of you have really read the Epistle of James.  I just went through it this past week and believe me, it is so filled with practical gospel truths that will bring spiritual guidance, assistance and light – to your lives.

James 1:22 says “But be ye doers of the word, and not hearers only...”

In his epistle - James writes to clarify and emphasize that fact that - true “faith” always leads to righteous “works,”

There once was a man named Morris.  He was a man who knew all there was to know about golf. He knew all the courses, the champions and their scores as well as the prize money the professionals had won for the past 50 years.

He had read every book ever published on the game and knew all there was to know about technique, but, strange to say, he had never played a game.

Having listened to him go on and on for so long, his friends finally ganged up on him and insisted that he play the game. It was arranged for the following weekend.

Morris set out with borrowed clubs and faced the 18 holes of his local course. Five hours later he returned with a score of 53, which included four eagles, nine birdies and even a hole in one. Never had anyone seen such a fine performance.

However, while the celebrations were going on in the clubhouse, Morris announced that he would never play again.

“What!?” cried his distraught friends.

“What!?” echoed the equally distraught pro. “But you could win all sorts of prizes – bring notoriety to the club. You know everything there is to know about the game.”

“Not everything,” Morris replied. “The books didn’t tell me I’d have to walk.”

Having faith in the Lord – requires more than knowledge – it requires effort and action.

Alexander Graham Bell was an amazingly talented person.

He invented the multiple telegraph, the audio-meter - which is used to test your hearing -the tricycle landing gear you find on planes - and a host of other machines.

In addition to this he was co-founder of the prestigious magazine Science - he served as President of the National Geographic Society, and spent his life working with the deaf.

But the most famous of all his creations was the telephone.

It also made his family and his descendants extremely wealthy.

Yet.... he almost lost it all.

You see – Alexander Graham Bell never seemed to find the time to submit a patent application for the telephone.

Finally, his father-in-law, who had financed much of the research, became so impatient that he filed the patent on Bell's behalf on the 14th of February 1876 -Alexander’s 29th birthday.

And it was a good thing he did -just a few hours later, another scientist by the name of Elisha Gray went to the patent office and filed on a machine he also had been working on for many years -- you guessed it, the telephone.

This story reminds us - that sometimes it is not enough simply to have or to believe in a great idea.

We need to also - act on them.

Alexander and his father-in-law are an example of the relationship between faith and works.

Alexander had faith. He believed in his telephone. But his father-in-law had faith and works to go with it.

Three times in his epistle, James repeats the truth "faith without works is dead"

If not our faith does not include the works – then I submit to you brothers and sisters – it’s not real deal.

“General faith” is a common fact of life. Everyone alive expresses faith in something on a daily basis.

No one can live a single day without exercising faith.

When you awoke and went into the bathroom this morning you flipped a light switch and you had faith that it would work.

When you got in your car - you turned the key and have faith that it will start.

Every time you walk into a building you are expressing faith in the architect and the workmen.

In each instance there was an action.

You flipped a switch, you turned a key, and you walked into a building.

There once was a great tightrope walker, named Blondin.

He was one of the greatest tightrope walkers of all time, and there are many legends told of feats he performed.

One of the most often told stories of Blondin is of his crossing over the Niagara Falls on a tightrope. He reportedly did that several times.

At some point he turned to his large audience, which included numerous reporters from various newspapers, and he asked them, "How many believe I can walk across this tightrope over the Falls pushing a wheelbarrow?"

People cheered loudly - they were sure the great Blondin could do it.

Then he asked, "How many believe I can push a wheelbarrow across the tightrope with a man sitting in it?"

Again, there was a loud response.

Blondin then pointed to one of the most enthusiastic men in the audience, and said, "Okay, you get into the wheelbarrow."

Needless to say, the man made a quick exit.

Blondin demonstrated that there is often a great difference between belief - the faith we SAY we have - and the action faith we really have.

The measure of our faith is NOT our "talk" -- it is our "walk".

It is not what we say. It is what we will do!

Simply stating that you are a great golfer, or pianist, or artist, or whatever you may say; it does not mean anything unless you can demonstrate it

With our relationship in Christ and wanting to be like him, our faith and works go together - like inhaling and exhaling.

The late pastor Billy Graham stated it in these terms - Faith is taking the Gospel in; works is taking the Gospel out."

Inhaling and Exhaling!

You see brothers and sisters - faith is never something just to be talked about.

It is something that must be demonstrated in the way we live.

Paul Harvey once said, "If you don't live it, you don't really believe it."

James proudly proclaimed, "… I will show you my faith by my works." (James 2:18).

Again – Brothers and Sisters - believing is one thing; but is your believing - an action filled faith?

The Scriptures are clear that we should put our faith and trust in our Lord and Saviour, Jesus Christ.

I’ve heard the questioned poised - “If you were on trial for being a believer of Christ and his gospel - would there be enough evidence to convict you?”

James also talked about "an empty faith".  What might that be?  He tells us that it is a non-action filled faith.  He says that that empty faith is in reality ... “not a true faith, it is not a saving faith, it is nothing more than mouthing words.”

I ask you again – is Faith faith, without works?

I think that you know my thoughts to the answer to that – now ask yourself – do you agree with me?

And if you agree with me – ask yourself this question – Do I really have faith in the Lord Jesus Christ?

Brothers and Sisters - True faith will lead you to repentance. It will cause you to surrender your soul to Christ. It will inspire you to do right, to live as He lived.

Promise yourselves – that you will bring action to the faith that you have in the Lord and His gospel.

Be doers of the Word, and not just hearers only.

Be a faithful disciples.

May your efforts to develop your faith with Christ like attributes be successful which will be manifested in your behaviour.

I humbly pray, in the name of Jesus Christ, amen.`

  {
    id: "joy-through-the-atonement",
    section: "Church Talks",
    title: "Joy Through the Atonement",
    date: "March 2017",
    location: "Terrace, BC",
    notes: "Also given in Smithers on May 2016.",
    body: `Good morning Brothers and Sisters.

A young boy lived in the country. His family had to use an outhouse, which the young boy hated. It was hot in the summer, cold in the winter, and always smelly. The outhouse was located near the creek so the boy decided that he would push it into the water. After a spring rain, the creek swelled so the boy pushed it in.

Later that night his dad told him that he and the boy needed to make a trip to the woodshed. The boy knew this meant punishment. He asked his father why to which his dad replied, "Because someone pushed the outhouse into the creek and I think that someone was you. Was it?"

The boy responded that it was. Then he added, "Remember when George Washington's father asked him if he had chopped down the cherry tree? He didn't get into trouble because he told the truth."

His Father quickly responded, "That is correct, but his father was not in the cherry tree when he cut it down."

It’s a good bet that none of us have ever toppled an outhouse (except Pres. Eckman), however we can identify with the boy in at least three ways.

First, there is an urge within us that wants to do wrong. We call it the natural man.

Second – sometimes our actions affect others.

And thirdly, there are consequences to our choices.

Consequences of sin most often bring sorrow, regret and heartache.

Many large corporations and some governmental jobs offer "Fringe Benefits" that are worth almost as much as the salary.

Some of these benefits can be:  Health Insurance; a Company Car; Retirement Plans; Extensive Paid Vacation; Profit Sharing, Stock Options, and the list continues.

Well my talk today is about one of the most significant fringe benefits that come from the atonement of our Saviour Jesus Christ.

We believe that the purpose of the atonement is to allow all of God’s children to enter into the mansions prepared for us in our Father in Heaven’s kingdom.  That is Eternal Life.

But there is more to the atonement and the benefits that come to us through its power.

May we rejoice in the Psalm that declares: “Bless the Lord, O my soul; and all that is within me, bless his holy name. Bless the Lord, O my soul, and forget not all his benefits— who forgiveth all your iniquities: who healeth all thy diseases” Ps. 103:1-3.

Brothers and Sisters – may we remember all His benefits – it’s not just the forgiveness of our sins – but it is also - the healing of all that burdens us.

Christ is the Healer.

Our Father in Heaven is by nature a healing God.

Satan, on the other hand, has come to tear us down; steal our souls; and destroy our hope of eternal joy.

Jesus says, “I am come that they might have life, and that they might have it more abundantly.” (John 10:10)

God says, “I am the Lord that healeth you.”  Ex. 15:26,

Today and every week - as we listen to the sacrament prayer – we commit and take upon ourselves, that we will always remember - that His blood, the blood of the new testament, which was shed for many – was for the remission of our sins. Matt 26:28

It is because of the nature of life and the Plan of Salvation, that we are all blessed to be here on earth to experience all the joys and heartaches that comes from the gift of agency.

Because of this plan – we all find ourselves doing those things that bring us closer to our Father in Heaven; but conversely, we also find ourselves doing those things that makes it a barrier to being in His presence.

The wrongs we do are NOT eternal.  They do not have to be obstacles of endless torment and grief.

It’s never too late –

There once was a priest who was out golfing one day.

He was halfway down the first fairway, waiting to hit his second shot, when he heard “Fore!” and a ball slammed into his back.

Soon, the golfer who had made the drive was on the scene to offer his apologies. When the priest assured him that he was all right, the man smiled.

“Thank goodness, Father!” he exclaimed.

“I’ve been playing this game for forty years, and now I can finally tell my friends that I’ve hit my first holy one!”

[Story omitted for copyright — an account of Tim Goeglein’s 2008 resignation from the George W. Bush White House over plagiarism, and his conversation with President Bush about forgiveness (likely drawn from a published article or Goeglein’s memoir, "The Man in the Middle"). Add back in from the source document.]

Brothers and Sisters - The Lord allows us to put the mistakes of the past behind us.

He has covenanted and promised, “Behold, he who has repented of his sins, the same is forgiven, and I, the Lord, remember them no more.” D&C 58:42.

Each of us knows a person who has had serious challenges in his or her life―someone who has wandered or wavered.

That person could be a friend or relative, a parent or child, a husband or wife. That person may even be you.

Brothers and Sisters – whether it is your friend or relative, or even you – I want you to know – the Atonement is a miracle to us all.

Our Saviour came to redeem all mankind.

All that we do in this Church – all that is within the gospel of our Saviour Jesus Christ points toward the atoning sacrifice of the Messiah, the Son of God.

This sacrifice, which began in Gethsemane and continued on the cross and culminated with His Resurrection – was to bring about God’s great glory of bring to pass the immortality and eternal life of man.

Alma 34:10 says, “For it is expedient that there should be a great and last sacrifice; yea, NOT A SACRIFICE OF MAN, neither of beast, neither of any manner of fowl; for it shall not be a human sacrifice; but it must be an infinite and eternal sacrifice.”

So – not a sacrifice of Man – well here is an interesting piece of doctrine found in JST John 1:13 - “He was born, NOT OF BLOOD, nor of the will of the flesh, nor of the will of man, but of God.”

You see, brothers and sisters - Christ did not have mortal blood. He was not a man like you and I - He was a God.

Our Saviour - the Son of God – He who inherited power over physical death - allowed Himself to suffer “even more than man can suffer, except it be unto death; for behold, blood cometh from every pore, so great [was] his anguish …” Mosiah 3:1

Not only did He pay the price for the sins of all mankind, but He also took “upon him the pains and the sicknesses of his people.” And He took “upon him their infirmities, that his bowels may be filled with mercy, … that he may know according to the flesh how to succor his people...” Alma 7:1

Succor – Because He has experienced your pain, He knows how to help you, how to strengthen you, how to heal you.

There are times when each of us needs “relief from feelings of guilt that come from mistakes and sins.”   As we repent, the Savior removes the guilt from our souls.

Let us remember the man who was painting his house. He only bought 5 gallons of paint. He knew he couldn’t finish the job with 5 gallons, so he started to thin it with water. He thinned and thinned and finally the job was done.

Then a big black cloud showed up over the house. It rained and rained and of course washed all the paint off the house.

A voice was heard from the cloud. "Repaint and thin no more."

Brothers and Sisters, through our Saviour’s atoning sacrifice, our sins are remitted - no matter how large or small the sin.

Because of His never-ending love, our Saviour beckons us - to repent, so that we will not have to suffer the full weight of our own sins:

“Repent—repent, lest … your sufferings be sore—how sore you know not, how exquisite you know not, yea, how hard to bear you know not. For behold, I, God, have suffered these things for all, that they might not suffer if they would repent;” D&C 19:15-16

The Savior extends healing to those who are suffering from sin.  He says: “Will ye not now return unto me, and repent of your sins, and be converted, that I may heal you?” 3 Nephi 9:13

A Doctor says to his patient: “I have some bad news and some very bad news.”

Patient: “Well, might as well give me the bad news first.”

Doctor: “The lab called with your test results. They said you have 24 hours to live.”

Patient: “24 hours! That's terrible! What could be worse? What's the very bad news?”

Doctor: “I've been trying to reach you since yesterday!”

We cannot be slow to repentance.

Brothers and Sisters – my talk is not supposed to come across as a warning of hell and damnation.

On the contrary – it is about the sweet blessing of forgiveness – of releasing the sin, the transgression, the pain, and sorrows – and embracing the healing power of our Saviours Atonement.

Satan wants us to feel and remain in a position of despair, confusion, or acceptance of our position of spiritual stagnation.

Our Redeemer offers redemption to all—no matter what we have done wrong.

If you are suffering - I invite you to seek relief.

If you need to - go to the branch president. He is the Lord’s messenger of mercy. He will help you as you struggle to become one with God through the offering of repentance.

Remember - The wrongs we do are NOT eternal.  They do not have to be the obstacles of endless torment and grief.

But you know what brothers and sisters - Each of us has been given the gift of moral agency.  We are free – free to choose liberty and eternal life; or free to choose captivity and death, according to the … power of the devil.

President Uchtdorf shared the following in a General Women’s Conference: “One woman who had been through years of trial and sorrow said through her tears, ‘I have come to realize that I am like an old 20-dollar bill—crumpled, torn, dirty, abused, and scarred. But I am still a 20-dollar bill. I am worth something. Even though I may not look like much and even though I have been battered and used, I am still worth the full 20 dollars.’”

This woman knows that she is a beloved daughter of her Heavenly Father and that she is worth enough to Him, to send His Son to atone for her. That all of us – is so loved by our Father in Heaven and He so much wants us to be blessed through the miracle of forgiveness.

Brothers and Sisters - “All that is unfair about life can be made right through the Atonement of Jesus Christ.” Preach My Gospel: A Guide to Missionary Service

I believe that if we could truly understand the Atonement of our Lord and Saviour, Jesus Christ, we would realize how precious we are as a son or daughter of God.

I believe that the atonement can make us at one with God.

If we truly understood the Atonement and the eternal value of our souls, we would employ the miracle of its power.

I know of its healing power. In mine own life and the life of others that have received joy and happiness, with a greater hope of life in this world and the world to come.

I testify that Jesus is the Christ—the Healer of our souls.

I pray that each of us will choose to respond to the Savior’s invitation: “Will ye not now return unto me, and repent of your sins, and be converted, that I may heal you?” 3 Nephi 9:13

In the name of Jesus Christ, amen.`

    notes: "Baptism talk for Shae Harding (February 18, 2017).",
    body: `We are so grateful to be here today with you Shae. We want you to know how happy we are for you as you continue your journey with spiritual growth and opportunities.

We know that blessings are in store for you, great blessings of faith, of hope, and of eternal life.

Shae, you have made that greatest choice of all: you have chosen to cross the bridge of baptism that shows your commitment to your Saviour and will bring you back to your Father in Heaven.

During the Vietnam War, a group of soldiers were ambushed. Fire was exchanged, and during it all, a young LDS soldier was hit in the chest.

The others had no choice but to retreat, leaving their friend's body in the tall grass.

Later that night, back at the camp, they saw a figure moving towards them. One of the soldiers yelled out, "Who goes there?"

Out of the shadows stumbled the LDS soldier. The group stood in disbelief, wanting to know how he survived.

The LDS soldier reached into his jacket and pulled out a pocket version of the Book of Mormon, with a bullet lodged in it.

Holding it high in the air he exclaimed, "Nothing, and I mean nothing, gets through Second Nephi!"

I know of a lot of people who have not been able to get through Second Nephi, but much of my talk on baptism will come from my most favourite chapter in the Book of Mormon, and yes, it is found at the end of Second Nephi.

Nephi said:

"Wherefore, do the things which I have told you I have seen that your Lord and your Redeemer should do; for, for this cause have they been shown unto me, that ye might know the gate by which ye should enter. For the gate by which ye should enter is repentance and baptism by water; and then cometh a remission of your sins by fire and by the Holy Ghost. And then are ye in this strait and narrow path which leads to eternal life; yea, ye have entered in by the gate" (2 Nephi 31:17–18).

These verses clearly teach that baptism, a holy sign of a covenant between God and His children, is required for our salvation.

This doctrine is also taught throughout the scriptures.

Nephi explained the reason why the Saviour was baptized, even though he was perfect, and how important it is for us to be baptized when he said: "And now, if the Lamb of God, he being holy, should have need to be baptized by water, to fulfil all righteousness, O then, how much more need have we, being unholy, to be baptized, yea, even by water!" (2 Nephi 31:5).

Mosiah 18:8–9 tells us that when we are baptized, we witness to the Father that we are willing to enter into a covenant "to come into the fold of God, and to be called his people, and are willing to bear one another's burdens, that they may be light; yea, and are willing to mourn with those that mourn; yea, and comfort those that stand in need of comfort, and to stand as witnesses of God at all times and in all things, and in all places that ye may be in, even until death, that ye may be redeemed of God, and be numbered with those of the first resurrection, that ye may have eternal life."

I want to remind all of us, and emphasize with you Shae, that we renew this covenant every Sunday as we partake of the sacrament.

The words of the covenant, as stated in the sacrament prayers, invite all of our Heavenly Father's children to witness "that they are willing to take upon them the name of His Son, and always remember him and keep his commandments which he has given them; that they may always have his Spirit to be with them" (D&C 20:77).

Besides witnessing our willingness to obey God, baptism allows us to enter into the kingdom of God, which is the Church of Jesus Christ on earth.

The Savior clearly defined the purpose of baptism when he told Nicodemus, "Verily, verily, I say unto thee, Except a man be born of water and of the Spirit, he cannot enter into the kingdom of God" (John 3:5).

Baptism is not just the gate through which we enter the Lord's Church and subsequently the celestial kingdom; it is also the gateway to the precious, the essential, and the ongoing process of becoming "perfect in Christ" (Moroni 10:32–33).

This process of being perfected in Christ is described in the fourth article of faith, and it begins with faith in the Lord Jesus Christ, followed by repentance, then "baptism by immersion for the remission of sins," and then receiving the gift of the Holy Ghost.

This process is called conversion.

In answer to Nicodemus's question about what he must do to be saved, the Saviour answered, "Verily, verily, I say unto thee, Except a man be born again, he cannot see the kingdom of God" (John 3:3).

Being born again requires more than baptism. An apostle of the Lord explained: "The spiritual rebirth described in the scriptures typically does not occur quickly or all at once; it is an ongoing process, not a single event. We begin the process of being born again through exercising faith in Christ, repenting of our sins, and being baptized by immersion for the remission of sins." But other essential steps in the process of being born again include "total immersion in and saturation with the Savior's gospel."

Being "born again" is another name for conversion. It is having "a broken heart and a contrite spirit." I want you to know that this process does lead us to a remission of our sins.

Like many members who have grown up in the Church, I did not have the dramatic conversion to the gospel. I was "born of goodly parents" and was baptized at age eight. I can still remember that day, but at that time, I know that I never did have a powerful moment of conversion. I don't think any child at the age of eight can experience the same conversion as those who join the Church at a later age.

This is one of the most wonderful things that each of us can come to understand about the gate called baptism.

Baptism is not the destination, not even when accompanied by the essential element of the gift of the Holy Ghost.

Baptism is the gate to the ongoing, lifelong process of true and enduring conversion.

In my favourite chapter, Nephi poses this question: "After ye have gotten into this strait and narrow path, I would ask if all is done?"

So Shae, is it all done now that you will have been baptized?

Nephi answers: "Nay; for ye have not come thus far save it were by the word of Christ with unshaken faith in him, relying wholly upon the merits of him who is mighty to save. Wherefore, ye must press forward with a steadfastness in Christ, having a perfect brightness of hope, and a love of God and of all men. Wherefore, if ye shall press forward, feasting upon the word of Christ, and endure to the end, behold, thus saith the Father: Ye shall have eternal life."

President Henry B. Eyring, from the First Presidency, remembers when he was baptized. On the way home, all he could think of was, "Uh-oh, the free ride is over." And it's true. After our baptism, each of us has the blessing of being responsible for every action in our lives.

A story is told of the son of King Louis XVI of France. As a young man, he was kidnapped by evil men when they dethroned the king.

For six months he was exposed to every filthy and vile thing that life had to offer, yet he never buckled under the pressure.

This puzzled his captors, and they asked him why he had such great moral strength. His reply was simple: "I cannot do what you ask, for I was born to be a king."

Shae, you were born to be a daughter of a King.

By being baptized, you have been promised the blessings of royalty as you sanctify yourself and become holy.

And how can we become more holy so we may claim our royal heritage? Christ has said, "Follow me, do the things which ye have seen me do" (2 Nephi 31:12).

I pray that all of us, and especially you Shae, that we obtain a greater appreciation, a greater understanding of the importance of our covenant of baptism, the gateway that provides us a lifelong process of conversion, and of the free flowing atoning love of our Savior, who stands "at the door" and bids us enter and dwell with Him and the Father forever.

I humbly pray and testify, in the name of Jesus Christ, Amen.`

  {
    id: "wisdom-jadyn",
    section: "Church Talks",
    title: "Wisdom",
    date: "January 22, 2017",
    location: "Smithers, BC",
    notes: "Written for Jadyn",
    body: `Could you use a little more wisdom?

With all of the different things that you have done in life - how much better would your choices have been - if you had the wisdom to do the right thing at the right time; to avoid many of the mistakes that you have made – especially with all of those decisions as it pertains to your relationship with your Father in Heaven?

Wisdom is not knowledge.  It's being aware of something, and having information.

Knowledge is really about facts and ideas that we acquire through study, research, and experience.

Wisdom is the ability to discern and judge which aspects of that knowledge are true, right, lasting, and applicable to your life.

I believe that we should all acquire knowledge of things that are both taught by the world but more importantly, we should acquire the knowledge of the things of God.

But it’s the wisdom that really makes our knowledge effective in our lives.

I believe that in the end – we can all use more wisdom in our lives.

Henry Ford, the founder of Ford Automotive asked an electrical genius by the name of Charlie Steinmetz to build the generators for his factory.

One day the generators just stopped working; and the repairmen couldn’t find the problem.

Ford called Steinmetz, who fiddled with the machines for a few hours and then threw the switch and just like that – the generators began to work again.

A little while later--Henry Ford got a bill for $10,000 from Steinmetz.

Henry Ford was shocked at the high cost of the bill, so he asked Steinmetz why it cost so much for only a few hours of work.

Steinmetz said, “Well I only charged $10 for the time that I tinkered on the generators, but the $9,990 is for knowing where to tinker.”

With that - Henry Ford paid the bill.

Here were two men who had wisdom.

Henry Ford had the wisdom to know that he didn’t know it all and the wisdom to find someone who had the knowledge he needed. Then he had the wisdom to pay for that knowledge rather than try to figure it out the hard way.

Steinmetz also had wisdom. He had the wisdom to know what to do, how to do it and then how to go about convincing Henry Ford to pay for what he knew.

This year’s Mutual Theme is about prayer – but more importantly – about how prayer can give us wisdom.

James 1:5–6 says, “If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him. “But let him ask in faith, nothing wavering. For he that wavereth is like a wave of the sea driven with the wind and tossed”

We all lack wisdom. We all need wisdom. And thank goodness know where we can go to get that wisdom.

That is – when we ask God in prayer.

A well respected man of God was out by the river one day when a young boy came up to him and said, “Sir, please teach me to pray.” The old man asked, “Are you sure you really want to know?” The boy replied, “Yes, of course.”

So the old man takes the boy by the hand and leads him into the river until they are almost chest deep. He plunges the boy under water.

After a while the boy begins to struggle and fights desperately to come up for air. Finally the old man lets him up. “What was that all about?!” the boy asked.

“That my son was your first and most important lesson—when you long for God the way you just longed to breathe, THEN you will be able to pray.”

I think that that is what James is saying – nothing wavering! Asking in faith!!

Imagine you were on Alcatraz - and you needed to send an urgent message to someone. The only way to do this is by using a homing pigeon.

You write out a detailed message, roll it up and tie it to one of the pigeon’s legs—careful not to tie it too tightly and hurt the little bird.

After you are certain that your message is secure, you tie a brick to his other leg and throw the bird off the ledge.

Do you think your message will get to where it’s needs to go?

So often, we do the same thing with our prayers.

We often weight down our prayers because we lack the faith that we will get the wisdom that we desire.

With all the choices that are in this world – and so many of them that are pulling us away from God – it truly is important for us to prepare ourselves to hear our Father in Heaven’s voice!

I believe that if we ask God in prayer, with faith – nothing wavering – we are promised that we will gain wisdom – and that wisdom comes for the whisperings and inspiration from the still small voice – the Holy Ghost.

Too many times - we pray asking God for protection, for health, or for help with our finances, and then we act as if God is not going to answer the prayer.

We have to believe – truly believe with all our hearts – and then be prepared to discern and accept, the answers from our prayers.

There was a man who was having some very serious financial problems. He went to his pastor and told him of all his troubles. The Pastor told him that if he would pray then God would provide for his needs. So the man went home that night and prayed “Dear Lord please let me win the lottery so that I can pay all my bills. Thank you. Amen.”

So the lottery came and went and the man did not win. So he went back to his pastor to ask why God hadn’t answered his prayer. The pastor told him that you must have faith; if you have enough faith then God will always answer your prayer.

So the man went home and prayed even harder. “Dear Lord Please let me win the lottery. I believe that you can hear me and that you will answer my prayer. Thank you. Amen.”

The lottery again came and went and he still did not win. He went back to his pastor and asked why God had not answered his prayer. The pastor told him that if he would repent and beg God for help He would surely help him.

So he went home and started praying, “Dear God forgive me of my sins, I want to be your servant, Lord just please...”

And all the sudden a loud voice came from heaven saying, “WOULD YOU PLEASE BUY A TICKET!”

Sometimes, our Father in Heaven is waiting for us to take the necessary action so that He can bless us. (Now buying a lottery ticket is not one of those actions, but it makes the point.)

Our prayers are promised to give us wisdom and in return, our Father in Heaven then wants us to act upon the wisdom that we receive.

Prophets have long told us to pray humbly and frequently.

I love the guidance from our prophet, President Thomas S. Monson, who said:

“To those within the sound of my voice who are struggling with challenges and difficulties large and small, prayer is the provider of spiritual strength; it is the passport to peace. Prayer is the means by which we approach our Father in Heaven, who loves us. Speak to Him in prayer and then listen for the answer. Miracles are wrought through prayer”

In closing, I would like to emphasize how important prayer really is.

I believe that any follower of Christ – who doesn’t have healthy prayer in their life - is like a SCUBA diver without an air tank; like a mountain climber without a rope; or a skydiver without a parachute.

I am so grateful to that promise that comes to us through prayer.

I believe in its power.

And I say that in the name of Jesus Christ. Amen.`

    body: `Chippie the parakeet never saw it coming. One second he was peacefully perched in his cage. The next he was sucked in, washed up, and blown over.

The problems began when Chippie’s owner decided to clean Chippie’s cage with a vacuum cleaner.

She removed the attachment from the end of the hose and stuck it in the cage.

The phone rang, and she turned to pick it up. She’d barely said "hello" when all of a sudden, Chippie got sucked in.

The bird owner gasped, put down the phone, turned off the vacuum, and opened the bag. There was Chippie -- still alive, but stunned.

Since the bird was covered with dust and soot, she grabbed him and raced to the bathroom, turned on the faucet, and held Chippie under the running water.

Then, realizing that Chippie was soaked and shivering, she did what any compassionate bird owner would do . . . she reached for the hair dryer and blasted the pet with hot air.

Poor Chippie never knew what hit him.

A few days after the trauma, the reporter who’d initially written about the event contacted Chippie’s owner to see how the bird was recovering. "Well," she replied, "Chippie doesn’t sing much anymore -- he just sits and stares."

It’s hard not to see why. Sucked in, washed up, and blown over . . . That’s enough to steal the song from anyone’s heart.

“Sucked in, washed up, and Blown over” That about sums up how many of us feel at times – doesn’t it?

Can you imagine what the disciples of Jesus Christ felt on the day they set sail upon the Sea of Galilee? The scriptures tell us that Jesus was weary, and He went to the back of the ship and fell asleep on a pillow.

Soon the skies darkened, and “there arose a great tempest in the sea, insomuch that the ship was covered with the waves.”  The storm raged.

The disciples panicked. It seemed as though the boat would capsize, yet the Savior still slept.

At last, they could wait no longer and they awakened Jesus.

You can almost hear the anguish and despair in their voices as they pled with their Master, “Carest thou not that we perish?”

Many of us feel troubled and distressed; many feel that, at any moment, the ships of their lives could capsize or sink.

Be assured that there is a safe harbor. You can find peace amidst the storms that threaten you. Your Heavenly Father—who knows when even a sparrow falls—knows of your heartache, your sufferings, your doubts, and your fears.

He loves you and wants the best for you. Never question this.

A man entered the golf pro shop and looked all around, frowning.

After watching him for a bit, the pro asked him what he wanted.

“I can’t find any green golf balls,” the man replied.

“Well, I don’t think they make them, but I can check,” the pro said.

The pro looked all over the shop, through all the catalogs, even called all the ball manufacturers. Sure enough, no one makes green golf balls.

As the man walked out the door, the pro asked him, “Before you go, could you tell me why you would want green golf balls”

“Because” he said, “they’d be so much easier to find in the sand traps!”

For many of us – we seem to feel like we are always in a trap and that there are few too many times when we find ourselves in positions that we want to be.

Rest assured – life does not always have to feel that way.

I truly love this statement that Saviour gave to his disciples: “Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid.”

To the meek and discouraged, virtually every words that our Lord spoke were those of compassion and encouragement. To the sick, He brought a healing balm.

Today Jesus the Christ stands at the right hand of our Heavenly Father. Do you suppose that today He is any less inclined to aid those who suffer, who are sick, or who appeal to the Father in prayer for succor?

The Son of the Living God will not forget nor forsake those whose hearts are drawn to Him.

“Then,” the world would ask, “why does He sleep when the tempest rages all around us?  Why does He not still this storm, or why would He let us suffer?”

The answer may be found in considering a butterfly. Wrapped tightly in its cocoon, the developing young butterfly must struggle with all its might to break its confinement. The butterfly might too think, Why must I suffer so? Why cannot I simply, in the twinkling of an eye, become a butterfly?

Such thoughts would be contrary to the Creator’s design. The struggle to break out of the cocoon develops the butterfly so it can fly. Without that adversity, the butterfly would never have the strength to achieve its destiny. It would never develop the strength to become something extraordinary.

President James E. Faust explained that “into every life there come the painful, despairing days of adversity and buffeting. There seems to be a full measure of anguish, sorrow, and often heartbreak for everyone, including those who earnestly seek to do right and be faithful.”

Adversity can strengthen and refine us. As with the butterfly, adversity is necessary to build character in people.

Even when we are called to sail through troubled waters, we need to know the place of adversity in shaping our divine potential.

We have heard the words before "My son, peace be unto thy soul; thine adversity and thine afflictions shall be but a small moment;  And then, if thou endure it well, God shall exalt thee on high; thou shalt triumph over all thy foes."

There is a wonderful quote that goes, "Serenity is not freedom from the storm, but peace amid the storm".

There is another quote which says, “Lord, grant me the serenity to accept the things I cannot change, the courage to change the things I can, and the wisdom to hide the bodies of those people I had to kill because they ticked me off!”

It is easy - when we are in a time of trouble or turmoil that we can get angry and upset.

May we remember that “anger doesn’t solve anything. It builds nothing, but it can destroy everything.”

I remember a few summers ago, when Kaleb and I were golfing in the Kootenays.  At the beginning of the round, my game was poor.  Not hitting the ball well.  Not putting well.  I remember a little breakdown of anger.  I hated everything.  I felt bad for Kaleb for being my playing companion.  It was on the 4th or 5th hole, that I made this specific statement to myself, I said, "Dana, why are you so mad?  Look around!  Look at how beautiful this course is!  Look at how beautiful the weather is!  Look at what you are doing!  You're playing golf with your son!"

At that moment, I looked around and realized how beautiful things were and what a great experience I was missing out on.  I changed my outlook and from that moment on my game turned around and I shot far better than I ever thought I would.

Life was great, but I got so focused on the bad and my vision was narrowed to only looking at the bad and not on what is good!

We are promised that we can emerge from our trials more refined and glorious.

You are stronger than you think. Our spirits are eternal, and eternal spirits have immeasurable capacity!

Our Father in Heaven does not wish us to cower. He does not want us to wallow in our misery. He expects us to square our shoulders, roll up our sleeves, and overcome our challenges.

That kind of spirit, that blend of faith and hard work, is the spirit with which, we should emulate as we seek to reach a safe harbor in our own lives.

Sisters and Brothers - you are not alone. In The Church of Jesus Christ of Latter-day Saints today, millions of people stand beside you.

Those who follow the teachings and example of the Savior are “willing to bear one another’s burdens, that they may be light; yea, and are willing to mourn with those that mourn; yea, and comfort those that stand in need of comfort.”

I call upon all who hear my words today to be active in our charge to execute our commitment at baptism to bear one another's burden, to mourn with those that mourn, and to comfort those in need of comfort!

The question Cain asked of the Lord, “Am I my brother’s keeper?” has been answered by prophets in these latter days. “Yes, we are our brothers’ keepers,”

President Thomas S. Monson has said, when we work together to benefit those in need, “we eliminate the weakness of one person standing alone and substitute the strength of many serving together. While we may not be able to do everything, we can and must do something.”

Our Branch Presidency, home teachers, visiting teachers, and members of priesthood quorums and of Relief Societies and other auxiliary organizations should all stand ready to help.

In moments when the light of resolution dims and when the heart grows faint, we can take comfort from His promise: “Be not weary in well-doing. … Out of small things proceedeth that which is great. Behold, the Lord requireth the heart and a willing mind.”

The Savior’s teachings and this Church – The Church of Jesus Christ of Latter-Day Saints - constitutes our best safe harbor.

This does not mean - that the brothers and sisters of this Church are here to solve all your problems.

History shows us that when we do for others what they can and ought to do for themselves, we often weaken rather than strengthen them.

Sisters and Brothers - As you overcome adversity in your life, you will become stronger.

When you feel tossed by the storms of life and when the waves rise and the winds howl, on those occasions it would be natural for you to cry in your heart, “Master, carest thou not that I perish?”

When these times come, think back upon that day when the Savior awoke, rose up and rebuked the storm, and said, “Peace, be still,”

Use your ingenuity, your strength, your might to resolve your challenges. Do all you can do and then leave the rest to the Lord.

Living the gospel does not mean the storms of life will pass us by, but we will be better prepared to face them with serenity and peace.

“Search diligently, pray always, and be believing,” the Lord admonished, “and all things shall work together for your good, if ye walk uprightly.”

Draw close to our Lord and Saviour, Jesus Christ. Be of good cheer. Keep the faith. Doubt not. The storms will one day be stilled.

Our beloved prophet, President Gordon B. Hinckley, has said: “We have nothing to fear. God is at the helm … [and] He will shower down blessings upon those who walk in obedience to His commandments.”

The Saviour said, “My yoke is easy, and my burden is light.”

When our souls are anchored in the safe harbor of the Savior, we can proclaim as did Paul: “We are troubled on every side, yet not distressed; we are perplexed, but not in despair; persecuted, but not forsaken; cast down, but not destroyed.”

The gospel gives us that harbor of enduring safety and security. I bear testimony – that I KNOW - our living prophet and the apostles - today are as lighthouses in the storm.

Steer towards the light of the restored gospel and the inspired teachings of those who represent the Lord – here on earth.

They are there to give us HOPE.  As are the scriptures - as the Apostle Paul taught that the scriptures were written to the end that we “might have hope.” (Romans 15:4)

Hope has the power to fill our lives with happiness and in its absence - “the heart (becomes) sick.” (Psalms 146:5)

The Lord has given us a reassuring message of hope: “Fear not, little flock.” God will wait with “open arms to receive” those who give away their sins, their doubts, and their insecurities as they continue in faith, hope, and charity.

And to all who suffer—to all who feel discouraged, left alone, or confused – I humbly say to you – look forward with hope, with courage, with humility, and with faith – and never give in.

Never surrender. Never allow these feelings to overcome your spirit.

President Uchtdorf encourages, “Embrace and rely upon the Hope of Israel, for the love of the Son of God pierces all darkness, softens all sorrow, and gladdens every heart.”

I bear solemn testimony that Jesus is the living Christ, our Savior and Redeemer. He leads and directs His true Church through our prophet, President Thomas S. Monson.

And if we live by the Savior’s teachings – believing in the saving ordinances of our gospel, we will with surety find a safe harbor; we will find peace; and we will find serenity in this life and in the eternities to come. I so testify in the name of Jesus Christ, amen.`

    body: `Good morning Brothers and Sisters.

A newly married flight engineer with the US Air Force had planned a weekend getaway with his new bride. But on the Friday, his squadron called and told him he was to leave the next afternoon for an eight-day mission.

His wife was obviously disappointed. "Don't you get weekends off like normal people?" she asked.

He gently explained that as a member of the US Air force he was on call 24 hours a day, 7 days a week, 52 weeks a year.

She looked longingly into his eyes and said "But, honey, couldn't you just explain to them that we had plans?"

The Armed Forces are people who understand they can’t just explain they have plans.

They are serious people doing a serious job, protecting nations and their people.

And they are on call 24 hours a day, 7 days a week, 52 weeks a year.

They understand that they are to remember to do their jobs… no matter what the cost

We have been sometimes called a royal army. And we are called to do a most glorious and power work

It may not be 24 hours a day, 7 days a week, 52 weeks a year – but our devotion and readiness should always be present; regardless of what calling you might have – whether it be a Branch President or a Branch Librarian.

Our thoughts, energies and passions should always be engaged in the capacity of which we are called by God through revelation, to serve Him and His church.

The fifth Article of Faith says: “We believe that a man must be called of God, by prophecy, and by the laying on of hands, by those who are in authority to preach the Gospel and administer in the ordinances thereof.”

Leaders of our church seek the guidance of the Spirit in determining whom to call.

We consider the worthiness that may be required for the calling. We consider the member’s personal or family circumstances.

Although service in Church callings requires sacrifice, we believe that it should not compromise a member’s ability to fulfill family and employment responsibilities.

Sometimes I have heard that some people are called because of their relationship with the presiding priesthood holders – whether they were directly related or maybe just friends.

I like to think about the early days of the church.  You might remember the Zions Camp.

Zion's Camp was an expedition of Latter Day Saints, led by Joseph Smith, from Kirtland, Ohio to Clay County, Missouri during May and June 1834 in an unsuccessful attempt to regain land from which the Saints had been expelled by non-Mormon settlers.

About 200 men and a number of women and children volunteered to join this expedition which became known as "Zion's Camp."

The expedition left Kirtland on May 4, 1834. By June 4, they had marched across Indiana and Illinois, reaching the Mississippi River, which they crossed, entering Missouri. The 900 mile march ultimately failed in its objective, and fourteen of the over 200 participants died.

Something that isn’t well known, is that over that long trek, Sylvester Smith (not related to Joseph) had been a huge thorn in Joseph’s side.  He complained, bickered, and undermined many of the things that Joseph had done.

In fact, once they returned back to Kirkland – rumors spread around of falsehoods of how Joseph had lead the saints on the trek.  All these rumors originated by Sylvester Smith.

The complaints against Joseph Smith resulted in the only time in church history that the Common Council of the Church has been convened to try a President of the Church.

It was determined that Joseph Smith had "acted in every respect in an honorable and proper manner."

Given the great lengths of the problems that Sylvester had made to Joseph – can you guess who the First Presidency called to be as a member of the inaugural Quorum of the Twelve?

That’s right – Bro. Sylvester Smith.

Do you not think that Joseph could have exercised some of his biases and partialities and found some way not to call him?

This is a testament to me about the faith and confidence that the Prophet had in the revelation that he was receiving as they were praying to extend such callings.

Brothers and Sisters – I am here today to tell you that all of us who hold callings in the church are called of God by prophecy and by the laying on of hands.

Because of this - you are entitled to great powers.

And as Peter Parker’s Uncle said to Spiderman, “With great power, comes great responsibilities”

Jacob, the brother of Nephi, in speaking of the call which he and his brother Joseph had received, said: “And we did magnify our office unto the Lord, taking upon us the responsibility, answering the sins of the people upon our own heads if we did not teach them the word of God with all diligence.” (Jacob 1:19.)

Your calling in the Church is both a personal and a sacred matter.

Brothers and Sisters – I testify that each of you are called to act in the name of God in whatever positions you may hold.

And if you don’t believe that, your Father in Heaven has promised - that every person in this church has the right to know that he/she has been called of God.

If you do not have that assurance, then I would suggest you give your calling – serious and prayerful consideration - so that you can receive all the power and authority that you have rights to attain.

I sincerely hope - that when someone asks you “Who called you?” that your immediate response will be with conviction, “The Lord Jesus Christ,”

Just a few moments ago, we were asked to raise our hands to the square and sustain those who are called to serve us in various capacities within our District.

When we sustain officers, we are given the opportunity of sustaining those whom the Lord has called by revelation.

The dictionary tells us that the word sustain means “to bear up, to support”

President Hinckley said, “The procedure of sustaining is much more than a ritualistic raising of the hand. It is a commitment to uphold, to support, to assist those who have been selected”

When we sustain, it means we do something about our belief.

Our testimony of the Lord’s chosen turns into action when we sustain them.

Last week, in our Sunday School Lesson – we talked about this sustaining.  The question was asked to our Branch President – President Norton, about what could the members of his branch do, to sustain him.  His response was in my opinion is doctrine.

He simply asks that each person that has a calling within his branch – that they serve to the best of their ability. That is what Pres. Hinckley meant by “assisting those who have been selected”.

What more can be said?  But I have to keep going because I’ve been assigned to speak for 15 minutes.

So how about the corny jokes that Pres. Slocombe always looks forward to.  Maybe I’ll say this really slow, since I find that Pres. Slocombe doesn’t really get them until he’s heard it a few times.

There once was a nun in the back of a taxi cab … Actually, we’ll skip that one …

There once were two missionaries standing by the side of a road holding up “a sign that reads “The end is near! Turn around now before it’s too late!”

A passing driver yells, “You guys are nuts!” and speeds past them. From around the curve, they hear screeching tires—then a big splash.

The one missionary turns to the other says, “Do you think we should just put up a sign that says ‘Bridge Out’ instead?”

Brothers and Sisters – every calling is an opportunity to teach, preach, expound and exhort.

That reminds me of the pro at a golf course that was trying to teach my buddy Pres. Norton.

It was a sunny Saturday morning, and Richard was beginning his pre-shot routine, visualizing his upcoming shot when a voice came over the clubhouse loudspeaker – it was the club pro: “Would the gentleman on the Ladies tee please back up to the men’s tee!”

Richard was still deep in his routine, seemingly impervious to the interruption. Again the pro announced: “Would the man on the women’s tee kindly back up the men’s tee!”

Well at this point, Richard had had enough and he shouted: “Would the announcer in the clubhouse kindly be quiet and let me play my second shot!”

Brothers and Sisters, we belong to the true church; the church that has the fullness of the gospel.

And you know what? The doctrine of our church is perfect; however, just because we have the fullness of the gospel, it does not mean that our actions and efforts as ministers or representatives are perfect.

Good doctrine does not always perform that which is right

Take for example the Pharisees - the Pharisees taught good doctrine… the problem with them is that they weren’t really into helping anybody.

If our Savior had given the Pharisees the ability to heal, or cast out demons, or raise the dead, they’d have used it to set up a show (like the TV Ministries) that would bring great crowds and congregations in – to simply bring personal wealth to themselves.

You see the Pharisees weren’t into religion because they could use it to help people… they were into religion to get gain, popularity and status for themselves.

A church that ONLY preaches good doctrine but doesn’t do anything for the poor and the needy - is preaching a lop-sided message.

If we ignore the needs of our members, and our church service – we can no longer be able to claim to have the truth manifested in our lives

So - let us not take for granted that simply because we have the perfect gospel - that it will make us perfect servants.

May we not be like the unwise and slothful servant.

I can’t help but think about the sloths in the various movies like Ice Age and Zootopia.  These guys are loveable – you gotta love them but I hope that that image is something that we do not aspire to be – I mean who doesn’t want to be loveable?

A Sloth is an animal that is slow and only does the absolute necessary things to keep living.

A slothful person is a person that is both undependable and lazy; and does not want to do work.

Proverbs 21:25 says, “the desire of the slothful killeth him: for his hands refuse to labor”.

I pray that we will not be like Sid or Flash, the Sloth.  Adorable as they are – we cannot; we shall not be slothful servant to the most high God.

I am sure that there will be, or currently may be - times when you will feel overwhelmed; or have the feelings inadequacies.

The truth is, we are all inadequate.  I mean – look at President Slocombe, and President Van Horne, and most of all look at look at me– inadequate? Yes.

We are all inadequate to represent the Lord – when we are relying on the arm of our own flesh - but, we have access to more than our own abilities - remember, we do not work alone.

The Lord will magnify what you say and what you do in the eyes of the people you serve.

There is no question - He will send the Holy Ghost to manifest truth and light.

What you say and do will carry hope; and give direction to people far beyond your own understanding.

Not only will He magnify the power of your efforts. He, Himself will work with you.

Sis Moyle, last week in Sacrament Meeting, spoke an eternal truth, that the Lord’s work will move forward.  It will not be stopped. It will not be destroyed – because it is His work.  It is His Glory. And it is He that stands at the head of this Church and all that it does.

How beautiful the promise in the D&C 84:88 were it says, “And whoso receiveth you, there I will be also, for I will go before your face. I will be on your right hand and on your left, and my Spirit shall be in your hearts, and mine angels round about you, to bear you up.”

You are called to represent the Savior in whatever capacity that you are called; to bless all of His children with the opportunities, to inherit eternal life.

It is our calling to bless lives.

May we be of good cheer and understanding of the magnitude or your calling as Henry B. Eyring proclaimed,

“Your call has eternal consequences for others and for you. In the world to come, thousands may call your name blessed, even more than the people you serve here. They will be the ancestors and the descendants of those who chose eternal life because of something you said or did, or even what you were...”

Joseph Smith said, “Let us cheerfully do all things that lie in our power.”

The Lord will be with you, Brothers and Sisters.  He will greatly enlarge your talents, gifts, and abilities, as you serve Him.

All He asks is that you give your best effort and with all your heart.

Do it cheerfully and with the prayer of faith.

The Father and His Son will send the Holy Ghost as your companion to guide you. Your efforts will be magnified in the lives of those people that you serve.

And when you look back on what you may think are trying times of service and sacrifice - you see that the sacrifice has actually become a blessing.

At the end of World War I, Herbert Hoover, later to become President of the United States, and he led the allied relief efforts in Europe.

He kept hundreds of thousands of people from starving.

At that time a new word entered the Finnish language. In Finland, to “Hoover” means to be kind, to help.

Brothers and Sisters - If someone coined a word from your name, what would it be? Would it signify character? Would it signify devotion to your God?

I bear testimony that God hears and answers our prayers.  He desires us to be anxiously engaged in serving His spirit children.

I testify that the Savior lives and leads His living Church.

He knows you. He loves you. He sees and appreciates your faithful service in the work to which He has called you.

I so humbly testify in the name of Jesus Christ, amen.`

    body: `It was great to hear from a couple of angels last week.  I am grateful for my wife and Toby’s words that encourages us to celebrate Christmas by practicing service and love – especially those 7 second super hugs!!

The Christmas season is a wonderful time of year.  For many it is a time to look at what they can do for others.

For some – especially the children, it’s a time to wish for wonderful presents to be placed under the tree that will bring happiness to their lives.

And for others – it’s a time to feel and experience the love of family members as they gather together.

I know for me – I love to think about the family traditions that we do together.

For many years, we had a tradition that each child would alternate years when they would go with me to hunt for a Christmas tree.  One of the years that sticks out with me is the year it was Taaron’s year to go on the hunt.

Taaron was so cute. I remember when we got out of the truck and started out to trek into the woods.  Taaron had this massive backpack strapped to his back.  It seemed to be as large as him.

At one point, we found the tree that would be cut and placed into our living room.  Taaron declared that it was time to have lunch.  He opened his pack and out came everything imaginable.  Not just food but socks, a hammer, Pokémon cards, a flashlight.  He had everything in that pack.

I smile to this day because of the traditions that we have that are surrounded through Christmas.

I also smile when I think about the “BIG” gift tricks where we give a big box as a gift only to have something small in it.  I think of Kaleb when he was wanting a new 3 wood.  We wrapped the box that it came in but only had something small like a pack of golf balls or something like that.

And he would laugh but be gracious and give us a hug and a thanks and then we would have him read the note that would be in the box which would then surprise him with some other gift – and then after the smiles and hugs and thanks, we then surprised him of his coveted 3 wood.

One of my most memorable Christmas is, and my heart warms each time I recall – was last Christmas - when Jadyn opened her eyes to see her new puppy.

Christmas is truly a wonderful time of year.  So much joy – so much happiness – and so much to be grateful for.

Brothers and Sisters - When we keep the spirit of Christmas, we keep the Spirit of Christ.

It is important that we remember that the Spirit of Christ will block out all the distractions around us that can truly diminish Christmas and swallow up its true meaning.

We cannot lose that Spirit of Christ through the layers and layers of wrappings paper.

There once was a television reporter who was walking streets of Tokyo at Christmas time. Much like on the North American continent, Christmas shopping is a big commercial event – even though the major religion in Japan is Shinto Buddhism.

The reporter stopped one young woman on the sidewalk, and asked, "What is the meaning of Christmas?"

Laughing, she responded, "I don't know. Is that the day that Jesus died?"

In a sense there is a profound truth to her answer. We can see that the commercialism of Christmas is beginning to bring about the death or the removal of Christ during the Christmas celebrations.

I have spoken many years at Christmas time about the world moving further and further away from Christ during this special time – and we certainly see the evidences of it – but I do need to share that Rasmussen Polling recently poised these questions:

Should Christmas be more about Jesus or Santa?

Would you prefer stores to show signs saying “Merry Christmas” or “Happy Holidays”?

And the results found that 71 percent want to keep Christ in Christmas – which is up from the 60 percent who favored Christ over Claus last year.

Only 14 percent think Christmas should be more about Santa – which is down from 20 percent a year ago.

64 percent say they prefer stores with signs saying "Merry Christmas" over ones with "Happy Holidays," while just 24 percent prefer the generic greeting.

Even though those results are encouraging I still ask you a simple question that many of us know the answer to but sometimes lose sight at – What, is truly the meaning of Christmas?

There is no more pressing question today than this: Why did Christ come to the earth? And truly what difference does it make?

We have heard many answers to these questions.

Some argue that Jesus came to give us an example of God’s love.

Others say that he came to be the Perfect Man, the one shining example that can lift the rest of us up.

Many people consider him the greatest teacher of all time.

But against all of these theories or beliefs - we have the clear words of our Lord himself when he said: “For the Son of man is come to seek and to save that which is lost” – Luke 19:10

This simple statement declares a most glorious historical fact. - The Son of Man came.

Jesus has come to earth, the Almighty has entered our world - the God of the Old Testament was now on earth in human flesh.

The Bible calls him Immanuel – or, “God with us”.

His birth differs from every other birth in that he voluntarily came in obedience to the Father’s will.

The events leading up to the birth of Christ weren't coincidental, but were put in place by God, so that the prophecies of old would be fulfilled.

Everything that happened, from the time the census was ordered, to everyone returning to their own city to be registered, and then the birth of Jesus while Joseph and Mary were in Bethlehem, was orchestrated by our Father in Heaven.

Out of Bethlehem, a small town in the City of David, came the Messiah.

This event was the beginning of something so incredible.

He came into the world, miraculously conceived, and then born as all humans are.

And Mary brought forth her firstborn Son, and wrapped Him in swaddling cloths, and laid Him in a manger, because there was no room for them in the inn.

He experienced humanity at all levels – as a child, as a teenager, and as an adult - so He truly could identify with all people at all stages of life.

The miraculous birth differs from you and me.  I was born in Yakima Washington to Hartmut and Irene Gorbahn.

There was no immaculate conception.  No prophecies to be fulfilled by my birth.

I am here by the choices made by my parents according to the great plan of happiness.

But Jesus “came” according to the plan of God

Every detail was minutely planned in the courts of heaven. Nothing happened by chance.

He came from the light into the darkness - He came from splendor into squalor - He came from purity into a world of sin.

But, brothers and sisters – still he came!

He is the Son of Man because he was firstborn of our Father in Heaven.

The majority of the world categorically reject the notion that God has a Son and that God could somehow become one of us.

However, to us – we who call ourselves Christians assert boldly that at the heart of our faith is this certain truth: God has come down to us.

And in so doing – He came to seek and save that which was lost.

He is like the woman who lost a coin and searched her house until she found it.

He is like the man who lost one sheep and went out into the wilderness to find it.

He is the like the Father who welcomed his Prodigal Son home again.

Jesus came looking for someone.

He came seeking sinners up a tree, at midnight, and by Jacob’s Well.

He came seeking those caught in adultery, blind beggars, and lepers.

He even came seeking the self-righteous Pharisees who thought they didn’t need him.

He came seeking fishermen, politicians, physicians, tax collectors, rich men who were at the top of the economic food chain; and the poor - who no one else would touch.

He sought the prostitutes and drunkards, and they loved him for it. And when he was dying, he came seeking one hanging on a cross beside him.

Jesus came as the seeking Savior. And Brothers and Sisters, we will never truly understand him unless we see this clearly.

He is seeking and saving all that are lost.

We know that all mankind are sinners and are lost.

But what does it mean to be lost?

I remember when my wife and I were younger and we had our young son, Kai with us at the great shopping complex of Pine Center Mall in Prince George.  I remember that while we were busy looking at items in a store, that our young boy, wander off and we could not find him.

Panic overwhelmed us to great despair – until at last, we spotted him with another patron that had found him and was bringing him back to a visibly distraught young couple.

We are all like our young son, Kai.  We are all like, as Isaiah 53:6 reminds us - “all we like sheep have gone astray”

What, then, is our hope if we are so hopelessly lost?

We again find the answer in the words of the Saviour who said that he came “to seek and to save all those who are lost.”

He did not come as a tourist or a casual visitor or an educator or as a philosopher.

Jesus came as a Savior seeking to save the lost.

It is the glory of the gospel, Brothers and Sisters - that no matter how bad your sins may be, you can be forgiven - and your past - does not determine your future when the atonement of our Saviour Jesus Christ is applied in your life.

If you feel lost, then know that you are being sought by your elder brother – even Jesus Christ.

Won’t you come? Won’t you come to the Saviour of this world?

Long ago, there ruled in Persia a wise and good king. He loved his people. He wanted to know how they lived. He wanted to know about their hardships. Often he dressed in the clothes of a working man or a beggar, and went to the homes of the poor.  No one whom he visited thought that he was their ruler. One time he visited a very poor man who lived in a cellar. He ate the coarse food the poor man ate. He spoke cheerful, kind words to him.  Then he left.

Later he visited the poor man again and disclosed his identity by saying, "I am your king!" The king thought the man would surely ask for some gift or favor, but he didn't.  Instead he said, "You left your palace and your glory to visit me in this dark, dreary place. You ate the coarse food I ate. You brought gladness to my heart! To others you have given your rich gifts. To me you have given yourself!"

Brothers and Sisters - The King of Kings, our Lord and Saviour Jesus Christ, gave himself to you and me.  His gift to you and me through His birth and His sacrifice is truly the greatest gift one can receive at Christmas.

There is no better time than now, this very Christmas season, for all of us to rededicate ourselves to the principles and ordinances that make His atonement valid in our lives.

Because He came, there is meaning to our mortal existence.

Because He came, we can no longer be lost but be found in His love

Because He came, we too can be partners with Him in finding and rescuing those that are lost.

Because He came, death has lost its sting, the grave its victory. We will live again because He came.

Because He came and paid for our sins, we have the opportunity to stand before our Father in Heaven and hear the words, “Well done, my good and faithful servant – enter ye into my rest”

May this Christmas season, be a time to reflect and act upon the blessings and opportunities we have because of the birth, life, Atonement, and Resurrection of our Savior, Jesus Christ.

This is a season of rejoicing! A season of celebration!

A wonderful time when we acknowledge that our Almighty God sent His Only Begotten Son, Jesus Christ, to redeem the world! To redeem us!

Can you imagine being those shepherds that were abiding in the fields?

And an angel of the Lord came to you, and the glory of the Lord shone round about them.

And the angel spoke to you saying: “For unto you is born this day in the city of David a Saviour, which is Christ the Lord.”

And that you would find the babe wrapped in swaddling clothes, lying in a manger.

Can you imagine being there and a multitude of the heavenly hosts sang their praises, saying “Glory to God in the highest, and on earth peace, good will toward men.”?

Can you imagine that you went and found Mary, and Joseph, and the babe lying in a manger?

This is what it’s all about – a babe was born – and that babe was born to bring about the immortality and eternal life of man.

May this be the reason for our rejoicing?  May this be the reason of our celebrations?

May this season be a season of seeking HIM - the Lamb of God, the King of Glory, the Everlasting Light of the World, the Great Hope of Mankind, the Savior and Redeemer of our souls.

I believe that if we do not let the worldly distractions of this season clutter our lives – but with sincerity and humility seek the pure and gentle Christ within our hearts, we will be counted as one of those whom he has found.

Of this I testify in the sacred name of Jesus Christ, amen.`
