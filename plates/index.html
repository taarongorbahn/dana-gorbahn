    location: "Smithers, BC",
    notes: "",
    body: `Good morning Brothers and Sisters.

A few years ago, when we moved into our new home, I purchased a couple of crab apple trees for our front yard. I was able to convince Bro. Akre to come help me dig holes in my front yard to place these already somewhat large trees in.

After we planted them, I noticed that the trees were not planted straight and vertical. Ignoring my wife, my brother (who works for a landscaping company), and Bro. Akre, I left them as they were, hoping that they would settle in the new dirt and that they would work themselves out and grow straight up. These individuals suggested that I place rope onto the tree and anchor it to several spots to help it develop the way in which it was intended.

Over the next year, I would look at these trees and say to myself, "they are not straightening." I even saw my neighbors plant trees and rope and anchor them to the ground. And I kept saying that they'll straighten out.

Finally the next spring came around and it was obvious that the tree was not going to grow the way I wanted it to, and I went to the shed and got some rope and spikes and pulled and tugged until I could anchor the tree to the correct position.

After a year, I was able to take the rope off of the trees and let them grow on their own. To this day they are growing relatively straight.

Pres. Hinckley related a similar story about when he planted a young tree that needed these support strings to help it withstand the external forces that are placed on a new tree.

We may sometimes be like that young tree or the crab apple trees that are in my front yard, unable to withstand the wind (or the temptations of Satan) on our own.

We may be on the wrong track, moving away from that straight and narrow path that leads to eternal life.

In the book of Judges, we learn about some of the "stakes" that can support us. We learn that the stakes that give us support are: righteous parents, faith in God, righteous friends, and covenants.

In the book of Judges, we find that the Israelites went through a cycle of apostasy. And like we discussed in Sunday School last week, the cycle went from freedom to apostasy, from apostasy to bondage, from bondage to humility and repentance, from humility and repentance to deliverance.

Led by Joshua, the Israelites conquered much of the Promised Land.

After Joshua died, Israel was not united under a single leader until the days of the prophet Samuel and King Saul.

During this interval, 12 judges served as Israel's rulers and military leaders. Most of their reign was tragic as Israel went through the cycle of apostasy, bondage, repentance, and deliverance many times.

They began to forsake the Lord that delivered them from captivity by beginning to serve the gods of the nations around them, like the Canaanites and the Midianites serving Baal. This brings us to the first stake of support: righteous parents.

For the most part, the older generation of the Israelites tried hard to teach their children the correct manner in which to worship the Lord. However, because they didn't drive out all of the Canaanites from the land, the Canaanites were able to influence the younger generation toward idol worship.

From this example, we see that proper parenting includes sheltering our children from the temptations of Satan, and that this is essential to the spiritual development of our children.

Parents have at their disposal many different teaching tools to help rear their children in the ways of righteousness.

One of the most powerful and influential tools is that of "positive example."

President David O. McKay said, "Example is the influence that emanates from one person and sponsors a similar response in another person. The power of positive example is probably the most common source of moral motivation, especially among children."

Early Church leaders pointed out that "God became an object of faith" for the children of Adam through the influence of "human testimony."

It was this strength of example, parental commitment and testimony, that stimulated the children to acquire knowledge by their own experience.

Christ recognized the power of example to influence the motivation of others in Alma 17:11:

"And the Lord said unto them also: Go forth among the Lamanites, thy brethren, and establish my word; yet ye shall be patient in longsuffering and afflictions, that ye may show forth good examples unto them in me, and I will make an instrument of thee in my hands unto the salvation of many souls."

Example is a tool parents can consciously use to influence their children for good.

An illustration of the power of example is the case of the youth who was being pressured by his friends to drink a bottle of beer. After repeatedly declining, his friends asked him why he didn't give in. His reply was simple, and no, it was not "Well, I'm allergic to alcohol," it was: "My dad has been offered beer many times in my presence by his friends and he never accepted."

President Lee made an invitation to those who did not have their own testimonies. He told them that they could lean on his own testimony until they obtained one for themselves.

This is yet another illustration of the power of example as a real tool in the hands of the righteous.

In Pathways to Happiness, David O. McKay said that parents are the resource for conveying an influence of a particular truth to their children, so they can experience that truth, at least in part, and develop a desire to embrace it.

In "Children Learn What They Live," we find some very interesting behavioral responses:

If a child lives with criticism, he learns to condemn.

If a child lives with hostility, he learns to fight.

If a child lives with ridicule, he learns to be shy.

If a child lives with shame, he learns to feel guilty.

If a child lives with tolerance, he learns to be patient.

If a child lives with encouragement, he learns confidence.

If a child lives with praise, he learns to appreciate.

If a child lives with fairness, he learns justice.

If a child lives with security, he learns to have faith.

If a child lives with approval, he learns to like himself.

If a child lives with acceptance and friendship, he learns to find love in the world.

Children may have spiritual feelings in abundance.

How do children describe spiritual feelings? The following are statements of actual children describing what they feel.

"Beautiful. You don't feel like you have any worries" (Danny, age twelve).

"I feel like everything is right" (Sarah, age seven).

"I feel that I don't want to do anything wrong. I just want to be good 100 percent of the time" (Blaine, age sixteen).

"It's not just a feeling. It's more like the love of Heavenly Father and Jesus, and you feel love for them and your family" (Mitchell, age ten).

"I feel all washed again" (Julia, age nine).

Unlike the children quoted, some may never be taught to recognize that these feelings are spiritual and that they come from God.

It is incumbent upon all parents to help our children feel and recognize the promptings of the Holy Spirit.

No one is better able to help children recognize their spiritual feelings than their own parents.

The Lord has endowed parents with a deep love for their little ones, a special capacity for discerning their needs and feelings.

Brothers and Sisters, may we consider the magnitude of the holy calling given to us to be righteous parents, to provide the support, guidance, and positive example, and to help them feel the promptings of the Holy Ghost.

So that they may grow up in the straight way, always striving to be back in the arms of our Father in Heaven.

The second stake of support is that of faith in God.

The story of Gideon was an example of the strength of faith in God.

Gideon's call came in Judges 6:14: "And the Lord looked upon him, and said, Go in this thy might, and thou shalt save Israel from the hand of the Midianites: have not I sent thee?"

And Gideon's reply was, in Judges 6:15: "And he said unto him, Oh my Lord, wherewith shall I save Israel? behold, my family is poor in Manasseh, and I am the least in my father's house."

Here we have an ordinary Joe. A man not of importance within the Israelite nation, being called to deliver them out of bondage.

The Lord reassured Gideon that he was called of God and that he would be with him and help him.

Gideon demonstrated his faith in God by showing unto the children of Israel a sign. He asked the Lord that when he put a piece of wool fleece on the ground, that in the morning the piece of wool would be dry while the rest of the ground was wet with dew.

He put himself in a position that if it didn't happen, all of the children of Israel would then disbelieve his calling as their leader. As it turns out, according to Gideon's faith, the sign was given and the children of Israel were convinced and followed him.

He then went on to be commanded by the Lord to send 31,700 of 32,000 men home, leaving him just 300 men to go up to battle against the Midianites.

Gideon showed great faith by doing so. Imagine yourself being in Gideon's place.

You have 32,000 men in your army and you send all of them except for 300 men home before fighting a nation. And he does it!

As it turns out, they were able to drive the Midianites out of Israel. What faith it took to do such a thing.

And why was he commanded to send 99% of the army home?

Because the Lord wanted to show the children of Israel that the Lord was with them and that they could rely upon him and not on the strength of man.

This is a very powerful lesson.

The third stake is righteous friends.

In the book of Judges we also read about Deborah, the prophetess, and her friend Barak.

The story here is about how the Israelites, going through their apostasy, found themselves again back in bondage by the Canaanites.

After twenty years of bondage, the Lord called Barak to go up against the Canaanites and defeat them, but Barak ignored the call.

Deborah knew this by way of the Lord and called to speak with Barak.

Barak again was hesitant even after Deborah reassured him that the Lord would deliver them.

In Judges 4:8–9 we read their conversation: "And Barak said unto her, If thou wilt go with me, then I will go: but if thou wilt not go with me, then I will not go. And she said, I will surely go with thee: notwithstanding the journey that thou takest shall not be for thine honour; for the Lord shall sell Sisera into the hand of a woman. And Deborah arose, and went with Barak to Kedesh."

Deborah was the type of friend that recognized that her friend needed to be encouraged and inspired to obey God's command.

What kind of friends do we have? Do we have friends that try to encourage and inspire us to greater spirituality and obedience? If not, should we find ones that do?

And what kind of friend are we? Do we try to encourage and inspire our friends to greater spirituality and obedience? If not, should we?

The fourth stake was that of covenants.

Many things have been talked about regarding covenants from this pulpit.

Many of us have made covenants throughout our lives. Some have made the covenant of baptism, or eternal marriage, or of the rites of the priesthood, or of church callings. We make covenants each day not just to our Father in Heaven but also to the people around us. We also honor or renew covenants each day.

As with each covenant, blessings or rewards are associated. We promise to do something in exchange for something else. When we do not honor a covenant, we forfeit the associated blessings.

An example of this is found in the Old Testament in the story of Samson.

The story starts off with Samson's mom. She could not bear any children.

The Lord recognized Samson's mom's anguish and sent an angel to her and her husband on a couple of occasions to let her know that she would indeed bear a son.

Samson's mom covenanted with the Lord that she would rear her son to be a Nazarite. The Nazarites made covenants with the Lord that they would separate themselves from the things of the world and become holy unto him.

Samson's mom fulfilled her covenant and raised and dedicated her son as a Nazarite.

As many of you know, Samson grew to be very strong; in fact he slew a lion with his bare hands. The reason for his strength was that the Lord covenanted with Samson that he would have this strength for as long as he would never cut or shave his head.

Now the source of this strength was not literally derived from his hair.

It derived from the power of God and was simply a symbol of the covenant that the Lord had made with him.

So here we have Samson, a man raised to keep himself separate from the things of the world and become holy unto God, and guess what he does?

He goes chasing after a woman from the Philistine nations. This was bad because she was not from the covenant people, and he married outside the covenant.

As we fast-forward through the story of Samson, we find that Samson eventually defeated the Philistines single-handedly by killing a thousand men.

He became the Israelite leader for twenty years.

Near the end of the twenty years, Samson sees a harlot named Delilah.

Samson was so smitten by Delilah.

She even tries to betray Samson three times, and Samson is still smitten with her.

At a point where Samson is afraid that Delilah was going to leave him, he tells her about his covenant with the Lord and that his strength came from his locks of hair.

Again, Delilah betrayed Samson. She cut seven locks of his hair, and has the Philistines come and bind Samson and throw him into prison.

The end result: Samson received his just reward for not fulfilling his covenant with the Lord.

Brothers and Sisters, the covenants we make with the Lord should be a source of strength, guidance, and commitment.

We have been blessed to be able to make everlasting and eternal covenants with the Lord. These covenants can bring us blessings beyond measure if we but only obey and live up to them.

It is my hope and prayer that we remember and honor the covenants that we make or have made with the Lord.

In the book of Judges, the Israelites began to lose spiritual battles, letting themselves be influenced by the Canaanites' worldly practices and false gods.

We face similar spiritual battles.

I testify that we can succeed in these battles as we follow the ways of righteous parents and ancestors, make good friends, increase our faith in the Lord, and keep our covenants.

May we remember and obey.

In the name of Jesus Christ. Amen.`

    body: `Good evening brothers and sisters.

Before I get into my talk, I need to tell you about the last time I spoke. As I went on through my talk, people in the congregation got bored and kept getting up and walking out. By the end of my talk, there was one lone man sitting in the congregation. At that point, I asked the man why he stayed to the bitter end of my talk. He quite frankly said, "I'm the next speaker."

I hope that I will not bore you this evening and that you will gain knowledge or be touched by the Holy Spirit.

There's a story about a doctor who had a leak in his bathroom plumbing that became bigger and bigger.

Even though it was 2am, the doctor decided to phone his plumber.

"For Pete's sake, Doc," the plumber said, "this is some time to wake a guy."

"Well," the doctor answered testily, "you've never hesitated to call me in the middle of the night with a medical problem. Now it just happens that I've got a plumbing emergency."

There was a moment's silence. Then the plumber spoke up, "Right you are, Doc, tell me, what's the problem?"

The doctor explained about the leak in the bathroom.

"I'll tell you what to do," the plumber offered. "Take two aspirins every four hours and drop them down the pipe. If the leak hasn't cleared up by morning, phone me at the office."

I testify to you that the words which I will speak tonight are true and not simply words of advice that means nothing.

The fourth article of faith states: We believe the first principles and ordinances of the gospel are: 1. Faith in the Lord Jesus Christ. 2. Repentance. 3. Baptism by immersion for the remission of sin, and 4. Laying on of hands for the gift of the Holy Ghost.

After the resurrection of Jesus Christ, the Saviour appeared and spent some time with his disciples in Jerusalem. As he was about to leave them for the last time, he gave them a commandment that they should "go ye therefore and teach all nations, baptizing them in the name of the Father and of the Son, and of the Holy Ghost."

50 days after the crucifixion of our Savior, on the day of Pentecost, and after Peter received the Holy Ghost, he spoke boldly to a multitude.

He spoke of the Savior's life, His mission, His crucifixion, and resurrection.

And as the multitude heard about this Savior, their hearts were pricked. Meaning the Holy Ghost had touched their hearts and they now had faith in this Savior, called Lord and Christ.

And they said to Peter and the rest of the apostles, "What shall we do?"

Peter then said to them, "Repent and be baptized every one of you in the name of Jesus Christ for the remission of sins, and ye shall receive the gift of the Holy Ghost." (Acts 2:37–38)

That very same day there were about three thousand souls who received a testimony of the Savior of this world, who repented of their sins, and who entered into a covenant that they would take upon themselves the name of the Father, and the Son, and the Holy Ghost. Three thousand souls.

A couple of things that I would like to impress upon you from this event: just like the Fourth Article of Faith, these people needed to have faith in the Lord Jesus Christ prior to baptism, and these people needed to repent of their sins and come before the Lord with a humble heart with the intent to live their lives as an ambassador of the Savior, and that too must be done before baptism.

Why has the Lord instituted baptism the way it is performed today? Why didn't the Lord institute some other type of ordinance?

Well, the Lord instituted baptism all the way back to the times of Adam, and it was done to prophesy and symbolize the death, burial, and resurrection of Jesus Christ.

Our Father in Heaven has instituted a wonderful plan for each of us to strive for exaltation. In this plan he allows us to be free to choose whom we will serve, whether it be God or other things. When we choose to serve something else other than our Father in Heaven, we then become unclean and are damned, or held back from our Father's Kingdom. Hence the death of our spirits.

When we are lowered into the baptismal waters by a person with authority from God and not man, we are then considered buried.

And as we are lifted up out of those waters, our spirit is then renewed and cleansed, just as our bodies will be reunited with our spirits in its perfect form.

Notice that I did not say that our spirits will be healed, it will be cleansed. When we are baptized our spirits will still be subjected to a life of deciding whom we will serve. Whether it be God or whether it be something else.

May we be like Joshua of old and say and do, "As for me and my house, we will serve the Lord."

The Savior instituted the sacrament, to allow us to not only remember our covenants that we made at baptism but also to allow ourselves to come before Him with a humble heart and a contrite spirit and repent of our sins. And by so doing, our spirits may once again be cleansed.

Do you remember the Israelites as they were leaving Egypt and bondage? There are many symbolic connotations to their exodus, but one in particular is the circumstance that they found themselves in, when many of the Israelites were bitten by fiery serpents and all they simply had to do was look at a brass serpent on a pole and they would be healed.

That's it! Just look! Just look and you'll be healed. And we know that many could not even do that.

All the Lord wanted them to do is to physically perform something.

As with baptism, the Lord simply wants us to physically perform the ordinance to openly show him and the rest of the world that we are humble enough to do as he asked.

For those of you who are not familiar with the story of Naaman, I will recount this story found in 2 Kings.

Naaman was a very powerful man. He was the captain of the host of the king of Syria. At this time, Syria had overthrown the Israelites.

This captain was stricken with leprosy, and once he heard about the prophet Elisha who could cleanse him of his disease, he quickly took his horses, chariots, and wealth and arrived at the doors of the prophet.

Elisha sent a messenger out to meet Naaman and told Naaman that he needed to "go and wash in Jordan seven times, and thy flesh shall come again to thee and thou shalt be clean."

"Naaman was wroth, and went away, and said, Behold, I thought, He will surely come out to me, and stand, and call on the name of the Lord his God, and strike his hand over the place, and recover the leper. Are not Abana and Parpar, rivers of Damascus, better than all the waters of Israel? may I not wash in them, and be clean? So he turned and went away in a rage."

Naaman was upset for two reasons: Elisha would not communicate with him directly but had a messenger meet and convey the instruction. And Naaman wasn't asked to do something miraculous, just a simple act.

As Naaman was heading back to his home, one of his servants came near, and spake unto him, and said, "My father, if the prophet had bid thee do some great thing, wouldest thou not have done it? How much rather then, when he saith to thee, Wash, and be clean?"

Naaman made the journey to the river Jordan and dipped himself seven times in the river, and "according to the saying of the man of God: and his flesh came again like unto the flesh of a little child, and he was clean."

Naaman saw nothing special in the Israelite water or in the act of immersion. Naaman was not healed by the water or by immersion, but by the power of God.

It is interesting to note that just as Elisha sent a messenger, the Lord sends his messengers to us, whether it be our prophet, or our local church leaders, or the missionaries, or even the whisperings of the Holy Spirit. The Lord will let us know what we need to do to be cleansed.

I testify to you that the Power of God can cleanse the soul.

In closing, I wish to relay these words: As we witness this baptism of Jake, we witness an individual that has chosen and covenanted with the Father that he will follow his Savior and Redeemer's example and take upon himself the name of the Father and the Son and the Holy Ghost, therefore becoming one with them.

As we witness this sacred ordinance, may we picture our Savior as he humbled himself before the Father and witnessed unto the Father that he would be obedient unto him in keeping his commandments.

In the name of Jesus Christ. Amen.`

    location: "Smithers, BC",
    notes: "Also given in Smithers in 2018.",
    body: `A young boy was asked a few days before Christmas Eve, "Could you come to a party on Christmas Eve? We're planning to meet up at the canyon. It will be beautiful. Get a date and join us."

The young man was delighted to be with a group of friends and enthusiastically looked forward to that social event. He even asked a lovely young woman to go with him and she too seemed to be as excited as he was.

As the time approached for him to leave for the party, a subtle uneasiness disturbed his positive feelings.

"What's wrong?" He asked himself. Then reality struck. He did not want to be with his friends on this special night. He wanted to be with his family as he had been for the previous 16 or 17 Christmas Eves.

He hurried to the telephone and called his friend.

"Don, I, er … well, I don't know how to say this, but don't count on me this evening. I'm going to spend Christmas Eve with my family." He hoped and was sure that his friend understood.

He quickly called his date. They agreed to spend time together during the holidays but not on that particular evening.

Suddenly a burden had been lifted. He had made the right decision.

Christmas is for families. It is their love that makes the season so bright. They fill us with gratitude for the Redeemer, who made it possible for us to live with them forever.

And yet, while we enjoy Christmas in the warmth of your families, we should remember that many are not so fortunate.

Homeless men and women walk the streets of our towns, far from family ties. Someone we know has lost a loved one to death this year. Another cannot afford the travel expense to join their family.

Some are too ill to take part in the festivities. For these people, Christmas is not always a "season to be jolly." It can be a time of depression and loneliness.

Surely, these people have a right to ask, "Who needs Christmas?"

We all have complaints about Christmas.

Complaints like the hustle and bustle. The added expenses, especially for those who don't have enough money to get by or those who don't even have jobs.

Complaints of commercialization.

Complaints of the many pagan activities that are done in the name of Christmas which are not even related to the birth of Jesus Christ.

Jesus Christ himself wasn't even born in December.

So, who needs Christmas?

We do! All of us! Because Christmas can bring us closer to the Savior and he is the only source of lasting joy.

We need Christmas because every December millions of people open the Bible to Luke's account of one of the greatest events in history, and we may hear again what the shepherds heard: "For unto you is born this day in the City of David a Savior which is Christ the Lord" (Luke 2:11).

The world was never the same again after the angel spoke those words.

Christ was born, fulfilling centuries of prophecy. And much of that prophecy was borne to his brothers and sisters in the Americas in our Book of Mormon.

We need Christmas because it helps us to be better people, not only in December but in January, June and November, and every month of the year.

Because we need Christmas, we had better understand what it is and what it isn't.

Gifts, holly, mistletoe, and red-nosed reindeer are fun as traditions, but they are not what Christmas is really all about.

Christmas pertains to that glorious moment when the Son of our Father joined the world of imperfect humanity.

It is about his 33 year ministry of teaching mankind how to live, and his journey to the garden and then to the thorns and cross.

It is about a rocky hill where he died that we might live with joy.

It is about a garden tomb promising a New World in which death has no dominion.

It is about his ascension and subsequent visit to the Nephites and Lamanites, his other sheep.

It is about a new life for those who will accept his gift. Christmas is not just about a baby in a manger.

It is about a loving older Brother who came down to be with his brothers and sisters in the world.

It is about the eternal difference that his ministry has made. It is about all the manifestations of his love since that day, including the glorious visions in the Sacred Grove and the Kirtland Temple.

And what about those who are lonely or lost, for whom Christmas is a burden?

Why do they need Christmas? Because, hopefully, we will reach out to them at this season and help to heal their wounds. Perhaps the greatest challenge and opportunity we face at Christmastime is to make Christmas real to people such as these.

I firmly believe that the only way to make Christmas real is to imitate the Master.

We need to develop an avenue to connect, support, and strengthen those people who are lonely; those who are hurt both physically and emotionally; those who are in need of food; and those who are in need of understanding.

Jesus spent his life rescuing us all from ourselves. Shouldn't we rescue others from loneliness and discouragement?

My neighbor lost her husband over the past year. The death of someone close always makes Christmas more difficult. She will need a lot of love over this time from both her family and her neighbors.

It could be quite simple to simply ignore these people and make Christmas no more than a winter holiday or a week-long celebration sitting on our hands and doing nothing.

And let's be sure that our reaching out is not marked with any feeling of superiority.

At Christmastime no gift that we wrap will mean as much as the gift of ourselves.

Several years ago some of the General Authorities were hurrying to leave Church Offices during the Christmas hustle and bustle. Elder Bruce R. McConkie was one of those General Authorities.

Instead of going home like the rest of the General Authorities, he had gone to the LDS Hospital and there had gone from room to room blessing people, holding their hands, telling them that the Savior and others loved them.

And so during that precious time when the rest of the General Authorities felt they needed to be home, he took a few minutes to bring light into those people's lives.

Elder McConkie understood something it takes many of us years to learn, that a simple expression of love can heal and bless the lives of others. So often we are not skilled in expressing love.

Satan does not approve of the kind of openness that it takes to say, "I love you," because it brings happiness to both the giver and the receiver.

The following story is taken from an experience by Elder Hugh W. Pinnock:

Once at a zone missionary conference in Philadelphia, I discussed the importance of expressing love. Later that day a missionary told me, "President, I have never told my father that I love him."

I said, "Elder, pick up that telephone and call your father and let him know you love him." Ordinarily we don't encourage missionaries to call home, but I felt inspired that this young man should.

He said, "I can't. My father works in a steel mill out on the slag pile, and he can't be reached during the day. But I will call him tonight, I promise."

I responded by saying, "Elder, after you call your father, please call me at the mission home. I would like to know what he said."

Late that night the telephone rang. It was my missionary. He said, "President, I did it." I replied, "Tell me about it, elder."

And this is what he said: "Mother picked up the phone. She was worried that something had happened. I assured her that all was well and that I wanted to speak to Dad. She handed the telephone to my father. He was still groggy because he had been asleep for a while, and he said, 'What is it, son?'

"I said, 'Dad, I love you.' He started to cry and handed the telephone back to mother.

"She said, 'What did you tell your father?'

"I told dad that I love him, and I want you to know how much I love and appreciate you."

Well, that missionary had many good days in the mission field, delightful times, but the greatest day of all, I suspect, was the day that he expressed love to his parents.

You can give a wonderful Christmas present just by telling someone you care. Of course, the power to bless others is not in Christmas, but in doing what Christ would have us do.

Christmas can focus our minds on the Savior's mission, and thus help us discover ways in which we can be of use to him. Let us invite him into our lives.

Is there any better way of inviting Christ into our lives than by helping our fellowmen?

You and I can make our Christmas joy filled and meaningful by reaching into the life of another whose heart may be aching, whose body may be tired or filled with disease, or someone who is confused and misdirected. Shouldn't we, who have been blessed with the fullness of the gospel, share our joy? Shouldn't we stop asking, "Who needs Christmas?" and start asking, "Who needs my help?"

I would like to end my talk with this story that demonstrates how wonderful the gift of the Savior is in our lives.

In 1994, two Americans answered an invitation from the Russian Department of Education to teach morals and ethics (based on biblical principles) in the public schools.

They were invited to teach at prisons, businesses, the fire and police departments, and a large orphanage. About 100 boys and girls, who had been abandoned, abused, and left in the care of a government-run program, were in the orphanage.

They relate the following story in their own words:

It was nearing the holiday season, 1994, time for our orphans to hear, for the first time, the traditional story of Christmas. We told them about Mary and Joseph arriving in Bethlehem. Finding no room in the inn, the couple went to a stable, where the baby Jesus was born and placed in a manger. Throughout the story, the children and orphanage staff sat in amazement as they listened. Some sat on the edges of their stools, trying to grasp every word.

Completing the story, we gave the children three small pieces of cardboard to make a crude manger. Each child was given a small paper square, cut from yellow napkins I had brought with me. No colored paper was available in the City.

Following instructions, the children tore the paper and carefully laid strips in the manger for straw. Small squares of flannel, cut from a worn-out nightgown, were used for the baby's blanket. A doll-like baby was cut from the tan felt we had brought from the United States.

The orphans were busy assembling their manger as I walked among them to see if they needed any help. All went well until I got to one table where little Misha sat.

He looked to be about 6 years old and had finished his project. As I looked at the little boy's manger, I was startled to see not one, but two babies in the manger.

Quickly, I called for the translator to ask the lad why there were two babies in the manger.

Crossing his arms in front of him and looking at this completed manger scene, the child began to repeat the story very seriously.

For such a young boy, who had only heard the Christmas story once, he related the happenings accurately, until he came to the part where Mary put the baby Jesus in the manger.

Then Misha started to ad-lib. He made up his own ending to the story as he said, "And when Maria laid the baby in the manger, Jesus looked at me and asked me if I had a place to stay.

"I told him I have no papa and I have no mamma, so I don't have any place to stay. Then Jesus told me I could stay with him. But I told him I couldn't, because I didn't have a gift to give him like everybody else did.

"But I wanted to stay with Jesus so much, so I thought about what I had that maybe I could use for a gift. I thought maybe if I kept him warm, that would be a good gift."

"So I asked Jesus, 'If I keep you warm, will that be a good enough gift?' And Jesus told me, 'If you keep me warm, that will be the best gift anybody ever gave me.' So I got into the manger, and then Jesus looked at me and he told me I could stay with him, for always."

As little Misha finished his story, his eyes brimmed full of tears that splashed down his little cheeks.

Putting his hand over his face, his head dropped to the table and his shoulders shook as he sobbed and sobbed. The little orphan had found someone who would never abandon nor abuse him, someone who would stay with him, for always.

May we always strive to ask ourselves, "Who needs our help? What can I do to reflect the love that I have in my Lord and Savior?" This is my prayer.

In the name of Jesus Christ. Amen.`

    body: `Good Morning Brothers and Sisters.

As you have already heard about the first 5 days of our bike trip, it is my pleasure to speak on our last day on the Queen Charlotte Islands.

Friday morning we got up, ate breakfast, and took down our camp.

It was back onto the bikes. Needless to say, everyone was very excited about this.

It was 51 km to Charlotte City.

We stopped for a break at St. Mary's Spring. Legend has it, that those who drink of the spring will return back to the island. I for one took a drink and look forward to returning to the island.

At this point which was about half ways to Charlotte City, Bro. Mitchell and I traded off driving and biking. He began to ride the bike and I drove.

We stopped at the Balancing Rock. It is a big rock about the half of the size of this room balanced on a small point on its underside. It was quite interesting.

One more stretch to Charlotte City. It was amazing how excited everyone was to get back on their bikes.

During this stretch, Bro. Mitchell's bike got a flat tire and had to walk for a while.

Eventually, I picked him up.

While in Charlotte City, we showered and relaxed at the Golyn's place. Bro. and Sis. Golyn had lived in Terrace and recently moved to the Charlottes. Sis. Golyn made us dinner using two of the Cohoes that we had caught on Wednesday.

After dinner, we planned a few different games, and then it set in … we had to ride our bikes again to the ferry. We were overjoyed with the thought.

Once we got on the ferry, we watched a movie and then bunked down for the night. I had the great idea that wouldn't it be fun if we just slept right on the deck of the ship?

Well, we did... At least until it started to rain. Some scrabbled into the TV room and some of us braved the outside but under cover.

Morning arrived and oh, oh … again we would have to mount our bikes and ride to the church. It was inspiring to know that the riding was going to end.

It was during these last few hours that we experienced the only rain during our trip.

We were finally home after a few hours' drive.

So there you have it. That was our bike trip to the Queen Charlotte Islands. It was a great experience.

This experience could only happen if it wasn't for the Young Men's Program of the Church of Jesus Christ of Latter-Day Saints.

For the remainder of my talk today, I would like to speak about the Young Men's Program.

The Aaronic Priesthood is the basic organization for the young men of the Church, ages twelve through eighteen.

The Young Men's organization is an auxiliary to the priesthood and includes scouting and other programs designed to help with the full development of young male members of the Church, including spiritual, social, and physical aspects.

When you look at our bike trip, can you recognize the fulfillment of the spiritual, social, and physical aspects?

Spiritual — On every campout or trip that I am involved with, it is imperative that all young men bring their scriptures for the evening scripture reading or devotionals.

What better opportunities does one have to read the scriptures, bear testimony and feel of the spirit than this when others of your own peer group are participating in the same spiritual exercise?

Social — This trip was able to get many young men throughout this district get together and develop relationships that may last for eternity. There was one young man that I noticed, who broke through a social wall he has had in past district activities.

Physical — For those of you who have tried to ride a bicycle 176km, with 121km in one day, you will know that there is a lot of physical development.

The Young Men's program's purpose is to help each young man come to Christ through conversion of the gospel of Jesus Christ; understand the priesthood he holds, learn to give service to others, including missionary service; prepare to advance to the Melchizedek Priesthood; and live in such a way that will qualify him to enter the temple and become a worthy husband and father.

The Young Men's organization serves hundreds of thousands of young men in most parts of the world.

Its literature is published in many languages and is adapted for use in various cultures. The organization is under the direction of the bishopric or branch presidency in wards and branches, with assistance from a Young Men's Presidency.

The Young Men's Program is divided up into the different priesthood groups, determined by age.

12 and 13 year olds constitute the deacon's quorum.

14 and 15 year olds constitute the teacher's quorum.

And 16 and 17 year olds constitute the priest quorum.

Locally, because of our small numbers, all of the young men meet together and do activities together while still maintaining each young man's particular priesthood office.

On Sundays the quorums meet for lessons on gospel subjects. Class lessons include and are not limited to the Atonement, Charity (the pure love of Christ), brotherhood, respecting family and friends, magnifying priesthood offices, and many other important gospel principles.

Usually, we meet one evening a week, where we meet for activities such as sports, service projects, or cultural events, either as participants or spectators. All of these activities are designed to help the young men make a significant contribution to their communities and each other.

Once a month we meet with the young women for what we call a joint activity. These joint activities are designed to help young men and young women learn to work together, to respect one another, and to develop social and communication skills that will help them regard one another as individuals.

In addition to the traditional activities, they solve problems together and overcome stereotypical gender images, while maintaining strong, independent gender identities.

Individuality, creativity, teamwork, a sense of belonging, and unity are stressed.

In the decades since its founding, the Young Men's organization has undergone many changes in structure, format, frequency of meeting, and leadership, but it has, for the most part, maintained its original purpose and direction: to provide for "the establishment in the youth of individual testimony of the truth."

Associations for the spiritual and cultural growth of the youth began in the early days of the Church.

In February 1843, the Prophet Joseph Smith authorized the formation of a Young Gentlemen's and Young Ladies' Relief Society.

And in 1854, Elder Lorenzo Snow organized the Polysophical Society.

In 1875, President Brigham Young, aware that these organizations were individually good but lacked unity and structure, organized the young men into one association, the Young Men's Mutual Improvement Association (YMMIA).

President Young instructed the YMMIA leaders to help the young men develop the gifts within them, stand up and speak, and bear testimony.

Until around 1900 the YMMIA met separately from the Young Women's Mutual Improvement Association. At that time they were joined to form the Mutual Improvement Association (MIA) as another step in strengthening youth programs.

In 1911 the Church adopted the Scouting Program for all of the young men from the ages of 12 through 18. On May 21, 1913 the church was invited to be affiliated with the Boy Scouts of America and were issued a national charter.

By the 1950s the young men's program included sports, dance, drama, music and public speaking.

Athletics had become a major part of the program. They had local stake tournaments, and the winners advanced to bigger and wider ranges of tournaments all the way up to the all-Church finals held annually in Salt Lake City. These tournaments were discontinued in the early 1970s.

Early in the 1970s the church organized the Aaronic Priesthood – MIA for young men ages twelve through seventeen. At this time the MIA became part of the priesthood and was no longer an auxiliary.

In June 1974 the name Aaronic Priesthood – MIA was shortened to Aaronic Priesthood.

In May 1977 the name was changed to Young Men and in October 1979 the Church announced that the Young Men general presidency would be comprised of three General Authorities from the First Quorum of the Seventy.

So there you have it. That is the Young Men's Program and how it developed into the program it is today.

From the Young Gentlemen and Young Ladies Relief Society envisioned by the Prophet Joseph Smith to the Young Men's program of today, divinely led through our prophet Gordon B. Hinckley.

I have been very fortunate to be called to serve as the Young Men's President within this branch and district.

I have served in the Young Men's for 10 of the last 13 years since my return from my mission.

I have seen many young men grow up and serve missions. Some are now married in the temple and are rearing children in the gospel.

I know that the Young Men's Program affects lives.

Here is a part of a letter from a young man, which I was associated with in Prince George. He is currently serving a mission in the Philippines.

Read.

In another letter he says this about the influences of his days as a youth….

Read.

Another young man which I was associated with in Prince George who is currently serving a mission in Honduras wrote: "You are a blessing in my life, have been, and will be forever. You touched my life at an important age."

As I said before, I have been fortunate to serve with the young men of this church. I am appreciative of the experiences and friendships that I make.

I will always look back at our trip to the Queen Charlotte Islands with fondness.

How can one forget Spencer's quick ride into the ditch? The double header for coho within 30 seconds of fishing? The scare of Red Tide? The crab hunting? The strong influence of peer pressure the young men can exert on me to jump off a pier or extend my physical limitations to the limits?

I want the young men to know that I love them. Not in a freakish way but as Christ does. I respect the way they try to do that which is right. To stand for truth and righteousness.

I know that this program is divinely inspired. I believe strongly in its mission.

To help each young man develop a testimony of their Savior Jesus Christ and be converted; to magnify their priesthood callings; to give meaningful service; to prepare to receive the Melchizedek Priesthood; to prepare and serve an honorable full-time mission; and to help live in such a way that will qualify him to enter the temple and become a worthy husband and father.

It is my prayer that all young men and their parents endeavor to support the Young Men's Program. That they actively participate in this program.

And by so doing, the blessing associated to the mission of the Young Men's Program will be showered upon your heads, your families' heads, and your future families' heads.

I testify in the name of Jesus Christ, Amen.`

    section: "Church Talks",
    title: "Enduring to the End",
    date: "July 23, 2000",
    location: "Smithers, BC",
    notes: "",
    body: `Good morning Brothers and Sisters.

I would like everyone to think about a conflict, opposition, or problem that you are now facing.

Hopefully through this talk, you will be able to overcome the problem that you are thinking about.

We can better understand why we have suffering and death if we understand the nature and purpose of mortality.

The scriptures tell us why we have suffering and problems.

We are all quite familiar about the fall of Adam.

The fall of Adam brought into the world the possibility for opposition, or suffering and adversity.

Let us read in 2 Nephi 2:11, 22–24.

"For it must needs be, that there is an opposition in all things. If not so, my firstborn in the wilderness, righteousness could not be brought to pass, neither wickedness, neither holiness nor misery, neither good nor bad. Wherefore, all things must needs be a compound in one; wherefore, if it should be one body it must needs remain as dead, having no life neither death, nor corruption nor incorruption, happiness nor misery, neither sense nor insensibility.

"And now, behold, if Adam had not transgressed he would not have fallen, but he would have remained in the garden of Eden. And all things which were created must have remained in the same state in which they were after they were created; and they must have remained forever, and had no end. And they would have had no children; wherefore they would have remained in a state of innocence, having no joy, for they knew no misery; doing no good, for they knew no sin. But behold, all things have been done in the wisdom of him who knoweth all things."

Lehi gives us the reasons for the need of opposition in our lives. He tells us that without opposition there would not be righteousness or wickedness, holiness or misery, good or bad.

Back to 2 Nephi 2, this time verses 15 and 16.

"And to bring about his eternal purposes in the end of man, after he had created our first parents, and the beasts of the field and the fowls of the air, and in fine, all things which are created, it must needs be that there was an opposition; even the forbidden fruit in opposition to the tree of life; the one being sweet and the other bitter. Wherefore, the Lord God gave unto man that he should act for himself. Wherefore, man could not act for himself save it should be that he was enticed by the one or the other."

There was opposition in the garden … the tree of life and the tree of knowledge. Why?

The answer is written at the beginning of verse 15 … To bring about his eternal purposes. He gave us agency. Think about agency.

What does opposition have to do with the principle of agency?

Without opposition, choice would not be possible; without choice, there would be no righteousness. Righteousness requires having a choice between good and evil and choosing the good.

We are aware of the sufferings that the early church leaders endured for the sake of their faith.

We are aware of the experiences that the Prophet Joseph Smith related about the time in Liberty Jail.

We are also aware of the reasons for this as discussed in Doctrine and Covenants Section 122 verse 7 where the Word of the Lord declared "know thou, my son, that all these things shall give thee experience, and shall be for thy good."

President Gordon B. Hinckley relates the following story:

Mary Goble Pay was twelve years old and living in Brighton, England, when the missionaries taught her family the gospel. The year was 1855, and all Mary's mother could think of was to join the other Saints in Utah. And so the following spring Mary's mother, father, and four younger brothers and sisters boarded the ship Horizon for America.

By the time they could get outfitted and started on the trail, it was the middle of July. Winter storms came early that year, and the Gobles spent five terrible months on the trail between St. Louis and Salt Lake City.

Mary wrote: "We had to keep close to [the handcart companies] to help them if we could. We began to get short of food and our cattle gave out."

Many died. Among them Mary's two-year-old sister, her five-year-old brother, and Edith, a baby sister born on the trail and buried in Wyoming.

And then when all seemed lost, the stranded Saints were miraculously rescued by men and teams sent by Brigham Young. But even as the handcart companies crossed the final mountain into the valley, Mary's mother died.

Mary describes the scene: "We arrived in Salt Lake City nine o'clock at night the 11th of December 1856. Three out of four who were living were frozen. My mother was dead in the wagon. … [We were] taken to a home … and the sisters brought us plenty of food. … Early next morning Bro. Brigham Young and a doctor came. … When Bro. Young came in he shook hands with us all. When he saw our condition—our feet frozen and our mother dead—tears rolled down his cheeks."

Mary Goble Pay went on to raise a large and wonderful family, some of whom became great leaders in the Church.

Those who persecuted and opposed the Saints had their agency as well as the Saints who embraced and defended the gospel.

If we endure opposition well, often the most valuable gospel learning experiences come to us through trials and difficulties.

Spencer W. Kimball said:

"The basic Gospel law is Free Agency. To force us to be careful or righteousness would be to nullify that fundamental law and growth would be impossible. Should we be protected always from hardship, pain, suffering, sacrifice or labor? Should the Lord protect the righteous? Should he immediately punish the wicked? If growth comes from fun and ease and aimless irresponsibility, then why should we ever exert ourselves to work or learn or overcome? … Is there not wisdom in His giving us trials that we might rise above them, responsibilities that we might achieve, work to harden our muscles, sorrows to try our souls?"

Can spiritual strength result from trials in our lives? Yes.

Can experiencing illness or injury give us compassion? Yes.

Can personal suffering help strengthen our love for the Savior? Yes it can.

In 1974, President Ezra Taft Benson gave a talk in General Conference that deals with twelve ways that we can overcome sorrow, disappointment, and depression. Those twelve ways are:

Repentance – Sin creates disharmony with God and is depressing to the spirit. Every law kept brings a particular blessing. Every law broken brings a particular blight. Those who are heavy laden with despair should come unto the Lord, for his yoke is easy and his burden is light.

Prayer – Prayer in hour of need is a great boon. From simple trials to our Gethsemanes, prayer can put us in touch with God, our greatest source of comfort and counsel.

Service – To lose yourself in righteous service to others can lift others, can lift your sights and get your mind off personal problems, or at least put them in proper focus. When you find yourselves a little gloomy, said President Lorenzo Snow, look around you and find somebody that is in a worse plight than yourself; go to him and find out what the trouble is, then try to remove it, with the wisdom which the Lord bestows upon you; and the first thing you know, your gloom is gone, you feel light, the Spirit of the Lord is upon you and everything seems illuminated.

Work – Work is our blessing, not our doom. We should work at taking care of the spiritual, mental, social, and physical needs of ourselves and those whom we are charged to help.

Health – The condition of the physical body can affect the spirit. That's why the Lord gave us the Word of Wisdom. Retire to bed early; food can affect the mind; rest and physical exercise are essential.

Reading (uplifting books) – Many a man in his hour of trial has turned to the Book of Mormon and been enlightened, enlivened, and comforted. Uplifting books is special food for the soul.

Blessings – Whether it be a personal blessing, or the sacrament, in the priesthood in action.

Fasting – Periodic fasting can help clear up the mind and strengthen the body and the spirit. Couple it with prayer.

Friends – The fellowship of true friends, who can hear you out, share your joys, help carry your burdens, and correctly counsel you is priceless.

Inspiring Music – may fill the soul with heavenly thoughts, move one to righteous action, or speak peace to the soul.

Endurance – There are times when you simply have to righteously hang on and outlast the devil until his depressive spirit leaves you. While you are going through your trial, you can recall your past victories and count the blessings that you do have with a sure hope of greater ones to follow if you are faithful.

Goals – Every accountable child of God needs to set goals, short and long range goals. A man who is pressing forward to accomplish worthy goals can soon put despondency under his feet, and once a goal is accomplished, others can be set up.

By using one or more of these methods, we can overcome sorrow, disappointment, despair, or discouragement.

We can learn to overcome opposition.

Nephi predicted the conditions of the last days.

One of the great messages that the Book of Mormon has for our day is that prosperity often begets wickedness.

Wickedness is a greater tragedy than death, pain, suffering, or any other condition of mortal life.

Remaining humble and righteous in the midst of prosperity can be one of the greatest challenges in enduring to the end.

Through prayer and righteous living we come close to the Lord so that when difficult experiences arise we will have the strength to face them.

We must always be watchful that the prosperity of our day does not cause us to forget our relationship with the Lord and the things in life that really matter.

I challenge you to use one or more of the 12 ways that President Ezra Taft Benson gave to help overcome the problem or conflict that you are currently faced with.

I challenge you to set a goal for yourself to live in the celestial kingdom and center your life on that goal.

I pray in the name of Jesus Christ. Amen.`

function renderInline(text){
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\*(.+?)\*/g, "<em>$1</em>");
}

function renderBody(body){
  return body
    .split(/\n\s*\n/)
    .map(p => `<p>${renderInline(p.trim()).replace(/\n/g, "<br>")}</p>`)
    .join("");
}

function renderMedia(media){
  if (!media) return "";
  if (media.type === "pdf") {
    return `<div class="media-pdf">
      <iframe src="${media.src}" title="PDF viewer" loading="lazy"></iframe>
      <p class="media-fallback"><a href="${media.src}" target="_blank" rel="noopener">Open PDF in a new tab ↗</a></p>
    </div>`;
  }
  if (media.type === "video") {
    return `<div class="media-video">
      <video controls preload="metadata" src="${media.src}"></video>
      <p class="media-video-fallback" hidden>This video isn't hosted here yet — check back soon.</p>
    </div>`;
  }
  if (media.type === "video-hub") {
    return media.videos.map(v => `
      <div class="video-hub-item">
        <h2 class="video-hub-title">${v.title}</h2>
        ${v.subtitle ? `<p class="video-hub-subtitle">${v.subtitle}</p>` : ""}
        <div class="media-video">
          <video controls preload="metadata" src="${v.src}"></video>
          <p class="media-video-fallback" hidden>This video isn't hosted here yet — check back soon.</p>
        </div>
      </div>
    `).join("");
  }
  if (media.type === "gallery") {
    return media.groups.map(group => `
      ${group.label ? `<p class="gallery-group-label">${group.label}</p>` : ""}
      <div class="media-gallery">
        ${group.images.map(img => `
          <button type="button" class="gallery-item" data-src="${img.src}" data-caption="${img.caption.replace(/"/g, "&quot;")}">
            <img src="${img.src}" alt="${img.caption.replace(/"/g, "&quot;")}" loading="lazy">
            ${img.caption ? `<span class="gallery-item-caption">${img.caption}</span>` : ""}
          </button>
        `).join("")}
      </div>
    `).join("");
  }
  return "";
}

function renderTalk(talk){
  const index = talks.findIndex(t => t.id === talk.id);
  const prev = talks[index - 1];
  const next = talks[index + 1];
  const metaParts = [talk.date, talk.location].filter(Boolean);
  const page = document.getElementById("page");
  page.classList.remove("page-cover");
  page.innerHTML = `
    <p class="talk-eyebrow">${talk.section}</p>
    <h1 class="talk-title">${talk.title}</h1>
    ${talk.subtitle ? `<p class="talk-subtitle">${talk.subtitle}</p>` : ""}
    ${metaParts.length ? `<p class="talk-meta">${metaParts.join(' <span class="dot">•</span> ')}</p>` : ""}
    ${talk.notes ? `<p class="talk-notes">Notes: ${talk.notes}</p>` : ""}
    <hr class="rule">
    <div class="talk-body">${talk.body ? renderBody(talk.body) : ""}${renderMedia(talk.media)}</div>
    <nav class="talk-nav" aria-label="Talk navigation">
      <div class="nav-slot">${prev
        ? `<button class="nav-btn" data-id="${prev.id}"><span class="nav-label">Previous</span><span class="nav-title">${prev.title}</span></button>`
        : ``}</div>
      <div class="nav-slot nav-slot-next">${next
        ? `<button class="nav-btn" data-id="${next.id}"><span class="nav-label">Next</span><span class="nav-title">${next.title}</span></button>`
        : ``}</div>
    </nav>
  `;
  page.querySelectorAll(".nav-btn").forEach(btn => {
    btn.addEventListener("click", () => selectTalk(btn.getAttribute("data-id")));
  });
  const galleryItems = page.querySelectorAll(".gallery-item");
  galleryItems.forEach((item, i) => {
    item.addEventListener("click", () => openLightbox(galleryItems, i));
  });
  page.querySelectorAll(".media-video video").forEach(video => {
    video.addEventListener("error", () => {
      video.hidden = true;
      const fallback = video.nextElementSibling;
      if (fallback && fallback.classList.contains("media-video-fallback")) fallback.hidden = false;
    });
  });
  page.focus();
}

function buildTocInto(listId, section){
  const list = document.getElementById(listId);
  const items = talks.filter(t => t.section === section);
  list.innerHTML = items.map(t => `
    <li class="toc-item" data-id="${t.id}">
      <button class="toc-link">${t.navTitle || t.title}</button>
    </li>
  `).join("");

  list.querySelectorAll(".toc-item").forEach(item => {
    item.querySelector(".toc-link").addEventListener("click", () => {
      selectTalk(item.getAttribute("data-id"));
      closeMobileMenu();
    });
  });
}

const TOC_GROUPS = {
  "Church Talks":     ["tocCollapseMain", "tocCollapseMobileMain"],
  "Christmas Letters":["tocCollapseC", "tocCollapseMobileC"]
};

function setTocSectionOpen(collapseId, open){
  const collapse = document.getElementById(collapseId);
  if (!collapse) return;
  collapse.classList.toggle("open", open);
  const toggle = document.querySelector(`.toc-toggle[aria-controls="${collapseId}"]`);
  if (toggle) toggle.setAttribute("aria-expanded", String(open));
}

function openTocSectionFor(section){
  (TOC_GROUPS[section] || []).forEach(collapseId => setTocSectionOpen(collapseId, true));
}

document.querySelectorAll(".toc-toggle").forEach(btn => {
  btn.addEventListener("click", () => {
    const collapseId = btn.getAttribute("aria-controls");
    const isOpen = document.getElementById(collapseId).classList.contains("open");
    setTocSectionOpen(collapseId, !isOpen);
  });
});

function selectTalk(id, { openSection = true } = {}){
  const talk = talks.find(t => t.id === id);
  if (!talk) return;
  document.querySelectorAll(".toc-item").forEach(el => {
    el.classList.toggle("active", el.getAttribute("data-id") === id);
  });
  if (openSection) openTocSectionFor(talk.section);
  renderTalk(talk);
  history.replaceState(null, "", "#" + id);
}

let lightboxItems = [];
let lightboxIndex = 0;

function openLightbox(items, index){
  lightboxItems = items;
  lightboxIndex = index;
  showLightboxImage();
  document.getElementById("lightboxOverlay").classList.add("open");
}

function showLightboxImage(){
  const item = lightboxItems[lightboxIndex];
  const src = item.getAttribute("data-src");
  const caption = item.getAttribute("data-caption") || "";
  const img = document.getElementById("lightboxImg");
  img.src = src;
  img.alt = caption;
  document.getElementById("lightboxCaption").textContent = caption;
  const multiple = lightboxItems.length > 1;
  document.getElementById("lightboxPrev").style.display = multiple ? "flex" : "none";
  document.getElementById("lightboxNext").style.display = multiple ? "flex" : "none";
}

function closeLightbox(){
  document.getElementById("lightboxOverlay").classList.remove("open");
  document.getElementById("lightboxImg").src = "";
}

function showPrevLightboxImage(){
  if (!lightboxItems.length) return;
  lightboxIndex = (lightboxIndex - 1 + lightboxItems.length) % lightboxItems.length;
  showLightboxImage();
}

function showNextLightboxImage(){
  if (!lightboxItems.length) return;
  lightboxIndex = (lightboxIndex + 1) % lightboxItems.length;
  showLightboxImage();
}

document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
document.getElementById("lightboxPrev").addEventListener("click", showPrevLightboxImage);
document.getElementById("lightboxNext").addEventListener("click", showNextLightboxImage);
document.getElementById("lightboxOverlay").addEventListener("click", (e) => {
  if (e.target.id === "lightboxOverlay") closeLightbox();
});
document.addEventListener("keydown", (e) => {
  const overlay = document.getElementById("lightboxOverlay");
  if (!overlay.classList.contains("open")) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowLeft") showPrevLightboxImage();
  if (e.key === "ArrowRight") showNextLightboxImage();
});

function openMobileMenu(){
  document.getElementById("mobileMenuOverlay").classList.add("open");
  document.getElementById("mobileMenuBtn").setAttribute("aria-expanded", "true");
}

function closeMobileMenu(){
  document.getElementById("mobileMenuOverlay").classList.remove("open");
  document.getElementById("mobileMenuBtn").setAttribute("aria-expanded", "false");
}

document.getElementById("mobileMenuBtn").addEventListener("click", openMobileMenu);
document.getElementById("mobileMenuClose").addEventListener("click", closeMobileMenu);

const COVER_PREVIEW_COUNT = 6;

function renderCoverEntry(talk, dateLabel, extra){
  return `<li${extra ? ' class="extra-entry" hidden' : ""}>
    <a href="#${talk.id}" class="cover-link" data-id="${talk.id}">
      <span class="entry-title">${talk.navTitle || talk.title}</span>
      <span class="entry-leader" aria-hidden="true"></span>
      <span class="entry-date">${dateLabel}</span>
    </a>
  </li>`;
}

function renderCoverSection(items, dateFn, listId){
  const preview = items.slice(0, COVER_PREVIEW_COUNT).map(t => renderCoverEntry(t, dateFn(t), false)).join("");
  const rest = items.slice(COVER_PREVIEW_COUNT);
  const restHTML = rest.map(t => renderCoverEntry(t, dateFn(t), true)).join("");
  const showAllHTML = rest.length ? `<button class="show-all-toggle" type="button" data-list="${listId}">Show all</button>` : "";
  return { listHTML: preview + restHTML, showAllHTML };
}

function renderCover(){
  const page = document.getElementById("page");
  page.classList.add("page-cover");

  const churchTalks = renderCoverSection(
    talks.filter(t => t.section === "Church Talks"),
    t => t.date || "",
    "coverChurchTalksList"
  );

  const christmasLetters = renderCoverSection(
    talks.filter(t => t.section === "Christmas Letters"),
    () => "PDF",
    "coverChristmasList"
  );

  const moreHTML = talks
    .filter(t => t.section === "More Stuff")
    .map(t => renderCoverEntry(t, t.media && t.media.type === "gallery" ? "Gallery" : t.media && t.media.type === "video-hub" ? "Videos" : "", false))
    .join("");

  page.innerHTML = `
    <div class="titlepage">
      <img class="titlepage-portrait" src="/Photo Gallery/Profile Image.png" alt="Dana Gorbahn">
      <h1 class="titlepage-title">The Plates of Dana</h1>
      <p class="titlepage-desc">Church Talks, Christmas Letters, and More from Dana Gorbahn.</p>
      <hr class="titlepage-rule">
    </div>

    <p class="contents-label">Contents</p>

    <div class="contents-section">
      <p class="contents-section-head">⛪ Church Talks</p>
      <hr class="contents-section-rule">
      <ul class="talks-list" id="coverChurchTalksList">${churchTalks.listHTML}</ul>
      ${churchTalks.showAllHTML}
    </div>

    <div class="contents-section">
      <p class="contents-section-head">🎄 Christmas Letters</p>
      <hr class="contents-section-rule">
      <ul class="years-list" id="coverChristmasList">${christmasLetters.listHTML}</ul>
      ${christmasLetters.showAllHTML}
    </div>

    <div class="contents-section">
      <p class="contents-section-head">More Stuff</p>
      <hr class="contents-section-rule">
      <ul class="more-list">${moreHTML}</ul>
    </div>
  `;

  page.querySelectorAll(".cover-link").forEach(a => {
    a.addEventListener("click", e => {
      e.preventDefault();
      selectTalk(a.getAttribute("data-id"));
    });
  });

  page.querySelectorAll(".show-all-toggle").forEach(btn => {
    btn.addEventListener("click", () => {
      const list = document.getElementById(btn.getAttribute("data-list"));
      const extraItems = list.querySelectorAll(".extra-entry");
      const willShow = extraItems.length > 0 && extraItems[0].hidden;
      extraItems.forEach(li => { li.hidden = !willShow; });
      btn.textContent = willShow ? "Show less" : "Show all";
    });
  });

  document.querySelectorAll(".toc-item").forEach(el => el.classList.remove("active"));
  history.replaceState(null, "", location.pathname + location.search);
}

function showCover(){
  renderCover();
  closeMobileMenu();
}

document.getElementById("sidebarProfileImg").addEventListener("click", showCover);
document.getElementById("sidebarBookTitle").addEventListener("click", showCover);
document.getElementById("mobileHeaderTitle").addEventListener("click", showCover);
document.querySelector(".mobile-menu-title-group").addEventListener("click", showCover);

buildTocInto("tocListMain", "Church Talks");
buildTocInto("tocListC", "Christmas Letters");
buildTocInto("tocListD", "More Stuff");
buildTocInto("tocListMobileMain", "Church Talks");
buildTocInto("tocListMobileC", "Christmas Letters");
buildTocInto("tocListMobileD", "More Stuff");
const startId = (location.hash || "").replace("#", "");
if (startId && talks.some(t => t.id === startId)) {
  selectTalk(startId, { openSection: false });
} else {
  renderCover();
}
</script>

</body>
</html>
