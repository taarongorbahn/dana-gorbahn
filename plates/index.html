  {
    id: "easter-2011",
    section: "Church Talks",
    title: "Easter 2011",
    date: "April 17, 2011",
    location: "Terrace, BC",
    notes: "Also given in Smithers on April 17, 2010.",
    body: `Good Morning Brothers and Sisters.

George Burns has given many preachers sound advice to a successful talk, he said: “The secret of a good sermon is to have a good beginning and a good ending; and to have the two as close together as possible.”

As we approach the celebration of one of our history’s most important events, I wish to take this opportunity to touch upon its significance and importance.

The events of our Easter celebrations has developed in me a great faith; a great love; and a great testimony in our Saviour and Redeemer,  the Son of God, the Prince of Peace, the Master over death and hell, even Jesus Christ, our Lord.

The Prophet Joseph Smith taught, “The fundamental principles of our religion are the testimony of the Apostles and Prophets, concerning Jesus Christ, that He died, was buried, and rose again the third day, and ascended into heaven; and all other things which pertain to our religion are only appendages to it.”

These fundamental principles are grounded in the Atonement of Jesus Christ.

The word Atonement “describes the setting to become ‘at one’ of that which one has been separated from”; which in our case, makes us at one with God.

Sin and the loss of our physical body, is the cause of our separation, and therefore one of the purposes of atonement is to correct or overcome the consequences of sin and the reuniting of the body and spirit.

What does the Atonement mean to you and to me? For me, it means everything. As Jacob explained, we can “be reconciled unto [the Father] through the atonement of Christ, his Only Begotten Son” (Jacob 4:11).

This means that we can repent, and come into full harmony and complete acceptance with Him.

Christ has borne the sins, griefs, sorrows, and … pains of every man, woman, and child

Only a God could do what He did.

This atonement, from which I speak, is available for all of us to enjoy and partake.  It is available for us to have not only immortality, but most importantly to have Eternal Life.

Immortality is different than Eternal Life.  Eternal is another word given for God; therefore, Eternal life is in reality, God’s Life.

The Saviour declared to his servant Moses, “This is my work and my glory, to bring to pass the immortality and eternal life of man.”

That was Christ’s purpose for coming to this earth, when he was born in a manger.  To grow in stature and in faith, to dedicate His life to the work of his Father above.

He called His apostles.  He walked the dusty roads of Israel to share knowledge of Him and His father.  He performed miracles that healed the sick and the lame.

He organized His church.  He showed us how we should live our lives and how we should treat one another.

But all of those are secondary to the great event of His sacrifice in the Garden and on the cross.

He gave us the gift of Eternal Life.  It is for us to grab hold and be saved through that extraordinary offering.

When I was a Young Men leader in Prince George, I took some young men to the Morice River to go steelhead fishing.

Some of the young men wanted to fish on the other side of the river.  I instructed and gave allowances to the older young men to cross the river upstream at a safer crossing.

They proceeded with another younger youth right behind.  Fortunately, the young men were successful in their passage across the river to the other side.

We spent a nice afternoon fishing and talking and when it was time for the young men to return over to our side of the river, I instructed them to go back to the safe crossing;  but the one young man decided that it would be quicker and easier to cross at the point of which we were at.

As I watched him cross I intently discerned that he was in trouble.  As he waded across, I could tell that it was over his head and that the current had caught him and was sweeping him downstream.

I ran along the bank of the opposite side and as I did, I picked up a stick lying on the bank of the river.

I entered the river and waded as closely as I could to him as he was being swept downstream, with him gasping for air as his head moved up and down, in and out of the water.

He was in full panic mode.  When I got close enough to him, I reached out with the stick.  He seized hold of the stick that was offered to him.

At the second that he grasped on to that stick, his fear and fright disappeared.  I pulled him to the shore and he was well.

One might say that I was his saviour, but he too became his own saviour.  If he did not grab hold to the stick, he would not have been saved.

As the Saviour extends His atonement towards us, we too must be like that young man and hold to that offering that brings not only peace, but life, Eternal Life.

Among all the facts of mortality, none is so certain as its end. Death comes to all; it may come when we are both young and old.

It comes in many ways; through results of accident or disease; or through natural causes; but there is no doubt that it will come.

We have all paused, at some time in our lives, for a moment and contemplated about what lies beyond the veil which separates the seen from the unseen.

Centuries ago the man Job, so blessed with every material gift, only to find himself afflicted by all that can take place upon a human being; sat with his companions and uttered this timeless, ageless question, “If a man die, shall he live again?”

During this coming Easter event, please consider Job’s question—“If a man die, shall he live again?”

And may the words of the prophets that have declared truth to us through spoken or written word, be a powerful beacon of truth to you.

We were created to receive intelligence; a brain, a mind, and a soul. With these attributes, we were given the capacity for faith and hope, for inspiration and ambition.

We know that our purpose is to gain a physical body, to overcome trials, and to prove that we would keep the commandments of God.

Our Father knew that because of the nature of mortality, we would be tempted, we would sin, and we would fall short.

In order for us to have every chance of success, He provided a Saviour, who would suffer and die for us. Not only would He atone for our sins, but as a part of that Atonement, He would also overcome the physical death to which we have been subjected to, because of the Fall of Adam.

Thus, more than 2,000 years ago, Christ, our Saviour, was born to mortal life in a stable in Bethlehem. The long-foretold Messiah had come.

As the mortal mission of the Saviour of the world drew to its close. A last supper with His Apostles took place in an upper room. Ahead lay Gethsemane and Calvary’s cross.

No mere mortal can conceive the full significance of what Christ did for us in Gethsemane. He Himself later described the experience: “[The] suffering caused myself, even God, the greatest of all, to tremble because of pain, and to bleed at every pore, and to suffer both body and spirit.”

Following the agony of Gethsemane, now drained of strength, He was seized by rough, crude hands and taken before a number of religious and political leaders of His time.

He was accused and cursed. Vicious blows further weakened His pain-racked body. Blood ran down His face as a cruel crown fashioned of sharp thorns was forced onto His head, piercing His brow.

And then the cries of the angry mob shouted: “Crucify him, crucify him.”

He was scourged with a whip into whose multiple leather strands sharp metals and bones were woven.

Rising from the cruelty of the scourge, with stumbling steps He carried His own cross until He could go no farther.

Finally, on a hill called Calvary, while helpless followers looked on, His wounded body was nailed to a cross. One in each hand, another in each wrist, and yet another in his feet.

He was mocked and cursed. And yet He cried out, “Father, forgive them; for they know not what they do.”

The agonizing hours passed as His life faded. And finally, from His parched lips came the words, “Father, into thy hands I commend my spirit: and having said thus, he gave up the ghost.”

The earth shook as His spirit passed. The centurion who had seen it all declared in solemnity, “Truly this was the Son of God” (Matt. 27:54).

Our elder brother, our Lord, our Saviour, could have turned back. But He did not. He permitted that these things occur so that all things might be saved.

His lifeless body was gently placed in a borrowed tomb.

And three days later, when the grieving Mary Magdalene and the other Mary approached the tomb to care for the body of their Lord. An angel spoke:

“Why seek ye the living among the dead?  “He is not here, but is risen.”

Our Saviour lived again. The most glorious, comforting, and reassuring of all events of human history had taken place—the victory over death.

The pain and agony of Gethsemane and Calvary had been wiped away. The salvation of mankind had been secured.

In the empty tomb, on that first Easter morning was the answer to Job’s question, “If a man die, shall he live again?”

I give thanks to my Lord.  I love Him.

I testify and declare; If a man die, he shall live again.

In the name of Jesus Christ. Amen.`

    id: "learning-to-be-content-shannon",
    section: "Church Talks",
    title: "Learning to be Content",
    date: "March 27, 2011",
    location: "Smithers, BC",
    notes: "Written for Shannon",
    body: `Contentment is not a gift to be received but rather a lesson to be learned. Paul makes this clear in Philippians 4:11 where he says, “In whatsoever state I am in, I have learned to be content.” Notice he didn’t say, “In whatsoever state I am in, God gives me contentment.” Contentment is a spiritual discipline to be learned. It is a product of resolving the struggles between what we want to have and what we know God wants for us.

Paul reminded Timothy, for example that we brought nothing into the world and will take nothing out. Whatever we have accumulated between our birth and our death stays here. We leave our riches here; but we take our relationships with us. Our relationships are eternal.

The difficulty comes in focusing on the eternal more than on the temporal. Distinguishing between these two is the first lesson of one who desires contentment.

When you find a contented person, you are going to find someone who is grateful and thankful. Today so many people feel cheated. Many people are ungrateful for what they have and envy what others have. Some see life as being unfair and discontentment is the price to pay for this attitude. They do not see things the way a content person does. When you find a contented person you are going to find someone who thinking of life in terms of what they have and who they are. Contentment is one of the benefits that come to a person who is thankful. When you are discontented you are ungrateful for what you have and you are not content being who you are.  You are a very unhappy person, and are constantly looking for someone who can make you content.

If you want to avoid that kind of agitation in your spirit that creates discontent, then develop a thankful attitude for life. The thankful person appreciates the things that come to him or her in life. The grateful person sees whatever comes to him or her as not being deserved, but rather the goodness of God. Truly thankful people appreciate all that they receive.

Much of our frustration in life comes from attempting to control what we cannot and neglecting to control what we can. We all know the Serenity poem. God grant me the serenity to accept the thing I cannot change, the courage to change the things I can, and the wisdom to know the difference.

Being content does not mean to sit back with shoulder shrugging passiveness. Contentment is learned.

You are not going to be content if you feel powerless or helpless. Much of our frustration in life comes from believing that we have the power to control things we actually can’t.

Here are 5 steps you need to take to be content

1. We must learn to distinguish the temporal from the eternal.

2. We must discipline our ambitions

3. We must learn to defer our appetites

4. We must develop a grateful and thankful attitude toward life

5. We must learn the limits of our power.

When we complain we are not content. Know God works all things together for your good. And then live as though you believe it.

You cannot find contentment from getting what you want but from  wanting what you already have.

Another definition: Contentment is not just a peaceful easy feeling or a way to rationalize laziness. It is a deep easy breathing wisdom that knows what can and can’t be changed, and more important, knows what to do about it and when to wait. The contented person watches the world closely but does not stare it down. She or he enjoys things rather than trying to possess them or straighten them out.

More ways to practice contentment want what you have. This is a basic gratitude practice. Don’t make comparisons, and accept your imperfections and the lacks in your life.`

    id: "word-of-wisdom",
    section: "Church Talks",
    title: "Word of Wisdom",
    date: "January 30, 2011",
    location: "Smithers, BC",
    notes: "",
    body: `What do you think of when I mention the word ‘health’? What is it that you first think of? For many people the words health or exercise are very positive things, but not for everybody.

Some people think of excuses. Someone has said this. “Every time I think about exercise, I lie down until the thought goes away.” Or  “I’m not into working out. My philosophy: No pain, no pain.” Those comments are just a fraction of the kind of excuses that people have for not making healthy lifestyle choices. Many people in the world downplay the need for paying attention to their health. But the scriptures has lots of things to say about health.

“Know ye not that ye are the temple of God, and that the Spirit of God dwelleth in you? If any man defile the temple of God, him shall God destroy; for the temple of God is holy, which temple ye are” (1 Corinthians 3:16-17).

The mind affects the body. But let me ask you a question. Can it work the other way around?

If there’s a mind/body connection, and the mind influences the body, can the body affect the mind? In other words, could what goes on in the body affect the ability of our minds to think clearly?

Good health can impact how we think and make us better able to understand God’s Word. So wouldn’t we want to practice a lifestyle that makes our bodies healthy, so that our minds can be in the best shape?

The Word of Wisdom recorded in section 89 of the Doctrine and Covenants is a law of health revealed by the Lord for the physical and spiritual benefit of His children.

It puts restrictions on members of the Church. To this day those regulations apply to every member and to everyone who seeks to join the Church.

They are so compelling that no one is to be baptized into the Church without first agreeing to live by them. No one will be called to teach or to lead unless they accept them.

When you want to go to the temple, you will be asked if you keep the Word of Wisdom. If you do not, you cannot go to the house of the Lord until you are fully worthy.

I know that a lot of people do not like the thought that it is considered a restriction; however you look at it though, it is a restriction of substance that should or should not be put into our bodies.

Many people do not like restrictions. A resistance to anything that limits one’s conduct has almost taken over society.

We can almost visibly see how our society can and is self-destructing over the obsession with freedom disconnected from responsibility, where choice is imagined to be somehow independent of consequences.

We must understand that there is great justification to the restrictions imposed by the Word of Wisdom.

The Word of Wisdom was “given for a principle with promise” (D&C 89:3). That word principle in the revelation is a very important one.

A principle is an enduring truth, a law, a rule you can adopt to guide you in making decisions.

President Joseph F. Smith taught that the Word of Wisdom was more than a prohibition against tea, coffee, tobacco, and alcohol; it contained practical counsel for good health and spiritual growth, and those Saints who obeyed it would draw nearer to the Lord and become more like Him.  We cannot list all of the things that we should or shouldn’t take; however, we have the understanding of what is good for our bodies and what is bad for our bodies.  It’s as simple as that.

The story is told of a king who was choosing between two drivers for his coach. He ordered each of them to drive his coach down a steep, winding road cut into a high cliff.

The first driver came down slowly, hugging the wall of the cliff. The second driver demonstrated great talent and ability. He raced down the mountain, with the coach so close at times that half the wheel was off the edge of the cliff.

The king was very thoughtful, then wisely chose the first man to drive his coach. It is best to stay on the safe side of things.

When comparing this to the boundaries of what and how we should partake of substance into our own body, we should remember the cautious driver and stay on the safe side of things.

In the United States, alcohol and drug abuse cost society an estimated $86.1 billion from direct costs and losses in productivity related to crime, social welfare expenditures, motor vehicle crashes, and fire destruction.

The Centers for Disease Control and Prevention published research in 2002 claiming that the cost of each pack of cigarettes sold in the United States was more than $7 in medical care and lost productivity. However, with another study putting it as high as $41 per pack, when taking into account the impact on the individual’s family.

According to a study of national costs attributed to both overweight and obesity, medical expenses accounted for 9.1 percent of total U.S. medical expenditures which translate to $92.6 billion dollars.

A landmark study investigated the 10 leading causes of death in the country, noted that in fifty percent of the cases, those deaths were related to lifestyle choices.  Smoking, poor eating, lack of exercise, alcohol and drug abuse, and risky sexual practices.

When the Word of Wisdom was revealed, no one, and I mean no one ever thought that activity that was not in harmony to this law, would have such an effect on society.

A guy is terribly overweight, so his doctor puts him on a diet. “I want you to eat regularly for two days, then skip a day, and repeat this procedure for two weeks. The next time I see you, you’ll have lost at least five pounds.”

When he returned, he shocked the doctor by losing nearly 20 pounds.

“Why, that’s amazing!” the doctor said. “Did you follow my instructions?”

The guy nodded. “I’ll tell you though, I thought I was going to drop dead that third day.”

“From hunger, you mean?” asked the doctor.

“No, from skipping.”

The Word of Wisdom is a Law, it is the Law of Health.  We are commanded to do all that we can to live and act as healthy as we can.  This does not say that we will all be trim and fit like our Branch President.  It simply requires us to care for the body that was given to us from our Father in Heaven.

The scriptures counsel us, “Cease to be idle; cease to be unclean; … cease to sleep longer than is needful; retire to thy bed early, that ye may not be weary; arise early, that your bodies and your minds may be invigorated” (D&C 88:124).

If you honour the principle of the Word of Wisdom, you will receive the promised blessings. “All saints,” the revelation promises, “who remember to keep and do these sayings, walking in obedience to the commandments,” are promised that they “shall receive health in their navel and marrow to their bones” and “shall run and not be weary, and shall walk and not faint” (D&C 89:18, 20).

Again, the Word of Wisdom does not promise you perfect health, but it teaches how to keep the body you were born with in the best condition and your mind alert to be receptive to any and all spiritual promptings.

There is a greater blessing promised in the Word of Wisdom than that of good health. Those who obey it are promised that they “shall find wisdom and great treasures of knowledge, even hidden treasures” (D&C 89:19).

There’s a final promise in the revelation. Speaking again of those who keep and do and obey these commandments, the Lord said, “I … give unto them a promise, that the destroying angel shall pass by them, as the children of Israel, and not slay them” (D&C 89:21). That is a remarkable promise.

But it is not from mortal death that we shall be spared if we walk in obedience to these commandments, for each of us in time shall die.

But there is spiritual death which you need not suffer. If you are obedient, that spiritual death will pass over you.

While the Word of Wisdom requires strict obedience, in return it promises health, great treasures of knowledge, and that redemption bought for us by the Lamb of God, who was slain that we might be redeemed.

Surely the Word of Wisdom was given so that we may keep our sensitive and spiritual senses on proper alert.

To those of you who may be wandering off course, (whether it be the faithfulness towards the Word of Wisdom or any covenant that we have entered) now is the time to return.

You can, you know, go forward with faith. You’ll be led by the Spirit as was Nephi, “not knowing beforehand the things which [he] should do” (1 Ne. 4:6).

I wish to share the following quote which really struck a chord with me:

“When our appetites control us, when we neglect to keep our bodies and minds in the best possible condition, we may not be literally breaking the Word of Wisdom, but we are neglecting a sacred trust that the Lord has given to us when he gave us our marvellous bodies”

When God looked at the potential of our body, God says, “It is good.”

And if that’s the case, then wouldn’t it make sense that we should want to take care of our bodies?  It’s the greatest and best gift we have been given.  It is a constant reminder of God’s miraculous creativity.

And more importantly - it is the only body you’ll ever get.

So, we’re called to take care of it.  Feed it right, exercise it well, give it plenty of rest, and do whatever it takes to protect it and prevent disease.

Not just so that we can lower the cost of health care, and not just so we can look better and feel better.  But because by taking care of our bodies, we become better stewards of what God has given us, and better able to do what God wants us to do.

I bear witness that this revelation is a powerful protection to all members of the Church, as you face a life full of so many troubles and danger and uncertainties. But have faith. The Lord will be with you; you will be guided. I bear witness of him and of his sacrifice and of his Atonement and of his love for you, in the name of Jesus Christ, Amen.`

  {
    id: "obedience",
    section: "Church Talks",
    title: "Obedience",
    date: "May 16, 2010",
    location: "Smithers, BC",
    notes: "",
    body: `In D&C 130: 20-21, we learn about the first law in Heaven, it says:  There is a law, irrevocably decreed in heaven before the foundations of this world, upon which all blessings are predicated— And when we obtain any blessing from God, it is by obedience to that law upon which it is predicated.

Since I was young I always admired a couple of examples from the Book of Mormon.  The first to which I wish to talk about is that of Nephi.  Very quickly in his records, Nephi says to his family “I will go and do the things which the Lord commands”

This was in response to his father’s direction, whom Nephi had faith was a prophet leading his family to a promised land.  Nephi knew that the Lord will give none of us a commandment that we would not be able to accomplish.

I bear testimony to this truth.  All that we are asked to do in the name of the Lord, we can do, we can accomplish, we can achieve!

My second example to which I admire is that of Ammon.  After he faithfully served his king as a shepherd of his flocks and saved his sheep from thieves, he could have gone in to the king with the other servants and receive praise from the king for saving his flocks, but what did Ammon do?

The king asked for Ammon and he was not there among his servants. He asked, Where is this Ammon? And the answer to the king’s question was ... he is tending to your horses and preparing his chariot.

King Lamoni was then even more astonished.  Why? Because  of the faithfulness of Ammon, saying:

“Surely there has not been any servant among all my servants that has been so faithful as this man: for even he doth remember all my commandments to execute them”

I think that this case in point is powerful!  Would it not be wonderful if we all could remember the things which we are commanded and then execute it to our finest?

One day I won a toy in a draw. I was in a difficult situation when I thought about who I could give this toy to.  Each of my children would like it.

So I gathered my four children together to ask

which one should have the toy.

"Who is the most obedient?" I asked.

The children all stared back at me silence.

Then I asked, "Who never talks back to mom?"

Again, my kids appeared to be mystified by the question.

Then I asked, "Who does everything she says?"

With that question, my kids were finally able to come to a conclusion. The four small voices answered in unison, "Okay, dad, you get the toy."

There are many reasons why people obey commandments.

Sometimes:

They are afraid of being punished for disobedience, or

They want the rewards that come from obedience, or

They want other people to see them and think that they are righteous, or

They feel peace and joy when they are obedient.

Some of these reasons are not bad reasons, but the most important motivation for us to obey is found in John 14:15.  “If ye love me, keep my commandments”.

This is so important, that we develop a mindset that will show our love for our Father in Heaven and His son, Jesus Christ.

Sometimes we are obedient because we know what the consequences are going to be, and we know that it is far better to do what we need to do then live with the end results.

All too often, we find ourselves not worrying about the consequences.  Sometimes we have the attitude of “Eat, Drink and be merry for tomorrow we die”  This attitude gives the notion that our actions mean nothing and that nothing matters.

Many nations rise and fall.  The most stable of civilizations are built around a strong sense of rules and regulations.  They are created and structured around sets of laws.

There are many times while driving through a city and when I approach a set of traffic lights that turn red, I think to myself about how much I hate them, but I think about it this several times.

If these lights were not operating, can you imagine what the traffic system would look like?  There is no doubt that the streets would be plagued accidents and the traffic would be brought to a standstill.

This simple example gives us a clear realization that commandments can give us greater freedom and exercise to do the things that we need in our lives.

By keeping God’s commandments, we prepare for eternal life and exaltation.

Sometimes we hear about blind obedience.  I do not subscribe that we always go about doing things simply for the fact of showing obedience but there are times when we need to for the purpose of showing our faith and trust in God.

Adam and Eve were an example of this.  They were commanded to offer sacrifices to God. One day an angel appeared to Adam and asked why he offered sacrifices. Adam replied that he did not know the reason. He did it because the Lord commanded him to.

The angel then taught Adam the gospel and told him of the Savior who was to come. The Holy Ghost fell upon Adam, and Adam prophesied concerning the inhabitants of the earth down to the last generation.  This knowledge and great blessings came to Adam because he was obedient.

We can look to our elder brother Jesus Christ as an example of obedience, even when there are times that we just don’t want to.  As the Saviour knelt down in the Garden of Gethsemane he foresaw what was to be done and asked his Father if the cup should pass him by, but here is the important words that were uttered:  “Not as I wilt, but as thou wilt”.  He obeyed even though he did not wish to do so.

Obedience is still essential even when it may be difficult.

There was a man who had worked all his life, had saved all of his money and was a real “miser” when it came to his money. Just before he died, he said to his wife, “When I die, I want you to take all my money and put it in the casket with me. I want to take my money to the afterlife with me.” So he convinced his wife to make this promise to him with all of her heart; that when he died, she would put all of his money into the casket with him.

Well, he died. He was stretched out in the casket, his wife was sitting there – dressed in black, and her friend was sitting next to her. When the ceremony was finished, just before the undertakers got ready to close the casket, the wife said, “Wait just a moment!”  She had a small metal lock-box with her which she walked over and placed inside the casket.  Then the undertakers locked the casket down and they rolled it away.

Her friend said, “Girl, I know you were not foolish enough to put all that money in there with your husband.”  The loyal wife replied, “Look, I’m a Christian and I cannot go back on my word. I promised him that I was going to put that money into the casket with him.”

You mean to tell me you put that money in the casket with him?”, her friend asked.

“I sure did,” said the wife, “I got it all together, put it into my account, and wrote him a check.  If he can cash it, then he can spend it.”

Being obedient is necessary for our personal growth and progression.

We hear many persuasive voices demanding freedom from restrictions, particularly from our moral standards.  These voices are influencing the generations that look to immediate self gratification.  It is those who can put off the natural man and focus his/her life in the preparations of the eternities who can delay this immediacy.

But again, we learn from the history of the earth that any successful society has had boundaries. Consider the earth itself. It was formed out of matter and in the beginning was empty, desolate, and dark.

Then came order, as God commanded that the light should be divided from the darkness. God’s command was obeyed, and the earth had its first day, followed by its first night.

Then God ordered the creation of the atmosphere. He organized the sun, the moon, and the stars to shine in their appropriate times and seasons.

After a series of commands and obedience to commands, the earth not only became habitable but beautiful.

Obedience brings peace in decision making. If we have firmly made up our minds to follow the commandments, we will not have to redecide which path to take when temptation comes our way. That is how obedience brings spiritual safety.

We need to be obedient to spiritual promptings. This too can be liberating. How many times have we felt regret for ignoring a prompting from a higher source?

Ephraim Hanks is a remarkable example of a young man’s obedience to spiritual promptings.

In the fall of 1856, after he had gone to bed, he heard a voice say to him, “The handcart people are in trouble and you are wanted; will you go and help them?” Without any hesitation he answered, “Yes, I will go if I am called.”

He rode quickly from Draper to Salt Lake City. As he arrived he heard the call for volunteers to help the last handcart companies come into the valley. Ephraim jumped up and said, “I am ready now!”

The leaders of two great nations arranged a competition to determine whose nation had the bravest troops. The two leaders arrived, at the designated hour, on a plateau in Finland high above the water. Each was accompanied by a battalion of crack troops, smartly uniformed. The leaders shook hands.

President Barrack Obama went first. He addressed his battalion of Marines:

"Private Jones! Front and center."

Private Jones saluted and briskly marched to the front of the ranks, facing his commander.

"Private Jones! March to the edge of the cliff."

Private Jones saluted and briskly marched to the very edge of the cliff.

"Private Jones! Jump!"

Jones just stood there, unmoving.

"Private Jones! I said jump!"

The man's knees started to shake, but he was otherwise motionless.

"Private Jones! This is your Commander-in-Chief. I ORDER YOU TO JUMP!!!" Private Jones wailed out: "I can't! I have a wife--and a family!"

The MPs arrived and escorted Jones away for court martial.

President Obama backed off in disgrace. It was now Putin’s turn.

"Comrade Dmitrivich! Front and center."

Comrade Dmitrivich saluted and briskly marched to the front of the ranks, facing his commander.

"Comrade Dmitrivich! March to the edge of the cliff."

Dmitrivich saluted and briskly marched to the very edge of the cliff.

"Comrade Dmitrivich! Jump!"

Dmitrivich jumped off the cliff.

By some miracle, he is snagged on a branch and he lands on a crag some 50 feet below the top of the cliff. Dmitrivich is badly injured, but still alive and conscious. He is carried away on a stretcher.

As Dmitrivich is carried passed Private Jones, Jones cannot resist asking him:

"Dmitrivich! How could you do it? How could you jump?"

Dmitrivich answered: "I had to! I have a wife--and a family!"

Again, we have different reasons for our faithfulness.

The Lord counsels us, “If you keep my commandments and endure to the end you shall have eternal life, which gift is the greatest of all the gifts of God” (D&C 14:7).

He also says:

“Great shall be their reward and eternal shall be their glory...

“And to them will I reveal all mysteries, yea, all the hidden mysteries of my kingdom from days of old, and for ages to come ...

“And their wisdom shall be great, and their understanding reach to heaven. … (D&C 76:6–9).

Brothers and Sisters, I know that you and I are children of a loving Heavenly Father. I know that His Son, Jesus Christ, lives and that He is our Savior and that He paid the price of all of our sins. He was resurrected. I know that this is the true Church of Jesus Christ.

I know that through the Holy Ghost we can learn what God would have us do. I testify that He can give us the power to do what He asks of us, whatever it is and whatever trials may come.

I pray that we will choose to obey the Lord quickly and always, in times of harmony and in times of troubles. As we do, our faith will be strengthened, we will find peace in this life, and we will gain the assurance that we and our families can qualify for eternal life in the world to come. I so promise you and bless you, in the name of Jesus Christ, amen.`

    id: "articles-of-faith",

    title: "Articles of Faith",

    notes: "",
    body: `“We believe all that God has revealed, all that He does now reveal, and we believe that He will yet reveal many great and important things pertaining to the Kingdom of God.”

In this Article of Faith, we as members of the Church of Jesus Christ of Latter-Day Saints declare to the world that the heavens are not closed. That God continues to reveal His will to mankind, as He has in all periods of time when He has had authorized servants, as prophets, upon the earth.

In Amos 3:7 it says, "Surely the Lord God will do nothing, but he revealeth His secret unto his servants the prophets."

As we search our Holy Scriptures, this fact is made.

The principle of constant communication with God through divine revelation is basic to our belief.

The prophets, seers, and revelators have had and still have the responsibility and privilege of receiving and declaring the word of God for the world.

Individual members, parents, and leaders have the right to receive revelation for their own responsibilities but have no duty nor right to declare the word of God beyond the limits of their own responsibilities.

The first part of the ninth article of faith states, “We believe all that God has revealed.”

Through the ages, God’s messages to His children generally have been revealed through prophets.

The qualifications of a prophet in any age are not wealth, title, position, physical stature, scholarship, or intellectual abilities.

There are two qualifications: first, a prophet must be called as such by God and ordained by one known to have legal and spiritual authority: and second, he must receive and declare revelation from God.

Over the centuries revelation from prophets has come incrementally. The Lord stated, “For he [God] will give unto the faithful line upon line, precept upon precept; and I will try you and prove you herewith” (D&C 98:12).

Revelations have come by different means. They have come by the guidance of the Holy Ghost (which is perhaps most common), or by the spoken word, and by visits from holy messengers.

The ninth article of faith continues: “We believe … all that [God] does now reveal.”

For some strange reason it seems easier for many to believe the words of dead prophets rather than those of living prophets. The greatest revelator in our time has been Joseph Smith. In the difficult period between 1823 and 1843, just 20 years, 134 revelations were received, printed, and made public.

We now move forward nobly and boldly, with courage and conviction, led by our prophet, Thomas S. Monson.

He is in every respect entitled to our sustaining action.

He is the senior Apostle on the earth. He has been ordained and set apart as the prophet, seer, and revelator to the world. He has been sustained as the President of the Church. He is the presiding high priest over all the priesthood on the earth. He alone holds and exercises all the keys of the kingdom under the Lord Jesus Christ, who is the head of this Church and is the chief cornerstone.

President Monson is leading this work forward and is assisted by two counselors and sustained by the Quorum of the Twelve.

I do not believe members of this Church can be in full harmony with the Savior without sustaining His living prophet on the earth, the President of the Church.

If we do not sustain the living prophet, whoever he may be, we die spiritually. Ironically, some have died spiritually by exclusively following prophets who have long been dead.

In our lifetime we have been favored with ongoing communication from the heavens, which have been open to the prophets of our time. Major divine pronouncements have included what we now know as section 138 of the Doctrine and Covenants, given in 1918.

Surely one of the greatest divine disclosures came in 1978, when the blessings of the priesthood and temple became available to all worthy male members. Line upon line and precept upon precept, new knowledge and direction have been given to the Church.

Thus, by revelation in our day the Seventies have been given an expanded role as members of Area Presidencies and in general Church administration, helping the First Presidency and the Twelve “in building up the church and regulating all the affairs of the same in all nations” (D&C 107:34).

Many other divine instructions have also been received. Much revelation received, in this time as well as anciently, has been doctrinal. Some of it has been operational and tactical. Much of our recent revelations can be considered dramatic, yet they occur.

President John Taylor reminds us: “Adam’s revelation did not instruct Noah to build his ark; nor did Noah’s revelation tell Lot to forsake Sodom; nor did either of these speak of the departure of the children of Israel from Egypt. These all had revelations for themselves” (Millennial Star, 1 November 1847, page 323).

In our time, God has revealed how to administer the Church with a membership of over nine million people.  This administration surely must look differently than when there were just six members of the Church.

These differences include the use of modern technology, such as films, videos, computers, and satellite broadcasts, to teach and communicate new ways to conduct missionary work in various nations; the location and building of temples; and many others.

This process of revelation comes to the Church very frequently. President Wilford Woodruff stated, “This power is in the bosom of Almighty God, and he imparts it to his servants the prophets as they stand in need of it day by day to build up Zion” (The Discourses of Wilford Woodruff, page 56).

It is important to note that this continued revelation is necessary for the Church to fulfill its mission. Without it, we would fail.

A very encouraging portion of the ninth article of faith we have been considering is its conclusion, “We believe that He will yet reveal many great and important things pertaining to the Kingdom of God.”

Elder Boyd K. Packer, the President of the Quorum of the Twelve Apostles, stated: “Revelation is a continuous principle in the Church. In one sense the Church is still being organized. As light and knowledge are given, as prophecies are fulfilled and more intelligence is received, another step forward can be taken”

This Church constantly needs the guidance of its head, the Lord and Savior, Jesus Christ.

This was well taught by President George Q. Cannon, formerly a member of the First Presidency: “We have the Bible, the Book of Mormon and the Book of Doctrine and Covenants; but all these books, without the living oracles and a constant stream of revelation from the Lord, would not lead any people into the Celestial Kingdom of God. This may seem a strange declaration to make, but strange as it may sound, it is nevertheless true.”

When does this promised revelation come? Only God knows. It comes as needed.

To whom does it come? To obtain the answer to this, we must again go back to the words of Amos: “Surely the Lord God will do nothing, but he revealeth his secret unto his servants the prophets” (Amos 3:7).

This ongoing revelation will not and cannot be forced by outside pressure from people and events. It is not the so-called “revelation of social progress.” It comes from God.

The Church is governed by the prophet under the guidance and direction of God. Parley P. Pratt disclosed: “The legislative, judicial, and executive power is vested in [the Lord]. He reveals the laws, and he elects, chooses, or appoints the officers; and holds the right to reprove, to correct, or even to remove them ..."

We have been promised that the President of the Church, as the revelator for the Church, will receive guidance for all of us. Our safety lies in paying heed to that which he says and following his counsel.

How, then, one might ask, can we be so sure that, as promised, the prophets, seers, and revelators will never lead the people astray?

President J. Reuben Clark, formerly a member of the First Presidency, stated, “We can tell when the speakers are ‘moved upon by the Holy Ghost’ only when we, ourselves, are ‘moved upon by the Holy Ghost’ ”

I declare to you this day that as I hear the words from our prophets, seers, and revelators; I am moved upon by the Holy Ghost.

Revelation was required to establish this Church. Revelation has brought it from its humble beginnings to its present course. Revelation has come like flowing, living water.

Continuing revelation will lead it forward.

We have been told that we do not necessarily need more or different prophets. We need more people with “a listening ear”.

We make no claim of individual infallibility or perfection as the prophets, seers, and revelators.

Yet, I believe their greatest desire is to know and do the will of our Heavenly Father.

I witness humbly that I know the Lord guides His Church through His servants. I believe them to be noble, righteous, dedicated servants of the Lord.

I hope and pray that we may be responsive and be moved upon by the Holy Spirit as we listen to the oracles He has appointed.

I so pray because I know that we mortals, without the aid of revelation, cannot know the purposes of God.  We have a source of light and understanding.  May we exercise our opportunity to draw upon this gift.  I pray, in the name of Jesus Christ. Amen.`

    id: "christmas-2009",
    section: "Church Talks",
    title: "Christmas 2009",
    date: "December 20, 2009",
    location: "Smithers, BC",
    notes: "",
    body: `Brothers and sisters, I extend to you my warmest Christmas greetings.

As followers of the Master, I desire that we all draw closer to Him as we remember during this season His wondrous birth virtually two thousand years ago.

We are all aware of the significance that a name or title can have in describing an important office.

In foretelling the birth of Christ more than 700 years before it occurred, the prophet Isaiah used titles expressing great admiration: “Wonderful, Counsellor, The mighty God, The everlasting Father” (Isa. 9:6).

Isaiah also used the titles Savior and Redeemer, expressing great faith in Christ and His mission.

One of these titles that is of particular interest in our present world is “Prince of Peace”.

Isaiah declared. “Of the increase of his government and peace there shall be no end,” What a thrilling hope that is for the increasingly disobedient world that we live in!

The Savior dedicated His life to blessing other people. As expressed by His chief Apostle, Peter, “God anointed Jesus of Nazareth with the Holy Ghost and with power: who went about doing good” (Acts 10:38).

Never did the Savior give in expectation of receiving.

He gave freely and lovingly, and His gifts were of great value. He gave eyes to the blind, ears to the deaf, and legs to the lame; cleanliness to the unclean, wholeness to the infirm, and breath to the lifeless.

His gifts were opportunity to the downtrodden, freedom to the oppressed, forgiveness to the repentant, hope to the despairing, and light in the darkness.

He gave us His love, His service, and His life. And most important, He gave us and all people resurrection, salvation, and eternal life.

We should strive to give as He gave. To give of oneself is a holy gift. We should give as a remembrance of all the Savior has given.

This is the time of year for giving. Someone once said he couldn’t think of what to give for Christmas. The next day in the mail he received an anonymous list which read:

Give to your enemy forgiveness,

To your opponent tolerance,

To your friend your heart,

To all men charity, for the hands that help

are holier than lips that pray,

To every child a good example,

and to yourself—respect.

All of us need to follow the example of the Savior in giving these kinds of gifts. There is a thought provoking poem that says:

What can I give Him,

Poor as I am?

If I were a shepherd

I would give Him a lamb,

If I were a Wise Man,

I would do my part,—

But what I can I give Him,

Give my heart.

This Christmas, mend a quarrel. Seek out a forgotten friend. Dismiss suspicion and replace it with trust.

Write a letter. Give a soft answer. Manifest your loyalty in word and deed. Keep a promise. Forgo a grudge. Forgive an enemy.

Apologize. Try to understand. Examine your demands on others. Think first of someone else. Be kind. Be gentle.

Laugh a little more. Express your gratitude. Welcome a stranger. Bring joy to the heart of a child. Take pleasure in the beauty and wonder of the earth.

Speak of those things that you love and then speak it again.

Christmas is a celebration, and there is no celebration that compares with the realization of its true meaning.

A life filled with unselfish service will also be filled with peace that surpasses understanding.

The Savior said: “Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled: neither let it be afraid” (John 14:27).

This peace can come only through living the principles of the gospel. These principles constitute the program of the Prince of Peace, who is also the prince of glory and the prince of eternal progress.

May we be ever faithful in observance of our Savior’s teachings.  He said, “If ye love me, keep my commandments” (John 14:15).

May our Saviour become our focal point not only at this Christmas season, but always.

I testify that He lives today, the babe of Bethlehem—and now the risen Lord. He and His Eternal Father love and care for each of us in a sacred and personal way.

I extend my love and admiration to you this day.  My wish for you is a happy, joyous Christmas. May this season bring to you and yours the rich blessings of the gospel of the Savior,

I pray, in the name of Jesus Christ, amen.`

    id: "unanswered-prayers",
    section: "Church Talks",
    title: "Unanswered Prayers",
    date: "May 31, 2009",
    location: "Smithers, BC",
    notes: "",
    body: `I remember back when I was probably 10 years old.  I received a ticket for a draw for a trip to Hawaii.  I remember on the night before the draw, I knelt down beside my bed and prayed to my Father in Heaven with all the faith I could assemble and asked Him that he would make it so that I would win that draw.  I prayed and prayed.  I knelt beside that bed for virtually the whole evening until I fell asleep.

The next morning, I anticipated that the phone would ring and I would be told about my wonderful vacation.  I exercised faith that God would hear and answer my prayers.  And guess what? The phone rang and it was for me; and you guessed it, it was somebody other than the vacation to Hawaii.

I was heartbroken and confused that I exercised my faith in God and He did not answer my prayers.

Garth Brooks wrote a song called “Unanswered Prayers.” [Lyrics omitted for copyright — Garth Brooks, “Unanswered Prayers” (1990), written with Pat Alger and Larry Bastian. Add back in from the source document.]

I think we all have struggled with the problem of “unanswered” prayers. I also think that we usually don’t worry about whether or not our prayers are being answered when all is well.

It’s when we’re in trouble, when we have special needs, that we seek with some intensity to obtain answers to our prayers. And when those answers don’t seem to come, our need seems to increase.

It’s natural in this situation to contemplate, “Where are you, Heavenly Father?” “Are you listening?”

We can answer those questions by remembering that God is constant. He operates by pre-established principles, not unwisely or by whim. We should also remember that he has promised to not leave us alone.

So, it seems to me that if we’re not getting answers to our prayers the problem is in our understanding or in our faithfulness or in our asking, not in the Lord.

There are some common problems that may be holding us back from receiving answers.

One is that we ask impatiently. We sometimes expect the Lord to give us immediate answers. But he hasn’t promised that—and sometimes it’s for our good that he waits. Sometimes when the Lord doesn’t answer our questions on the spot—or within a day, or a week, or a month—we assume that he isn’t going to answer them at all. That, of course, is a serious mistake.

As long as we continue in our prayers we have the promise of an answer. But remember this … we’ve never been promised an immediate answer.

A second problem is that we don’t listen. Our senses are constantly bombarded with other information: we kneel to pray and feel the floor under our knees or our arms folded across our chests; a truck rambles past the house; rain hits the window pane; the clock ticks loudly in the corner.

No wonder it’s difficult to find enough spiritual quiet to hear the things the Lord is trying to tell us. But we can make things even worse by failing to make a real effort to listen.

We utter our prayers, even with feeling and sincerity, and then immediately rise and jump into bed; or rise and run to work.

How can the Lord get through to us under those conditions? It takes practice and patience to learn how to receive spiritual communications in the best of circumstances.

Again, the difficulty is not with the Lord; it is with us. I believe he will give us answers; but if we are not listening or if we are not in tune, we may not receive or understand the answer.

The result is that we may think the Lord is not even listening, when the real problem is that we’re not listening.

Here is something important for all of us to learn … we must not expect the Lord to do all the work for us.

Oliver Cowdery received a special revelation from the Lord teaching him that principle: “Behold, you have not understood,” he was told. “You have supposed that I would give it unto you, when you took no thought save it was to ask me.” (D&C 9:7.)

Then the Lord explained the process: We should first study the problem out in our minds, weigh the various factors involved, and come to a decision. Then we may go to the Lord to seek his approval, redirection, or further counsel.

We must also be careful not to “ask for that which [we] ought not” (D&C 8:10).

Sometimes we ask for things that would not be in our best interest. In such cases the Lord is being very kind when he doesn’t grant our requests. But when we want something badly, we often times don’t hear any answer other than the answer we want.

Again, this is something important that we need to remember … we must be willing to work for our prayers to come to pass. If we pray to get out of debt and then just sit around waiting for someone to miraculously come up and give us the exact amount we need, we’ll probably be disappointed.

If we pray to get out of debt, we should be willing to work hard enough and smart enough to make it happen. When missionaries pray to be led to the honest in heart, they must be willing to move their feet in the direction shown them. If a person prays for a testimony, he must do his part by studying and living the commandments.

Brothers and Sisters, we must learn how to recognize the answers when they come. A person might do everything that I have said and still not hear what the Lord is trying to tell him.

Part of the difficulty may stem from the fact that we just don’t know the voice of the Lord, we may not know how it feels to have a prayer answered, so we don’t recognize the answer when it comes.

There are many ways prayers may be answered. Joseph Smith often had heavenly visitations. Moses heard a voice from a burning bush. Some people receive dreams. I have had visions to answer my prayers, but most commonly and I think for most people, we can identify with Enos, who said, “While I was thus struggling in the spirit, behold, the voice of the Lord came into my mind” (Enos 1:10).

This is the way the Lord usually answers our prayers. Perhaps he knows it is the way that we are best equipped to hear him.

He answers others in other ways. He spoke to Oliver Cowdery about a feeling like a burning in the bosom (D&C 9:8). That feeling comes to different people in different ways.  For some it’s a warm feeling in their chest. For others it’s a feeling of exhilaration. And yet for others it may come in different ways.

In revelations to Joseph Smith, Oliver Cowdery, and Hyrum Smith, the Lord talks about answering prayers by enlightening the mind, speaking peace to the mind, telling the person “in your mind and in your heart,” filling the soul with joy (D&C 6:15, 23)

He will speak to us in ways that will be most effective for our own conditions. We must learn to recognize how we feel when the Spirit is with us and when he is communicating to us.

Sometimes the answer to our prayer is no. We can receive that answer in the form of a “stupor of thought” (D&C 9:9); or it may come as a dark feeling, a feeling of disquiet and unrest, a feeling of uneasiness.

Receiving answers to prayers is not complicated, even though it may sound like it.

When we righteously seek help and counsel from the Lord, keeping in mind the principles of prayer, we’ll grow in our ability to receive and interpret the answers to our prayers.

Our Heavenly Father loves us; he is not an uncaring God. And he stands willing to answer our prayers.

He promised through James, the brother of Jesus: “If any of you lack wisdom [or need comfort, or seek direction, or need help in overcoming the chains of sin, or desire heavenly assistance] let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him.

“But let him ask in faith, nothing wavering.” (James 1:5–6.)

I want you all to know that God does answer prayers.  I have had countless prayers answered in my life to which I bear testimony, but I also have had times when I have felt that I have not yet received the answers, but I do recognize that maybe they were one of those great gifts that God has given me of unanswered prayers, or that I must put more effort in accomplishing that which I am asking my Father to do.

I must be like Alma the elder, I need to continue on and never falter.

God does answer our prayers.

Please know that He is there. I testify He is.

In the name of Jesus Christ. Amen.`

    id: "acting-upon-the-spirit-kaleb",

    title: "Acting Upon The Spirit",
    date: "March 22, 2009",
    location: "Smithers, BC",
    notes: "Written for Kaleb",
    body: `Good Morning Brothers and Sisters.  Much of my talk is taken from the Ensign.  The ensign is in a sense, a medium which gives our Father in Heaven a way to speak to each of us.

Some of my talk is inspired by a talk that my mom made a few months ago.

When my family and I went to Los Angeles, the traffic was terrible; my dad had the G.P.S., my mom didn’t. My mom was going to follow my dad that didn’t work out as we planned. My mom fell behind, then she called and asked us to turn around. My dad used the G.P.S. to find her. My mom told us that she was at a Shell gas station, so my dad put it in the G.P.S. and found her.

We learned to depend upon our onboard navigational instrument. Without it, my mom would have been lost and confused forever. We also got to our hotel safely because we gave my mom the G.P.S.

We each have our own onboard navigation system to give us turn-by-turn instructions. But, it has nothing to do with finding a certain street or a location.

It has everything to do with our eternal destination. Our destination is clearly defined, and a good navigation system will help us achieve exaltation and eternal life.

We all want to be on the right road. We all desire to move effectively down that highway of life with the least amount of detours and delays.

We all have moments when we get slightly confused and need additional help in making correct choices. We are frequently at a crossroads where we must choose one of two highways: the lower road leading to spiritual delays and sorrow, or the higher road leading to spiritual progress and happiness.

It is very important for us to always choose the higher road.

It is an eternal truth that through the choices we make, we shape our own destiny. Our success or failure, peace or discontent, happiness or misery depends upon the choices we make each day.

As members of The Church of Jesus Christ of Latter-day Saints, we have a built-in navigation system. We have been given the gift of the Holy Ghost to direct us in all things. “Yea, behold, I will tell you in your mind and in your heart, by the Holy Ghost, which shall come upon you and which shall dwell in your heart” (D&C 8:2).

For our navigation system to work, we must have an understanding of where we are and where we are going. This gives us the point of reference and the tracking system to move us along identified routes to our destination.

In order for an onboard navigation system to work, you must allow the system to identify exactly where you are by its global positioning system. Then you can program in your desired destination. It will then suggest the best route for you.

That is exactly what you must do in your own lives. You must take the time to evaluate precisely where you are. It is not an imaginary place.

Look around at your true point of beginning, your precise location. The part that is slightly more complicated goes beyond your physical location. It has to do with where you are on your spiritual highway.

This is the part which requires you to look inside through meditation and personal prayer to determine your exact position.

The Lord knows your precise spiritual location. He has said, “I know thy heart, and have heard thy prayers” (D&C 112:11).

I know that He knows you and loves you. He is aware of your location, both physically and spiritually. He knows if you are on the right path or if you are in need of some course correction.

He knows your heart, and He knows your desires to seek and remain on the higher road.  I encourage all of you to stay on the higher road and avoid the lower road with the delays.

When Samuel (in the Old Testament) was called to be a prophet, he was around my age.  He was serving a High Priest, named Eli.

One night, the Lord spoke to him three times.  He heard the voice each time, but was unsure who it was and what it was about.  In fact, he at first thought it was the High Priest, Eli.  Finally, on the third time, …

“the LORD came, and stood, and called as at other times, Samuel, Samuel. Then Samuel answered, Speak; for thy servant heareth.

And the Lord said to Samuel, Behold, I will do a thing in Israel, at which both the ears of every one that heareth it shall tingle.  (1 Samuel 3: 10-11)”

Samuel heard and listened and tried to act upon the voice which spoke to him.  He also learned this important truth, that we all should remember; and remember for the rest of our lives … When the Lord speaks to our ears, we can hear it and our ears will tingle.  The truth spoken to us will be more than just words but it will be special words that will ring true to our hearts and minds.

We soon are going to hear words from our Priesthood leaders at both District Conference and General Conference.

We have opportunities to have our ears tingle from the words that we hear.  Do not take these words lightly.  Arise, as Samuel did, and do as you are commanded.

Our path may be difficult and hard to follow at times, but I know this …

I know that God knows you and loves you. He is aware of your location, both physically and spiritually.

He knows if you are on the right path; or if you are in need of some course correction.

He knows your heart, and He knows your desires to seek and remain on the higher road.  I encourage all of you to stay on the higher road and avoid the lower road which is filled with delays and danger.

So I leave these words with you, with the challenge that you act upon the promptings that you receive from our Father in Heaven, that is given to us through His special gift, the Holy Ghost, in the name of Jesus Christ Amen.`

    id: "my-covenant-taaron",
    section: "Church Talks",
    title: "My Covenant",
    date: "February 21, 2009",
    location: "Smithers, BC",
    notes: "Written for Taaron",
    body: `Today I wish to touch upon the responsibilities of the covenant that I have made as a priesthood holder, but I want to remind all that are present today, that each of you who have made a personal covenant to our Heavenly Father in baptism, are also held to this same responsibility.

I, as a priesthood holder, have furthered my commitment to act as the Saviour's representative and agent.

So as I refer to the Holy priesthood, I also want each of you that is not a priesthood holder to also substitute it for your covenant as a member of Christ's Church and as a witness of Him.

Much of what I speak about today was told to us by our Prophet, Seer and Revelator, Pres. Thomas S. Monson.

President Joseph F. Smith made the following statement concerning the priesthood. Said he: “The Holy Priesthood is that authority which God has delegated to man, by which he may speak the will of God. … It is sacred, and it must be held sacred by the people. It should be honored and respected by them, in whomsoever it is held.”

The oath and covenant of the priesthood pertains to all of us. To those who hold the Melchizedek Priesthood, it is a declaration of our requirement to be faithful and obedient to the laws of God and to magnify the callings which come to us. To those who hold the Aaronic Priesthood, it is a pronouncement concerning future duty and responsibility, that they may prepare themselves here and now.

President Marion G. Romney, a former member of the First Presidency said: “Every bearer of the Melchizedek Priesthood should give diligent and solemn heed to the implications of this oath and covenant which he has received. Failure to observe the obligations imposed by it is sure to bring disappointment, sorrow, and suffering.”

Added President Spencer W. Kimball: “One breaks [his] priesthood covenant by transgressing commandments—but also by leaving undone his duties.

I find it interesting that it is not only through transgression but by not doing those duties and responsibilities that we have accepted, we will then be breaking our covenants.  Again, it is not just transgressing, but it is also a failure to do and act.

A famed minister observed: “Men will work hard for money. [Men] will work harder for other men. But men will work hardest of all when they are dedicated to a cause. … Duty is never worthily performed until it is performed by one who would gladly do more if only he could.”

The performance of one’s duty brings a sense of happiness and peace. Wrote the poet:

I slept and dreamt that life was joy.

I awoke and saw that life was duty.

I acted, and behold—

Duty was joy.

The call of duty can come quietly as we who hold the priesthood respond to the assignments we receive. President George Albert Smith, an effective leader, declared, “It is your duty first of all to learn what the Lord wants and then by the power and strength of [your] holy Priesthood to [so] magnify your calling in the presence of your fellows … that the people will be glad to follow you.”

What does it mean to magnify a calling?

It means to build it up in dignity and importance, to make it honorable and commendable in the eyes of all men, to enlarge and strengthen it, to let the light of heaven shine through it to the view of other men.

And how does one magnify a calling?

Simply by performing the service that pertains to it. An elder magnifies the ordained calling of an elder by learning what his duties as an elder are and then by doing them. As with an elder, so with a deacon, a teacher, a priest, a bishop, and each who holds office in the priesthood.

A Primary Teacher magnifies their calling by ensuring that they have a lesson reading and loves the children that they teach.  To give light and understanding to the child so that it may magnify the teaching that they are taught in their homes.

Poet and author Robert Louis Stevenson reminded us, “I know what pleasure is, for I have done good work.”

Let us remember the counsel of King Benjamin: “When ye are in the service of your fellow beings ye are only in the service of your God.”

Let us reach out to rescue those who need our help and lift them to the higher road and the better way. Let us focus our thinking on the needs of all of our Saints who have slipped or are slipping from the path of activity.

May we listen to the unspoken message from their hearts. You will find it to be familiar: “Lead me, guide me, walk beside me, / Help me find the way. / Teach me all that I must do / To live with him someday.”

The work of reactivation is no task for the idler or daydreamer. Children grow, parents age, and time waits for no man. Do not postpone a prompting; rather, act on it, and the Lord will open the way.

President Stephen L Richards, who served as a counselor to President David O. McKay, declared, “The Priesthood is usually simply defined as ‘the power of God delegated to man.’ ” He continues: “This definition, I think, is accurate. But for practical purposes I like to define the Priesthood in terms of service, and I frequently call it ‘the perfect plan of service.’ … It is an instrument of service … and the man who fails to use it is apt to lose it, for we are plainly told by revelation that he who neglects it ‘shall not be counted worthy to stand.’”

President Harold B. Lee, one of the great teachers in the Church, gave us this easy-to-understand counsel regarding the priesthood. Said he: “You see, when one becomes a holder of the priesthood, he becomes an agent of the Lord. He should think of his calling as though he were on the Lord’s errand.”

Some of us may be shy by nature, perhaps feeling inadequate to respond affirmatively to a calling.

Remember that this work is not yours and mine alone. It is the Lord’s work, and when we are on the Lord’s errand, we are entitled to the Lord’s help. Remember that the Lord will shape the back to bear the burden placed upon it.

We hear often of many people's sacrifice, and dedication to truth. Duty, honor, service, and love—is what we should aspire to.

To all who willingly respond to the sacred call of service comes the promise: “I, the Lord, am merciful and gracious unto those who fear me, and delight to honor those who serve me in righteousness and in truth unto the end. Great shall be their reward and eternal shall be their glory.”

I encourage and challenge that we all qualify for this divine promise, in the name of Jesus Christ, our Savior, amen.`

    id: "moms-talk",
    section: "Church Talks",
    title: "Baptism and the Holy Ghost",
    date: "February 21, 2009",
    location: "Smithers, BC",
    notes: "Shannon's talk given at baptisms starting with Taaron.",
    body: `Who speaks in a still, small voice that is sometimes felt more than heard?

Who can bring a feeling of comfort and peace when you are sad, lonely, or frightened?

Who brings a warm, sweet feeling into your heart when you think about Jesus Christ and Heavenly Father?

Who can help teach you right and wrong?

Who encourages you to do good deeds for others?

Who can help you understand and remember the scriptures?

The answer to all of these questions is the Holy Ghost.

The Holy Ghost is a personage of spirit and a member of the Godhead. The scriptures explain why the Holy Ghost is a personage of spirit: "The Father has a body of flesh and bones as tangible as man's; the Son also; but the Holy Ghost has not a body of flesh and bones, but is a personage of Spirit. Were it not so, the Holy Ghost could not dwell in us" (D&C 11:12).

*Have a face drawn on a paper bag.* Because the Holy Ghost is a spirit, He can dwell inside of you. Demonstrate that the flashlight (the Holy Ghost) can fill the bag (our souls) with light and warmth. Say that sometimes it is possible to see the light through the bag. This is like the Holy Ghost brightening our souls and making us happy.

You are now starting a journey and will need a guide and some things for this journey. Your guide is the Holy Ghost and he will help you in these special ways:

Candle — The Holy Ghost can light your way and help you know the light and truth of the gospel.

A Compass — The Holy Ghost is also like a compass because he will guide you in the right direction and help you make good choices. He will help you find your way home if you are lost. The Holy Ghost will help you find your way home to your Father in Heaven.

A Blanket/comforter — Another name for the Holy Ghost is the comforter. This comforter is warm and soft and when you wrap it around yourself you feel safe and secure. This is the same feeling that the Holy Ghost can give you. You can have a warm, peaceful feeling inside and feel safe when you listen to the Holy Ghost.

Glasses — Like these glasses, the Holy Ghost can help you to focus and see clearly when you might feel confused.

A Teddy Bear — The Holy Ghost will remind you to "bear" one another's burdens and "bear" your testimony.

A Seashell — If you listen closely and put the seashell next to your ear you can hear the ocean. You also have to listen closely to hear the Holy Ghost because he doesn't speak to us in a loud voice. He speaks mainly to our mind and heart and spirit, and if you aren't paying attention, you won't hear him.

I would like to testify to you that the Holy Ghost will help you make the most important journey you will have during this earth life, to return to our Heavenly Father.

Everyone who sins must be baptized. But what about babies, little children, and the mentally disabled? Do they need to be baptized?

Baptism at Age of Accountability: Everyone born on this earth who reaches the age of accountability (being able to understand right and wrong) commits sins and must be baptized. Children under the age of eight are not required to be baptized, nor are those who do not mentally reach the age of accountability.

Baptism of Babies and Little Children: Children are free of sin and do not need to be baptized until they are old enough to comprehend right and wrong. The prophet Mormon, from the Book of Mormon, said:

"Listen to the words of Christ, your Redeemer, your Lord and your God. Behold, I came into the world not to call the righteous but sinners to repentance; the whole need no physician, but they that are sick; wherefore, little children are whole, for they are not capable of committing sin; wherefore the curse of Adam is taken from them in me, that it hath no power over them. Little children need no repentance, neither baptism." (Moroni 8:8, 11.)

Little Children Alive in Christ: Children who die before the age of accountability and the mentally disabled will be saved because of Christ. Mormon continues:

"But little children are alive in Christ, even from the foundation of the world; if not so, God is a partial God, and also a changeable God, and a respecter to persons; for how many little children have died without baptism! Wherefore, if little children could not be saved without baptism, these must have gone to an endless hell." "For awful is the wickedness to suppose that God saveth one child because of baptism, and the other must perish because he hath no baptism." (Moroni 8:12, 13.)

Baptism at Age Eight: The Church of Jesus Christ of Latter-day Saints teaches that the age of accountability is at age eight. "Children shall be baptized for the remission of their sins when eight years old, and receive the laying on of the hands" (D&C 68:27). The laying on of hands is for the gift of the Holy Ghost.`
