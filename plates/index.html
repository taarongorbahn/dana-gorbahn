    id: "judge-not",
    section: "Church Talks",
    title: "Judge Not",
    date: "October 2013",
    location: "Kitimat, BC",
    notes: "",
    body: `During a trial, in a small Missouri town, the local prosecuting attorney called his first witness to the stand. The witness was a proper well-dressed elderly lady, the Grandmother type, well spoken, and poised. She was sworn in, asked if she would tell the truth, the whole truth and nothing but the truth, on the Bible, so helps her God.

The prosecuting attorney approached the woman and asked, “Mrs. Jones, do you know me?” She responded, “Why, yes I do know you, Mr. Williams. I’ve known you since you were a young boy and frankly, you’ve been a big disappointment to me.

You lie, cheat on your wife, manipulate people and talk badly about them behind their backs.

You think you’re a rising big shot when you haven’t the sense to realize you never will amount to anything more than a two-bit paper-pushing shyster. Yes, I know you quite well.”

The lawyer was stunned. Not knowing what else to do, he pointed across the room and asked, “Mrs. Jones, do you know the defense attorney?”

She again replied, “Why, yes, I do. I’ve known Mr. Bradley since he was a youngster, too.

He’s lazy, bigoted, has a bad drinking problem. The man can’t build or keep a normal relationship with anyone and his law practice is one of the worst in the entire state.

Not to mention he cheated on his wife with three different women. Yes, I know him.”

The defense attorney almost fainted. Laughter mixed with gasps, thundered throughout the courtroom and the audience was on the verge of chaos.

At this point, the judge brought the courtroom to silence, called both counselors to the bench, and in a very quiet voice said, “If either of you morons asks her if she knows me, you’re going to jail.”

Matthew 7:1 says, “Judge not, that ye be not judged”.

These words have been used by many who have the feeling and belief that, "You live your lifestyle and I’ll live mine; but don’t you tell me how to live mine."

This counsel from the Saviour, "Judge not, that ye be not judged" is uttered by a lot of people who really have no idea of what was meant.

In order to fully appreciate, comprehend and understand what is meant by this saying; it is important to read the verses earlier in Matthew.

(Matthew 5:20) Which says: "For I say unto you, That except your righteousness shall exceed the righteousness of the scribes and Pharisees, ye shall in no case enter into the kingdom of heaven."

We are told that we must be different than that of the Scribes and Pharisees.

Their type of righteousness was superficial; they did it so that it could be seen by men – it was not from the heart.

Ours must be different.

The Saviour was describing two different extremes which cause problems in our judgement.

The first extreme is judging with a harsh and critical spirit. The second extreme is permissiveness and tolerance.

In Matthew 7:2 - "and with the same measure (judgement) you use, it will be measured back to you."

As Jesus observed the religious situation of his day; he saw that judging others had become a great religious problem.

The Pharisees and Scribes set themselves in the position of being the ultimate critic of spiritual and temporal obedience.

They were quick to pass judgment on those who didn’t live up to their expectations.

When Jesus was in the house of Simon the Pharisee and the sinful woman anointed his feet, Simon said, "This man, if he were a prophet, would know who and what manner of woman this is who is touching him, for she is a sinner." (Luke 7:39).

The Pharisees, in their self-righteous arrogance, had created a special class of people called "sinners,”

The Saviour emphasised that their actions are not what we should exemplify.

It is overly critical; it is intensely focused on digging and searching for faults; and always suspecting the worst.

He is talking about judgement in a hasty, unloving, "holier than thou" type of attitude; and "jumping to conclusions".  These are at the very heart of gossiping.

Whenever we make a judgment, we do so based on what we have seen and sometimes that’s not enough to provide the whole picture.

Human judgment is limited to the information we are able to comprehend; and sometimes that is not enough to make an accurate judgment.

The First Nations have a saying: "Don’t judge a man until you’ve walked a mile in his moccasins." And there’s something to that.

There is a story about a newspaper reporter that was once searching for a story about the laziness that existed throughout the South, when he saw a man in his field, sitting in a chair and hoeing his weeds.

This had to be the ultimate in laziness. So he rushed back to his car to start his story when he looked back a second time and what he saw changed his entire outlook.

He saw that the pants legs on the farmer hung down loose -- the man had no legs. So what seemed at first to be a story of laziness turned into a story of great courage.

God once made the point that "… for the Lord seeth not as man seeth; for man looketh on the outward appearance, but the Lord looketh on the heart." (I Samuel 16:7).

That is why we do not have the right to sit in judgment on someone else’s motives - because we simply do not know what they are. Only the Lord knows all.

However, even though we are unqualified, we still find ourselves judging. And we often do so for selfish reasons; Why? Because it often makes us feel better.

If we have a problem with sin in our own lives, it appears to take a little pressure off ourselves when we point the finger at others for a while.

It may fool us to think that our sins are not so bad after all.

If I spend my time pointing my finger at your sin, my attention is distracted from my own sins; and that is the real danger of judging.

We’re all sinners; we have all fallen short of the mark; but remember, ultimately, the only sins over which I have control, are my own; and those are the ones that should command my greatest attention.

So when the Saviour said that we are not to judge. He is certainly not talking about the obvious things that we must and need to judge – like that of a judge in a courtroom, or the judging about open and obvious sin, or the personal judgement between good and bad.

We talked about the first extreme of which judging can be which is that harsh and critical spirit; but the other side or extreme - is permissiveness and tolerance.

Now some would argue that tolerance is a good thing – and it can; however – once on the other extreme in judging it allows for an acceptance of things that are wrong.

Those that argue up and down that we cannot or should not judge – over and over use the first five verses of Matthew 7, as their scriptural evidence.

They interpret that as meaning we cannot judge in any case, or in any setting.

If you are inclined to believe this - you are misguided.

Let us remember - Jesus doesn’t end His sermon about judging with the command "judge not".

He went on to say, "Give not that which is holy unto the dogs, neither cast ye your pearls before swine, lest they trample them under their feet..."

You see, we must use some kind of judgement to know who are the spiritual dogs and pigs.

In John 7:24, Jesus said, “Judge not according to the appearance, but judge righteous judgment”

In 1 John 4:1, it says, “… test the spirits, whether they are of God…"

These exhortations - demands that we must make a judgment of some sort.

So what is the message that the Saviour gives us, in this portion of the Sermon on the Mount?

I believe that it is a warning for us to avoid the extremes of judgment.

We need to be careful not to be harshly judgmental, looking for faults, taking the opportunity to look down on others from our position of self-righteousness.

But neither are we to overlook sin. We need to be able to recognize sin for what it is. Any attempt to overlook or justify sin on any grounds, is in itself wrong.

We live in a world in which many situations require us to make judgments that are often difficult.

We must judge well - when making critical decisions in each phase of our lives, such as choosing friends, finding an eternal companion, or choosing an occupation that will allow us to care for our family and serve the Lord.

Our righteous judgments about others - can provide needed guidance for them and, in some cases, protection for us and our families.

We should approach any such judgment with care and compassion.

We should always be sensitive to the Holy Spirit, who can guide our decisions.

Alma's counsel to his son Corianton is a helpful reminder, where he said: “See that you are merciful unto your brethren; deal justly, judge righteously, and do good continually” (Alma 41:14).

Elder Dallin H. Oaks said:

“… A righteous judgment will be guided by the Spirit of the Lord, not by anger, revenge, jealousy, or self-interest”

There once was a very critical, negative barber never had a good thing to say about anyone or anything.

A salesman came into his shop one day and told him he was going on a business trip to Rome.

The barber asked, “What airline will you be taking and what hotel will you be staying at?”

When the salesman told him, the barber criticized the airline for being undependable and the hotel for having horrible service.

“You’d be better off to stay at home,” he advised.

“But I expect to close a really big business deal and then I’m going to see the Pope.”  The barber continued, “Don’t count on seeing the Pope. He only sees important people.”

Several weeks later the salesman returned and stopped by the barber shop. “How was your trip?” asked the barber.

“It was wonderful,” the salesman said. “The airline was great, the hotel was excellent.”

“Did you see the Pope? What happened?”

The salesman said, “Oh yes! I even bent down and kissed his ring.”

“No kidding. What did he say?” asked the barber.

“Well, he placed his hand on my head and said to me, “My son, where did you ever get such a lousy haircut?”

Brothers and Sisters - when you judge, usually it will eventually come back to you.

I testify - that we should, no, we must - follow the council and direction of our Lord and Saviour – that we should never judge unrighteously –

That we be not like the Pharisees and the Scribes – that we, in times of judgement - may judge with care, with empathy, with benevolence, and with compassion.

May we have our lives filled with the Holy Spirit, who can guide our decisions.

Again - May we be merciful; deal justly; judge righteously; and do good continually.

I humbly pray and bear witness, in the sacred name of our Saviour, Jesus Christ, amen.`

    id: "reclaim-and-let-go",
    section: "Church Talks",
    title: "Reclaim and Let Go",
    date: "August 2013",
    location: "Prince Rupert, BC",
    notes: "",
    body: `Good Morning Brothers and Sisters.  It’s good to be here and representing the District.  Know that you are in our prayers and we wish the best for you.

I enjoy coming to Prince Rupert.  You are wonderful people and strength to my testimony.

Some of my ideas for my talk today comes from a wonderful Mormon Message that is entitled “Reclaimed”.  I encourage all of you, whether you have seen it already or not, to go home today and watch it in your homes.  It is powerful and bears truth of the opportunities that are yours and mine.

One of the reasons of why I come to Prince Rupert is not just because of my District assignments but also because of the golfing since I am our high school’s golf coach.

You have a wonderful golf course.  The beauty and enjoyment on that piece of property is great.

It has been told to me that this beautiful piece of earth was built on an old landfill.

Brothers and Sister, how many of you have seen or been to a landfill?  It’s filled with so much garbage – it’s dirty, it’s smelly, and it’s polluted.  Filled with undesirable things.

Many years ago, the golf course that I enjoy in Prince Rupert used to be that.  I would certainly not travel from Smithers to go to a place like that.

But as the City of Prince Rupert envisioned the potentials of this property, they reclaimed that land and made it into a place of beauty.

The definition for reclaim is:

To bring back, as from error, to a right or proper course – or to bring into or return to a suitable conditions for use.

I think that Brother Keene has lived here the longest and possibly when the golf course was a landfill – he probably has some of his garbage under the surface of your beautiful golf course.

Given this – would you think that Bro Keene would feel at some point that he might want to go back to the old landfill, with a shovel in tow; walk to the middle of the 15th hole and dig – ruining the surface that is enjoyed by all?  To find his old garbage that he had discarded many years ago? Of course he wouldn’t.

So if this would seem very illogical, unreasonable, and irrational – why is it, that we as human beings seem to bring up the dirt from the past – things that we have spent countless hours of regret, sorrow and anguish repenting of?

Christ has reclaimed our souls as we come unto him in a broken heart and contrite spirit; and submit to him as child to be forgiven of the dirty, the undesirable, and the unholy actions against his holy plan.

One of the clearest declarations of our faith is the Articles of Faith.  The third one teaches and proclaims, “We believe that through the Atonement of Christ, all mankind may be saved, by obedience to the laws and ordinances of the Gospel.” [A of F 1:3]

The Atonement offers redemption from spiritual death and from suffering caused by sin.

The story is told that Noel Coward, a well-known playwright, as a prank, once sent an identical anonymous letter to 10 notable men in London. The note said, "We know what you have done. If you don’t want to be exposed, leave town." Within 6 months, all 10 men that received the letter, moved!

Brothers and Sisters – the results of this prank, shows the tremendous power of guilt.

Not so very long ago, an old German man was feeling guilty about something he had done, so he decided to go to Confession.

He said, "Bless me, Father, for I have sinned. I feel terrible because during World War II I hid a refugee in my attic."

The priest said, "But that's not a sin! I wouldn't feel bad about that if I were you!"

"But I made him agree to pay me 50 Marks for every week he stayed."

The priest said, "Well, I admit that certainly wasn't the most noble thing to do, charging the man to save his life -- but you did save his life, after all, and that is a good thing. Don't worry about it too much; God forgives."

The man said, "Oh thank you, Father, that eases my mind. I have only one more question to ask you -- Do I have to tell him the war is over?"

Guilt is a horrible burden to bear and some have such heavy grime on their spirits that nothing seems to be able to remove it.

King David – who was once described as a man whose heart was as of God’s – he who has such promise - ultimately fell into serious transgression and sin.

And though David’s name is mentioned 57x in the New Testament - never once is his sins mentioned. Why? Because it was gone! He spent most of his life repenting of the wrongs that he made.

In 1 John 1:9 it says: "But if we confess our sins to him, He is faithful and just to forgive us and to cleanse us from every wrong."

Satan is the “enemy to all righteousness”; and so he plants doubts about the true happiness that comes from true repentance and the atonement.

Lucifer is laying traps and snares to catch us by the feelings and thoughts of needless guilt.

You may be a person who is a devoted mother or father, a loving friend, a faithful Church servant, and a frequent temple goer.

But in your heart, you may not be able to forgive yourself of sins committed years ago which you have repented of and fully resolved with priesthood leaders.

You may have doubts that your life will ever be acceptable to the Lord and have lost hope of eternal life in our Heavenly Father’s presence.

If you have any of these thoughts and feelings, know this - you can become as a little child and feel again “the great and wonderful love made manifest by the Father and the Son through His great atonement.

Childlike faith in the perfect love of Heavenly Father and Jesus Christ will “divide asunder” Satan’s snares of inadequacy, imperfection, and guilt.

Proverbs teaches, “For as he thinketh in his heart, so is he.”

May I suggest—in addition to consistent prayers, scripture study, and Church and temple attendance—four changes to your thoughts and heart to more fully feel the tender love of God and His precious gift of repentance.

See yourself as a precious child of a loving Father in Heaven.

Remember, you are the beloved son or daughter of Heavenly Father, created “in his own image,” and of immense value—so much so that Jesus Christ gave His life for you.

God the Father is merciful and has infinite love for you despite your faults.

Only the voice of Satan will cause you to feel of no value.

When you feel worthless, “remember the worth of souls is great in the sight of God.”

Please - refrain from repeatedly thinking or saying negative words about yourself—there is a clear difference between humility and humiliation.

Place your burdens on Jesus Christ.

When you feel overwhelmed by expectations and challenges, do not fight the battle alone. Follow the example of small children, and drop to your knees in prayer.

Jesus Christ has commanded us, “Look unto me in every thought; doubt not, fear not.”

The Savior promised, “Come unto me, all ye that labour and are heavy laden, and I will give you rest.”

Forgive yourself of sins and imperfections.

Heavenly Father is not expecting you to become completely perfect in this life. He knew His children would make mistakes as they learned from experience in mortality

Jesus said, “I, the Lord, will forgive whom I will forgive, but of you it is required to forgive all men.”

Brothers and Sisters - Start with yourself.

If God will not remember our repented-of sins, then why should we? Avoid wasting time and energy reliving the past.

To forgive yourself and others, you must trust the Atonement of Jesus Christ. If we do not forgive ourselves, are we then putting limitations on the power of Christ’s atoning sacrifice?

If guilt remains after sincere repentance, believe your priesthood leaders when they declare you to be worthy.

Lastly,

Sustain hope of eternal life.

Remember the promises made - As you do your best to be obedient and repentant, you too can receive a place in the celestial kingdom through the Atonement and grace of Jesus Christ.

Brothers and Sisters - For some reason, we think the Atonement of Christ applies only at the end of our mortal life – a redemption from spiritual death. It is much more than that.

This is not true - It is an ever-present power to call upon in our everyday life.

When we are racked or harrowed up or tormented by guilt or burdened with grief, He can heal us.

While we do not fully understand how the Atonement of Christ was made, we can experience it. We can experience “the peace of God, which passeth all understanding.”

The Lord promised, “A new heart … will I give you, and a new spirit will I put within you.”

I testify of Heavenly Father, who in great and wonderful love reaches out to each of His children.

I bear witness of Jesus Christ, who is “mighty to save” us from our inadequacies, imperfections, and sins.

I bear testimony of the Holy Ghost, who will accompany the imperfect yet repentant soul.

To you faithful and worthy Saints who struggle with latter-day snares of the devil, “may God grant unto you that your burdens may be light, through the joy of his Son.”

In the sacred name of him, even Jesus Christ, amen.`

    id: "family-jadyn",
    section: "Church Talks",
    title: "Family",
    date: "July 28, 2013",
    location: "Smithers, BC",
    notes: "Written for Jadyn",
    body: `Good Morning Brothers and Sisters.

The trends in American families during the past several years reveal that families all across America need healing in the home.

This past year 2.4 million couples exchanged the words or similar words in their wedding vows: “I take you to be my lawfully wedded spouse, to have and to hold from this day forward, for better or for worse, for richer or poorer, in sickness and in health; to love and to cherish until we’re separated by death. As God is my witness, I give you my promise.”

These couples were congratulated by well wishers with people clapping and blessing their new commitment to each other in marriage.

Yet this past year 1.2 million couples in the United States, for many different reasons, separated or divorced.

Families today look different than they did just 30 years ago. Thirty years ago the traditional family had a working father and a mother who stayed at home to care for their two children.

The traditional family made up 60 percent of all households in America. Today the so called traditional family reflects only 7% of our households.

Today the average American family has one child and both parents work outside the home.

Today parents are having fewer children and having them later.

More and more households are blended families with children coming from two or more marriages.

Cohabitation before marriage, is more common today than ever. One half of adults under 30 will live with someone before they get married.

The census bureau statistics show that couples who cohabitate before marriage are even more likely than others to get divorced.

Among couples who have been divorced and remarried, 60% of all second marriages end in divorce.

You can see that the trends of society are not following the directions and guidelines that our Father in Heaven desires.

God desires that all of His children come into the world as part of an eternal family with a mother and father who love and care for each other and for their children.

In the Booklet for the youth of the church, called “For the Strength of Youth” we have a section from it that discusses our Families.

In this section, it firstly refers to “The Family: A Proclamation to the World”, which says:

“The family is ordained of God. Marriage between man and woman is essential to His eternal plan. … Happiness in family life is most likely to be achieved when founded upon the teachings of the Lord Jesus Christ.”

I believe this.  I believe that as we use the gospel in our families, we will be stronger and closer to one another.

Being part of a family is a great blessing.

A man in a bar sees a friend at a table, drinking by himself. Approaching the friend, he comments, "You look terrible. What's the problem?"

"My mother died in August," he said, "and left me $25,000."

"Gee, that's tough," he replied.

"Then in September," the friend continued, "my father died, leaving me $90,000."

"Wow. Two parents gone in two months. No wonder you're depressed."

"Then last month, my aunt died and left me $15,000."

"Three close family members lost in three months? How sad."

"Then this month," continued the friend, "absolutely nothing!"

Our families can be, and should be, the greatest  blessing that life can bring.

Our family can provide us with companionship and happiness, help us learn correct principles in a loving atmosphere, and help us prepare for eternal life.

To have a strong family, it requires effort; but that effort is worth it.

A young man at this construction site was bragging that he could outdo anyone based on his strength. He especially made fun of one of the older workman. After several minutes, the older worker had enough.

"Why don't you put your money where you mouth is?" he said. "I'll bet a week's wages that I can haul something in a wheelbarrow over to the other building that you won't be able to wheel back."

"You're on, old man," the young man replied. "Let's see what you've got."

The old man reached out and grabbed the wheelbarrow by the handles. Then nodding to the young man, he said with a smile, "All right. Get in."

We not only have to work hard and provide a lot of effort in the developing of our families, but we also have to be smart.

Our families will be blessed as we do our part to strengthen it.

We are asked to be cheerful, helpful, and considerate of family members. Many problems in the home come from family members speaking and acting selfishly or unkindly.

We should seek to be a peacemaker rather than to tease, fight, and quarrel.

We should show love for our family members each day; share our personal testimonies with our family through not only our words, but also in our actions.

Our righteous example can make a difference in strengthening our families.

One thing I will strive to do; is honor my parents by showing love and respect for them. Obey them as they lead me in righteousness.

We must be willingly, and enthusiastically helping in our homes.

We should contribute in wholesome family activities and traditions; join our family in family prayer, family scripture study, and family home evenings.

I believe that by keeping these commandments, it will strengthen and unify our  families.

Our leaders ask us to increase our relationships with your brothers and sisters.

They can, and should become our closest friends.  We should support them in their interests, and help them with challenges they may be facing.

I love my family.  I love the blessing that come from being a part of it.  I hope that I will always remember and keep sacred the relationships that I have with each of my family members.

My dad and I have an agreement that I will remember this as I grow older and become an older teenage daughter.

The Doctrine and Covenants tells us, “But I have commanded you to bring up your children in light and truth.”

May we do all we can; whether we are a parent or a child, to enjoy the light and truth of the gospel in our homes.

May our homes truly become places of refuge from the world.

May we be able to welcome and maintain the Spirit of the Lord in our homes to strengthen our families; so that each of our family members may stay on the “strait and narrow path which leads to eternal life”

I submit to you, and pray, in the name of Jesus Christ, amen.`

    id: "christmas-2013",
    section: "Church Talks",
    title: "Christmas 2013",
    date: "December 22, 2013",
    location: "Smithers, BC",
    notes: "",
    body: `Good morning brothers and sisters.  I bring you a special Christmas Greeting from Pres. Slocombe ….

I thought that I might speak to something that I don’t think too many people give much thought to; but is certainly an intriguing lesson for us.

It is about the wise men who began a long trip to Israel simply because they saw a particular star in the sky, which alerted them of the birth of the king of the Jews.

They traveled for several months to finally meet the Christ child in person.

It is easy to conclude that the story of these wise men, would have been a bit different if these wise men, had been wise women.

They would have asked for directions before they arrived in Jerusalem to alert the evil King Herod.

They would have arrived on time and helped with the delivering of the newborn.

They would have cleaned the stable and brought something practical for the family– like a casserole, diapers, and baby wipes.

Today, I would like to take away some simple gospel truths from this part of the Christmas story.

One thing that strikes me, is that God makes every effort to reach out and communicate to every person, whether far or near.

In this case, God used the star to reach these astrologers in order to bring them to the newborn.

The first time we hear of these wise men is when they arrive in Jerusalem, the Jewish capital.

Where we read, “There came wise men from the east to Jerusalem, Saying, Where is he that is born King of the Jews? for we have seen his star in the east, and are come to worship him”

These wise men were on a mission, to find the newborn king of the Jews and to ultimately, worship him.

What is fascinating about these men, is what they have to teach us about God.

Even though these men were not Jews, God still beckoned them to come and worship the Messiah.

They were Magi, which was a combination of a learned scientist, astrologer, and magician. They were the academicians of their time; hence the name “Wise Men”.

God called them – those that were not one of the Jews. He called upon them – and they listened.

What this shows us, is that God never abandons anyone. No one is ever too far gone, that He will not reach out to them.

God never gives up on anyone and he uses whatever means He can to help lead them to Christ.

In this case, God sent them a message, using a cosmic event, a star, to signal to them that they needed to search for the child born as king of the Jews.

God used a language, or method, of which they understood.

Perhaps if an angel had appeared to them like the shepherds, it would have been misinterpreted, but God knew the best way to reach astrologers, was through a star.

So - God used the star as a way to bring these Wise Men to Christ.

Brothers and Sister – God uses means that are relevant to us personally.  Remember - He who hath ears, let him hear; and he that hath eyes, let him see.

May we use these gifts to be enlightened and be blessed by His gospel.

I think the second thing this story teaches us - is that God wants us to diligently seek him.

By this, I mean, that we must seek out a relationship with our Father in Heaven and with His son, Jesus Christ.

There is a danger to feeling that all we need to do, is to know Him.

The truth is, that we can have all the knowledge of the scriptures; we can follow His commandments; and still miss what true discipleship is.

These Wise men; pagan astrologers, with only partial information about a Jewish Messiah set off on a journey of faith to find the Christ, the king of the Jews;

A journey which is estimated at 500-1000 miles long. It may have taken them 3 months perhaps even longer to get to Bethlehem.

That journey cost them time, money, and it cost them their precious gifts.

These Wise Men only had partial knowledge about the Bible and the Jewish Messiah because otherwise they would have known to look for the infant in Bethlehem; but they had faith, and made an effort to seek out the Christ child.

On the other hand, we see that the religious community in Jerusalem. The people with a firm grasp on the Bible, people who lived out the letter of the law as written in the scriptures.

They did all of the rituals and followed all of the commandments. They knew about God from their Holy Scriptures.

Yet, when the Wise Men showed up, Herod and these religious leaders, were stunned to find out the Messiah had been born, in fact it says they were “disturbed,” or “troubled” upon hearing the news.

They had either not seen the star in the sky, or were unable to interpret its meaning. They had no clue their king had been born, and it had to take some pagan, Gentile, astrologers to tell them about the Messiah.

You can only imagine how that would have gone over. Imagine how it would go over today if a practitioner of witchcraft or magic, came to church today to tell us that Christ has returned and was in our midst; but we missed it because we were more concerned about following some part of the Gospel, than fully seeking God and having a relationship with Him.

Unlike the wise men who have traveled hundreds of miles to worship the Christ, the religious leaders couldn’t even travel six miles to seek out and worship the Him.

We can have knowledge of many things that pertain to the Gospel; we can even have deep religious convictions; we can even live out God’s commands to the letter; yet still miss the point.

Our Father in Heaven is seeking a relationship with us through his Son Jesus the Christ, and he wants us to seek him.

Remember - when we seek him; we will find him. The Saviour promised, “Seek and ye shall find, knock and the door shall be opened unto you.”

The author of Hebrews wrote, “But without faith it is impossible to please him: for he that cometh to God must believe that he is, and that he is a rewarder of them that diligently seek him (Hebrews 11:6).”

And when we find Him, meaning have a relationship with the Father through Christ, everything else falls into its place. The Wise Men were rewarded for their journey of faith to meet the new born Christ.

When we come to church; when we live good lives; when our primary focus is on seeking Christ; to search after him; to try draw nearer to him; it is through these, that we exhibit and demonstrate our faith in being a diligent seeker of Him.

Once the wise men reached the newborn Christ, the scriptures say that the first thing they did was worship, just like the shepherds had done.

In Matthew 2:11 we read, “And when they were come into the house, they saw the young child with Mary his mother, and fell down, and worshipped him: and when they had opened their treasures, they presented unto him gifts; gold, and frankincense, and myrrh”

They bowed down and worshipped. One way to worship was to bow low before another. It signaled ones submission to the other as having authority over them.

This is important for us to remember that we need to submit ourselves to the Father and His Son.

They presented an offering, of which three gifts were presented to the Child as a sign of worship.

So please remember, that as you worship, you too, should provide an offering.

The gifts which these Wise Men brought were very valuable; and they were given at great cost to themselves.

The Christ deserved a gift worthy of his kingship.

The first of course is gold, a treasure deserving of a king.

The second, frankincense was a fragrant scent offered up to God during sacrificial worship, it could only be offered to God by a priest (and we know that Jesus is called our high priest).

Lastly, myrrh was used as an oil to prepare a body for burial. In fact myrrh was used to embalm Jesus when he died.

Who knows?  Maybe it was the same myrrh he had received from these wise men.

It was a gift symbolizing the preservation of life after death. It was a gift for a Savior who would die for us all.

Each of these gifts came at a significant cost to the bearers. Worship should cost us something.

What do we bring; or what do we offer to our Lord and Saviour, which is costly to us? What do we lay at his feet?

Further in Matthew (2:12) it tells us, “And being warned of God in a dream that they should not return to Herod, they departed into their own country another way”

The journey to the Christ and their reward of faith had taught them to remain open to God’s promptings.

There is never a point in our mortal lives when we can say that we’ve received all that the Father has; that we have all knowledge or understanding of the Gospel.

We need to seek Him, we need to worship Him, but know this … these are not one-time events. We must continue to remain open to God’s guidance, persuasions, and directions.

Even though the wise men had found the Christ child and had worshipped him, they weren’t done. It wasn’t, “okay I did my duty, I’m glad that is over, now let’s get back to regular life.”

Their seeking didn’t end with meeting the newborn Christ. They continued to remain open to God.

Our Father in Heaven gave them a message in a dream.

Remember these are men whose job it was to interpret dreams, and so God spoke to them again in a way they would understand.

They recognized this dream as a message from God and they obeyed. They didn’t go back to tell Herod, because they now knew the true intents of that wicked king.

The point is clear for us. Just because we have sought Christ, and found him, doesn’t mean we are at the end of our journey. It is only the beginning.

Our Father wants us to be open to the promptings of His Holy Spirit.

It may not be a dream, but God still speaks to us in other ways such as His Holy Scriptures; through prayer; through counsel of a modern day prophet; to guide us, persuade us, and direct us aright.

He will lead us away from danger and to stay focused on His plan ... His plan of salvation, of happiness, of exaltation.

Brothers and Sister – I so testify that God continues to speak to us, to let us know where we need to be, and where we should not be; but we have to be willing to listen to Him through prayer, and through His sacred messenger, the Holy Ghost.

Ask yourself, at what place are you at today? Are you the one far from God that is hearing the calling to come seek his Son?

Remember God continues to seek you no matter where you come from, and no matter what you have done.

If you are here at this sacrament meeting, it is a very good place to begin that journey.

Brothers and Sisters, remember - God promises that if you seek him, you will find him and be rewarded for your journey of faith.

Don’t ever give up on that journey, because God has not given up on you.

And what do you offer to Him?

I can tell you what he wants the most, it’s not your money, or your time; however, God does want you to pay those tithes and offerings of service - but what he really wants - is you, all of you, every part.

I can’t help but think of my son Kai (or all those missionaries that serve throughout the world), as he embarks in the service of his God, and in the service of his Saviour.  I think of his offering.

His gift, his offering of gold, frankincense, and myrrh – is all of himself.  For this I give thanks and know that my Father in Heaven is looking down with teary eyed; which are filled with love, adoration, and honor.

The message of Christmas is not just a story of the birth in a stable, the Wise Men, the shepherds, or the flight into Egypt. The message of Christmas is also a celebration of the Atonement and the Resurrection that the birth of the Savior made possible.

President Thomas S. Monson taught “Giving, not getting, brings to full bloom the Christmas spirit,”

With the birth of the babe in Bethlehem, there emerged a great endowment, an endowment of power stronger than weapons, and a wealth more lasting than the coins of Caesar.

This child was to be the King of kings, the Lord of lords, the promised Messiah, even Jesus Christ, the Son of God.

Since that time, the spirit of giving gifts has been present in the mind of each Christian as they commemorate the Christmas season.

The Christmas spirit is the Christ spirit; it is the spirit of the gospel of Jesus Christ, obedience to which will bring ‘peace on earth,’ because it means—good will toward all men.

Remember, the real spirit of Christmas lies in Christ’s assurance: “I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live: And whosoever liveth and believeth in me shall never die” (John 11:25–26).

May our Heavenly Father bless us … with the desire to serve, the patience to prepare, and a willingness to labor, that all of us, and all who comprise this royal army of God – that we may merit His promise: “I will go before your face. I will be on your right hand and on your left, and my Spirit shall be in your hearts, and mine angels round about you, to bear you up.” (D&C 84:88.)

I close with the words of the prophet, President Harold B. Lee: “Life is God’s gift to man. What we do with our life is our gift to God.”

I testify of His life.  The words, “Joy to the World” can come to all mankind with this knowledge – to those that know, feel, and experience, that simple truth that - He is our Saviour.

May we come to really know Him.  May we give generously to Him, as He has so abundantly has given to us.  I so pray, in the sacred name of our Saviour, even Jesus Christ, amen.`

    id: "christ-is-my-foundation",
    section: "Church Talks",
    title: "Christ is my Foundation",
    date: "April 21, 2013",
    location: "Terrace, BC",
    notes: "",
    body: `Good Morning Brothers and Sisters.

There is a building called the Wexner Art Center at the Ohio State University.

It is a fascinating building designed in the post-modernist view of reality.  The building has no pattern. Staircases went nowhere.  Pillars supported nothing.

The architect designed the building to reflect how he saw life. It went nowhere and it was mindless and senseless.  The question was asked as to whether or not the foundation was built in the same manner, without pattern or design?

What would happen if that were the case?

While serving my mission in England, each morning I would look out the window of our kitchen of our flat in Liverpool, looking off to the mountains of Wales (far from being mountains to our standards).

Just behind our flat was a residential complex that was built only less than 10 years from when I served there.

This residential complex had won global awards in artistic architectural design.  But within just short years, what many believed to be a home of wonder and awe, became a wasted accumulation of concrete ruins.

No one lived there anymore.  Many nights we would look out that same window to see one of the units on fire here, and one there.

What happened that made such a seemingly magnificent complex to become a wasteland?

Foundation!

Any contractor will tell you that a building is only as good as its foundation. If the foundation is faulty, the building is doomed.

Our Saviour tells us that everyone builds on some kind of foundation, but not every foundation is a good one. For example, He tells the parable of 2 men who built on two different foundations:

• A wise man built upon a foundation of rock and his house stood in the storm

• But the foolish man built his house on a foundation of sand and the rain washed it away

During an earthquake that occurred many years ago, the inhabitants of a small village were very startled, scared and frightened; yet there were some that were also surprised, at the calmness and apparent joy of an old lady, whom they all knew.

After a few moments following the event, one of them, addressed the old lady, and said, “Why are you not afraid?”

“I am not afraid, and do you know why?” she replied, “Because I rejoice to know that I have a God that can shake the world.”

As we look around us we see serious economic concerns; political unrest in much of the world; drug abuse; domestic violence; and the list goes on.

The world around us shakes and our hearts cry out for sure footing, for a sure foundation; for certainty in uncertain times.

In times of uncertainty, we are not left without hope. As believers in the resurrected Saviour, we are not like so many sailors drifting at sea in the storm.

We are not alone in the storms of this life. We have a sure footing and a sure foundation.

The Persians tell a story about an unhappy king. In an attempt to find the answer to his dissatisfaction, he consulted his astrologers who told him he could find happiness by wearing the coat of a perfectly happy man.

Immediately the king set out on his quest. He knocked at the doors of the very rich, for it seemed logical to find happiness there, but in vain.

He visited the institutions of higher learning, thinking the philosophers must be happy in their wisdom. That, too, proved to be a dead end.

Finally he stumbled across a common laborer singing at his work who confessed he was perfectly happy. “Sell me your coat,” cried the king. “I’ll give you a bag of gold for it.” But the laborer only laughed and said, “I’d gladly give it to you, Sir, but I have no coat.”

This is only a legend of course, but it illustrates a profound truth.

Achieving riches is not synonymous with achieving happiness. That doesn’t mean the rich have to become poor in order to be happy. The ranks of the happy include the poor and the rich, as well as those in between.

True happiness comes from one source.  It is the knowledge that we are here for a special purpose, to be saved from our sins. To live obediently to the commandments of our Father and live in His rest for eternity.

There is but one Sure Foundation upon which the difficulties and disasters of this world can look to in hopes of better things.

President Hinckley said,

“If we do not have a deep foundation of faith and a solid testimony of truth, we may have difficulty withstanding the harsh storms and icy winds of adversity which inevitably come to each of us.

“Mortality is a period of testing, a time to prove ourselves worthy to return to the presence of our Heavenly Father. In order for us to be tested, we must face challenges and difficulties. These can break us, and the surface of our souls may crack and crumble—that is, if our foundations of faith, our testimonies of truth are not deeply embedded within us.”

Isaiah prophesied of the foundation when he wrote: “Therefore thus saith the Lord God, Behold, I lay in Zion for a foundation a stone, a tried stone, a precious corner stone, a sure foundation; he that believeth shall not make haste.” (Isaiah 28:16)

This passage of scripture is prophetic in every way.  It pointed to the coming of the Messiah, even Jesus Christ.

In Mark 12, Christ calls Himself the measuring stone, or, the cornerstone.

The cornerstone, is not only the first stone placed upon which the rest of the building is built; it is the first stone laid for the foundation.

Builders would get a stone from the quarry and chisel it carefully to get as near a right angle as possible.

They would calculate the placement of all the other stones against that cornerstone, that first measuring stone.

It was the standard by which all the walls of the building were determined.

When Jesus Christ is called the cornerstone, it is saying that all things should be measured to Him.  To build upon Him; to pattern our lives upon Him.

His church was patterned upon Him; His life, His example; His authority.

We live in a world where this truth is often elusive, like shifting sand.

Just west of Yuma, Arizona lay the Imperial Sand Dunes. This region extends for more than 40 miles wide and 40 miles long.

The dunes are really an interesting phenomena of that part of the Arizona and California desert.

Over the years the dunes shift.

In 2002 these sand dunes were on the borders of Yuma.  Within less than 10 years, those same sand dunes are more than 10 miles away, across the border into California.

So it is with the things of this world. God measures all things according to the measurement of the chief cornerstone, that is, our Saviour.

He is firm. He is lasting. He is secure. Christ is certain and unchanging in a world of shifting sand.

In Matthew 28:20 it says, “Lo, I am with you always, even unto the end of the world.”

Regardless of the uncertainties of this life, our Saviour remains unchanging. Amidst the shifting sands, insecurity, and turmoil within us and around us, He is our refuge.

It is our Saviour’s love and atonement, that keeps us balanced while our boats are tossed about on the sea.

It is our Saviour’s love and atonement that keeps us in harmony with Him amidst the beckoning of the world’s many voices which seeks to pull us away.

Have you ever watched a symphony orchestra as a performance is about to begin?

The musicians sit and stand about, strumming on strings, blowing into horns, beating on drums. There is a lot of noise, but no music.

Then the conductor enters. He walks to his podium and steps up onto it.

His eyes sweep the ensemble before him.

He lifts his baton, pauses there for a moment, and then he gives the downbeat. Instantly there is music; all instruments blend into one harmonious wonder.

Our human spirits are a lot like symphony orchestras. Within us there may be conflicting elements, warring factions that pull this way or that, and we are out of focus, out of tune – we are just not together within.

As an orchestra needs a master control, so do we. When we turn the whole focus of our attention to our Lord and Saviour; and acknowledge that He is in command, our lives will give forth harmonious music.

In a world where promises are not always secure, where riches fail, where the future is unknown, where life is uncertain, and where earthly glory fades as quickly as it comes; Christ alone is our chief cornerstone; our certainty in an uncertain world; the steadfast measure of all things.

Pres. Hinckley also said, “Remember that you do not walk alone. … As you walk through life, always walk toward the light, and the shadows of life will fall behind you. …”

He also pointed out a particular word from the scriptures that stood out to him as he studied them.

The word is ‘come.’ The Lord said, ‘Come unto me.’ He said, ‘Come learn of me.’ He also said, ‘Come, follow me.’

Brothers and Sisters, my plea is that we would come to the Lord.

We are blessed.  We truly are.  We are here living a great plan.  We will rise and we will stand.  We will be steadfast as we live our lives upon the foundations of our rock and Redeemer.

Let us be steady and true, as we prosper in the good works that we were sent here to do.

Like a million stars lighting up the night, we will be strong and we will be true.

I humbly pray and bear solemn testimony of these truths, in the sacred name of our Saviour, whom I love and adore, even Jesus Christ, Amen.`

    id: "candlestick-jadyn",
    section: "Church Talks",
    title: "Candlestick",
    date: "February 10, 2013",
    location: "Smithers, BC",
    notes: "Written for Jadyn",
    body: `In Matthew 5:14-16, we read, “Ye are the light of the world. A city that is set on an hill cannot be hid.  Neither do men light a candle, and put it under a bushel, but on a candlestick; and it giveth light unto all that are in the house. Let your light so shine before men, that they may see your good works, and glorify your Father which is in heaven.”

It’s very easy when we live in such a world that seem dark, that sometimes we forget that we are the light. We forget that as God’s people we are called to be that light.

We have a great gift that has been given to us by taking upon us the light of Christ, which allows us to no longer walk in darkness, but walk in the light.

It’s by our light, that others see, in us, the glory of God.

In the scripture that I read earlier, Jesus calls us the “light of the world”.  He asks us, to shine.

By becoming lights in a dark world we become noticeable. And like the city set on a hill, it cannot be hidden.

Because light shines out in darkness, others can look to us, and they may seek to have what we have.  They may crave the light that has been given to us.

It is through our light, that ensures that Christ’s light is given.

We will on occasions fail, but our Saviour will always be there to pick us up and reignite the light in us. But we must always be striving, willing to change to become more like the person we are destined to be.

It is much easier to be light in church on a Sunday, there’s no darkness to put out our flame.

But God does not look to us to be strictly lights among other lights.

He looks to those who become lights in darkness.

He looks for those who can take the light into the world, to those who may have lost their way.

He looks for those who can become guiding light for his lost sheep.

God is looking for those who will step out and make a difference to those without hope, without revelation.

In 1 Peter 2:9 said, “But you are a chosen generation, a royal priesthood, a holy nation, a people for possession, so that you might speak of the praises of Him who has called you out of darkness into His marvellous light”

We have received light from our Saviour, we are a chosen generation that can and should declare His light to all the world.

Some nights we can go outside and see the full brightness of the moon shining down on us. Other nights we can go out and not see the moonlight, we know the moon is still there, shining and reflecting the light of the sun, but there are clouds that hide the light.

Brothers and Sisters, please do not let other peoples’ influences produce clouds of fear or anger to hide your light.

The world is dark enough without yet another light being dimmed.

The real you does not only show itself when you come here to church, it does not only show itself when things are going well.

The real you really shows itself when you are at work, when you are at home, or at school.

The real you shows itself during times of difficulty.

Brothers and sisters, during times of difficulty, does your light get smothered by the darkness? Or does the darkness disappear because your light shines so bright?

Our light shines not only in our words but also in our actions.

How bright our light shines is determined not by how much we love God, but it is determined by the amount of love that we have for each other.

If we strive to follow Jesus, to become perfect, as both our Saviour and our Father is perfect in Heaven, then He will give us opportunities to shine brightly.

It’s never easy to do these things but this is the way Jesus tells us to live, without judgment, without anger, without unforgiveness.

But I know that our Saviour will be with us and that His light will be reflected off of us to others, just like the moon reflects the light of the sun.

I challenge all of you to make sure that your light shines bright so that our Saviours light will shine also.

In the name of Jesus Christ Amen.`

  {
    id: "spirit-of-revelation",
    section: "Church Talks",
    title: "Spirit of Revelation",
    date: "February 10, 2013",
    location: "Smithers, BC",
    notes: "",
    body: `Good Morning Brothers and Sisters.

It’s good to be here with you as a District speaker.  I send you all the best wishes and love from our District President, President Slocombe.  We pray for your spiritual and temporal well-being.

I am so proud to listen to my daughter accepting the calling to speak with me today and do such a wonderful job with it.

One day God was looking down at Earth and saw all of the evil that was going on. He decided to send an angel down to Earth to check it out. So he called one of His best angels and sent the angel to Earth for a time.

When she returned she told God, yes it is bad on Earth, 95% is bad and 5% is good.

Well, he thought for a moment and said, maybe I had better send down a second angel to get another point of view.

So God called another angel and sent her to Earth for a time too.

When the angel returned she went to God and told him yes, the Earth was in decline, 95% was bad and 5% was good.

God said this was not good. So He decided to E-mail the 5% that were good and He wanted to encourage them, give them a little something to help them keep going.

Do you know what that E-mail said?

You didn't get one either ... huh?

Our cameras and technology keeps getting better – look at the new High Definition TV sets out there.

They really are remarkable, with the detail they reveal. In fact, TV stars are now worried because they have to use extra make-up for fear that every spot and blemish will be revealed through this new technology.

Now wouldn’t it be great if God did us this new technology with it clear vivid images or black and white text of an email to communicate and give direction to all of us?

People are always saying - "you know if God would just come down and show Himself then we’d be satisfied and give up on all these wordly things and embrace Him."

Brothers and Sisters, as Jadyn spoke in her talk, we too need to ensure that we are a reflection of Him.  A reflection of our Saviour who too is an image of our Father in Heaven.

There are many examples of spiritual lights. There is Light of Christ; there is Discerning Light; and there is the Light of Revelation.

I choose to talk about the later, the Light of Revelation.

There used to be a man who had the passion to see and experience God in an intimate way. He used to pray like this always: “Lord, please reveal yourself to me”.

As he prayed like this, one night he saw a dream. In that dream he saw himself in a new city.

He was traveling throughout that city, asking the people of that city about its shape, its beauty and glory.

Different people were giving different opinions about that city. While he was confused and thinking about this, he saw a noble man approaching him.

The noble man came to him and said, “I know you are confused. But if you really want to know the answer, do as I say.

There is a very high mountain just outside the city. If you go there and can climb that mountain, then you can see the whole city for yourself and decide whether it is beautiful or not.

But remember that climbing the mountain is very hard and risky and may even bring danger to your life.”

After hearing these words the man went to the mountain and started climbing it with great difficulty. He reached the mountain-top after facing life-threatening situations.

But when he reached the peak, he got a majestic, breath-taking and wonderful view of the city. The city was so beautiful. He responded with wonder and joy.

At that time he heard a voice from above saying, “Now because you have seen the glory of this city, go and proclaim the truth about it.”

When he came down the mountain, the noble man who guided him to this mountain again came to him and said, “Think about this vision and you will find the answers to your prayers. You will understand how God reveals himself. You will also understand how to respond to that revelation”.

Then the man’s dream stopped.

Now, we will come back to this man’s dream in the end. But, isn’t it true that many of us have the desire to know God and His will; and to experience His power and glory.

We have seen how Jesus was misunderstood by his own people, by the political elite and by the crowds. We have also seen how Jesus revealed himself to his disciples in the midst of these misunderstandings.

Let’s look at one of those experiences.  Matt 16:13-19 –

“When Jesus came into the coasts of Caesarea Philippi, he asked his disciples, saying, Whom do men say that I the Son of man am?

And they said, Some say that thou art John the Baptist: some, Elias; and others, Jeremias, or one of the prophets.

He saith unto them, But whom say ye that I am?

And Simon Peter answered and said, Thou art the Christ, the Son of the living God.

And Jesus answered and said unto him, Blessed art thou, Simon Barjona: for flesh and blood hath not revealed it unto thee, but my Father which is in heaven.

And I say also unto thee, That thou art Peter, and upon this rock I will build my church; and the gates of hell shall not prevail against it.

And I will give unto thee the keys of the kingdom of heaven: and whatsoever thou shalt bind on earth shall be bound in heaven: and whatsoever thou shalt loose on earth shall be loosed in heaven.”

It is by this example that we should recognize the divine right and opportunity that we all have.  Christ’s church is not built on Peter.  It is built on revelation.

Remember, the gates of hell cannot prevail against that revelation. And how blessed are you if you too have His will revealed to you?

Revelation is communication from God to His children on the earth and it is one of the great blessings associated with the gift and constant companionship of the Holy Ghost.

The Prophet Joseph Smith taught, “The Holy Ghost is a revelator,” and “no man can receive the Holy Ghost without receiving revelations”

Elder David A. Bednar gave some good examples of some patterns of revelation:

Consider two experiences most of us have had with light.

The first experience occurs as we entered a dark room and turned on a light switch.

Remember how in an instant, a bright flood of illumination filled the room and caused the darkness to disappear.

What previously had been unseen and uncertain became clear and recognizable. This experience was characterized by immediate and intense recognition of light.

The second experience takes place as we watched night turn into morning.

Do you recall the slow and almost undetectable increase in light on the horizon?

In contrast to turning on a light in a dark room, the light from the rising sun does not immediately burst forth. Rather, gradually and steadily - the intensity of the light increased, and the darkness of night was replaced by the radiance of morning.

Eventually, the sun emerges over the skyline.

But the visual evidence of the sun’s impending arrival was apparent hours before the sun actually appeared over the horizon. This experience was characterized by subtle and gradual discernment of light.

From these two ordinary experiences with light, we can learn much about the spirit of revelation.

Revelations are conveyed in a variety of ways, including - for example - dreams, visions, conversations with heavenly messengers, and inspiration.

Some revelations are received immediately and intensely just as the flick of a light switch; while others are recognized gradually and subtly, like the sunrise.

The two experiences with light I described help us to better understand these two basic patterns of revelation.

A light turned on in a dark room is like receiving a message from God quickly, completely, and all at once.

Many of us have experienced this pattern of revelation as we have been given answers to sincere prayers or been provided with needed direction or protection, according to God’s will and timing.

Descriptions of such immediate and intense manifestations are found in the scriptures, recounted in Church history, and evidenced in our own lives.

Indeed, these mighty miracles do occur. However, this pattern of revelation tends to be more rare than common.

The gradual increase of light radiating from the rising sun is like receiving a message from God “line upon line, precept upon precept” (2 Nephi 28:30).

Most frequently, revelation comes in small increments over time and is granted according to our desire, worthiness, and preparation.

Such communications from Heavenly Father gradually and gently “distil upon [our souls] as the dews from heaven” (D&C 121:45).

This pattern of revelation tends to be more common than rare and is evident in the experiences of Nephi as he tried several different approaches before successfully obtaining the plates of brass from Laban.

Ultimately, he was led by the Spirit to Jerusalem, “not knowing beforehand the things which [he] should do” (1 Nephi 4:6). And he did not learn how to build a ship of curious workmanship all at one time; rather, Nephi was shown by the Lord “from time to time after what manner [he] should work the timbers of the ship” (1 Nephi 18:1).

President Joseph F. Smith explained how this pattern of revelation occurred in his life, he says:

“As a boy … I would frequently … ask the Lord to show me some marvelous thing, in order that I might receive a testimony. But the Lord withheld marvels from me, and showed me the truth, line upon line … , until He made me to know the truth from the crown of my head to the soles of my feet, and until doubt and fear had been absolutely purged from me. He did not have to send an angel from the heavens to do this, nor did He have to speak with the trump of an archangel. By the whisperings of the still small voice of the spirit of the living God, He gave to me the testimony I possess…”

There are many who question the strength of their personal testimony and underestimate their spiritual capacity because they do not receive frequent, miraculous, or strong impressions.

If you have had similar thoughts or doubts, please know that you are quite normal. Just keep pressing forward obediently and with faith in the Savior.  And as it says in D&C 80:3, As you do so, you “cannot go amiss”

Sometimes the sun rises on a morning that is cloudy or foggy and because of the overcast conditions, perceiving the light is more difficult, and identifying the precise moment when the sun rises over the horizon is not possible.

But on such mornings, we nevertheless have sufficient light to recognize a new day and to go on our way.

This is another common experience with light that helps us learn an additional truth about the “line upon line, precept upon precept” pattern of revelation.

Now back to the man we talked about earlier - He began pondering on the dream. As he pondered on the dream, he got the answer. The glory of the city represented the glory of God.

Climbing the mountain represented the increasing difficulties in his life. Just as he was able to see the glory of that city only after climbing the mountain.

In a similar manner, we could be able to see the glory of God or the revelations that are His, after facing great perseverance.

And we can look upon any degree revelation in awe and wonder.

Moreover, he was given the responsibility of proclaiming the glory of that city to those who have all kinds of misconceptions about it.

My dear brothers and sisters, God has chosen us to be His disciples to proclaim that glory.

As you appropriately seek for and apply unto the spirit of revelation, I promise you will “walk in the light of the Lord” (Isaiah 2:5; 2 Nephi 12:5).

As I said before, sometimes the spirit of revelation will operate immediately and intensely, other times subtly and gradually, and often so delicately you may not even consciously recognize it.

But regardless of the pattern whereby this blessing is received, the light it provides will illuminate and enlarge your soul, enlighten your understanding (see Alma 5:7; 32:28), and direct and protect you and your family.

I declare my witness that the Father and the Son live. The spirit of revelation is real—and can and does function in our individual lives and in The Church of Jesus Christ of Latter-day Saints.

I testify of these truths in the sacred name of the Lord Jesus Christ, amen.`

    id: "crossing-the-goal-line",
    section: "Church Talks",
    title: "Crossing the Goal Line",
    date: "September 9, 2012",
    location: "Terrace, BC",
    notes: "",
    body: `Brothers and Sisters, I enjoy listening to stories about people who will not give up; stories of those who stay the course even though the “going gets tough” and they can be a source of great inspiration to all of us.

A couple of weeks ago, I first hand experienced an event which brought a tear to my eye.  An event which showed perseverance, determination, and resolution.  My son, Kaleb found himself in 2nd place, half way through the 3 day golf tournament; at which point, he inadvertently struck a rock where his ball was lying.  Pain shot through his hand and wrist.  Each successive shot brought that intensified agony with far from less desirable results.  He was counselled and encouraged to pull out of the tournament; but he would have nothing to do with it.  He was not going to quit.  He wanted to finish.

We talk about “Crossing the Goal Line, Finishers Wanted”.  By this, we want to impress upon you the spiritual importance of your challenge and privilege, to take that journey back to our Heavenly Father and enjoy all that He has.

So many people honestly think that coming to know Jesus … being saved … is the end result of their spiritual journey. They could not be further from the truth!

Matthew 7:14 – “Because strait is the gate, and narrow is the way, which leadeth unto life, and few there be that find it.”

All of us, who have exercised faith in Jesus Christ and have been baptized, have entered the gate which puts us onto the path which leads back to our Father in Heaven.

Knowing our Saviour and accepting baptism is only the beginning … it is the beginning of a lifelong race of faith. There are many spiritual “miles” that we must travel before this race of life and faith is over. And it may not be easy.

Grete Waitz - a Norwegian marathon runner and winner of 9 New York Marathons said, “For every finish-line tape a runner breaks - complete with the cheers of the crowd and the clicking of hundreds of cameras - there are the hours of hard and often lonely work that rarely gets talked about.”

Our life is not compared to a wind sprint, but to a marathon. In a wind sprint you run as fast as you can for a short distance, and speed is the critical factor.

But in a marathon, endurance is the critical factor.

As important as it is to start the race, what ultimately counts is that we finish the race. Very few ribbons, medals, trophies, and advertising contracts are given to athletes with good starts.

Athletes do not appear on boxes of Wheaties because they are good starters. You win the high privilege of being honored on breakfast tables around the world because you are a good finisher.

Good track coaches will teach their athletes to neither look to the right, nor to the left, and, by all means, certainly not behind. When you run without focusing straight ahead, there is a tendency to become distracted and possibly trip and fall. If we keep our eyes fixed on the finish line, this singular focus will keep us moving forward with success.

Remember, it’s not how you start out; it’s how you finish up. Take for example the Apostle Paul, who started out as a violent persecutor of the church, but he ended up as a gospel globetrotter. It’s not how you start out; it’s how you finish up.

Paul proclaimed, “I have fought the good fight, I have finished the race, I have kept the faith. “ (2 Timothy 4:6-8)

Remember, it’s not how you start out; it’s how you finish up. Take for another example, Alma the Younger, who too was a destroyer of the church, but he ended up as a prophet and missionary that brought thousands to the truth of our Saviour. It’s not how you start out; it’s how you finish up.

We are Inspired, Inspired by those saints, those believers that have gone on before.  We are inspired; inspired by the counsel and promises given to us by Prophets and by Him who makes it possible, our Saviour and Redeemer, Jesus Christ.

The race may be long.  The race may be all uphill.  And the race may be continuously into a fierce headwind.

Take for example Noah. Remember Noah? He spent 120 years of his life building an ark.  120 years!

Now I must confess that patience is not one of my finer virtues. Every once in a while, when something I am concerned about seems to be moving too slowly, I will get anxious, and complain: "Why is this taking so long?"

But, in those times, we could imagine Noah whispering in our ears, saying, “how long have you been waiting? It took me 120 years to build the ark, and it was never easy.”

He would say, “Don’t give up! Don’t lose heart. All of us who went before you are cheering you on.”

The 1992 Olympics in Barcelona featured memorable moments of sports history.

Derek Redmond of Great Britain was on the way to fulfilling a lifetime dream, that of winning a gold medal in the Olympics.

He had earned a spot in the semifinals of the 400 meter race, and as the gun sounded to start the race, Derek got off to a great start. He was running the race of his life, and the finish line was in sight, when suddenly he felt a stab of pain in his right leg. He fell face first to the track with a torn hamstring. The race was over for Derek.

He struggled to his feet before the medical team could reach him. Though every runner had passed him, he began hopping forward, tears of pain and disappointment streaking down his face, determined to finish the race.

Suddenly, a man plowed through the security guards on the sidelines and ran onto the track.

He raced up to Derek and hugged him, "You don’t have to do this," Jim Redmond told his weeping son.

"Yes I do," Derek answered. "Well, then," his father said, "we’re going to finish the race together."

Derek’s father gripped his son around the shoulders, and they faced the finish line, resolutely waving off the security men who hovered around them.

They limped and hopped together, Derek’s head sometimes buried in his father’s shoulder.

At first, the crowd watched in dismay at the unusual scene. Then one by one, they rose to their feet, and began cheering and crying at the son’s determination and the father’s support.

My friends, it is not easy out there on the marathon we call Life. When we feel like giving up we must push on. We must persevere.  We must turn to each other and bear on another’s burden so that it might be light.

We must fight the good fight. We must finish the race.

There is an announcer for ESPN. His name is Chris Berman.  When he is giving the highlights of when a player catches the football and begins running down the field, his famous words are: "He Could Go All The Way!"

We too, can go all the way.  We must fight the good fight. We must finish the race. And to finish it well

The race is laid before us; and we are to give it our all and when we cross over to the other side of eternity; we can collapse into our Savior’s arms knowing we had no more to give.

And to hear our Savior’s voice peacefully say: “Well done thou good and faithful servant. You have fought the good fight, you have finished the race.”  “Enter into my Rest”

This is my prayer and testimony, and solemn challenge to all.  In the name of Jesus Christ. Amen.`

    id: "a-better-life",
    section: "Church Talks",
    title: "A Better Life",
    date: "July 7, 2012",
    location: "Smithers, BC",
    notes: "Baptism talk for Ashlee Cocklin (July 7, 2012). Revised and personalized for Carolyne Stenhouse (September 1, 2013), and Eric Perrault (January 4, 2015).",
    body: `Ashlee, you are just about to participate in your very first saving ordinance and make your very first official promise to Heavenly Father.

Today when you are baptized you will promise Heavenly Father that you will remember and follow Jesus and keep all of His commandments.

Today Heavenly Father also will make you a promise. He promises you that He will forgive you if you make mistakes and do something wrong. He also promises that you can have the gift of the Holy Ghost with you and that you can obtain eternal life someday.

These two-way promises are called covenants. Heavenly Father never breaks His promises to us, and we need to try every single day never to break our promises to Him.

All those who covenant to baptism promise:

To take upon you the name of Christ (D&C 18:21–25). What does it mean to take the name of Christ upon us? When you take His name on yourself you see yourself as his. You seek what he wants rather than what you want or what the world wants. In the Book of Mormon, King Benjamin explains why it is important to take the name of the Savior upon ourselves:

"There is no other name given whereby salvation cometh; therefore, I would that ye should take upon you the name of Christ, all you that have entered into the covenant with God that ye should be obedient unto the end of your lives. And it shall come to pass that whosoever doeth this shall be found at the right hand of God, for he shall know the name by which he is called; for he shall be called by the name of Christ. And now it shall come to pass, that whosoever shall not take upon him the name of Christ must be called by some other name; therefore, he findeth himself on the left hand of God" (Mosiah 5:8–10).

To bear one another's burdens that they might be light (Mosiah 18:8).

To obey the commandments of God and to serve him (Mosiah 18:10). Your baptismal covenant is a commitment to come into God's kingdom, separating yourself from the world and standing as a witness of God "at all times and in all things, and in all places" (Mosiah 18:9). Your efforts to stand as a witness of God include everything you do and say. Strive always to remember and keep the Lord's commandments. Keep your thoughts, language, and actions pure. Be careful to watch, listen to, and read only those things that are uplifting. Dress modestly. Choose friends who encourage you to reach your eternal goals. Stay away from immorality. Keep yourself worthy to enter the temple.

All those who covenant to baptism, the Lord promises to:

To accept them as a member of his Church.

To forgive their sins.

To give the gift of the Holy Ghost.

To bring them into the kingdom of God in heaven if they remain obedient throughout their earthly life.

Being baptized and confirmed is your key to living with Heavenly Father in the Celestial Kingdom forever and ever.

We all know how hard it is to not make mistakes.

It is hard for everyone to choose the right every single minute of every single day. Heavenly Father knows that. So today, He gives you another great gift, the gift of the Holy Ghost. This wonderful gift will help you choose the right.

Every Sunday, we have a chance to remember the covenant you made this day. We should remember the promises that we have made to Heavenly Father and the promises He made to us.

The Book of Mormon tells of a group of people who learned the gospel and were baptized at a place called Mormon. From the time of their baptism, they regarded Mormon as a place of beauty because while they were there, they "came to the knowledge of their Redeemer" (Mosiah 18:30). Strengthened by their testimonies and their baptismal covenant, they remained faithful to the Lord, even in times of intense trial (see Mosiah 23–24).

Like the people in this Book of Mormon account, we can rejoice as we remember our baptismal covenant and the Lord's promises to us.

Ashlee, we know that through baptism you become a member of the Church of Jesus Christ of Latter-day Saints. When you are baptized you show your willingness to follow the Savior's example. He too was baptized, even though He was without sin.

Remember that this is the first day of the rest of your life. You will be absolutely clean in the eyes of your Heavenly Father. It is my prayer that you will always remember your promise and do all you can to keep yourself spiritually clean like you are today.

I would like to close with one of my most favourite quotes that gave courage and determination to Nelson Mandela as he found himself imprisoned for many years. It says:

"I thank whatever gods may be … For my unconquerable soul … I am the master of my fate … I am the captain of my soul."

May you always be strong, may you always steer your life after the course which will give glory and honor to our Father in Heaven. This day is your first day of the rest of your better life.

In the name of Jesus Christ. Amen.`
