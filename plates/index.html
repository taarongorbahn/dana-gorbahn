    title: "Be Focused and Balanced",
    date: "July 10, 2022",
    location: "Smithers, BC",
    notes: "",
    body: `Good morning Brothers and Sisters

I’d like to talk about a few important aspects of creating balance in our lives.  

But before I get into it I want to tell you a story about when Vladimir Putin dies and he finds himself – you guessed it - in hell.

He's met by the devil, who explains to him that he will be shown three different floors and he has to choose which one to spend eternity in.

The devil takes Putin to the first floor where everyone is standing on their heads on a wooden floor. Anytime someone started to tip or fall over, little demons would fly down with whips and whip them until they were again balancing on their heads. It was awful!

Putin said, "No! I need to see the second floor!"

So the devil takes Putin to the second floor where again everyone was standing on their heads, but this time on a concrete floor. Same routine with the little demons and the whips if you could not maintain your balance.

Again Putin shouted, "No! Show me the next floor."

So the devil took Putin to the third floor where everyone was standing waste deep in cow manure while drinking coffee. The little demons here were fluttering around handing everyone coffee cups with a nice rich roast.

It was certainly not ideal but way better than the other two floors so Putin said, "Da, yes, this will do."

With that he waded out into the manure and within seconds a little demon fluttered down with a cup of coffee.

Putin sipped the coffee, and though the room smelled horrible from the manure, he thought that after a while he may be able to get used to it after all.

Then about 10 minutes later an alarm sounded and the little demons had whips appear in their hands and began to shout, "All right, coffee breaks over, get back on your heads!"

Today - I will not talk about balancing on your head - but - I do have a couple of ideas of how to create balance in your life.

My first example - is to me – a principle about giving value and honor to every activity that we participate in.

I little while back I was in California and had the opportunity to go golfing with my second oldest brother.

I really am unsure how we got on this following topic – over the course of the round - but what my brother said – had a profound and lasting impression upon me – of which I would like to share.

He told me:

Back when he was 14-15 years old – he began noticing in our Sacrament meeting, that many of the talks started with the phrase "The most important thing you can do is ____".  

Each week he would hear it again - the most important thing you can do is read the scriptures - the most important thing you can do is missionary work - the most important thing you can do is the work with your family - the most important thing you can do is pray. And the list goes on and on.

Can you relate - I’m sure that you have heard this same thing - for yourself.

My brother continued - every time he heard the phrase - The most important thing you can do is ___ -  he would shut down and stop listening

He would say to himself - if last week was reading your scriptures; how can this week be about your family?

This went on for a number of years until he came to the realization – he realized that they were ALL right

The truth was – all of these things are the most important thing - but it all had to do with having those things balanced in your life.

Whatever you are doing at any particular moment in your life – it should be the most important thing you can be doing.

So, for my brother – when he was at work and with a patient – the attention to that patient was the most important thing he could be doing at that particular time.  Not the last patient – but the one that he was with at that moment.

When reading the scriptures – that needed to be the most important thing at that moment. 

When he was out golfing with his little brother – that was the most important thing at THAT moment.

When being with his family or spouse – that needed to be the most important thing at THAT moment.

Brothers and sisters – the thing that you are doing at any moment in your life should be the most important thing to you - at that time.

Your presence here at church today - should be to you - the most important thing at THIS moment.

This allows you to have to have balance in your life.

Living in the moment can allow you to become the most productive person for today – but also a means to securing a positive future filled with happiness, joy and contentment.

There is nothing wrong with enjoying and participating in the things of life.  Life was not created to simply read our scriptures, pray and go to church.

Life was created to experience all that the God has created – as long as it does not dishonor our covenants with our Father in Heaven.

It may be hard to find balance in your life but I do believe that if we take the wisdom of what my brother gave – if we give each activity the attention that it deserves – then we will find balance.

Spending time at work versus spending time at home. How do you balance that? What is the proper amount of time for these things? 

Or how about when you are at home – there is a struggle for balance there too, isn’t there?

Spending time enjoying yourself, relaxing, building relationships with family members, or spending time doing chores – fixing this, cleaning that. All of these are necessary. 

Elder David A. Bednar of the Quorum of the Twelve Apostles taught this about balancing life:

He was once asked how to keep home life, work life, and family life in balance. His answer was probably unexpected.

“You can’t,” he said. “So don’t worry about it.”

After a short chuckle, Elder Bednar offered some clarification. “Balance is a false notion,” he taught. “You can only do one thing at one time.”

He then compared balancing various areas of our lives to an acrobat - spinning multiple plates on the ends of sticks. Each plate requires regular spinning so that it won’t wobble and fall.

“Can [the acrobat] get all the plates spinning at exactly the same speed at exactly the same time?” Elder Bednar asked. “Nope. One is always closer to spinning off.”

“That’s life,” Elder Bednar explained how each of us must keep our various plates in the air by giving them attention as needed.

He also included a caution: “It’s probably the case that you cannot spin 17 plates. With the help of the Holy Ghost … we can identify the two, three, or four most important plates that always need to be spinning.”

If your life feels chaotic and overscheduled, consider that caution from Elder Bednar - You might need to reduce the number of plates you’re trying to keep in motion.

Even after simplifying your life, however, it can still be tough to know - how best to divide up your time and energy. 

That’s where one particular word comes in handy.

Consider the word - priority - for a moment.

First, pretend you’ve been outside on a hot summer’s day for a long time without water. Maybe you were hiking, playing sports, or just goofing off in the sun. 

However you imagine it - what you’re now completely focused - is your incredible thirst.

So what’s the first thing you’d do when you come home? The answer is pretty clear. You’d take a long, cold drink of water. And then perhaps - fill up your glass again to have more.

It’s important to note - that you’d find, and drink water - before doing anything else, even if you had a full schedule of activities and were running late. 

Why? Because it was your top priority.

The word priority - simply means something you do prior to something else. 

In extreme thirst situations, every other task lines up behind getting a drink of water. 

Text messages can wait. Emails can wait.  Even letting the dog out - can wait – In fact, pretty much everything else can wait because that drink of water has become your top priority.

We sometimes have a knack for making it more complicated in other situations.

It’s one thing to declare something a priority. It’s quite another to treat it as such. 

For example - someone might say that reading scriptures is a top priority. But if scripture study doesn’t fit in their schedule most days, or if it doesn’t get squeezed in until the last few minutes of the day before they collapse exhausted into bed, then it’s not a priority in the real sense of the word.

Once you decide your top priorities—those few key “plates” - or areas in your life that must remain spinning—do everything you can to schedule them in and don’t let anything else bump them out of your schedule.

One more thought, Elder Bednar identifies: Balance isn’t a one-and-done effort. It’s not something you can craft into a well-oiled machine that will then hum away uninterrupted for the rest of your life.

Instead, each phase of your life will require unique focus and adjustments. 

It’s a moving target; and you have to move with it simultaneously.

Plates will come. Plates will go. Either way, you’ll always have plenty to keep up in the air. 

Just take a deep breath and keep on spinning.

(https://www.churchofjesuschrist.org/study/new-era/2020/08/life-balance-a-moving-target?lang=eng)

Many times - in our struggles to find balance - we find ourselves tipped too far one way or the other – either we work too much, or not enough. 

Either we’re too busy doing chores at home, or we neglect them too much.

It can be easy to develop bad habits and live an unbalanced life.

What about in your spiritual life? Do you have a balanced relationship with God? 

Or, have you unknowingly picked up some bad habits – going too far one way, or too far the other, in your relationship with Him?

Jesus had met some unbalanced people.

He was traveling to Jerusalem, along the border between Samaria and Galilee. As he was going into a village, ten men with leprosy met him. 

Do you remember how bad the disease of leprosy was? 

Back in Jesus’ day, it was an incurable disease, and it was very easy to catch from someone else. 

I don’t want to nauseate you out with the details - but basically, you would wake up one day and find blotches on your skin and you’d feel a bit funny. 

This was the beginnings of leprosy, where your body begins to decay and fall apart while you are still alive. 

You could describe it as a form of visible cancer. You’d have to leave your family, leave the town, and go out into the desert, and live in the caves with strangers who also have leprosy. 

Every time someone comes near you, you have to shout, “Unclean! Unclean!” so that people knew to stay away from you. It was a terrible disease, a long and lonely way to die.

Ten lepers, living out in the caves, saw Jesus as he approached the town. They stayed at a distance, because that’s what they were supposed to do, and they called out to Jesus: “Jesus, Master, have pity on us!” 

They called him “master.” They must have heard that this Jesus had the power to heal. Some thought that maybe he was the Messiah. They had nothing to lose, so they asked for his help.

Is there anything wrong with what they did? Is this what you would have done, if you had leprosy? 

Imagine waking up one day, and you have blotches on your skin. You feel kind of strange. You get checked out, and you have leprosy. 

You have to leave your family, leave civilization, and go out and live in the caves. You’ve lost everything that was in your life.

But you hear about a man named Jesus. You hear that he has healed people of all kinds of diseases. 

Maybe he is the Messiah. If you were one of those ten lepers, would you have called out to Jesus, and asked for help? Of course you would have.

And they weren’t disappointed. Look at what happens. Jesus called out to them, and said, “Go, show yourselves to the priest.” 

And as they went, they were cleansed. Jesus was able to take away their terminal illness, just by speaking a few simple words.

“Go show yourselves to the priest.” Why was that part of their instructions? 

The priest doubled as a doctor – he would check you out, give you his stamp of approval if you really were healed, and allow you back into the town.

What would you have done if you were one of those ten lepers? What would you have done while on your journey to the priest – that you see and feel the effects of the healing command by the Savior?

Wouldn’t you have gone, and done what Jesus said? 

Go, show yourself to the priest - isn’t that what Jesus wants you to do? And then they would be able to go back to the lives that they had before.

Isn’t that what Jesus wants you to do?

Well - yes and no. Look at what happens next. 

One of them, when he saw he was healed, stopped his way onwards to the priest -  he came back, praising God in a loud voice.  He threw himself at Jesus’ feet and thanked him. 

Didn’t he disobey what Jesus had told him to do? Wasn’t he supposed to go and show himself to the priest? 

Well – again - yes, and no. Look at how Jesus responds. He said to the leper, “Were there not ten of you? Where are the other nine?” 

Do you see what Jesus is pointing out here? 

Nine of those lepers asked Jesus for help. And when Jesus helped them, they just took off. They didn’t balance their asking with their worshiping. 

They received a gift from God, but they didn’t balance that - by giving glory to the Saviour.

They were so focused on themselves - their hands and feet were healed! “Let’s go to the priest.  He will give the authorization to go back to our families and live life as they had hoped.

They were so focused on those things of a normal life – and let me point out that all of those things are good things – however, they failed to give the praise that they needed to.

They lacked the balance of the things of this world and the things of God.

Would you have been one of those nine unbalanced lepers? So excited, that you forget to worship God for what he has given to you? 

We struggle with this, don’t we? We ask and ask and ask God for things - but we forget to balance that, by thanking Him for all the things he has given to us. 

Often, when we receive a gift or a blessing from God – of which we are so excited about – we then sometimes forget to spend the moments needed in worshiping our God -  who has blessed us. 

We have our families. We have our friends. We have all kinds of things going on – all good things, that God wants us to enjoy. But sometimes we are so focused on those things – that sometimes -  we fail to balance it out, with worshiping and praising the Almighty.

We can’t be like the nine lepers that became too focussed on the blessing of their new life.

Mosiah 4:27 says - “See that all these things are done in wisdom and order….”  

And 2 Nephi 9:51 tells us - “Do not spend money for that which is of no worth, nor your labor for that which cannot satisfy.”

When summer is over – we notice that the trees turn color and eventually the leaves fall to the ground. Except one tree - the evergreen. 

The evergreen is different. Regardless of what the other trees are doing, the evergreen remains green.

A balanced follower of God is like that evergreen. Different from the rest of the world.

Regardless of what other people are doing, regardless of what is happening in the world, in our own lives, we are duty-bounded to ever-green. 

Always worshiping and praising our Father in Heaven. Always. 

Because no matter what we see, no matter what we experience, no matter what the rest of the world is doing - We know that our Savior has died for us. He has risen from the dead

We know that we have been cleansed of our sins - and that His Holy Spirit is with us, today – as it is encouraging us – and as it is comforting – and it is redeeming us through Christ’s atonement.

And so – it is important that we balance our lives by worshiping Him. May God bless each one of us with a heart that seeks to glorify him, each and every day.

Each of us has the ability to receive the direction we need to achieve a balanced life. 

My hope and prayer is that we will do what we need to do to have the influence of our Father in Heaven in our lives. As we do our part, I testify that He will do His part in brining balance into our lives. 

I humble declare - in the name of Jesus Christ, amen.`

    id: "i-love-you",

    title: "I Love You",
    date: "February 20, 2022",
    location: "Smithers, BC",
    notes: "",
    body: `Good Morning Brothers and Sisters.

This past Monday was Valentines Day.  One of the special things that happens on that day - is the reflection that we do - of those special people that are in our lives.  

It may be a spouse.  It may be boyfriend, a girlfriend.  It may be a family member; or it could be a group of people, or even other families.

I am so happy that we have a day that encourages us to express these emotions of LOVE.

And truly – there seems to be no greater time than these days were we need to hear, see, and feel that special expression – of love

My talk today uses the word “love”  - 114 times.  

Let me ask you this question - How do you know somebody loves you? And - How do you show others - that you love them?

Dr. Gary Chapman wrote a book called The Five Love Languages I never read the book – let’s be clear – I don’t read much.  The books I only read are the scriptures, but I understand that in the book, he suggests that people give and receive love, in one of 5 different ways:

Words of Affirmation – this is the simple act of saying “I love you”

Engaging in Quality Time with one another 

The Exchanging of Gifts

Acts of Service 

Physical Touch – like hugs and kisses.

He also identifies in his book - that because we all don’t speak the same language of love - it is possible to love somebody in a way which can be unknown to the person being loved.

Let me say that again - - it is possible to love somebody in a way which can be unknown to the person being loved.

Here’s an example:

Ma and Pa had been married for 30 years when Pa came home one night to find Ma in the kitchen crying. “What in tarnation is wrong with you, Ma?” Through her tears Ma blurted out, “Pa, why don’t you ever tell me you love me?” Pa replied, “Ma, I am devoted to you.  I will do anything for you, and when we were married I told you that I loved you, and if I ever change my mind, I’ll let you know."

Looks to me that Ma and Pa speak different love languages.

I ask the question once more - How do you know somebody loves you? And How do you show somebody that you love them? 

These are some very important questions in our relationships - with our spouse, with our children, with our family, and even with God. 

Brothers and Sisters - It is so important for you and I to know that our Father – our Father in Heaven – loves you!

Here’s a love letter from a young man to his girlfriend who lived across town before the age of the automobile: 

Honey, I would climb the highest mountain for you. I would swim the deepest river just to be where you are. I would fight alligators, lions, and tigers to be by your side. I would walk through fire for the privilege of gazing into your eyes. And I’ll surely come see you this coming Saturday night---if it doesn’t rain!”

This young man’s words don’t quite match his actions. His girlfriend might doubt the sincerity of his words, and maybe even the sincerity of his love.

That little example reminds me of a story that was told to me by my parents.  When they were both in school and before they were boy/girlfriend, my dad obviously liked my mom – so he and his good friend hoped on their bikes to ride miles and miles to my mom’s place.  As they came up to her place, my mom saw them from a distance and came out to the road as they approached, she asked, “Was macht ihr hier WA MACHT IN HERE  (What are you guys doing here)?”  And my dad would smile and respond, “Gehe nur vorbei GEAR NORF IN BY (Just passing by)!”  And on they would go with their several hours bike ride home.

Have you ever had your doubts when somebody says I love you? Have you had doubts about God’s love for you?

People can say those words without really meaning them, can’t they? 

Remember Sister Dorian.  She always expressed a difficulty with believing that we all had a love for her.  Yet, we all did.  It may not have been a love that you have for your spouse or children, but it was no less a love.

When I visit Sis. Ewert to offer up the sacrament – you know what she says to me every time I am leaving?  She says “I love you”

We are so greatly blessed to have each of us in our little branch.  We’ve heard it time and time again – at what love we have for each other.  We are so lucky to have this feeling amongst all of us!.

“I have loved you”, the Lord said. 

 “Yea, I have loved thee with an everlasting love: therefore with loving kindness have I drawn thee.” - Jeremiah 31:3 

There is an important truth -  God’s love for you never changes. His love is faithful, constant, never-ending. 

His love is not based on your performance, however it based on who He is.  His perfect love cannot love you more; nor can He love you less.

Some have asked of the Father - Do You still care about me? Do you really love me?”

Have you ever been this situation where you have wondered whether God loves you?  Whether he truly cares for you? 

You may have prayed and prayed, but day after day, no answer. You’ve got more questions than answers, more problems than solutions. 

Loneliness may hound you like a hungry wolf – stalking - and waiting to take you down. 

You may pray “lead me not into temptation” and yet still - you keep falling. 

Everything may be going wrong – and then you pick up your scriptures and you read – that God loves you.

And then you may go to church and hear the talks and teachers tell you – that God loves you. 

And somewhere in the back of your mind you’re asking, “Is that really true? Lord, do you really care about me?  Lord - do you really love me?”

My Brothers and Sister - The answer is always, “Yes.” 

God will not always answer your questions in your time and in your way; however, He calls out to you - to hold on to that fact – that He loves you, even when you cannot feel it – it is there!

Whatever else you doubt, don’t ever doubt His love, because it is real and it is everlasting. 

I testify that our Father in Heaven – is right now – saying to you: I have loved you, I still love you, I will always love you.

In 1995, Christopher Reeve, the "Superman" actor, fell from a horse in a riding accident that severed his spinal cord and paralyzed him from the shoulders down. 

In the days which followed both he and his mother considered pulling the plug on his life support system.

He later wrote about how he battled back from the accident - Reeve said he first shared his thoughts with his wife, Dana:

"I mouthed my first lucid words to her: ’Maybe we should let me go,’ " 

But his wife, through tears, persuaded him to fight back, saying, "I want you to know that I will be with you for the long haul, no matter what. You’re still you, and I love you."

As long as God is God, and you are you, He loves you. 

Love is more than words - love is a choice. 

The Savior loves us through His ultimate choice to save us through His atonement.

So with His love demonstrated for us. Now it’s our turn - to show our love for Him, by our devotion – and by our obedience to His work.

God has already answered the question, “How do I love you?” Now - you and I have to answer the same question about our love for Him. Will we worship and devote ourselves to Him? 

Will we honor and obey Him---give Him our best, and worship Him from a heart of love? 

That is the true measure of our love for the Lord.

Going back to Ma and Pa.  Ma longed for the words of “I Love You”.

But in that situation, Pa felt that his actions were greater than words.  Regardless of his words, he was committed and faithful to his wife.  His actions in reality – spoke the words of “I love you” 

Love can certainly be implied through actions - but remember Brothers and Sisters – saying these words (as Ma longed for) - saying, “I Love You” can bring great blessings to the recipient.

A Florida International University psychologist said about verbal expression of love: 

“It’s the oxygen for the relationship,” “Telling somebody you love them feeds the relationship, keeps it alive.”

It reinforces your feelings and helps remind your loved ones – whether your spouse, sweetheart, child or parent – that you are there for them and that they matter to you.

“What people are really looking for is emotional presence,” she explained. We can physically be standing right next to someone and yet be miles apart emotionally.

‘Are you there for me?’ is a key question we ask ourselves – and is an emotionally focused couple’s therapy question designed to examine the heart of one’s relationship.  

Brothers and Sisters - We are made for connections.  We are constantly turning toward or away from each other in relationships.

We are created to desire the feeling of being loved.  We desire acceptance and connection with one another.

On the TV Show “The Office” –Michael Scott, the boss, reflected and said, “Would I rather be feared or loved? Umm… easy, both. I want people to be afraid of how much they love me.” — 

Saying ‘I love you’ – and other statements of affection – is an immense means to creating resilient relationships with one another.

Some people might feel a little awkward confessing their love because they might be guarded in showing their vulnerabilities.

It can be risky.  Inherently, that’s what vulnerability means. You put yourself out there without any armor. Leaving yourself exposed, susceptible, and defenseless.

There are risks – the risk of getting hurt. But remember what the reward can be - you could feel a closeness, a connection and affection - that can bring an eternity of joy with one another.

If you’re an “actions-speak-louder-than-words” type of person, I ask that you try to take opportunities to vocally express your love to others – and if that really isn’t you – then please do not forget to apply the other 4 love languages that I talked about earlier:

Remember to create Quality Time with one another 

Exchange Gifts with each other.  This means both - giving and receiving.

Remember to provide Acts of Service to one another

And don’t forget to participate in Emotional acts of Physical Touch

Here’s an example - if you know that your spouse values a clean kitchen; and you decide to tidy everything up after dinner - that would be a sign of love.

But it’s important to understand what your loved one’s value are.  

Take the previous example - if your spouse doesn’t care about a spotless kitchen; and you clean the kitchen, there probably isn’t any impact or recognition of a love language. 

Quite often you might be left frustrated – thinking that they didn’t appreciate your gesture of love. 

In that case, remember that love language is between two - and not just one.  

Remember - that how you give AND received these gifts - is the language you both speak.

Also remember, Brothers and Sisters – ensure that your words are consistent with your actions. 

If your words or gifts are empty – and not backed up by actions – your loved one, will not have the conviction of your expression of that language of love.  

May we deepen our relationships with one another in love?

Create time together - where there are no distractions or other things that are going to take you away from each other.

Communication is crucial.  You need to continuously re-discover the person you love. 

Most importantly, Brothers and Sisters – may I encourage you to embrace love. Say it, show it, mean it; and celebrate the people who’ve shown you - that you too - are loved. 

Elder David A. Bednar said, “We should remember that saying ‘I love you’ is only a beginning. We need to say it, we need to mean it, and most importantly we need consistently to show it.”

Back in 2016, the Church came out with the 30 Day “I Love You” Challenge.

In that challenge they asked, “How often do you say, “I love you”? Can you say it more? 

It’s a Trick question. The answer is always YES!.

It can be easy to forget those simple words, but saying them out loud and showing that love to your family can make a big difference.”

How can showing love strengthen your family? Try it out! Here’s a challenge for you: for 30 days, find a way to say “I love you” to your family each day. 

If you need ideas, in addition to saying those three little words. the LDS website gives you examples of 30 ways you can tell your family that you love them. 

I encourage each you to try this challenge – you can try a different idea each day. Or pick one, two, or a few you specifically want to turn into a regular habit, and work on those. 

The key to this challenge is to intentionally show love to one another. 

President Thomas S. Monson reminds us, 

“What is most important - almost always involves the people around us. Often we assume that they must know how much we love them. But we should never assume; we should let them know. … We will never regret the kind words spoken or the affection shown. Rather, our regrets will come if such things are omitted from our relationships with those who mean the most to us.”

I close with Moroni 7:47–48. “Charity is the pure love of Christ, and it endureth forever; and whoso is found possessed of it at the last day, it shall be well with him.

“Wherefore, my beloved brethren, pray unto the Father with all the energy of heart, that ye may be filled with this love” 

Brothers and Sisters – I testify that when we are filled with God’s love - we can do, we can see, and we can understand things – that we could not otherwise do or see, or understand - without that love.

When we are filled with His love, we can endure pain, conquer fear, forgive freely, avoid contention, renew strength, and bless and help others in ways - surprising even to us.

Our Savior - Jesus Christ was filled with beyond your understanding love as He endured immeasurable pain, cruelty, and injustice for us. 

Through His love for us, He rose above. 

His love knows no barrier. He invites us to follow Him and partake of His unlimited love - so we too may rise above – so that we too, can share and bestow our own love - to one another.

I know He lives. I know He loves us. I know we can feel His love here and now, and forever. 

I know He is full of gentleness, kindness, and mercy. I love Him with all my heart.

And I declare this day – that I love my wife.  I love my children.  And I love you.

I testify that as we feel this love from Him - and from our Father above - that we too - can be that reflection of His image - and continue His work - to bring that love to all people.

As we share our love in word; and in our deeds.  Love will be strengthened and it will intensify your relationships - with others.

I so humbly testify. In the name of Jesus Christ, amen.`

    body: `There once was a young girl called – oh - let’s say her name is Bryer, who told her mother that her stomach hurt.

Her mother replied, “That’s because it’s empty. Maybe you should try putting something in it.”

The next day, a friend came to their house for lunch.

The friend seemed to be in some pain; and said she had a very bad headache.

Bryer quickly said, “That’s because it’s empty. Maybe you should try putting something in it.”

I’m hoping that my talk will help put something in our own heads today.

I’ll introduce my talk with this humorous story:

Larry goes to the revival and listens to the preacher.

After a while the preacher asks anyone with needs to be prayed over to come forward to the front at the altar.

Larry gets in line, and when it's his turn, the preacher asks:

"Larry, what do you want me to pray about for you?"

Larry replies: "Preacher, I need you to pray for my hearing."

The preacher puts one finger in Larry's ear, and he places the other hand on top of Larry's head and prays and prays and prays.

After a few minutes, the preacher removes his hands, stands back and asks Larry: "Larry, how is your hearing now?"

Larry says, "I don't know, Reverend, it's not until next Wednesday"

Today - I wish to discuss the power of prayer; and what can come from it; and the humbling influence that God can have, in blessing you – day in and day out.

When you pray, what are your expectations?

Specifically, what are your expectations of your Father in Heaven?

Matthew Henry, a Nonconformist minister from the late 16th Century - commented on this matter when he wrote:

“There is an inexhaustible fullness of grace and mercy in God, which the prayers of all the saints can never draw dry. Whatever we may ask, or think to ask, still God is still able to do more, abundantly more, exceedingly abundantly more. Open your mouth ever so wide, still he has the wherewithal to fill it.”

So again, I ask you - What are your expectations from prayer?

Brothers and Sisters – I testify that our Father in Heaven, is able to do more in our lives - than we can hope, think or imagine.

There may be many things in our lives that we are unable to do, with our abilities, capacity, and strength - but remember this important truth when Savior said in Matthew 19:26 “With men this is impossible; but with God all things are possible.”

When we pray according to God’s will - all things are possible.

There is a common stumbling block that crosses our way – when we go to our Father in prayer. 

Sometimes – we put limits on what we are asking Him to do.  Sometimes – we reveal to our Father in Heaven, the limits of our real faith in Him and full aspects of His power.

Unfortunately, it can happen - that we think our problems or circumstances or situations - are beyond the scope of God’s ability.

Does this make sense – that if we think that our problems are bigger than what God is able or willing to handle – does that then show a lack or limit of faith in Him - who loves and cares for us?

Unfortunately – if we demonstrate a lack – or limited faith in Him – it then limits the blessings that we can expect from our Father in Heaven and the influences of His Spirit in our lives.

Yet, the word of God is clear - when it tells us, to expect God to answer when we pray in faith.

Here are so many verses in the scriptures that clearly testifies, confirms, and bears witness; it is also to give encouragement to those who have limited faith – of the great expectations that you personally can have from the power of prayer:

Matthew 21:22 - And all things, whatsoever ye shall ask in prayer, believing, ye shall receive.

Mark 11:24 - Therefore I say unto you, What things so ever ye desire, when ye pray, believe that ye receive them, and ye shall have them.

John 14:13 - And whatsoever ye shall ask in my name, that will I do, that the Father may be glorified in the Son.

John 15:7 - If ye abide in me, and my words abide in you, ye shall ask what ye will, and it shall be done unto you.

John 15:16 - Ye have not chosen me, but I have chosen you, and ordained you, that ye should go and bring forth fruit, and that your fruit should remain: that whatsoever ye shall ask of the Father in my name, he may give it you.

I can go on and on with scriptural testaments that share this simple truth - of calling upon the Father; and the blessings that can come from that.

I can’t help but be reminded of a story of when I was a young boy.  I was probably 11 at the time.

I remember that my parents had just returned from a vacation in Hawaii.  It was really something special in our family because we didn’t have much.  

At that time, we lived in a rundown farmhouse.  Us boys had the attic for our bedroom. 

And during the winter, we would have little snow drifts on our bedroom floor from the snow blowing through the openings of the walls.  

We were a family of 10 with one bathroom!  

It got so cold at night during the winter, that over the course of the evening, we would all eventually make our way downstairs and sleep on the floor around the oil furnace that had a blower.  

Sometimes it was a race to be the first person there because it meant that you would have the heat blowing right on you; however, you would have to sleep on the edges of the thick plywood.  You were warmer but you were very uncomfortable.

Anyways.  Mom and Dad had won a raffle from the Cranbrook Rotary Club, which dad was a member of before we moved away.  Their win was a trip to Hawaii.  

When they returned, it was something else for us to see the pictures, and hear the descriptions of their experiences.  It was something that truly effected me.  And I think that it was from this occasion, that I had developed an attraction and an allure to traveling.

Oh how I wanted to experience what they did!

Now shortly after this, I somehow found and entered a raffle that also had a grand prize for a trip.  I’m not sure if it was a trip to Hawaii; or it might have been a cruise – I’m just not sure.

But I remember holding on to the entrance form.  It stayed by my bed and every night until the day before the draw, I would pray to my Father in Heaven, that I would win that grand prize.

On the night before the draw - me as a young boy, who had been taught that if I asked God in faith, that I would receive.  

I still remember to this day - and have vivid memories of me getting to my knees and praying with all of the faith that I had, that I would win that draw.  I felt that I had as much faith as the young boy Joseph Smith.

I prayed and I prayed.  I cannot tell you how long I prayed - but I prayed until I fell asleep on my knees.

The next morning came – and I had this belief that because I prayed and exercised my faith, that today, I would receive a call that I had won that coveted grand prize.

I stayed home that day – waiting by the phone – and you know what?  That’s right - No phone call came.  I did not win.  I did not win that coveted vacation.

Why, I ask?  Why did I not win?

I don’t know – maybe because thousands of others had also put their names into the draw?  Maybe that it.

I gotta say though Brothers and Sisters – because I never won, I never lost the faith of prayer.  Never did.  Since then, I have had prayers answered.  I’ve had revelations, visions and blessings bestowed upon me because of prayer.

I testify of its power!!

And you know what – I believe that the prayer that I so passionately poured out as a young boy had been answered.  My Father in Heaven has guided me, prepared me, and blessed me through out my life to be in the position, in my adult life to visit and experience places throughout the world.

Brothers and Sisters – Our Father in Heaven is a personal Being whom we can approach in prayer. 

When you kneel down to pray at night, do you feel his nearness, his character - hearing you?

Do you feel a power that works – perhaps, like a radio or a telephone – where you are feeling, hearing, or being inspired by His great power – as you commune together?

President David O McKay expressed this desire for us:

“I would like (us) to … feel so close to [God] that (you) will approach Him daily, not in public alone, but in private. I would have (you) have the trust in Him which the little blind girl had in her father. She was sitting on his lap in the train, and a friend sitting by said: “Let me rest you,” and he reached over and took the little child on his lap. The father said to her: “Do you know who is holding you?” “No,” she replied, “but you do.” Oh, as the trust of that child in her father was so real – so should, the trust which we should have in our Father in Heaven.

President Ezra Taft Benson had urged: “If we would advance in holiness—increase in favor with God—nothing can take the place of prayer. … Give prayer—daily prayer, secret prayer—a foremost place in your lives. Let no day pass without it. Communion with the Almighty has been a source of strength, inspiration, and enlightenment ….”

There was a Seinfeld episode where Kramer scoots into Jerry’s apartment where Jerry and George are talking, and he says "Do you guys want to have some fun!" George and Jerry say "Sure." 

And then Kramer says "Do you really want to have some fun? Or are you just saying you want to have some fun?" And George says "I really want to have some fun." And Jerry says "I was just saying I want to have some fun."

So my question to you today is - Do you trust God through prayer and faith? Or are you just saying you trust God through prayer and faith?

The divine invitation to pray unto the Father in the name of Jesus Christ is the single most mentioned commandment in all recorded scripture - and is the most basic form of personal worship. 

Yet many of us struggle in our attempts to make our prayers – personal, meaningful and revelatory.

Our personal prayers are a barometer of our spiritual strength; and an indicator of our spiritual well-being. 

If you were an outsider, hearing your personal prayers – what would it reveal about you and your relationship with your Heavenly Father?

To pray - is to speak with God, the Eternal Father of our spirits—not at Him - but with Him.

He loves each of us perfectly and is full of mercy and understanding. 

He knows everything about us. He knows what we need – even, when we can see only what we want. 

He has infinite power and capacity to sustain and guide us. He is always willing to forgive us and to help us in all things.

We can speak with Heavenly Father vocally or by forming thoughts and expressions in our minds and in our hearts. 

We must make every effort to render our personal prayers as solemn, sacred expressions of praise and gratitude.

May we make it a heartfelt petition for specific needs and desires; 

May it be humble, contrite confessions and requests for cleansing forgiveness; and pleadings for comfort, direction, and revelation. 

These types of expressions - often cause us - to pour out our very souls to a loving Heavenly Father.

Prayer can often be a brief communication, but it can also be an open and continuous dialogue - throughout the day and night

I so testify that prayer enables personal revelation and spiritual gifts – given to us through the Holy Ghost.

It is the spiritual channel made available to all God’s children, giving us constant access to our Eternal Father, His Beloved Son, and the Holy Ghost. 

Prayer is powerful and compelling evidence of the reality of God the Eternal Father.

Personal prayer is indispensable to understanding God - and our divine identity.

The Prophet Joseph Smith observed that “it is the first principle of the gospel to know for a certainty - the character of God, and to know that we may converse with Him as one man converses with another. …” (Documentary History of the Church, vol. 6, p. 305.)

Prayer opened the heavens to the Prophet Joseph Smith and thus opened the dispensation of the fulness of times. The Church of Jesus Christ of Latter-day Saints is truly a monument to prayer.

I am most grateful to the Prophet Joseph Smith for his simple belief in prayer. The answer to his prayer restored light and truth to mankind regarding the Godhead; regarding the Plan of Salvation; and many other great and eternal truths.

The Lord has promised to show mercy and to give comfort and strength to all who love Him and keep His commandments. 

However, it is most important to remember that our attitude and approach in prayer should be similar to that of the Savior, in one of His last prayers in which He said, “Father, if thou be willing, remove this cup from me: nevertheless not my will -  but thine, be done.” 

Three times – Three times - he prayed in this manner. And then “there appeared an angel unto him from heaven, strengthening him.”

May our will, may our yoke, be one with him in our prayers.  May miracles be made through our faith in Him.  

May we always go to the Father and ask for His divine guidance and assistance. 

And as we do this, we will truly appreciate the words of the beautiful hymn: “O how praying rests the weary! Prayer will change the night to day.”

May each of us strive with greater resolve to ask in faith and thereby make our prayers truly meaningful.

May we know that prayer is a privilege - and may it be a reflection of your soul’s, sincere desire. 

May we press forward and persevere in the sacred work of prayer – of which, after we say “amen,” – that we may act upon the things of which we have expressed to our Father in Heaven.

May we know that every sincere prayer is heard and answered by our Heavenly Father.

May we know that humble, earnest, and persistent prayer enables us to recognize and align ourselves with the will of our Father in Heaven.

I testify that prayer becomes meaningful - as we ask in faith - and act. 

May we not limit His power on us; by limiting our faith in Him.

I testify that there is a God in heaven who hears and answers our prayers. I know this to be true, for He has answered mine. 

I would humbly urge all within the sound of my voice to keep in close two-way communication with your Father in Heaven, through prayer.

In the name of Jesus Christ. Amen.`

    body: `Good morning Brothers and Sisters.  

A young man was on his way to visit his friend. While driving, his car broke down and it began to rain so heavily, he couldn’t even see his own hands in front of him.

He walked for as long as he could, but the rain became too much to bear. He found a tree and stood beneath it, waiting for a car.

Hours went by, and he was about to give up hope. It was a quiet road that he found him on. The next town wasn’t for miles, so he’d have to stay the night under this tree if he didn’t find a ride.

Just as things were looking grim, he catches a light moving slowly towards him. He says to himself, I’m saved!

Desperate for a ride, he jumps into the vehicle once it stops for him. Once in, he turned to the driver seat to say thanks, and only then did he realize the moving car had no driver. The rain was so heavy; he couldn’t even hear the sound of the engine as the car slowly continued its journey.

The young man was too scared to move, too afraid to jump out of the car and run. Seeing the car was coming to a sharp bend that lead down to dark water, he began to pray for his life. 

He was sure the ghost car would go off the road and into the river, where he would surely drown!

Right before the car made it to the bend, a shadowy hand reached in through the driver side window and turned the wheel, guiding the car around the bend, thus avoiding a wet demise for the young man. Just as silently, the hand disappeared through the window and the hitchhiker was alone again.

Paralyzed with fear, the lad watched the hand reappear every time they reached a bend. Finally, scared to near death, he’d had all he could take and jumped out of the car and ran towards the first town he could find.

Wet and in shock, he went into the nearest bar and told everybody about his supernatural experience. A silence enveloped the room and everybody got goosebumps when they realized the guy was telling the truth about the strange car and the ghostly hand that guided it on its way.

Just then, two men walked into the bar. They were dripping wet and as they took off their rain gear, they looked around the room. Their eyes came to rest on the hitchhiker. 

They pointed at him ominously, and he feared they were ghosts coming to get him.

“Look!” said one of the men, “There’s the idiot who jumped into our car when we were pushing it in the rain.”

Brothers and Sisters - My talk today is heavily adapted from a conference address that I heard many years ago - which had a profound impact and inspiration in my life.

In the eyes and hearts of many people in the world today, there is evidence of doubt, fear, and hopelessness. Much of the insecurity in the world has filtered into our homes and personal lives. 

No matter what our age or circumstance, we all have a need to know that we have power in the present and hope in the future.

Listen to the words of Mormon: “Know ye not that ye are in the hands of God? Know ye not that he hath all power?” (Morm. 5:23).

Hands are one of the symbolically expressive parts of our bodies. 

Apparently, in Hebrew, yad, the most common word for “hand,” is also used metaphorically to mean power, strength, might. Thus, hands signify power and strength.

The extended hand of our living prophet, President Russell M Nelson - strengthens, lifts, and inspires people all across the world.

To be in the hands of God would suggest that we are not only under His watchful care but also that we are guarded and protected by His wondrous power.

Throughout the scriptures, references are made of the hand of the Lord. His divine assistance is evidenced over and over again. 

His powerful hands created worlds, and yet they were gentle enough to bless the little children.

Consider John’s words describing the resurrected and glorified Savior: “And when I saw him, … he laid his right hand upon me, saying unto me, Fear not; … I am he that liveth, and was dead; and, behold, I am alive for evermore” (Rev. 1:17–18). 

When He lays His hand upon us, we, like John, can be alive in Him.

A tiny newborn son struggled for his life in the intensive care unit of a hospital. His lungs were not fully developed because of his premature birth, and he desperately fought for each breath of air. He was so small but with so much will to live. 

His young and inexperienced parents - courageously and ever faithfully, prayed that the Lord’s hand would reach out and somehow help their baby boy continue to breathe. 

As the father put his trembling hand through the small opening into the incubator, he felt so inadequate and powerless. 

He took hold of the tiny but perfect hand of the newborn son, and there was a powerful spiritual connection never to be forgotten. Two fingers from each of his hands covered the tiny head as he administered to him.

The parent’s desire for him was pure, but they knew that his earthly experience rested in the Lord’s hands and not in their; nor in the medical team’s hand - who cared for him. 

And then – the father humbly realized that his quivering hands held power and authority well beyond his own. 

The father’s fingers on the child’s head symbolized the placing of God’s hands and power upon the newborn.

Following that blessing, in a moment of emotional peace, the couple looked at each other across the incubator, feeling the spirit of renewed hope and comfort born of faith in the Lord Jesus Christ and in the personal effect of His Atonement. 

It was a powerful witness of His love for an infant son who had just left His presence. The young parents were now better prepared to accept the Lord’s will for their newborn son. 

They demonstrated their faith and placed their hands - in the hands of the Savior. It was as if the Savior’s own hands provided the critical respiratory aid, allowing their son to breathe and gain sustenance. 

With each breath and with each incremental bit of progress, the parents continued to express prayerful thanks. 

And now, today - those indebted parents have a healthy son.

The great plan of happiness includes a familiar roller coaster of challenging times - along with the most joyful times. 

Yes, we have all had our moments of difficulty and heartbreak. Occasionally, they are so difficult for us that we just want to give up. 

There are times when our steps are so unsteady – we feel discouraged – and feel compelled to reach in desperation for anything at all that can give us peace.

Every one of us needs to know that we can go on in the strength of the Lord. We can put our hand in His, and we will feel His sustaining presence lift us to heights  - unattainable alone.

When a stricken father brought his terribly afflicted son to Jesus, Mark records that “Jesus took him by the hand, and lifted him up; and he arose” (Mark 9:27).

We must trust in the Lord. 

If we give ourselves freely to Him, our burdens will be lifted and our hearts will be consoled.

The late Elder Richard G Scott has counseled: “Trust in God … no matter how challenging the circumstance. … Your peace of mind, your assurance of answers to vexing problems, your ultimate joy - depends upon your trust in Heavenly Father and His Son, Jesus Christ” 

How do we learn to trust? How do we learn to extend our hand and connect to the comfort provided by the Lord?

Clear instructions came from the Lord to prophet Joseph Smith: “Learn of me, and listen to my words; walk in the meekness of my Spirit, and you shall have peace in me. … Pray always, and I will pour out my Spirit upon you” (D&C 19:23, 38).

The four sources to those blessings as described in those instructions to the prophet Joseph Smith are:

Learn

Listen

Seek the Spirit

Pray always

The Lord will provide the wherewithal; and the support - if we are willing to open the door and receive His hand of divine assistance.

The late prophet Thomas S. Monson reminds us of the Savior’s willing hand of rescue: “Adored is the hand that saves—even the hand of Jesus Christ, the Son of God. … With that hand he knocks upon the door of our understanding” 

A young couple were preparing to enjoy an evening together. They were rushing around trying to get things ready; and giving the babysitter some last-minute instructions. 

They didn’t really notice the sad countenance of one of the children; and the tears in the eyes of another until they were at the door, ready to leave. 

They realized that their children were apprehensive about their mommy and daddy being away from them. So their parents gathered their four precious children around them. 

Their daddy asked them to put their hands out in front of them. All eight tiny hands were extended. Mom and Dad then kissed each hand and told them that when they missed them; or they were frightened; or needed to feel their love - they could put their little hands up to their cheeks and they would be able to feel Mommy’s and Daddy’s presence anytime. 

They were so happy, and when the young parents got into their care, they saw four little children standing at the window with smiles on their faces and hands on their cheeks.

They trusted their parents. They knew they were loved.

Just as little children trust - each of us must have that same childlike, unreserved trust. 

We must all remember that we are sons and daughters of God; and that He loves us – so so very much. 

If we truly understand who we are, we will have an unfailing source of hope and comfort.

We can never complete “the race that is set before us” (Heb. 12:1) without placing our hand in the Lord’s.

A young girl who enjoyed to run for exercise decided to compete in a marathon. She trained and worked very hard, along with some of her friends. 

The race was difficult, and there were times when she wanted to quit. But she kept going, just concentrating on one step at a time. 

As she was approaching the middle part of the course, she heard someone behind her shout out, “Blind man on your left.”

She turned her head only to see a blind man overtake her, holding the hand of another man. They were both running the race. 

As they passed, she could see how tightly the blind man held the hand of his friend.

Overcome with her own physical pain, she was lifted as she watched these two men run hand in hand. 

He who could see was motivated by his blind friend, and the blind man depended upon the connection he had to his friend’s hand. 

The young women knew the blind man could never finish the race alone. She was inspired by the trust of the blind man and the devoted love of his friend.

In like manner, the Savior has stretched forth His hand to each of us so that we don’t have to run alone. 

“To those [of us] who [occasionally] stagger or stumble, He is there to steady and strengthen” As we advance toward the finish line, He will be there to save us; and for all this - He gave His life.

Imagine the wounds in His hands. His weathered hands, yes, even His hands of torn flesh and physical sacrifice – imagine it.  This love of sacrifice and the gift of His hands – give to us, greater power and direction.

It is the wounded Christ who leads us through our moments of difficulty. It is He who bears us up when we need more air to breathe; or direction to follow; or even more courage to continue.

If we will keep the commandments of God - and walk hand in hand with Him in His path, we will go forward with faith and never feel alone.

Trust in His promise of eternal life, and allow peace and hope to distill upon you.

When we connect with the Author of Peace and with His perfect and redeeming love, then we can come to know the reality of the Lord’s promise: “I the Lord thy God will hold thy right hand, saying …, Fear not; I will help thee” (Isa. 41:13).

I testify of Jesus Christ, our Redeemer and living Savior.

I testify that He lives and extends His loving hand to each and everyone of us. In the name of Jesus Christ, amen.`

    body: `I prepared my talk on Monday or Tuesday.  And it was amazing that throughout the week - little messages from all around me – were giving me thoughts that I could add to my talk.  Almost every day I would take these things and fit it into this message.

Our prophet - President Nelson challenged us - This New Year’s Day, make one of your resolutions to be more resolute in being kind to (each) other and strengthening your own spiritual foundation.

Today I would like to touch upon the principle of being kind to one another – which in return, I believe will strengthen your own spiritual foundation.

To start off – here are a couple of stories about kindness:

An older lady was in a long McDonald's drive-through line up - one morning - when a young lady behind her leaned on her horn because the older lady was taking too long to place her order.

Take the high road - she said to herself. So when she got to the first window, she paid for the young lady’s order as well.

The cashier must have told her what was done because as they moved up, she leaned out her window and waved and mouthed "Thank you.", she was obviously embarrassed that she had repaid her rudeness - with kindness.

When the older lady got to the second window, she showed them both receipts – and then proceeded to take the young woman’s food as well.

Now the younger lady had to go back to the end of the line, and start all over.

Moral of the story - Don't honk your horn at old people.

Second story – 

A person found a girl outside a mall crying with distraught.

When asked, what was wrong, she told the person that she had just lost out of her pockets - $200 which she has been saving for a very long time. 

Out of the kindness of that person’s heart, she gave the distraught girl $40 out of the $200 – which she had earlier found at the entrance of the mall.

Moral of the story - When God blesses you, you be kind and pay it forward.

I certainly hope that these little stories – are not the stories that we can live by as it inspires you about kindness.

When you think of kindness – what images and thoughts come to you?  For me – I think of caring, being sympathetic, being generous, gentle, thoughtful, compassionate, considerate and charitable.

And – from one of my all-time favourite movies from the 1980s – Bill and Ted’s Excellent Adventure – they had a saying which was intended to be the foundation of their movie – “Be Excellent to Each Other”.

How can we be Excellent to Each Other?

I think that if we apply those thoughts and images that I asked you about earlier – whether it be caring, thoughtfulness, compassion, and being sympathetic, or whatever those were that came to your mind – if we did these things – we truly would be - Excellent to Each Other.  

And by doing those things – we would then be undertaking the challenge that our prophet has asked us to do - to be kind to one another.

Jimmy dusted off his pants. “My cancer didn’t tell me not to help others, Doc,” he said, before waving at the old man to start the car. The engine roared to life. 

The old man thanked Jimmy and drove off. Then Jimmy got into his car and took off as well.

Why the change of heart? Because the patience of love - had won.

Brothers and Sisters - when someone drives you up the wall. When you have had it with all the negativity - be willing to be patient. I know that it’s hard to be kind and patience to some people.

So brothers and sisters – let us follow Him and be willing to be patient - as He does.

“But,” you ask, “what if people are rude?”

Love them.

Love them.

Love them.

In a Dr. Seuss Christmas story, the small-hearted Grinch takes food and toys away from all the Who’s of Whosville in an effort to steal their Christmas joy.

Yet on Christmas morning, everyone in Whosville – the old, the young, the small, the big – they gathered, held hands and sang without any presents at all.

And the Grinch with his grinch-feet, ice cold in the snow, stood puzzling and puzzling, how could it be so?

It came without ribbons and bows! It came without packages, boxes or bags!

And he puzzled three hours, till his puzzler was sore, the Grinch thought of something he hadn’t before.

Maybe Christmas, he thought, doesn’t come from a store. Maybe Christmas, perhaps, is a whole lot more.

Do you know why the Grinch hated Christmas? Because his heart was so filled with hurts…, pains of the past…, and brokenness… That there was NOT enough room…, for joy.

Let the Christmas Joy be our attitude; Let the Christmas Joy into our heart.

I’m sure that we all know Grinches in our lives – and I am sure – that we all have bouts of being a Grinch.  

We are not immune to times of hurt, pains of the past, and brokenness.

Rest assure brothers and sisters – your hearts can be enlarged, it can swell so that all darkness and pain in your life - will be cast away - and peace, tranquility and stillness will envelop you and those around you.

The things of this world are fleeting.

You can lose joy in your work.  You can lose joy in your home.  You can lose joy in your faith. You can lose yourself in all kinds of hang-up, and addictions, and negative thinking.  You can isolate yourself in loneliness and try to go it alone.

You can build up a lot of fences for why you don’t let God in.  But God knows how to find you.

One of the messages of Christmas Joy isn’t that you found God - but that God has found you.

He finds you in the places of despair. He finds you in the when you are distressed He finds you when you are wounded, broken, and lost.  God reveal Himself to you.  

Brothers and Sister – take moments in your busy lives to ponder, listen, and attend to the whisperings that He might be saying to you this Christmas on a personal level.

Maybe God is reminding you that He is with you - in the loneliness.  That he is with you - in the fire. That is He is with you - in the storm. That He is with you - in the financial struggles.  That He is with you - in your sickness and pains.

He is with you – Brothers and Sisters - when you have done wrong – or when you cannot forget, or forgive yourself.

There is nothing you have done or experience – that withholds His succor, relief, and peace.

Regardless of all that has happened - He still loves you.  He still comes to you.  

It isn’t under a Christmas tree. It isn’t wrapped up in a box with a ribbon or a bow.  The greatest gift of God is the free gift of the atonement.

I believe that the voice of God is always trying to reach you – to drawing you near to Him.  He who hath hears – let me hear!

You know sometimes we go into Christmas expecting everything to just be perfect. And things don’t turn out exactly the way we want it.  And we can be disappointed.

We can have a table spread with food, but unless you have your favorite dessert you feel let down.

There can be dozens of presents under the Christmas tree but unless you get that one gift you really wanted you can be disappointed.  Imagine opening a box that looks like a brand new golf club and it turns out to be wind chimes?

This is something to think about - 

How blessed we are - but easy it is, to find ourselves disappointed and complaining.

How we get so frustrated and hung up on the little things in life.

We are among the most blessed and privileged people that ever lived.  Yet it is as though we are walking around living in the negative, always seeing what we don’t have…, instead of what we do have.

Is it possible to have joy when life is hard? To feel peace amid uncertainty - hope in the midst of skepticism? 

Is it possible to change - to shake off old habits and become new again? 

Is it possible to live with integrity and purity in a world that no longer values the virtues that distinguish the followers of Christ?

Yes. The answer is yes because of Jesus Christ; whose Atonement ensures that we need not bear the burdens of mortality alone. 

There is nothing - this confused world needs more - nothing that inspires a greater sense of well-being - nothing that has greater power to strengthen families - than the gospel of Jesus Christ. 

The Savior will do for each of us what He has promised to do—if we will have faith in Him and receive His gift.

The Lord will never forget or forsake you.

Christmas is for love. It is for joy, for giving and sharing, for laughter, for reuniting with family and friends, for tinsel and brightly decorated packages. 

But most importantly it is about love.  Love of our Father in Heaven.  Love of our Saviour.  May we express this love always.

There is a story told about a small, innocent wide-eyed student who gave his teacher a wondrous Christmas gift. The teacher relates:

Mark was an 11 year old orphan who lived with his aunt, a bitter middle aged woman greatly annoyed with the burden of caring for her dead sister's son. 

She never failed to remind young Mark, if it hadn't been for her generosity, he would be a beggar and homeless orphan. 

Still, with all the scolding and chilliness at home, he was a sweet and gentle child. 

I had not noticed Mark particularly until he began staying after class each day (at the risk of arousing his aunt's anger) to help me straighten up the room. 

We did this quietly and comfortably, not speaking much, but enjoying the solitude of that hour of the day. 

When we did talk, Mark spoke mostly of his mother. Though he was quite small when she died, he remembered a kind, gentle, loving woman, who always spent much time with him. 

As Christmas drew near however, Mark failed to stay after school each day. 

I looked forward to his coming, and when the days passed and he continued to scamper hurriedly from the room after class, I stopped him one afternoon and asked why he no longer helped me in the room.

I told him how I had missed him, -his large gray eyes lit up eagerly as he replied, "Did you really miss me?" 

I explained how he had been my best helper. 

"I was making you a surprise," he whispered confidentially. "It's for Christmas." With that, he became embarrassed and dashed from the room. He didn't stay after school any more after that. 

Finally came the last school day before Christmas. Mark crept slowly into the room late that afternoon with his hands concealing something behind his back. 

"I have your present," he said timidly when I looked up. "I hope you like it." He held out his hands, and there lying in his small palms was a tiny wooden box. 

"Its beautiful, Mark. Is there something in it?" I asked opening the top to look inside. " 

"Oh you can't see what's in it," He replied, "and you can't touch it, or taste it or feel it, but mother always said it makes you feel good all the time - warm on cold nights, and safe when you're all alone." 

I gazed into the empty box. "What is it Mark," I asked gently, "that will make me feel so good?" "It's love," he whispered softly, "and mother always said it's best when you give it away." 

Yes, Christmas is for fun, laughter and song – and it’s for good and wondrous gifts. But mostly – Brothers and Sisters - Christmas is for loveMay we recommit to seek after this Jesus of Nazareth.  The boy – born to Mary in a stable.  Born to be the King, the Prince of Peace, the Saviour of Mankind.

May we rise up as sons and daughters of God - and shake off the world; shake off the troubles that weigh us down. May we realize the love that we have for each other; and the love that we have from our Father in Heaven and His Son.

I conclude with my most favorite and magnificent promise in the scriptures – which is given to those who cast ourselves before the Lord and draw liberally upon the matchless power of His Atonement – the Saviour promises: 

“I will go before your face. I will be on your right hand and on your left, and my Spirit shall be in your hearts, and mine angels round about you, to bear you up” (D&C 84:88).

Brothers and Sisters – my Christmas wish is that we all feel the power, the peace, the assurance, and confidence of the atonement which is brought to us because of the gift that our Father in Heaven gave the world with the birth of our loving older brother – even Jesus Christ.

May we honor him today, this season, and every day of our lives.

He is our only chance to the peace that you desire. He will show us the way because He is the way, to which I testify in the name of Jesus Christ, amen.`

    body: `What runs through your mind - when you think of Thanksgiving Day?

For some Thanksgiving Day is all about the food. Turkey, dressing, cranberry sauce, pumpkin/apple pie, my son Kaleb’s favorite – mash potatoes.  Oh such good food!

In the United States - Thanksgiving Day means FOOTBALL!!! They stay glued to the television - as one game is followed by another.

For others, Thanksgiving represents a LONG WEEKEND, a time to rest, unwind and relax.

And for some, Thanksgiving Day is a time for family. It represents a family reunion when mom and dad, brothers and sisters, uncles and aunts and cousins gather together. 

It’s interesting me – and I don’t know why – but I really don’t see as much determination for families to be together in Canada – like it is in the United States – where I understand that the Thanksgiving weekend is the busiest period for airplane commuting.  It’s even busier than Christmas! 

For some - Thanksgiving may be reflected in the story where a teacher asks her students, “Why do we have a Thanksgiving holiday?” To which one of the students quickly responds, “So we know when to start Christmas shopping!”

This is in reference to the shopping blitz in the States called - Black Friday.

For some Thanksgiving represents history. They think of the founding of our country and the early settlers and their relationships with each other.

The first official proclamation of thanksgiving in America was made by George Washington in 1789. And was made a national holiday by President Lincoln in 1863.

Thanksgiving has been officially celebrated as an annual holiday in Canada since November 6, 1879.  

While the date varied by year and was not fixed in Canada (like it is in the US), it was commonly the third Monday in October.  However, this year - it is tomorrow – the second Monday of the month.

For those of us who profess to follow the Lord, Thanksgiving Day is not just a time for food, football, fellowship and family. 

It should not be just a holiday in the fall – and it should not be limited to just one day at all. 

For God’s people - everyday ought to be Thanksgiving Day!

Paul told the Ephesians “…. give thanks always for all things to God the Father….” (5:20). 

A Second World War soldier was sent to a rest camp after a period of active service. When he returned to his platoon, he wrote a letter to General George Patton - and thanked him for the splendid care he had received, 

General Patton wrote back - that for thirty-five years he had sought to give all the comfort and convenience he could to his men, and added that this was the first letter of thanks he had received in all his years - in the Army.

I believe, Brothers and Sisters - that we can improve our own human nature in our lack of expression of gratitude. 

Do you remember the story of the ten lepers who came to Jesus for healing? 

Ten lepers approach the Saviour and asks Him to have mercy on them and He did by curing them of their leprosy. 

Of the ten lepers cured, only one came back and thanked and praised Jesus for healing him.

Jesus asked, “Were there not ten cleansed? But where are the nine? 

Is it possible that giving thanks - is a thing of the past? Can we feel content in feeling that it is sufficient to only take just one day a year to give thanks? 

I know Brothers and Sisters - There are so many things in this world, and in our lives - that could make it difficult for us to even utter the word “thanksgiving”.

Life can be rough – the wars and rumours of war; the natural disasters that devastate regions throughout the world; failing health in ourselves and other – can cause us, to just sometimes, just bow our heads and weep.

1 Thess 5:18 says - “In every thing give thanks: for this is the will of God in Christ Jesus concerning you.”

Just a little background on Paul when he wrote this epistle.  Paul was imprisoned in Rome.  He was beaten and starved; barely seeing the light of day.

And under these circumstances, Paul had faith; and had embodied the spirit of thanksgiving.

When Paul gave thanks, he didn’t mention:

the house he lived in

the money he had in the bank

the possessions he owned.

Paul based his thanksgiving on something else entirely.

He based his thanksgiving on the mercy and forgiveness that he had received from God.

Paul was trying to get this message across:  that true thanksgiving is more basic than simply a listing of blessings. 

True thanksgiving is based upon on how much you really love your Saviour. And true love for Him starts with realizing how much the atonement can affect your life.

Under almost the same circumstances – the Prophet Joseph Smith who was imprisoned and recovery from a mob beating; and being tarred and feathered - said this:

“Let us be thankful that it is as well with us as it is, and we are yet alive and peradventure, God hath laid up in store great good for us in this generation, and may grant that we may yet glorify His name.

Brothers and Sisters – it’s not a bad thing to be thankful for the possessions you have. 

And it’s not a bad thing to be grateful for the earthly comforts you enjoy. But if it stops there… if that’s the main focus of our thanksgiving – we then err in our intentions.

What happens when you lose those possessions?

What happens when you no longer have those earthly comforts?

What happens when you lose your home, your car, your family?

What happens when you lose your health?

If you suddenly lost those things… would you also lose your ability to be thankful?

The things of this earth are fleeting; they are temporary and short-lived.  

They break, they wear out, they get lost, and they get stolen, and they die. And there’s not a lot that we can do to stop it.

And if those earthly things disappear – and they form the principle basis for your thanksgiving – your joy and hope in this world will disappear as well.

However, brothers and sisters – the things of eternal nature - The spiritual gifts given to us from our Father in Heaven - the powerful and consecrated blessing of the Saviour’s atonement is one of those eternal gifts that will last and provide opportunities of peace, comfort, and reconciliation - each and every day our lives.  

It is never withheld.  

Consider these words written by Abraham Lincoln as part of a resolution in 1863 that made Thanksgiving a National Holiday – he said:

“We have been the recipients of the choicest bounties of heaven; we have been preserved these many years in peace and prosperity; we have grown in number, wealth, and power as no other Nation has ever grown. But we have forgotten God. We have forgotten the gracious hand which preserved us in peace and multiplied and enriched and strengthened us, and we have vainly imagined, in the deceitfulness of our hearts, that all these blessings were produced by some superior wisdom and virtue of our own.

 “I believe,” said President Joseph F. Smith many years ago, “that one of the greatest sins of which the inhabitants of the earth are guilty today is the sin of ingratitude”  

He went on to magnify his observation that the world is ever increasing in many people that feel they should be given the honour – because of the talents that THEY have blessed world.

Here is an example of who to truly thank for the simple items that we receive day in and day out:

Mrs. Green thanked Tom, the grocery boy, for delivering a loaf of bread.

"Do not thank me. Thank Grocer Jones," Tom smiled. "He gave me the loaf to deliver."

But when she thanked the grocer, he said, "I get the bread from Baker Brown. He makes it, so he deserves the thanks."

So Mrs. Green thanked the baker. But he told her that Miller Milligan should be given the gratitude. "Without Miller Milligan’s flour, I could not make bread," Brown replied.

The miller told her to thank Farmer Foster because he made the flour from Foster’s wheat. But the farmer also protested, "Don’t thank me; thank God," Foster said. "If He did not give my farm sunshine and rain, I could not grow wheat."

In contrast to this ultimate recognition of where all blessing flow – there was this old miser that grumbled:  "I do not have to thank anyone for anything I have.  Everything I have I got the hard way--by the sweat of my own brow."

"But” asked his neighbor, “who gave you the sweat?"

Thanksgiving requires awareness and effort, not only to feel it but to express it. 

Thanksgiving is a Spirit-filled principle. It opens our minds to a universe infused with the richness of a living God. 

Through it, we become spiritually aware of the wonder of the smallest things, which gladden our hearts with their messages of God’s love.

This Thanksgiving awareness heightens our sensitivity to divine direction. 

When we communicate thanksgiving, we can be filled with the Spirit; it inspires happiness - and carries divine influence. 

“Live in thanksgiving daily,” said Amulek, “for the many mercies and blessings which he doth bestow upon you.”

We have so much for which we can be thankful for. 

God has blessed us all immeasurably. Let us not allow Thanksgiving to be limited to food, football, family, and shopping.

Brothers and Sisters – Let our Thanksgiving Days be public, purposeful, passionate, and perpetual in remembering the One from whom all blessings flow.

My most profound thanksgiving - is for my Savior—an obedient Son, who did all that His Father asked and atoned for each and every one of us. 

As we remember Him and acknowledge His goodness, we can then develop the desire to be like Him. 

May we be blessed to feel of His love in our lives daily. 

May we thank God for all things: for life and what sustains it - for loved ones that make it meaningful - for faith and purpose.

I bear my testimony to you - that the Lord wants us to be grateful and thankful unto him. And if we do these things which he has advised us to do - we will, be the happiest people who dwell upon the earth.

I so testify, in the name of Jesus Christ, amen.`
