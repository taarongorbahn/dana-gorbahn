    body: `The other night when Bro and Sis Norton had returned from the enjoyable ”A Night in Bethlehem”, they spent a short while relaxing on the couch reflecting upon the spirit that they felt from the program and then retired to bed.

Some time in the middle of the night they were awoken by heavy knocking on their front door. Richard was very unhappy about this. He went down stairs and noisily unlocked the door to be confronted by a very intoxicated man.

“'cuse me thur. Will you helpth me with a puth.”

"Help you with a push!" said Richard. "You drunken fool! Get away from my house before I call the police! Irresponsible people like you should be banned from driving!" And slammed the door into the man's face.

He went back to bed and was astonished to find himself being reprimanded by his wife, Tanya.

"How could you be so mean and uncharitable." she said. "Surely this evening's program must still be ringing in your ears. How the innkeeper turned Joseph and Mary away. Here you are presented with the same situation and you show yourself to be no better than that uncaring man. Shame on you."

Richard was shocked by the relevance of what he had done and was full of remorse. He ran down the stairs and opened the front door, but the man was no longer there.  So, he ran down to end of his driveway to see if the man or his car was along the road; but there was no traffic or people at all.

On the off-chance that the man might still be around somewhere Richard shouted loudly. “Hey mister, needing a push, where are you?”

The unmistakable drunken voice replied immediately. "Over here thur, on your swing."

Brothers and sisters, I extend to you my warmest Christmas greetings.

As followers of the Master, I desire that we all draw closer to Him as we remember during this season His wondrous birth virtually two thousand years ago.

We are all aware of the significance that a name or title can have in describing an important office.

In foretelling the birth of Christ more than 700 years before it occurred, the prophet Isaiah used titles expressing great admiration: “Wonderful, Counsellor, The mighty God, The everlasting Father” (Isa. 9:6).

Isaiah also used the titles Savior and Redeemer, expressing great faith in Christ and His mission.

One of these titles that is of particular interest in our present world is “Prince of Peace”.

Isaiah declared. “Of the increase of his government and peace there shall be no end,” What a thrilling hope that is for the increasingly disobedient world that we live in!

The Lamanite prophet Samuel foretold the birth of the Savior five years before it happened. The people would not let Samuel into Zarahemla to preach, so he stood on a city wall and proclaimed:

“Behold, I give unto you a sign; for five years more cometh, and behold, then cometh the Son of God to redeem all those who shall believe on his name.

“And behold, this will I give unto you for a sign at the time of his coming; for behold, there shall be great lights in heaven, insomuch that in the night before he cometh there shall be no darkness, insomuch that it shall appear unto man as if it was day. …

“And behold, there shall a new star arise, such an one as ye never have beheld; and this also shall be a sign unto you” (Hel. 14:2–3, 5).

The Savior dedicated His life to blessing other people. As expressed by His chief Apostle, Peter, “God anointed Jesus of Nazareth with the Holy Ghost and with power: who went about doing good” (Acts 10:38).

Never did the Savior give in expectation of receiving.

He gave freely and lovingly, and His gifts were of great value. He gave eyes to the blind, ears to the deaf, and legs to the lame; cleanliness to the unclean, wholeness to the infirm, and breath to the lifeless.

His gifts were opportunity to the downtrodden, freedom to the oppressed, forgiveness to the repentant, hope to the despairing, and light in the darkness.

He gave us His love, His service, and His life. And most important, He gave us and all people resurrection, salvation, and eternal life.

We should strive to give as He gave. To give of oneself is a holy gift. We should give as a remembrance of all the Savior has given.

Christmas is a time for giving. Someone once said he couldn’t think of what to give for Christmas. The next day in the mail he received an anonymous list which read:

Give to your enemy forgiveness,

To your opponent tolerance,

To your friend your heart,

To all men charity, for the hands that help

are holier than lips that pray,

To every child a good example,

and to yourself—respect.

All of us need to follow the example of the Savior in giving these kinds of gifts. There is a thought provoking poem that says:

What can I give Him,

Poor as I am?

If I were a shepherd

I would give Him a lamb,

If I were a Wise Man,

I would do my part,—

But what I can I give Him,

Give my heart.

This Christmas, mend a quarrel. Seek out a forgotten friend. Dismiss suspicion and replace it with trust.

Write a letter. Give a soft answer. Manifest your loyalty in word and deed. Keep a promise. Forgo a grudge. Forgive an enemy.

Apologize. Try to understand. Examine your demands on others. Think first of someone else. Be kind. Be gentle.

Laugh a little more. Express your gratitude. Welcome a stranger. Bring joy to the heart of a child. Take pleasure in the beauty and wonder of the earth.

Speak of those things that you love and then speak it again.

Christmas is a celebration, and there is no celebration that compares with the realization of its true meaning.

A life filled with unselfish service will also be filled with peace that surpasses understanding.

The Savior said: “Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled: neither let it be afraid” (John 14:27).

This peace can come only through living the principles of the gospel. These principles constitute the program of the Prince of Peace, who is also the prince of glory and the prince of eternal progress.

May we be ever faithful in observance of our Savior’s teachings.  He said, “If ye love me, keep my commandments” (John 14:15).

May our Saviour become our focal point not only at this Christmas season, but always.

I testify that He lives today, the babe of Bethlehem—and now the risen Lord. He and His Eternal Father love and care for each of us in a sacred and personal way.

I extend my love and admiration to you this day.  My wish for you is a happy, joyous Christmas. May this season bring to you and yours the rich blessings of the gospel of the Savior,

I pray, in the name of Jesus Christ, amen.`

    notes: "Written for Kaleb",
    body: `As a deacon my responsibilities are to: Pass the sacrament, collect fast offerings, act as a messenger for the bishop in sacrament meeting, and set a good example.

It is amazing that I am given these responsibilities.

Do you know who was the first person to pass the sacrament?

Jesus Christ.

The sacred ordinance of the sacrament represents the sacrifice that Jesus Christ made for each of us; and I am given this responsibility to administer this amazing ordinance to the members of the church.

Elder Jeffrey R. Holland said this:

“We ask you young men of the Aaronic Priesthood to prepare and bless and pass these emblems of the Savior’s sacrifice worthily and reverently. What a stunning privilege and sacred trust given at such a remarkably young age! I can think of no higher compliment heaven could pay you. We do love you. Live your best and look your best when you participate in the sacrament of the Lord’s Supper”

I feel so honored to be given this trust.

I think to myself “how can I honor and sustain my priesthood?”

The answers are … I can honor and sustain my priesthood:

by accepting callings from priesthood leaders;

serving others;

speaking respectfully of Church leaders;

and praying for fathers, brothers, family members, and others who hold the priesthood.

Imagine this room is as dark as possible. Go on and close your eyes and imagine this, but don’t fall asleep.

There was a group of tourists who went into a deep, dark cave. Once inside the cave the guide turned off the lights, waited for a few minutes, and then asked each person to point in the direction of the exit. When the lights came back on, people were pointing in all different directions.

Elder Robert D. Hales said: “If the power of the priesthood were not upon the earth, the adversary would have freedom to roam and reign without restraint. There would be no gift of the Holy Ghost to direct and enlighten us; no prophets to speak in the name of the Lord; no temples where we could make sacred, eternal covenants; no authority to bless or baptize, to heal or comfort. … There would be no light, no hope—only darkness”.

When I live the gospel, I will be prepared to accept the responsibilities and enjoy the blessings of the priesthood.

In the Achievement Days booklet there is something called “My Gospel Standards”

As I read these Gospel Standards, I will pause and I wish that you take a moment to think to yourself as to how worthily you are living these standards:

I will remember my baptismal covenants and listen to the Holy Ghost.

I will be honest with Heavenly Father, others, and myself.

I will seek good friends and treat others kindly.

I will dress modestly to show respect for Heavenly Father and myself.

I will only read and watch things that are pleasing to Heavenly Father.

I will only listen to music that is pleasing to Heavenly Father.

I will use the name of Heavenly Father and Jesus Christ reverently. I will not swear or use crude words.

I will keep my mind and body sacred and pure.

I will not partake of things that are harmful.

I will do those things on the Sabbath that will help me feel close to Heavenly Father.

I will choose the right. I know I can repent when I make a mistake.

I will live now to be worthy to go to the temple and serve a mission.

I will follow Heavenly Father’s plan for me.

President Gordon B. Hinckley, fifteenth President of the Church: “This church does not belong to its President. Its head is the Lord Jesus Christ, whose name each of us has taken upon ourselves [at baptism]. We are all in this great endeavor together. We are here to assist our Father in His work and His glory, ‘to bring to pass the immortality and eternal life of man’ (Moses 1:39). Your obligation is as serious in your sphere of responsibility as is my obligation in my sphere. No calling in this church is small or of little consequence. All of us in the pursuit of our duty touch the lives of others”

It is my hope and prayer that I will always be worthy to hold and exercise the power and authority that has been given to me and that we will all do whatever we can to touch the lives of others.

In the name of Jesus Christ. Amen.`

    id: "gifts-of-the-spirit",
    section: "Church Talks",
    title: "Gifts of the Spirit",
    date: "August 13, 2006",
    location: "Smithers, BC",
    notes: "",
    body: `Good Morning Brothers and Sisters.

Over the past few weeks, many of our talks have had a theme of gaining understanding and I wish to continue this theme today.

The phrase "return with honor" is a clear description of our purpose in this life here in our mortal probation.

In our preexistence, we lived in the presence of God the Father; His Son, Jesus Christ; and the Holy Ghost.

Our goal in coming to this earth was to "return with honor" back into the presence of God the Father, Jesus Christ, and the Holy Ghost eternally.

One of the most significant events in our lives is that of baptism. The prophet Nephi describes that after we have exhibited faith and repentance and are baptized, we will find ourselves entered in to the gate, to receive the gift of the Holy Ghost; which if we are obedient and endure to the end, it will lead us to eternal life.

I have recently been enjoying a book written by Henry B. Eyring (member of the Quorum of the Twelve), entitled "Draw Closer to God".

I must tell you that because of reading good books like this, over this past week, I have experienced a most marvelous confirmation of the truthfulness of the Book of Mormon and the Prophet Joseph Smith.

In this book, he attempts to convey to the reader of how our Heavenly Father will speak to us through the many different ways of the Holy Spirit.

My talk today will address this amazing gift that we are promised.

The Holy Ghost is the third member of the Godhead and is identified as the Holy Spirit.

This Holy Spirit is a gift from God to help us make the decisions that will allow us to find and fulfill our mission in this life.

In these latter days, an understanding of the gifts of the Spirit has been given to us by revelation as recorded in D&C 46: "For all have not every gift given unto them; for there are many gifts, and to every man is given a gift by the Spirit of God" (D&C 46:11).

It is clearly instructed that each of us is given a gift or gifts. Do we know what gift we have been given? Are we seeking to find our gifts?

"To some is given one, and to some is given another, that all may be profited thereby" (D&C 46:12).

This phrase "that all may be profited thereby" is a very important concept to understand about the gifts of the Spirit.

"To some it is given by the Holy Ghost to know that Jesus Christ is the Son of God, and that he was crucified for the sins of the world.

"To others it is given to believe on their words, that they also might have eternal life if they continue faithful" (D&C 46:13-14).

The gifts given to each person are not only given for that person but also for those who can benefit from that gift if it is shared with others.

For example, you may be given the gift of faith and never question the existence of God, our Heavenly Father, and His Son, Jesus Christ.

I would like to emphasize this point, one might not have the gift to know the truth of all things; but that person may have the gift to believe on the words of those who do.

The gifts identified in section 46 give rise to other gifts, such as:

The gift to ponder; looking to God for direction.

The gift to hear and respond to the still, small voice.

The gift to be calm, which includes the ability to curb anger.

The gift to study and to listen.

And, perhaps the greatest gift of all, to have charity.

Listen to this statement by Elder Bruce R. McConkie of the Quorum of the Twelve Apostles: "Spiritual gifts are endless in number and infinite in variety. Of the sacred gifts of the Spirit, one that I believe has impact on each of our lives is the gift of prophecy or revelation. This gift is different from the priesthood office of prophet. The gift of prophecy is the testimony of Jesus."

President Joseph Fielding Smith taught, "All members of the Church should seek for the gift of prophecy, for their own guidance"

Every Church member, if faithful, has the right to receive revelation for his or her personal blessing.

One might ask, "What are the manifestations of the gifts of the Spirit and have I recognized it in my life?"

The scriptures are clear with regards to the feelings we can have within us, when we are touched by the Spirit.

"Verily, verily, I say unto thee, blessed art thou for what thou hast done; for thou hast inquired of me, and behold, as often as thou hast inquired thou hast received instruction of my Spirit. If it had not been so, thou wouldst not have come to the place where thou art at this time.

"Behold, thou knowest that thou hast inquired of me and I did enlighten thy mind; and now I tell thee these things that thou mayest know that thou hast been enlightened by the Spirit of truth"

"Yea, I tell thee, that thou mayest know that there is none else save God that knowest thy thoughts and the intents of thy heart.

"I tell thee these things as a witness unto thee-that the words or the work which thou hast been writing are true" (D&C 6:14-17).

The Lord reminded Oliver of the night he prayed to "know concerning the truth of these things." He helped Oliver remember by saying, "Did I not speak peace to your mind ... ? What greater witness can you have than from God?" (D&C 6:22-23). Oliver had to learn to recognize influences of the Spirit, as you and I must learn.

It is so very important for us to be close in spirit to our Heavenly Father so that when light is brought to our minds, we will recognize it.

It is as common as this, that I too, had received a manifestation of the Spirit this past week. I bear record that it is true.

Access to the gifts of the Holy Ghost is guaranteed only when we live our lives in harmony with the principles of the gospel.

Following our baptism, each of us had been given the right to receive the gift of the Holy Ghost.

If we are faithful, we can have His influence with us. Through Him, we can be blessed with certain spiritual powers called the "gifts of the Spirit".

These gifts are given to those who are faithful. They will help us know.

They will help us to bless others. They will guide us back to our Heavenly Father.

While the Holy Ghost can influence all mankind, the gift of the Holy Ghost functions when: 1. an individual has been baptized and confirmed by one having the priesthood and has been given the gift of the Spirit, 2. an individual continues to act under the principles of righteousness, 3. the recipient is striving to be virtuous and pure, 4. the recipient acts with integrity and truth and keeps the commandments of God.

To find the gifts we have been given, we must fast and pray. Our patriarchal blessings often tell us the gifts we have received and promises of the blessing we can receive if we seek after them.

I encourage all of you to seek and discover your gifts, which will give direction to your life.

We can also have the gift of discerning. George Q. Cannon has called the gift of discerning of spirits "a gift that is of exceeding value and one that should be enjoyed by every Latter-day Saint. ... No Latter-day Saint should be without this gift, because there is such a variety of spirits in the world which seek to deceive and lead astray"

Some may mean well but they are listening to the wrong influences. Some people with a very different type of spirit—they are clever with their words. They focus on the imperfections of others. And try to persuade others to follow their course.

The Spirit of the Lord will, and does withdraws itself from them. Unless they change, they will not be able to endure to the end but they will fall away in time.

All of us have questions at times in our lives on policies, procedures, or even principles. Even our prophet, President Hinckley, as a young student, questioned somethings about the church. What did he do?

He looked to the gifts of the Spirit for guidance. How do we do that?

First and foremost, we must go before the Lord, again, as a child ready to be taught.

We cannot demand an answer. If it is a demand, one loses the opportunity for an answer.

Second, if we have strong feelings about the way something should be and are unwilling to listen, we may lose the opportunity to get an answer.

One only has to remember when Martin Harris wanted to take home pages of the Book of Mormon translation to show to others. Joseph Smith prayed to the Lord a number of times to finally be allowed to let Martin do it. The Lord knew that the pages would be lost. But sometimes we want something so much and keep praying about it that the Lord lets us do it for our learning experience.

Humility and submitting ourselves to God like a child will always be vital in receiving direction from Him.

The gift of discernment is like the iron rod; it will keep us on the path toward the tree of life, which means eternal life.

How does one distinguish between manifestations of the Spirit and counterfeits? One might ask these questions: Is the manifestation edifying? Spiritual gifts are not given to satisfy one's lusts or curiosities, but are given as a blessing and benefit to those who love God and keep His commandments.

Too often people feel that answers to their prayers and their pleading for guidance and direction will be given in dramatic manifestations or through a direct voice giving specific directions from a heavenly host.

In most cases, this is not so.

As a regional representative, Robert D. Hales was traveling with President Marion G. Romney to a stake conference for the selection of a new stake president. They had been driving in a car for more than an hour discussing the Church and priesthood administration. For some reason, Elder Hales asked a question that, and at the moment he asked it, he realized was inappropriate.

The question he asked President Romney was "What is the most spiritual experience you have had as an Apostle of the Lord?" There was a pause. It seemed like an eternity. Then he said, "I believe what Joseph Smith and Brigham Young taught, that if we would keep our spiritual experiences to ourselves, many more spiritual experiences could be shared with us."

It seemed like there was a long period of silence after that remark, and then he said to Elder Hales, "I owe you a better answer." Then he gave Elder Hales great counsel. He said the greatest spiritual experiences of his life had been when he had been on an assignment from the President of the Church or the President of the Quorum of the Twelve, as we were that day.

He said: "We will interview 25 or 30 priesthood brethren, and there will be more than one who will be qualified to be the stake president. But after we have done all we can do, we will get on our knees and pray to our Heavenly Father. We will tell Him of our feelings of who the new stake president ought to be and the reasons why. We will tell Him of the needs of the stake at this time. Then He will give us a confirmation."

It was interesting that he said "us," because it was true on that occasion that as they knelt and prayed; they both were able to receive a confirmation.

Isn't it interesting that President Romney was sent to interview 25 or 30 men to choose one stake president rather than being told directly who it should be before his arrival?

This is what the Lord means when He tells us to study it out in our own minds. Too often we want to be given answers to questions and problems.

Some think it would be nice to have "spiritual fortune cookies" we could open to find the answers to life's challenges. Wouldn't it be nice to have a labeled jar we could reach into for our answers? But that is not the way it is meant to be.

Satan is mindful of each of us. He is committed to our destruction. He hopes we will fail to keep the covenants we have made to our Heavenly Father at baptism and in the temple.

Think about it. That is the only joy and satisfaction he and his disciples will ever have-when one of us falls.

It is for this reason that we want to have the stability and strength of the gifts of the Spirit; so that we may weather the storms when they come.

We will be tried. We don't want to decide to learn how to swim when the boat is already sinking.

The gifts of the Spirit can guide and enrich our lives. They can strengthen us spiritually and temporally. They can help us bless the lives of others.

Most important, they can bring us comfort in times of trial.

My brothers and sisters, I wish to emphasize the fact that God has bestowed these gifts upon the children of men and we are blessed because of it, but we can only be blessed with these gifts, when we are but faithful and submit ourselves as a child to Him through obedience and faith upon His words. I promise you that as you do these simple truths, you too will have the power and influence of these gifts; of which I bear testimony of, in the name of Jesus Christ. Amen.`

    title: "Christmas 2005",
    date: "December 25, 2005",
    location: "Smithers, BC",
    notes: "",
    body: `Christmas is truly an amazing time. Look all around you and you will see wonderful activities and excitement. As I drive home from work each night, I marvel at the homes that are lighted up. You also go into stores that are all decorated up. Even at home, I look over our living room and see the garland wrapped around the banister and along the fireplace. The Christmas tree is decorated and lit up and I just take a moment to say, how beautiful this is.

My children are excited to give each other presents. They are so concerned about wanting to give. Kaleb even tried to wrap up his piggy bank and place it under the tree for his father. Truly, as it says in Acts 20:35; "it is more blessed to give than to receive". Isn't this a wonderful time?

Of all the holidays, there is none that strikes a chord for so many. It stirs our hearts to remember traditions, to remember our families, to remember how to give, to remember why we give; which in turns gives us remembrance of what Christmas is really about!

Last Sunday we attended the Christmas Cantata at the Pentecostal Church. The members of the choir had spent since September learning and practicing songs of Christmas worship. It was a wonderful activity and certainly stirred my heart to the remembrance of the Christmas spirit.

This season is truly a wonderful time of year.

The legend of Santa Claus, the Christmas tree, the decorations, and the giving of gifts all express to us the spirit of this day we celebrate; but the true spirit of Christmas lies much deeper than this.

It is found in the life of the Savior, in the principles He taught, in His atoning sacrifice—which become our great gift and inheritance.

Many years ago the First Presidency of the Church made this significant statement:

"Christmas, to the Latter-day Saint, is both reminiscent and prophetic—a reminder of two great and solemn events, which will yet be regarded universally as the mightiest and most wonderful happenings in the history of the human race. These events were [foreordained] to take place upon this planet before it was created. One of them was the coming of the Savior in the meridian of time, to die for the sins of the world; and the other is the prospective advent of the risen and glorified Redeemer, to reign upon the earth as King of kings" ["What Christmas Suggests to a Latter-day Saint," Millennial Star, Jan. 2, 1908, 1].

The real Christmas comes to those who have taken Christ into their lives as a moving, dynamic, vitalizing force.

The real spirit of Christmas lies in the life and mission of the Saviour.

In his contemplation of the Christmas season, James Wallingford penned these lines: [Poem omitted for copyright — James Wallingford, untitled poem beginning "Christmas is not a day or a season," quoted in Charles L. Wallis, ed., Words of Life (1966), p. 33. Add back in from the source document.]

When we choose to have Christ at the center of our own heart, ... we bring the Lord into the core of our home and family.

When we choose to have Christ at the center of our heart, we choose not only to practice Christlike behavior each day but also to teach our family to do the same.

It is essential to have Christ at the core of our lives. In these most difficult times, we need Him! He is the source of strength and safety. He is light. He is life.

As our personal Savior and Redeemer, He invites us, one by one, with outstretched arms to "come unto him".

When we accept the Savior's invitation, we are strengthened individually, and others are blessed through our righteous influence.

My Brothers and Sister, if you desire to find the true spirit of Christmas and partake of the sweetness of it, let me make this suggestion to you.

During this hurried and sometimes chaotic festive time; find time to turn your heart to God.

Perhaps in the quiet hours, and in a quiet place, and on your knees—alone or with loved ones—give thanks for the good things that have come to you, and ask that His Spirit might dwell in you as you earnestly strive to serve Him and keep His commandments. He will take you by the hand and His promises will be kept.

I know that God lives. I bear witness of His Son, the Savior of the world, and I express appreciation for the blessings of His life, which is for all.

May we always remember His example and His sacrifice; and may we never render that sacrifice in vain. May we continue to have this wonderful feeling and spirit of Christmas, always! This is my prayer and challenge, in the name of Jesus Christ. Amen.`

    title: "Forgiveness",
    date: "October 23, 2005",
    location: "Smithers, BC",
    notes: "",
    body: `Good Morning Brothers and Sisters, I wish to speak a couple of topics that are closely related.

I would like everyone to either take out a pen/pencil and a piece of paper.

If you do not have one, I want you to think in your head and answer this question: What five important things would you like to accomplish in your life?

Now before, we visit these answers, a couple of months ago, I briefly spoke about an experience that I had. I received strong impressions, which I consider to be revelation from our Father in Heaven, regarding the needs of our branch.

These impressions have weighed heavy on me and I pray that we will all endeavor to put into effect in our lives on an ongoing basis.

For that which I hope for us to practice is that of being a Zion like people.

Now getting back to the five important things that you would like to accomplish in your life, the Prophet Joseph Smith: "We ought to have the building up of Zion as our greatest object. ... The time is soon coming, when no man will have any peace but in Zion and her stakes" (Teachings of the Prophet Joseph Smith, sel. Joseph Fielding Smith [1976], 160-61).

As you look at your list, how many of the items could help build up Zion?

How might you modify your list to respond to the words of the Prophet Joseph Smith?

The word Zion has several meanings.

However, I wish to touch upon one of them. In D&C 97:21, it says: Therefore, verily, thus saith the Lord, let Zion rejoice, for this is Zion—THE PURE IN HEART; therefore, let Zion rejoice, while all the wicked shall mourn.

And in Moses 7:18 it says: And the Lord called his people Zion, because they were of bone. heart and one mind, and dwelt in righteousness; and there was no poor among them.

When we speak of building Zion in our day, we are referring to purifying our hearts so that the places we live can be called Zion.

The Saints of our dispensation have been commanded to establish Zion we are commanded to "seek to bring forth and establish the cause of Zion"

For us as Saints, establishing Zion means becoming pure in heart and living in unity.

The early Saints had difficulties in being able to establish and build the city of Zion. Why? D&C 101:6-8 tells us: "Behold, I say unto you, there were jarrings, and contentions, and envyings, and strifes, and lustful and covetous desires among them; therefore by these things they polluted their inheritances. They were slow to hearken unto the voice of the Lord their God; therefore, the Lord their God is slow to hearken unto their prayers, to answer them in the day of their trouble. In the day of their peace they esteemed lightly my counsel; but, in the day of their trouble, of necessity they feel after me."

What can we learn from their experience that can help us build Zion today?

To build Zion—whether in a city, in our stakes, or in our homes-we must develop the qualities of a Zion people: pure hearts, unity, and unselfishness.

To build Zion—we must not be slow to hearken unto the voice of the Lord our God and esteem His counsel.

Hearken to these words of a prophet: "I see a wonderful future in a very uncertain world. If we will cling to our values, if we will build on our inheritance, if we will walk in obedience before the Lord, if we will simply live the gospel, we will be blessed in a magnificent and wonderful way. We will be looked upon as a peculiar people who have found the key to a peculiar happiness.

"'And many people shall go and say, Come ye, and let us go up to the mountain of the Lord ... : for out of Zion shall go forth the law, and the word of the Lord from Jerusalem' (Isaiah 2:3).

"Great has been our past, wonderful is our present, glorious can be our future" (in Conference Report, Oct. 1997, 94; or Ensign, Nov. 1997, 69).

The rest of my talk is adapted from President Hinckley's wonderful sermon this past general conference on Sunday Morning: In the Sermon on the Mount, the Lord taught: "Ye have heard that it hath been said, An eye for an eye, and a tooth for a tooth: "But I say unto you, That ye resist not evil: but whosoever shall smite thee on thy right cheek, turn to him the other also.

"And if any man will sue thee at the law, and take away thy coat, let him have thy cloke also.

"And whosoever shall compel thee to go a mile, go with him twain.

"Give to him that asketh thee, and from him that would borrow of thee turn not thou away.

"Ye have heard that it hath been said, Thou shalt love thy neighbour, and hate thine enemy.

"But I say unto you, Love your enemies, bless them that curse you, do good to them that hate you, and pray for them which despitefully use you, and persecute you" (Matthew 5:38-44).

The scribes and Pharisees brought before Jesus a woman taken in adultery so that they might entrap Him.

"But Jesus stooped down, and with his finger wrote on the ground, as though he heard them not.

"So when they continued asking him, he lifted up himself, and said unto them, He that is without sin among you, let him first cast a stone at her.

"And again he stooped down, and wrote on the ground.

"And they which heard it, being convicted by their own conscience, went out one by one, beginning at the eldest, even unto the last: and Jesus was left alone, and the woman standing in the midst.

"When Jesus had lifted up himself, and saw none but the woman, he said unto her, Woman, where are those thine accusers? hath no man condemned thee?

"She said, No man, Lord. And Jesus said unto her, Neither do I condemn thee: go, and sin no more" (John 8:6-11).

The great crowning love of the Savior was expressed when in His dying agony He cried out, "Father, forgive them; for they know not what they do" (Luke 23:34).

In our day the Lord has said in (D&C 64:9-10): "Wherefore, I say unto you, that ye ought to forgive one another; for he that forgiveth not his brother his trespasses standeth condemned before the Lord; for there remaineth in him the greater sin.

"I, the Lord, will forgive whom I will forgive, but of you it is required to forgive all men."

And though we as sinners have need for forgiveness, so comes that forgiveness from the Father through the atoning sacrifice of the Saviour.

Isaiah declared (Isaiah 1:18): "Come now, and let us reason together, saith the Lord: though your sins be as scarlet, they shall be as white as snow; though they be red like crimson, they shall be as wool." The Lord has offered a marvelous promise. Said He, "He who has repented of his sins, the same is forgiven, and I, the Lord, remember them no more" (D&C 58:42).

There are so many in our day who are unwilling to forgive and forget.

Children cry and wives weep because fathers and husbands continue to bring up little shortcomings that are really of no importance. And there also are many women who would make a mountain out of every little offending molehill of word or deed.

President Hinckley remembers clipping a column from the Deseret Morning News. [Excerpt omitted for copyright — Jay Evensen, "Forgiveness Has Power to Change Future," Deseret Morning News, Aug. 21, 2005, p. AA3 (about Victoria Ruvolo forgiving her assailant Ryan Cushing). Add back in from the source document.] What a great story that is, greater because it actually happened. Who can feel anything but admiration for this woman who forgave the young man who might have taken her life?

Somehow forgiveness, with love and tolerance, accomplishes miracles that can happen in no other way.

The great Atonement was the supreme act of forgiveness. The magnitude of that Atonement is beyond our ability to completely understand. We know only that it happened, and that it was for me and for you. The suffering was so great; the agony so intense, that none of us can comprehend it when the Savior offered Himself as a ransom for the sins of all mankind.

It is through Him that we gain forgiveness. It is through Him that there comes the certain promise that all mankind will be granted the blessings of salvation, with resurrection from the dead. It is through Him and His great overarching sacrifice that we are offered the opportunity through obedience of exaltation and eternal life.

I close my talk today with the plea that is given to us through and by our living prophet, Pres. Hinckley: May God help us to be a little kinder, showing forth greater forbearance, to be more forgiving, more willing to walk the second mile, to reach down and lift up those who may have sinned but have brought forth the fruits of repentance, to lay aside old grudges and nurture them no more.

For this, both Pres. Hinckley and I humbly pray, in the sacred name of our Redeemer, Jesus Christ, amen.`

    title: "Attitude",
    date: "April 24, 2005",
    location: "Smithers, BC",
    notes: "",
    body: `Good Morning Brothers and Sisters.

Before I get into the meat of my talk, I wish to address just a couple of items. A few weeks back at our District Conference, Pres. Slocombe had met with the branch presidents of the district. He has asked us to encourage and invite all members to increase their offerings. I wish to commend all of the members that are faithful in their commitment to pay an honest tithe. I would also wish to encourage you to not to forget your fast offerings.

We would also wish to encourage you to make contributions to the other areas including, Humanitarian, Perpetual Fund and others. I would also encourage you to make contributions to our Branch missionary fund.

The other item is for those of you who need this encouragement, and you only know who you are. We ask that if you are unable to fulfill your responsibilities (like teaching on Sundays), please arrange with someone else and let your presidency know.

A few years ago, before we moved to Smithers, I came for a visit and during a sacrament meeting, Philip Durichen gave a talk. A few things from his talk have always stuck with me and at this point I wish to relate the point that he gave.

We are all quite aware of the story about Lehi and his family. We know that the Lord commanded Lehi and his family to leave Jerusalem and all of their worldly possessions. They parted into the wilderness.

They were commanded to go back to Jerusalem to get the brass plates. They got them.

They were then sent back to Jerusalem to convince Ishmael and his family to go with them. They went back.

They were in need of food while in the wilderness. They got the food.

They were commanded to build a ship. They built one.

They were commanded to enter the ship and be at the mercies of the currents and the winds. They got into the boat and they ultimately found themselves on the shores of the New Promised Land.

As was told, the whole family of Lehi went through various circumstances, being commanded of the Lord to do many remarkable things. They all did it.

Each and every one of them found themselves from living in their homes in Jerusalem to a new home in the Promise Land.

But there is a difference in how they got there.

Nephi expressed an attitude of commitment and pure obedience by saying "I will go and do the things which the Lord commanded me, for I know that the Lord giveth no commandment unto the children of men, save he shall prepare a way that they may accomplish that which is commanded"; while his older brothers Laman and Lemuel expressed an attitude like "Do we have to? It's too hard! We can't do it". They murmured.

When Lehi told his family that they were leaving Jerusalem, his older sons murmured and told him that he was a visionary man. But they went.

When Laban refused to give them the brass plates even after he was offered and received gold and silver. The older brothers accepted failure and wanted to return back to the father empty handed; yet when Nephi told his brothers that they should go back to Laban, the older brothers began to hit and beat upon Nephi. An angel was sent from God to stop the older sons.

These young men were actually spoken to by an angel. They went back and Nephi found that Laban was delivered into his hands and he was able to secure the plates. The Lord provided a way.

There is no record of how the older brothers reacted when their father, Lehi instructed them to go back and convince Ishmael and his family to come with them to the Promised Land. Maybe because Laman and Lemuel realized that they would then be able to have girlfriends and eventually wives.

When the bow was broken and they were hungry, they again murmured. Nephi refused to complain and went straight to the Lord for direction and in so doing was able to attain the food needed.

When commanded to build the ship, what did the older brothers initially do?

They refused to accept the fact they could build it. They laughed at Nephi because Nephi trusted on the Lord and began to build the ship; eventually they did build the ship.

While in the boat and being tossed on the seas, again the older brothers murmured and bounded Nephi's hands.

During virtually the whole voyage (approx 6 years) these older brothers Laman and Lemuel complained, resented, and begrudged the whole experience, yet they did do it.

On the contrast, Nephi exhibited a totally different attitude. He went about with faith and resolve to accomplish what had been asked of him.

Often we are given responsibilities and tasks by our leaders. Often they do not meet with our routines and comfort levels; yet how do we go about doing that which we are asked?

I certainly hope that we are not like Laman and Lemuel and find ourselves grumbling about what is being asked.

If our Leaders, whether it be our Primary presidency, Relief Society Presidency, YW/YM Presidency, Elders' Quorum, Sunday School Presidency, Branch Presidency, or District Presidency, if they, having stewardship over us, have asked us to fulfill our calling in a certain way; even though it may not fall in line with our own agenda, we should go about doing it as if the Saviour himself had asked us.

The Saviour's work will go forward, with or without us. Will we be able to account for our own diligence and attentiveness? Will we be agents that will accelerate the work or slow it down?

I know that all who are in attendance this day are individuals that do what to accelerate His work. The question is "How much?" And when answer that question, ask this question, "Does your attitude towards your callings and responsibilities reflect how much you want help in accelerating His work?"

Sometimes, when things are going well, we have a better attitude than when things are not going well.

On Friday, I went golfing with Taaron and Kaleb. A couple of holes into the round, Taaron was feeling pretty good about his game. I heard Taaron say to me and younger brother, "Hey Kaleb, we should get up every morning at 5 and go golfing." Later in the round, when his game got worse, I asked Taaron if we were going to get up a 5 the next day to golfing, to which Taaron gave me his little grin which says "I don't think so."

We need to stay the course, regardless of what comes our way and if our attitude is constructive and positive, we will enjoy the ride.

President Hinckley related the following story: Following the renovation of the Mesa Arizona Temple some years ago, clergy of other religions were invited to tour it on the first day of the open house period. Hundreds responded. In speaking to them, I said we would be pleased to answer any queries they might have. Among these was one from a Protestant minister.

Said he: "I've been all through this building, this temple which carries on its face the name of Jesus Christ, but nowhere have I seen any representation of the cross, the symbol of Christianity. I have noted your buildings elsewhere and likewise find an absence of the cross. Why is this when you say you believe in Jesus Christ?"

I responded: "I do not wish to give offense to any of my Christian colleagues who use the cross on the steeples of their cathedrals and at the altars of their chapels, who wear it on their vestments, and imprint it on their books and other literature. But for us, the cross is the symbol of the dying Christ, while our message is a declaration of the Living Christ."

He then asked: "If you do not use the cross, what is the symbol of your religion?"

I replied that the lives of our people must become the most meaningful expression of our faith and, in fact, therefore, the symbol of our worship.

Are our lives an expression of our faith?

The late Marvin J. Ashton of the Quorum of the Twelve shared the following conversation with his wife: One warm evening, Sister Ashton and I enjoyed a professional baseball game. During the early part of the competition our attention was diverted from the action by a late arriver. As he walked by, he spotted me and asked, "Who's losing?" I responded with, "Neither one."

Following my answer, I noticed that he glanced at the right-field scoreboard, saw the game wasn't tied, and walked on, undoubtedly wondering about me.

Seconds after he made his way to a distant seat, Sister Ashton said, "He doesn't know you very well, does he?" "What makes you say that?" I replied. She responded with, "If he did, he would know you don't believe anyone is losing. Some are ahead and some are behind, but no one is losing. Isn't that right?" I smiled in approval with a warm feeling inside.

All of us can be better off if we realize that attitude is more important than the score. Desire is more important than the score. Momentum is more important than the score. The direction in which we are moving is more important than position or place.

Proverbs 23:7 says, "For as [a man] thinketh in his heart, so is he". This is as applicable today as any time in history.

To have the proper attitude in this world today is a priceless.

Never before is it more important for all of us to move forward with conviction.

We are not losing if we are moving in the right direction. God will not score our performances until the end of the journey.

He who made us expects us to be victorious. He stands by anxious to answer our call for help.

We need to lead with good cheer, optimism, and courage if we are to move onward and upward.

Proper self-confidence lets every person know that there is a spark of divinity within us waiting to be nurtured.

Proper attitude enables us to live in harmony with our potentials.

We must beware of pride.

The attitude with which we approach each day controls the outcome.

It is far more important for us to concern ourselves with what we are actually doing than to concern ourselves with what is happening to us.

Positive personal attitude will insist that we deliver our best, even though less might seem adequate for the moment.

Last week, Bro. Mike Tanner gave us a wonderful lesson in priesthood and relief society about the Prophet Joseph Smith.

We can learn from Joseph and we can go forward with fearless conviction as he did. Joseph said: "So it was with me. I had actually seen a light, and in the midst of that light I saw two Personages, and they did in reality speak to me; and though I was hated and persecuted for saying that I had seen a vision, yet it was true; and while they were persecuting me, reviling me, and speaking all manner of evil against me falsely for so saying, I was led to say in my heart: Why persecute me for telling the truth? I have actually seen a vision; and who am I that I can withstand God, or why does the world think to make me deny what I have actually seen? For I had seen a vision; I knew it, and I knew that God knew it, and I could not deny it, neither dared I do it; at least I knew that by so doing I would offend God, and come under condemnation." (JS-H 1:25.) Are we willing to offend God?

President David O. McKay often mentioned, "Man's earthly existence is but a test as to whether he will concentrate his efforts, his mind, his soul upon things which contribute to the comfort and gratification of his physical nature, or whether he will make as his life's pursuit the acquisition of spiritual qualities."

An attitude of faith can convert a doubter to a doer. When Joseph Smith approached the doubting John E. Page with a call to fill a mission to Canada, Brother Page replied, "I cannot go on a mission to Canada, Brother Joseph. I haven't even a coat to wear."

The Prophet removed his own coat, handed it to him, and said, "Here, wear this and the Lord will bless you."

John E. Page had faith in the Prophet's promise. He labored two years in Canada, walked 5,000 miles, and baptized 600 souls.

We need to have an Attitude of Work.

"Work will win when wishy washy wishing won't." An attitude of work results in the capacity to make continuous effort toward the accomplishment of a given goal.

We need an Attitude of Courage.

President Monson related the following experience: Often I am called upon to interview missionary candidates who have physical impairments. In considering the recommendation of one such candidate, the bishop of the ward had written: "Brother (blank) is badly scarred due to an automobile accident. However, if courage will help, he'll lead the lot."

I made an appointment to visit with the lad. My initial reaction upon meeting him was one of overwhelming compassion.

"Son," I explained, "if you were in the mission field, there would be those who would reject your message and you might feel that they were rejecting you. That would be unbearable."

"Brother Monson," he replied, "I have become used to that problem. It doesn't bother me anymore. I so much want to serve the Lord and to preach the gospel. Please let me be called."

The courage of his spirit bore witness to me of his faith. He received a call.

After two years of outstanding missionary activity, his president wrote, upon the occasion of his honorable release: "The bearer of this letter has served in this mission for two years. He has been one of the finest missionaries in our mission over the whole time that he has been here. He has been effective as a leader, as a proselyting missionary, as the liaison between the mission office and the several stakes in which he has served, and in all respects his performance has been without flaw.

"He has handled his personal problem, his severe scarring, in a way that has discouraged or affronted no one. It has been on a basis that 'this is my problem; don't worry about it.'

"We love him dearly. We are grateful for his service; and if you have any more just like him, send them along."

We need an Attitude of Obedience. Each of us have an opportunity to live the commandments of our Heavenly Father, to love him with all our heart, mind, and strength, and to demonstrate this love by how we serve.

We have received callings in his kingdom. How well do you obey his bidding?

How do you magnify your calling from the Lord?

In magnify a calling, it means to build it up in dignity and importance, to make it honorable and commendable in the eyes of all men, to enlarge and strengthen it, to let the light of heaven shine through it.

Lastly, we need to have an Attitude of Love. Such an attitude emulates the Saviour and His example. Perhaps when we face the Saviour, we will not be asked, "How many positions did you hold?" but rather, "How many people did you help?" In reality, you can never love the Lord until you serve him by serving his people.

A prison warden happened to be sitting in a railroad coach next to a young man who was obviously depressed. Finally the man revealed that he was a convict returning from a distant prison. His imprisonment had brought shame on his family, and they had neither visited him nor written often. He hoped, however, that this was only because they were too poor to travel and too uneducated to write. He hoped, despite the evidence, that they had forgiven him.

To make it easy for them, however, he had written them to put up a signal for him when the train passed their little farm on the outskirts of town. If his family had forgiven him and felt that he could rebuild his life in his own home and own town, they were to put a white ribbon in the upper branch of the apple tree located in the lower pasture near the railroad tracks. If, however, they felt it would be best for him to rebuild his life in a new environment, in a new city, they were to do nothing, and he would remain on the train.

As the train neared his home town, the suspense became so great he couldn't bear to look out of his window. His companion changed places with him and said he would watch for the apple tree. In a minute, he put his hand on the young convict's arm. "I can see the tree," he said.

The young man then asked, "Does it contain a white ribbon?"

The reply, "Not one white ribbon, but a white ribbon on every branch!"

In that instant, all the bitterness that had poisoned a life was dispelled. Warden Scudder said to the young man, "I feel as if I have witnessed a miracle."

The young man responded, "Perhaps you have."

"To err is human; to forgive, divine."

Because we have a knowledge of the gospel of Jesus Christ and know that we are spirit children of God, we should be the most positive-thinking people in the world.

We know that our loving Father in Heaven has put us on earth to succeed, not to fail.

The gospel of Jesus Christ can help us develop a positive attitude and create happiness, peace, and contentment in our own and others' lives.

Listen to the statement from President Spencer W. Kimball: "I remind you ... that regardless of your present age, you are building your life; ... it can be full of joy and happiness, or it can be full of misery. It all depends upon you and your attitudes, for your altitude, or the height you climb, is dependent upon your attitude or your response to situations"

Two friends were preparing to go to the same summer camp for a month.

Steven thought that summer camp was a waste of time and that all the popular kids were staying home, sleeping in and playing video games.

He did not see any point in going to the classes or participating in any of the activities, but his parents had paid for the camp and insisted that he go. Richard, on the other hand, had been saving up for camp, doing yard work and other jobs to earn money. He loved learning new things and making friends. He packed his entire suitcase three days before he left, and as he walked out the door he promised to send postcards to each member of his family.

If I were to ask Steven and Richard about their camp experiences when they got home, what do you think they would say? How might their responses be different? The reason for the differences would be because of how they went about it.

We can choose what our attitude will be. Each of us can develop a positive attitude that will bring us happiness and success.

It is my hope and prayer that we will have the attitude that our Father in Heaven wishes us to have that will bring happiness, contentment, and success in His work and in your lives.

I bear testimony that the road will be smoother and easier to travel if we maintain a positive attitude and be obedient and faithful to our commitments and commandments that are given to us.

I promise you that as you do this, God will bless you with understanding and peace in your life.

[Story omitted for copyright — "Aunt Mabel's Bad-Good Day" by Janice B. Weishaar, Friend magazine, March 1992, p. 26. Add back in from the source document.]`

    body: `Good Morning Brothers and Sisters.

As I pondered today's talk, I thought about the presentation that Mr. John will be giving today after church and as I ponder this, the Proclamation to the World kept coming to mind.

In a world of turmoil and uncertainty, it is more important than ever to make our families the center of our lives and the top of our priorities.

Families lie at the center of our Heavenly Father's plan. This statement from "The Family: A Proclamation to the World" declares the responsibilities of parents to their families: "Husband and wife have a solemn responsibility to love and care for each other and for their children. 'Children are an heritage of the Lord' (Psalms 127:3). Parents have a sacred duty to rear their children in love and righteousness, to provide for their physical and spiritual needs, to teach them to love and serve one another, to observe the commandments of God and to be law-abiding citizens wherever they live. Husbands and wives—mothers and fathers—will be held accountable before God for the discharge of these obligations."

The First Presidency, they have expressed concern about the deterioration of the family. Their mandate to the Priesthood Executive Council was to concentrate on the family in our assignments.

In response to the First Presidency, many plans and efforts are in place.

The Church has committed all of its resources to encourage greater harmony, greater love, and greater influence in the Lord's special designated unit—the family.

We need to make our homes a place of refuge from the storm, which storm is becoming greater and greater all the time.

Even if we neglect to develop our families in small things, negative influences can break through the very walls of our homes.

L. Tom Perry, a member of the Quorum of the Twelve shares this example.

"Several years ago, I was having dinner with my daughter and her family.

The scene is all too common in most homes with small children. My daughter was trying to encourage her young, three-year-old son to eat a balanced meal. He had eaten all the food on his plate that he liked. A small serving of green beans remained, which he was not fond of. In desperation, the mother picked up a fork and tried to encourage him to eat his beans. He tolerated it just about as long as he could. Then he exclaimed, "Look, Mom, don't foul up a good friendship!"

Those were the exact words he heard on a television commercial a few days earlier. Oh, what impact advertising, television programs, the Internet, and the other media are having on our family units!"

Brothers and Sisters, parents are to preside over their own families.

We can gather help from church leaders, including priesthood and auxiliary leadership to assist us as we strive to fulfill our family responsibilities.

On the Church's Web site, www.lds.org. They have included a home and family page. The page includes thoughts from the scriptures and Church leaders to strengthen the family. It also includes ideas for family activities. The home and family section provides:

Teachings from Church leaders specifically for the family.

Ideas for family activities.

Family home evening quick tips to help you have meaningful and enjoyable family home evenings.

Featured articles on topics such as making family home evenings more successful, strengthening the relationship between husband and wife, and ideas for feeling closer as family members.

As the site is updated, additional ideas for planning family home evenings will appear. One of these will offer suggestions for activities for Faith in God, Duty to God, and Personal Progress programs.

The church has one media source, that reaches the entire Church—it is the Church magazines. These magazines come into our homes regularly and are another way of delivering information to help strengthen the family.

One of the messages that came to us from these magazines was this from President Gordon B. Hinckley on family home evenings: " 'We have a family home evening program once a week [Monday night] across the Church in which parents sit down with their children. They study the scriptures. They talk about family problems. They plan family activities and things of that kind. I don't hesitate to say if every family in the world practiced that one thing, you'd see a very great difference in the solidarity of the families of the world' (interview, Boston Globe, 14 Aug. 2000)."

Following President Hinckley's encouragement for us to hold family home evenings, the next article in the Ensign was entitled "The Calling I Didn't Know I Had": [Article omitted for copyright — "The Calling I Didn't Know I Had," a personal-experience essay from the Ensign magazine. Add back in from the source document.]

What wonderful messages and inspiration these words can have on us and our families. May we be more effective in our planning for this special night set aside for the family.

The Friend/New Era, and the Liahonna provides children and youth opportunities to receive prophetic words and allow them to emulate through living examples of those within its pages. To understand the importance of loving and honoring their parents.

Parents are taught ways of building and maintaining close family ties, both in good times and in difficult times. The good spirit in these magazines will help fill your homes with warmth, love, and the strength of the gospel.

It is hoped by the Leaders of the Church that flooding the Church with family-oriented media, members of the Church will be assisted and encouraged to build stronger and better families.

They hope it will cause a conscious and sustained effort in building an eternal family unit.

An abundance of Church materials will be available for you from which to pick and choose useful ideas.

At least by seeing family issues mentioned so often, we all will be reminded to focus our attention on the most important organization the Lord has established here on earth.

From the very beginning the Lord has established the importance of the family organization for us. Soon after Adam and Eve left the Garden of Eden, the Lord spoke to them: "The Holy Ghost fell upon Adam, [and] beareth record of the Father and the Son. ...

"[Then] in that day Adam blessed God and was filled, and began to prophesy concerning all the families of the earth, saying: Blessed be the name of God, for because of my transgression my eyes are opened, and in this life I shall have joy, and again in the flesh I shall see God.

"And Eve, his wife, heard all these things and was glad, saying: [If it were] not for our transgression we never should have had seed, and never should have known good and evil, and the joy of our redemption, and the eternal life which God giveth unto all the obedient.

"And Adam and Eve blessed the name of God, and they made all things known unto their sons and their daughters."

"President Brigham Young explained that our families are not yet ours. The Lord has committed them to us to see how we will treat them. Only if we are faithful will they be given to us forever. What we do on earth determines whether or not we will be worthy to become heavenly parents."

The Church has established two special times for families to be together.

The first is centered around the proper observance of the Sabbath day. This is the time we are to attend our regular meetings together, study the life and teachings of the Savior and of the prophets. "Other appropriate Sunday activities include (1) writing personal and family journals, (2) holding family councils, (3) establishing and maintaining family organizations for the immediate and extended family, (4) personal interviews between parents and children, (5) writing to relatives and missionaries, (6) genealogy, (7) visiting relatives and those who are ill or lonely, (8) missionary work, (9) reading stories to children, and (10) singing Church hymns."

The second time is Monday night. We are to teach our children in a well-organized, regular family home evening. No other activities should involve our family members on Monday night. This designated time is to be with our families.

I hope that all of you have noticed the special emphasis the First Presidency has put on family home evenings.

A letter written by The First Presidency dated October 4, 1999, was sent to emphasis this point: "To: Members of the Church throughout the World "Dear Brothers and Sisters: "Monday nights are reserved throughout the Church for family home evenings.

We encourage members to set aside this time to strengthen family ties and teach the gospel in their homes.

"Earlier this year we called on parents to devote their best efforts to the teaching and rearing of their children in gospel principles which will keep them close to the Church. We also counseled parents and children to give highest priority to family prayer, family home evening, gospel study and instruction, and wholesome family activities.

"We urge members, where possible, to avoid holding receptions or other similar activities on Monday evenings. Where practical, members may also want to encourage community and school leaders to avoid scheduling activities on Monday evenings that require children or parents to be away from their homes.

"Church buildings and facilities should be closed on Monday evenings. No ward or stake activities should be planned, and other interruptions to family home evenings should be avoided."

May it be our resolve to build a gospel-centered home, a safe harbor from the storms of the adversary.

Let us again remember the promises and instructions from the Lord to His children: "The glory of God is intelligence, or, in other words, light and truth.

"Light and truth forsake that evil one. ...

"And that wicked one cometh and taketh away light and truth, through disobedience, from the children of men, and because of the tradition of their fathers.

"But I have commanded you to bring up your children in light and truth."

May we enjoy the light and truth of the gospel in our homes.

May our homes truly become places of refuge from the world is my humble prayer, in the name of Jesus Christ, amen.`
